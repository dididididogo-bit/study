Ex 2 · Associa masculino, feminino e plural: bisabuelo, yerno, cuñado, padrastro, hermano, abuelo, marido, sobrino, padrino, bisnieto.\n?? a-6 bisabuela, **bisabuelos** · b-4 **nuera**, yernos · c-9 cuñada, cuñados · d-2 madrastra, padrastros · e-3 hermana, hermanos · f-10 abuela, abuelos · g-1 **mujer**, **matrimonio** · h-7 sobrina, sobrinos · i-8 madrina, padrinos · j-5 bisnieta, bisnietos\n:::\n:::q U2 · p. 17 · Ex 3 · Organiza: festa – descrição – expressão (Carnaval, Cumpleaños, Nochebuena y Navidad, Nochevieja, Boda).\n?? Carnaval – **D** (se disfraza) – a · Cumpleaños – **E** (anual y personal) – b · Nochebuena y Navidad – **C** (24 y 25 de diciembre) – c · Nochevieja – **B** (víspera del año nuevo) – d · Boda – **A** (unión entre dos personas) – e\n:::\n:::q U2 · p. 17 · Ex 4 · Relaciona os anúncios com a cerimónia: a. \"comunican con pesar el fallecimiento de Anselma…\" b. \"¡Gracias por venir a conocerme! Martín…\" c. \"¡Nos casamos! Sergio y Rosa\"\n?? a **el funeral** · b **el nacimiento** · c **la boda**\n:::\n:::q U2 · p. 18 · Ex 2 · Persona que… a. cura a los enfermos b. atiende en un restaurante c. trabaja en una tienda d. lleva la mercancía e. estudia una ciencia f. mantiene el orden público g. combate incendios h. cocina en un restaurante i. dirige un negocio j. enseña\n?? a **médico** · b **camarero** · c **dependienta** · d **repartidor** · e **científica** · f **policía** · g **bombero** · h **cocinero** · i **director** · j **profesora**\n:::\n:::q U2 · p. 18 · Ex 3 · Une cada profissão à palavra associada: actor/actriz, periodista, abogado/a, pintor/a, enfermero/a, ingeniero/a.\n?? actor/actriz – **cine** · periodista – **información** · abogado/a – **justicia** · pintor/a – **arte** · enfermero/a – **salud** · ingeniero/a – **construcción**\n:::\n:::q U2 · p. 19 · Ex 1 · Adjetivo para cada vizinho: a. no tiene buenos modales b. chef impaciente y colérico c. no tiene miedo de decir lo que piensa d. no es sincero e. hace cosas arriesgadas f. l *venía** a recogerme a la escuela e **íbamos** juntos al parque. Mi madre **estaba** siempre vigilándome.\n:::\n:::q U2 · p. 22 · Ex 1 · Apócopes de bueno, malo, alguno, ninguno, primero, tercero, grande + mensagem escondida.\n?? **buen, mal, algún, ningún, primer, tercer, gran**. Mensagem: ***\"Hay palabras que apocopan cuando van delante del nombre.\"***\n:::\n:::q U2 · p. 22 · Ex 2 · Completa: a. Hoy es el ___ cumpleaños de mi hermanito (nació hace un año). b. ___ día iré a Madrid. c. Espero que tengas un ___ día. d. Este es mi ___ año (entré hace tres años). e. Ana es una ___ amiga. f. No hay ___ adulto en la fiesta. g. Pasar bajo una escalera es un ___ presagio.\n?? a **primer** · b **Algún** · c **buen** · d **tercer** · e **gran** · f **ningún** · g **mal**\n:::\n:::q U2 · p. 22 · Ex 3 · Escolhe: a. primero/primer b. bueno/buen c. malo/mal d. alguno/algún e. ninguno/ningún\n?? a. Juan es el **primer** amigo verdadero…, sí, el **primero** · b. es como un **buen** hermano, un hermano muy **bueno** · c. Él es muy **malo** para mentir… es un **mal** mentiroso · d. ¿Me has traído **algún** recuerdo? Si me has traído **alguno**, dámelo · e. No he comprado **ningún** libro, porque **ninguno** me gustaba\n:::\n:::q U2 · p. 23 · Ex 1 · Une: a. Si mi hermano consigue el dinero b. Si Ana no entiende c. Si estudiáis de forma regular d. Si llegáis antes que nosotros e. Si llueve f. Si mañana puedo ir al cine\n?? a-**6** va a viajar a los EE. UU. · b-**3** tiene que preguntar sus dudas · c-**1** aprobáis el examen · d-**5** tenéis que esperar · e-**2** no podemos ir al parque · f-**4** te llamo, ¿vale?\n:::\n:::q U2 · p. 23 · Ex 2 · Ordena as orações condicionais (a–d).\n?? a. Si necesitas un móvil, te lo regalo por tu cumpleaños · b. Si quieres saber toda la verdad, te la cuento más tarde · c. Si te gustan las fresas, debes probar esta tarta. Está muy rica · d. Si vas al supermercado, ¿puedes comprar pan?\n:::\n:::q U2 · p. 23 · Ex 3 · Si + presente + presente: a. película ser de terror / no pensar ir al cine b. no hablar más alto / nadie oírte c. contarme lo sucedido / poder ayudarte d. decirte la verdad / si no enfadarte\n?? a. Si la película **es** de terror, no **pienso** ir al cine · b. Si no **hablas** más alto, nadie te **oye** / **va a oír** · c. Si me **cuentas** lo sucedido, **puedo** ayudarte · d. Te **digo** la verdad si no te **enfadas**\n:::\n:::q U2 · DELE p. 24 · Ej 1 · Club familiar, V o F: 1. Hay actividades todos los días. 2. Hay personas para cuidar de los niños. 3. El club no está preparado para personas mayores. 4. Las comidas son gratuitas. 5. Las clases de inglés están abiertas a cualquiera. 6. El club cierra en agosto.\n?? 1 **V** · 2 **V** · 3 **F** · 4 **F** · 5 **F** (só para pessoas mais velhas) · 6 **F** (aberto todo o ano)\n:::\n:::q U2 · DELE p. 25 · Ej 2 · A que cartaz se refere: A (familia tipo), B (comercio de Barrio Nuevo), C (serie Vecinos)? a. compra solidaria b. empieza por undécima vez c. familias diferentes d. tiendas locales e. no es película, sino serie f. muchos personajes g. aceptar las diferencias\n?? a **B** · b **C** · c **A** · d **B** · e **C** · f **C** · g **A**\n:::"}, {"id": "90-preguntas-3", "title": "Unidad 3 · ¡Come sano y muévete!", "pages": "Caderno de ejercicios ¡A bordo! 8 · Soluciones pp. 60–63", "part": "Ejercicios y soluciones", "md": ":::q U3 · p. 26 · Ex 2 · Descobre o prato: a. huevos con patatas fritas b. arroz valenciano con azafrán c. pasta china en forma de cuerda d. aperitivo mexicano de maíz con salsas e. tortilla doblada rellena de queso f. sin alimentos de origen animal g. tortilla de trigo enrollada h. capas de pasta con carne picada\n?? a **tortilla** · b **paella** · c **fideos** · d **nachos** · e **quesadilla** · f **vegetariano** · g **burrito** · h **lasaña**\n:::\n:::q U3 · p. 27 · Ex 3 · Sabores: el chile, el pan con semillas, la zanahoria, la piruleta, el café, la comida sin sal, el limón, la sopa, el helado, el plátano, las patatas fritas.\n?? a ** elacionan las acciones con el momento ___.\n?? **acciones** · **temporales** · **presente**\n:::\n:::q U3 · p. 30 · Ex 2 · Sublinha os marcadores relacionados com o presente: ayer, ya, esta semana, esta tarde, el año pasado, el invierno pasado, anoche, este año, el mes pasado, nunca, esta mañana, este mes, siempre, esta noche, todavía no, este invierno, la semana pasada, este verano, el verano pasado.\n?? **ya, esta semana, esta tarde, este año, nunca, esta mañana, este invierno, esta noche, todavía no, este mes, siempre, este verano**\n:::\n:::q U3 · p. 30 · Ex 3 · Particípios regulares: empezar, comer, encontrar, conocer, partir, dividir, estudiar, entender, ir, gustar, leer, reír, llegar, querer, salir, preparar, responder, vivir, viajar, tener, dormir. Regra?\n?? empezado, comido, encontrado, conocido, partido, dividido, estudiado, entendido, ido, gustado, leído, reído, llegado, querido, salido, preparado, respondido, vivido, viajado, tenido, dormido. **-ar → -ado; -er/-ir → -ido**\n:::\n:::q U3 · p. 31 · Ex 4 · Particípios irregulares: abrir, decir, escribir, hacer, morir, poner, romper, ver, volver.\n?? **abierto, dicho, escrito, hecho, muerto, puesto, roto, visto, vuelto**\n:::\n:::q U3 · p. 31 · Ex 5 · Frases no pretérito perfecto com ya / nunca: a. recibir una noticia espantosa (yo) b. ¿conocer a alguien especial? (tú) c. hacer alpinismo (vosotros) d. organizar una fiesta (nosotros) e. entrar en un cementerio de noche (él) f. vivir en un país extranjero (yo) g. ser operado (tú) h. ver una película de terror (ellas)\n?? a. Ya/Nunca **he recibido**… · b. ¿Ya **has conocido**…? · c. Ya/Nunca **habéis hecho** alpinismo · d. Ya/Nunca **hemos organizado** una fiesta · e. Él ya/nunca **ha entrado**… · f. Yo ya/nunca **he vivido**… · g. Ya/Nunca **has sido** operado/a · h. Ellas ya/nunca **han visto**…\n:::\n:::q U3 · p. 31 · Ex 6 · Completa: Hoy (a) (tener, yo) un accidente: un coche me (b) (atropellar). Alguien que (c) (ver) el accidente (d) (pedir) una ambulancia. El médico me (e) (examinar) y (f) (hacer) varias pruebas. Afortunadamente, no (g) (ser) nada grave.\n?? a **he tenido** · b **ha atropellado** · c **ha visto** · d **ha pedido** · e **ha examinado** · f **ha hecho** · g **ha sido**\n:::\n:::q U3 · p. 32 · Ex 1 · Doler: a. los ojos (a ti) b. el tobillo (a mí) c. las muelas (a ella) d. la muñeca (a vosotros) e. el brazo (a ellos) f. la pierna (a usted) g. los pies (a nosotros)\n?? a **te duelen** · b **me duele** · c **le duelen** · d **os duele** · e **les duele** · f **le duele** · g **nos duelen**\n:::\n:::q U3 · p. 32 · Ex 2 · Doler: a. A mis hermanos gemelos ___ los oídos. b. Si ___ la espalda, es porque te sientas mal. c. Cuando ___ la cabeza, podemos tomar una aspirina. d. No sé qué tengo, ___ todo el cuerpo. e. ¿Cómo estáis? Si ___ la garganta, debéis ir al médico. f. Mi padre va al dentista, porque ___ las muelas.\n?? a **les duelen** · b **te duele** · c **nos duele** · d **me duele** · e **os duele** · f **le duelen**\n:::\n:::q U3 · p. 32 · Ex 3 · Plural/singular: a. ¿Qué te duele? b. No me duele nada. c. Les duelen las rodillas. d. Nos duele la cabeza.\n?? a **¿Qué os duele?** · b **No nos duele nada** · c **Le duele la rodilla** · d **Me duele la cabeza**\n:::\n:::q U3 · p. 33 · Ex 1 · tener que / haber que / deber: a. Si quieres vivir sano, (tener) practicar deporte. b. Si nos sobra comida, (deber) darla. c. Para hidratar el cuerpo, (tener, vosotros) beber agua. d. (haber) tener una alimentación equilibrada. e. Los niños no (deber) comer comida basura.\n?? a **tienes que** · b **debemos** · c **tenéis que** · d **Hay que** · e **deben**\n:::\n:::q U3 · p. 33 · Ex 2 · Consejos: a. Si estar en la playa / tener que / beber agua b. Si estar enfermo / deber / ir al médico c. Al viajar en coche / haber que / comer poco d. Al visitar un país / deber, nosotros / respetar sus costumbres\n?? a. Si **estás** en la playa, **tienes que** beber mucha agua · b. Si **estás** enfermo, **debes** ir al médico · c. Al v /* ---------- Dates ---------- */
const DAY = 864e5;
const sod = (t = Date.now()) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const isoDay = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const parseDay = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1).getTime(); };
const dueDiff = t => Math.round((parseDay(t.due) - sod()) / DAY);
function dueLabel(t) {
  const d = dueDiff(t), at = new Date(parseDay(t.due));
  if (d < 0) return 'Overdue · ' + at.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  if (d === 0) return 'Today';
  if (d === 1) return 'Tomorrow';
  if (d < 7) return at.toLocaleDateString('en-GB', { weekday: 'long' });
  return at.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
const fmtMin = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}`;

/* ---------- Components ---------- */
function seg(key, opts, value, extra = '') {
  return `<div class="seg noanim ${extra}" data-seg="${key}" role="radiogroup"><span class="seg-thumb"></span>${opts.map(([v, l]) =>
    `<button role="radio" aria-checked="${v === value}" class="${v === value ? 'on' : ''}" data-action="seg" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</div>`;
}
function placeSegs(scope = document) {
  $$('.seg', scope).forEach(s => {
    const on = $('button.on', s), th = $('.seg-thumb', s);
    if (!on || !th) return;
    th.style.width = on.offsetWidth + 'px';
    th.style.transform = `translateX(${on.offsetLeft}px)`;
    if (s.classList.contains('noanim')) requestAnimationFrame(() => requestAnimationFrame(() => s.classList.remove('noanim')));
  });
}
const sw = (key, on, label) => `<button class="switch" role="switch" aria-checked="${!!on}" aria-label="${esc(label)}" data-action="switch" data-key="${key}"></button>`;
const emptyState = (ic, title, text, btn = '') => `<div class="empty">${icon(ic)}<b>${esc(title)}</b><p>${esc(text)}</p>${btn}</div>`;

function subjectRow(s) {
  const fav = S.favs.includes(s.id);
  return `<button class="row" data-action="open-subj" data-id="${s.id}" data-ctx="subj">
    ${sicon(s)}
    <span class="row-main"><span class="row-text"><span class="row-title">${esc(s.name)}</span><span class="row-sub">${esc(s.id)} · ${esc(s.teachers.join(', '))}</span></span>
    ${GUIDES[s.id] ? `<span class="tag" style="--c:var(--cyan)">Guia</span>` : ''}${fav ? `<span class="star-on" aria-label="Favourite">${icon('star')}</span>` : ''}<span class="chev">${icon('chevron')}</span></span></button>`;
}
function subjectCard(s) {
  const fav = S.favs.includes(s.id);
  return `<button class="scard" data-action="open-subj" data-id="${s.id}" data-ctx="subj">
    ${sicon(s, 'm')}${fav ? `<span class="star-on">${icon('star')}</span>` : ''}
    <span class="t"><span class="code">${esc(s.id)}</span><span class="name">${esc(s.name)}</span><span class="who">${esc(s.teachers.join(', '))}</span></span></button>`;
}
function taskRow(t) {
  const s = BY[t.subj] || SUBJECTS[0], d = dueDiff(t);
  return `<div class="row task tap ${t.done ? 'done' : ''}" data-ctx="task" data-id="${t.id}" style="--c:var(--${s.color})">
    <button class="check" data-action="toggle-task" data-id="${t.id}" aria-label="${t.done ? 'Mark as not done' : 'Mark as done'}">${icon('check')}</button>
    <span class="row-main" data-action="open-subj" data-id="${s.id}"><span class="row-text"><span class="row-title">${esc(t.title)}</span>
    <span class="row-sub"><span class="tag">${esc(s.id)}</span> ${esc(t.type)} · <span class="${!t.done && d < 0 ? 'overdue' : ''}">${esc(dueLabel(t))}</span>${t.example ? '<span class="example">Example</span>' : ''}</span></span></span></div>`;
}

/* ---------- Views ---------- */
function renderToday() {
  const t0 = sod(), mins = minutesSince(t0), goal = S.settings.goal, pct = Math.min(1, mins / goal);
  const open = openTasks(), week = open.filter(t => dueDiff(t) < 7), next = open.slice(0, 3);
  const favs = S.favs.map(id => BY[id]).filter(Boolean);
  const totals = {};
  S.sessions.filter(x => x.at >= t0 - 6 * DAY).forEach(x => { totals[x.subj] = (totals[x.subj] || 0) + x.min; });
  const top = Object.entries(totals).filter(([id]) => BY[id]).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const max = top.length ? top[0][1] : 1;
  const C = 2 * Math.PI * 24;
  const date = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  const hr = new Date().getHours();
  const greet = hr < 12 ? 'Good morning' : hr < 19 ? 'Good afternoon' : 'Good evening';
  return `
  <div class="head"><p class="eyebrow">${esc(date)}</p><h1 class="lt">Today</h1><p class="subtitle">${greet}. ${open.length ? `You have ${open.length} open task${open.length > 1 ? 's' : ''}.` : 'Nothing due. Enjoy it.'}</p></div>
  <div class="widgets">
    <button class="widget press-in" data-action="go" data-go="focus">
      <span class="w-label" style="color:var(--green)">${icon('timer')}Focus</span>
      <span class="w-ring"><svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="24" fill="none" stroke="var(--fill2)" stroke-width="7"/>
        <circle cx="29" cy="29" r="24" fill="none" stroke="var(--green)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" style="transition:stroke-dashoffset 1s var(--ease-soft)"/></svg>
        <span><span class="w-big">${mins}<small>min</small></span></span></span>
      <span class="w-note">${mins >= goal ? 'Daily goal reached.' : `${goal - mins} min left of your ${goal} min goal`}</span>
    </button>
    <button class="widget press-in" data-action="go" data-go="tasks">
      <span class="w-label" style="color:var(--orange)">${icon('calendar')}This Week</span>
      <span class="w-big">${week.length}<small>due</small></span>
      <span class="w-note">${next[0] ? esc(next[0].title) + ' · ' + esc(dueLabel(next[0])) : 'No tasks due in the next 7 days.'}</span>
    </button>
  </div>
  <section class="sec">
    <h2 class="sec-h">Favourites <button class="link" data-action="go" data-go="study">All Subjects</button></h2>
    ${favs.length ? `<div class="favs">${favs.map(s => `<button class="fav press-in" data-action="open-subj" data-id="${s.id}" data-ctx="subj">${sicon(s, 'l')}<span>${esc(s.id)}</span></button>`).join('')}</div>`
      : `<div class="group">${emptyState('star', 'No Favourites Yet', 'Touch and hold a subject in Study, then choose Add to Favourites.')}</div>`}
  </section>
  <section class="sec">
    <h2 class="sec-h">Up Next <button class="link" data-action="add-task">Add Task</button></h2>
    <div class="group">${next.length ? next.map(taskRow).join('') : emptyState('check', 'All Caught Up', 'Homework, tests and projects you add will appear here.')}</div>
  </section>
  <section class="sec">
    <h2 class="sec-h">Focus This Week</h2>
    <div class="group">${top.length ? top.map(([id, m]) => { const s = BY[id]; return `<div class="bar-row" style="--c:var(--${s.color})">${sicon(s)}<div class="bt"><span class="bn">${esc(s.name)}</span><span class="bar"><i style="width:${Math.max(4, m / max * 100)}%"></i></span></div><span class="row-val">${fmtMin(m)}</span></div>`; }).join('')
      : emptyState('timer', 'No Sessions Yet', 'Start a focus session and your time per subject shows up here.', '<button class="btn btn-prim glass press" data-action="go" data-go="focus">Start Focus</button>')}</div>
  </section>`;
}

function renderStudyShell() {
  return `
  <div class="head"><h1 class="lt">Study</h1><p class="subtitle">${SUBJECTS.length} subjects · ${TEACHERS.length} teachers</p></div>
  <label class="search glass">${icon('search')}<input id="q" type="search" placeholder="Subjects, codes, teachers" autocomplete="off" enterkeyhint="search" aria-label="Search subjects"><button class="clear" id="q-clear" data-action="clear-search" aria-label="Clear search" hidden>${icon('xfill')}</button></label>
  <div id="study-guides" style="display:flex;flex-direction:column;gap:10px"></div>
  <div class="chips" id="chips" role="tablist" aria-label="Filter"></div>
  <div id="study-results" style="display:flex;flex-direction:column;gap:26px"></div>`;
}
function renderChips() {
  const opts = [['all', 'All'], ['fav', 'Favourites'], ...CATS.map(c => [c.id, c.short])];
  return opts.map(([v, l]) => `<button class="chip ${v === S.filter ? 'on' : 'glass'}" role="tab" aria-selected="${v === S.filter}" data-action="filter" data-v="${v}">${l}</button>`).join('');
}
function renderStudyResults() {
  const q = fold(S.query.trim());
  let list = SUBJECTS.filter(s => {
    if (S.filter === 'fav' && !S.favs.includes(s.id)) return false;
    if (S.filter !== 'all' && S.filter !== 'fav' && s.cat !== S.filter) return false;
    if (!q) return true;
    return fold([s.id, s.name, s.full || '', s.teachers.join(' '), CAT[s.cat].name].join(' ')).includes(q);
  });
  if (!list.length) {
    if (S.filter === 'fav' && !q) return `<div class="group">${emptyState('star', 'No Favourites', 'Touch and hold any subject, then choose Add to Favourites.')}</div>`;
    return emptyState('search', `No Results for “${S.query.trim()}”`, 'Check the spelling or try a subject code, like MAT or HIST.');
  }
  let sections;
  if (S.sort === 'name') {
    sections = [{ title: 'A–Z', items: [...list].sort((a, b) => a.name.localeCompare(b.name, 'pt')) }];
  } else if (S.sort === 'teacher') {
    const m = new Map();
    list.forEach(s => s.teachers.forEach(t => { if (!m.has(t)) m.set(t, []); m.get(t).push(s); }));
    sections = [...m.entries()].sort((a, b) => a[0].localeCompare(b[0], 'pt')).map(([t, items]) => ({ title: t, items }));
  } else {
    sections = CATS.map(c => ({ title: c.name, items: list.filter(s => s.cat === c.id) })).filter(x => x.items.length);
  }
  return sections.map(sec => `<section class="sec"><h2 class="sec-h">${esc(sec.title)}<span class="row-val" style="font-size:15px;font-weight:400">${sec.items.length}</span></h2>
    ${S.view === 'grid' ? `<div class="sgrid">${sec.items.map(subjectCard).join('')}</div>` : `<div class="group">${sec.items.map(subjectRow).join('')}</div>`}</section>`).join('');
}

function renderTasks() {
  const t0 = sod();
  let body;
  if (S.taskSeg === 'upcoming') {
    const open = openTasks();
    const buckets = [['Overdue', t => dueDiff(t) < 0], ['Today', t => dueDiff(t) === 0], ['Tomorrow', t => dueDiff(t) === 1], ['This Week', t => dueDiff(t) > 1 && dueDiff(t) < 7], ['Later', t => dueDiff(t) >= 7]];
    body = open.length ? buckets.map(([n, f]) => { const it = open.filter(f); return it.length ? `<section class="sec"><h2 class="sec-h ${n === 'Overdue' ? 'overdue' : ''}">${n}</h2><div class="group">${it.map(taskRow).join('')}</div></section>` : ''; }).join('')
      : emptyState('check', 'All Caught Up', 'Tap + to add homework, tests and projects.', '<button class="btn btn-prim glass press" data-action="add-task">' + icon('plus') + 'New Task</button>');
  } else {
    const done = S.tasks.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    body = done.length ? `<section class="sec"><h2 class="sec-h">Completed <button class="link" data-action="clear-done">Clear</button></h2><div class="group">${done.map(taskRow).join('')}</div></section>`
      : emptyState('tasks', 'Nothing Completed', 'Tasks you tick off are kept here.');
  }
  return `<div class="head"><h1 class="lt">Tasks</h1><p class="subtitle">${S.tasks.filter(t => !t.done).length} open · ${S.tasks.filter(t => t.done).length} done</p></div>
    ${seg('taskSeg', [['upcoming', 'Upcoming'], ['done', 'Completed']], S.taskSeg)}${body}`;
}

function renderFocus() {
  const f = S.focus, s = BY[f.subj], rem = focusRemaining(), idle = !f.running && rem === f.dur * 60000;
  const C = 2 * Math.PI * 130, pct = 1 - rem / (f.dur * 60000);
  const today = S.sessions.filter(x => x.at >= sod()).sort((a, b) => b.at - a.at);
  return `<div class="head"><h1 class="lt">Focus</h1><p class="subtitle">${fmtMin(minutesSince(sod()))} today · goal ${S.settings.goal} min</p></div>
  <div class="timer" style="--c:var(--${s.color})">
    <button class="pick glass press" data-action="focus-pick" aria-label="Choose subject">${sicon(s)}<span class="nm">${esc(s.name)}</span>${icon('down', 'dd')}</button>
    <div class="ring"><svg viewBox="0 0 290 290"><circle class="track" cx="145" cy="145" r="130" fill="none" stroke-width="14"/>
      <circle class="prog" id="ring-prog" cx="145" cy="145" r="130" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/></svg>
      <div class="ring-mid"><span class="ring-time" id="ring-time">${fmtClock(rem)}</span><span class="ring-sub">${f.running ? 'Focusing' : idle ? `${f.dur} minutes` : 'Paused'}</span></div></div>
    ${seg('dur', [['15', '15 min'], ['25', '25 min'], ['45', '45 min'], ['60', '60 min']], String(f.dur), 'dur' + (idle ? '' : ' disabled'))}
    <div class="ctrls">
      <button class="round glass press" data-action="focus-cancel" ${idle ? 'disabled' : ''}>Cancel</button>
      ${f.running ? `<button class="round hold glass press" data-action="focus-pause">Pause</button>` : `<button class="round go glass press" data-action="focus-start">${idle ? 'Start' : 'Resume'}</button>`}
    </div>
  </div>
  <section class="sec"><h2 class="sec-h">Today’s Sessions</h2>
    <div class="group">${today.length ? today.map(x => { const ss = BY[x.subj] || s; return `<div class="row">${sicon(ss)}<span class="row-main"><span class="row-text"><span class="row-title">${esc(ss.name)}</span><span class="row-sub">${new Date(x.at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}</span></span><span class="row-val">${fmtMin(x.min)}</span></span></div>`; }).join('')
      : emptyState('timer', 'No Sessions Today', 'Pick a subject, choose a length and press Start.')}</div>
  </section>`;
}

function renderSettings() {
  const st = S.settings;
  const row = (c, ic, label, trail) => `<div class="row"><span class="ricon" style="--c:var(--${c})">${icon(ic)}</span><span class="row-main"><span class="row-text"><span class="row-title">${label}</span></span>${trail}</span></div>`;
  return `<div class="head"><h1 class="lt">Settings</h1></div>
  <section class="sec"><h2 class="sec-h">Appearance</h2>
    <div class="group">
      <div class="seg-row">${seg('theme', [['auto', 'Automatic'], ['light', 'Light'], ['dark', 'Dark']], st.theme)}</div>
      <div class="row" style="flex-direction:column;align-items:stretch;padding-left:0"><span class="row-main" style="padding-left:16px;box-shadow:inset 0 -.5px 0 var(--sep), inset 0 .5px 0 var(--sep)"><span class="row-text"><span class="row-title">Accent Colour</span></span><span class="row-val" style="text-transform:capitalize">${st.accent}</span></span>
        <div class="swatches" role="radiogroup" aria-label="Accent colour">${ACCENTS.map(c => `<button class="sw ${c === st.accent ? 'on' : ''}" style="--c:var(--${c})" role="radio" aria-checked="${c === st.accent}" aria-label="${c}" data-action="accent" data-v="${c}"></button>`).join('')}</div></div>
    </div></section>
  <section class="sec"><h2 class="sec-h">Liquid Glass</h2>
    <div class="group">
      ${row('blue', 'dock', 'Minimise Tab Bar on Scroll', sw('minimize', st.minimize, 'Minimise tab bar on scroll'))}
      ${row('pink', 'sparkle', 'Animated Wallpaper', sw('wall', st.wall, 'Animated wallpaper'))}
      ${row('gray', 'drop', 'Reduce Transparency', sw('rt', st.rt, 'Reduce transparency'))}
    </div>
    <p class="sec-foot">Reduce Transparency replaces glass with solid backgrounds for better contrast.</p></section>
  <section class="sec"><h2 class="sec-h">Focus</h2>
    <div class="group">
      ${row('green', 'target', 'Daily Goal', `<span class="row-val">${st.goal} min</span><span class="stepper"><button data-action="goal" data-d="-15" aria-label="Decrease goal">${icon('minus')}</button><button data-action="goal" data-d="15" aria-label="Increase goal">${icon('plus')}</button></span>`)}
    </div></section>
  <section class="sec"><h2 class="sec-h">Data</h2>
    <div class="group">
      <button class="row" data-action="reset-focus"><span class="row-main"><span class="row-text"><span class="row-title danger">Reset Focus History</span></span></span></button>
      <button class="row" data-action="delete-tasks"><span class="row-main"><span class="row-text"><span class="row-title danger">Delete All Tasks</span></span></span></button>
    </div>
    <p class="sec-foot">Your tasks, notes and focus history are saved on this device only.</p></section>`;
}

const views = { today: $('#v-today'), study: $('#v-study'), tasks: $('#v-tasks'), focus: $('#v-focus'), settings: $('#v-settings') };
function renderStudy() {
  const c = $('.content', views.study);
  if (!c.dataset.built) { c.innerHTML = renderStudyShell(); c.dataset.built = '1'; }
  $('#study-guides').innerHTML = Object.keys(GUIDES).map(guideFeature).join('');
  $('#chips').innerHTML = renderChips();
  $('#study-results').innerHTML = renderStudyResults();
}
function render(only) {
  const all = !only;
  if (all || only === 'today') $('.content', views.today).innerHTML = renderToday();
  if (all || only === 'study') renderStudy();
  if (all || only === 'tasks') $('.content', views.tasks).innerHTML = renderTasks();
  if (all || only === 'focus') $('.content', views.focus).innerHTML = renderFocus();
  if (all || only === 'settings') $('.content', views.settings).innerHTML = renderSettings();
  placeSegs();
}

/* ---------- Nav bar ---------- */
const NAV = {
  today: { right: [['add-task', 'plus', 'New task']] },
  study: { right: [['study-view', S.view === 'grid' ? 'list' : 'grid', 'Change layout'], ['study-menu', 'more', 'More']] },
  tasks: { right: [['add-task', 'plus', 'New task', 'tint']] },
  focus: { right: [] },
  settings: { right: [] }
};
function updateNav() {
  NAV.study.right[0][1] = S.view === 'grid' ? 'list' : 'grid';
  const n = NAV[S.tab];
  $('#nav-right').innerHTML = n.right.map(([a, ic, label, cls]) => `<button class="nbtn glass press ${cls || ''}" data-action="${a}" aria-label="${label}">${icon(ic)}</button>`).join('');
  $('#nav-title').textContent = TABS.find(t => t.id === S.tab).label;
  onScroll(true);
}

/* ---------- Tab bar ---------- */
const bar = $('#tabbar'), lens = $('#lens'), track = $('#tabtrack');
track.innerHTML = TABS.map(t => `<button class="tab" role="tab" data-tab="${t.id}" aria-label="${t.label}"><span>${icon(t.icon)}</span><span class="tab-label">${t.label}</span></button>`).join('');
const tabEls = $$('.tab', track), tabIcons = tabEls.map(t => t.firstElementChild);
let tabIndex = TABS.findIndex(t => t.id === S.tab), itemW = 72, barW = 360, minimized = false;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

/* Damped springs, integrated every animation frame. z < 1 gives the slight overshoot iOS uses. */
const spring = (k, z, eps) => ({ x: 0, v: 0, t: 0, k, c: 2 * Math.sqrt(k) * z, eps });
const SP = { lx: spring(560, .74, .2), press: spring(800, .72, .002), min: spring(420, .84, .002) };
let raf = 0, lastT = 0;
function kick() { if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(frame); } }
function frame(now) {
  const dt = Math.min(.034, (now - lastT) / 1000); lastT = now;
  let moving = false;
  for (const s of Object.values(SP)) {
    if (reduceMotion.matches) { s.x = s.t; s.v = 0; continue; }
    const n = 4, h = dt / n;
    for (let i = 0; i < n; i++) { const acc = -s.k * (s.x - s.t) - s.c * s.v; s.v += acc * h; s.x += s.v * h; }
    if (Math.abs(s.x - s.t) < s.eps && Math.abs(s.v) < s.eps * 20) { s.x = s.t; s.v = 0; } else moving = true;
  }
  paintBar();
  if (moving) raf = requestAnimationFrame(frame);
  else { raf = 0; bar.classList.remove('resizing'); if (!drag) lens.classList.remove('pressed'); }
}
function paintBar() {
  const m = SP.min.x, p = SP.press.x, lx = SP.lx.x, v = SP.lx.v;
  const cx = (innerWidth - barW) / 2;
  bar.style.width = (barW + (64 - barW) * m) + 'px';
  bar.style.transform = `translate3d(${cx + (16 - cx) * m}px,0,0)`;
  bar.style.setProperty('--m', Math.max(0, Math.min(1, m)).toFixed(3));
  bar.style.setProperty('--p', Math.max(0, Math.min(1, p)).toFixed(3));
  track.style.transform = `translate3d(${((56 - itemW) / 2 - tabIndex * itemW) * m}px,0,0)`;
  // The lens stretches along its direction of travel and squashes vertically, like a drop of liquid.
  const stretch = Math.min(Math.abs(v) / 2600, .3);
  const sx = (1 + .14 * p) * (1 + stretch), sy = (1 + .2 * p) * (1 - stretch * .4);
  lens.style.transform = `translate3d(${lx}px,0,0) scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
  lens.style.opacity = Math.max(0, 1 - m * 1.6).toFixed(3);
  const c = lx + itemW / 2;
  for (let i = 0; i < tabEls.length; i++) {
    const d = Math.abs(i * itemW + itemW / 2 - c) / itemW;
    tabIcons[i].style.transform = `translate3d(0,${(7 * m).toFixed(2)}px,0) scale(${(1 + .16 * p * Math.max(0, 1 - d)).toFixed(4)})`;
    tabEls[i].classList.toggle('hl', d < .5 && m < .5);
    tabEls[i].style.opacity = i === tabIndex ? '' : Math.max(0, 1 - m * 1.4).toFixed(3);
  }
}
function layoutBar() {
  barW = Math.min(innerWidth - 32, 440);
  itemW = (barW - 8) / TABS.length;
  bar.style.setProperty('--itemw', itemW + 'px');
  if (!drag) { SP.lx.t = SP.lx.x = tabIndex * itemW; SP.lx.v = 0; }
  tabEls.forEach((t, k) => { t.classList.toggle('on', k === tabIndex); t.setAttribute('aria-selected', k === tabIndex); });
  paintBar();
  buildGlassFilters();
}
function setMin(v) {
  if (minimized === v) return;
  minimized = v; SP.min.t = v ? 1 : 0;
  bar.classList.toggle('min', v); bar.classList.add('resizing');
  kick();
}
function selectTab(i) {
  const id = TABS[i].id, v = views[id];
  SP.lx.t = i * itemW; kick();
  if (i === tabIndex && v.classList.contains('active')) { v.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  tabIndex = i; S.tab = id; save('tab');
  tabEls.forEach((t, k) => { t.classList.toggle('on', k === i); t.setAttribute('aria-selected', k === i); });
  Object.values(views).forEach(x => x.classList.toggle('active', x === v));
  const el = tabEls[i]; el.classList.remove('bounce'); void el.offsetWidth; el.classList.add('bounce');
  haptic(); lastY = v.scrollTop; setMin(false); updateNav();
  if (id === 'today' || id === 'focus') setTimeout(() => render(id), 380);
}
let drag = null;
const idxAt = x => Math.max(0, Math.min(TABS.length - 1, Math.floor((x - bar.getBoundingClientRect().left - 4) / itemW)));
bar.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  e.preventDefault();

/* ---------- Liquid Glass refraction maps ---------- */
const refractOK = /Chrome\/\d+/.test(navigator.userAgent) && !/Firefox/.test(navigator.userAgent) && typeof CSS !== 'undefined';
function dispMap(w, h, r, edge) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'), img = ctx.createImageData(w, h), D = img.data;
  const hw = w / 2, hh = h / 2;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const px = x + .5 - hw, py = y + .5 - hh;
    const qx = Math.abs(px) - (hw - r), qy = Math.abs(py) - (hh - r);
    const ox = Math.max(qx, 0), oy = Math.max(qy, 0);
    const sd = Math.hypot(ox, oy) + Math.min(Math.max(qx, qy), 0) - r;
    let gx = 0, gy = 0;
    if (qx > 0 && qy > 0) { const l = Math.hypot(qx, qy) || 1; gx = qx / l; gy = qy / l; }
    else if (qx > qy) gx = 1; else gy = 1;
    gx *= Math.sign(px) || 1; gy *= Math.sign(py) || 1;
    const dist = -sd, t = dist < edge ? Math.pow(1 - Math.max(0, dist) / edge, 2) : 0;
    const i = (y * w + x) * 4;
    D[i] = 128 - gx * t * 127; D[i + 1] = 128 - gy * t * 127; D[i + 2] = 128; D[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c.toDataURL();
}

    <feImage href="${dispMap(w, h, Math.min(r, w / 2, h / 2), edge)}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="m"/>
    <feDisplacementMap in="SourceGraphic" in2="m" scale="${scale}" xChannelSelector="R" yChannelSelector="G"/></filter>`;
};

// Inline Markdown: escape first, then bold / italic / code.
function mdInline(s) {
  const lit = [];
  s = s.replace(/\\\*/g, () => { lit.push('*'); return '\u0000' + (lit.length - 1) + '\u0000'; });
  s = esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^\w*])\*([^*\n]+?)\*(?!\w)/g, '$1<i>$2</i>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => lit[i]);
}
// Block Markdown with ::: callouts and :::q question cards. `ctx.q` numbers questions in document order.
function mdBlock(src, ctx) {
  const L = src.split('\n'), out = [];
  let i = 0;
  const isTable = l => /^\s*\|/.test(l);
  const isList = l => /^\s*([-*]|\d+\.)\s+/.test(l);
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    let m;
    if ((m = l.match(/^:::(\w+)\s*(.*)$/))) {
      const type = m[1], arg = m[2], body = [];
      i++;
      while (i < L.length && L[i].trim() !== ':::') body.push(L[i++]);
      i++;
      if (type === 'q') out.push(qCard(arg, body.join('\n'), ctx));
      else {
        const [label, ic] = CALLOUT[type] || ['', 'note'];
        out.push(`<div class="call ${type}"><div class="cl">${icon(ic)}${label}</div>${mdBlock(body.join('\n'), ctx)}</div>`);
      }
      continue;
    }
    if (l.startsWith('```')) {
      const body = []; i++;
      while (i < L.length && !L[i].startsWith('```')) body.push(L[i++]);
      i++; out.push(`<pre>${esc(body.join('\n'))}</pre>`); continue;
    }
    if ((m = l.match(/^(#{1,3})\s+(.*)$/))) { const n = m[1].length; out.push(`<h${n}>${mdInline(m[2])}</h${n}>`); i++; continue; }
    if (isTable(l)) {
      const rows = [];
      while (i < L.length && isTable(L[i])) rows.push(L[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter((r, k) => !(k === 1 && /^[\s|:-]+$/.test(r)));
      const [h, ...rest] = body;
      out.push(`<div class="tbl"><table><thead><tr>${cells(h).map(c => `<th>${mdInline(c)}</th>`).join('')}</tr></thead><tbody>${rest.map(r => `<tr>${cells(r).map(c => `<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      continue;
    }
    if (isList(l)) {
      const ordered = /^\s*\d+\./.test(l), items = [];
      while (i < L.length && (isList(L[i]) || (/^\s{2,}\S/.test(L[i]) && items.length))) {
        if (isList(L[i])) items.push(L[i].replace(/^\s*([-*]|\d+\.)\s+/, '')); else items[items.length - 1] += ' ' + L[i].trim();
        i++;
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag}>${items.map(t => `<li>${mdInline(t)}</li>`).join('')}</${tag}>`);
      continue;
    }
    if (l.startsWith('>')) {
      const body = [];
      while (i < L.length && L[i].startsWith('>')) body.push(L[i++].replace(/^>\s?/, ''));
      out.push(`<blockquote>${mdInline(body.join(' '))}</blockquote>`); continue;
    }
    const para = [];
    while (i < L.length && L[i].trim() && !/^(:::|```|#{1,3}\s|>)/.test(L[i]) && !isTable(L[i]) && !isList(L[i])) para.push(mdInline(L[i++]));
    out.push(`<p>${para.join('<br>')}</p>`);
  }
  return out.join('');
}
function splitQ(arg, body) {
  const parts = arg.split(' · ');
  const tag = parts.length > 2 ? parts.slice(0, 2).join(' · ') : parts.length > 1 ? parts[0] : '';
  const q = parts.length > 2 ? parts.slice(2).join(' · ') : parts[parts.length - 1];
  const k = body.indexOf('??');
  const extra = k < 0 ? body : body.slice(0, k);
  const ans = k < 0 ? '' : body.slice(k + 2).replace(/^ /, '');
  return { tag, q: (q + (extra.trim() ? '\n' + extra.trim() : '')).trim(), a: ans.trim() };
}
function qCard(arg, body, ctx) {
  const { tag, q, a } = splitQ(arg, body);
  const id = ctx.ch + ':' + (ctx.q++);
  const st = S.guide[id] || 0;
  return `<div class="qcard" data-qid="${id}" data-st="${st}">
    <div class="qhead"><span class="qdot"></span>${esc(tag)}</div>
    <div class="qtext">${mdBlock(q, ctx)}</div>
    <button class="qreveal" data-action="q-reveal">Mostrar resposta</button>
    <div class="qans-wrap"><div><div class="qans">${mdBlock(a, ctx)}
      <div class="qgrade"><button class="no" data-action="q-grade" data-v="-1">${icon('x')}Errei</button><button class="yes" data-action="q-grade" data-v="1">${icon('check')}Acertei</button></div></div></div></div></div>`;
}

});

const pages = [];
function pushPage({ title, back, html, right = '', onMount }) {
  const p = document.createElement('div');
  p.className = 'page';
  p.innerHTML = `<div class="pscroll"><div class="content">${html}</div></div><div class="edge top"></div>
    <header class="pnav"><div class="nav-inner"><div class="nav-slot"><button class="pback glass press" aria-label="Voltar">${icon('chevron')}<span>${esc(back)}</span></button></div>
    <div class="nav-title">${esc(title)}</div><div class="nav-slot" style="justify-content:flex-end">${right}</div></div></header>`;
  document.body.appendChild(p);
  const under = pages.length ? pages[pages.length - 1] : scene;
  pages.push(p);
  const sc = $('.pscroll', p), nav = $('.pnav', p), edge = $('.edge', p);
  sc.addEventListener('scroll', () => { nav.classList.toggle('scrolled', sc.scrollTop > 46); edge.classList.toggle('on', sc.scrollTop > 2); }, { passive: true });
  $('.pback', p).addEventListener('click', popPage);
  requestAnimationFrame(() => requestAnimationFrame(() => { p.classList.add('in'); under.classList.add('under'); }));
  // Interactive swipe from the left edge to go back.
  let d = null;
  p.addEventListener('pointerdown', e => { if (e.clientX > 24 || e.button > 0) return; d = { x0: e.clientX, t0: performance.now(), dx: 0 }; p.classList.add('dragging'); try { p.setPointerCapture(e.pointerId); } catch (_) {} });
  p.addEventListener('pointermove', e => { if (!d) return; d.dx = Math.max(0, e.clientX - d.x0); p.style.transform = `translateX(${d.dx}px)`; });
  const up = () => { if (!d) return; const v = d.dx / Math.max(1, performance.now() - d.t0), dx = d.dx; d = null; p.classList.remove('dragging'); p.style.transform = ''; if (dx > innerWidth / 3 || v > .5) popPage(); };
  p.addEventListener('pointerup', up); p.addEventListener('pointercancel', up);
  onMount && onMount(p, sc);
  return p;
}
function popPage() {
  const p = pages.pop(); if (!p) return;
  p.classList.remove('in');
  const under = pages.length ? pages[pages.length - 1] : scene;
  under.classList.remove('under');
  if (under !== scene && under.refresh) under.refresh();
  if (under === scene) { render('study'); render('today'); }
  setTimeout(() => p.remove(), 520);
}

  let right = 0, wrongN = 0, done = 0;
  openSheet({
    html: `<div class="sheet-head"><button class="nbtn glass press" data-close aria-label="Fechar">${icon('x')}</button><div class="sheet-title">${esc(label)}</div><span></span></div>
      <div class="sheet-body" style="gap:14px"><div class="pr-meta"><span id="pr-count"></span><span id="pr-score"></span></div><div class="pr-bar"><i id="pr-fill" style="width:0"></i></div><div id="pr-stage"></div></div>`,
    onMount(sh, close) {
      const stage = $('#pr-stage', sh);
      const meta = () => {
        $('#pr-count', sh).textContent = `${Math.min(done + 1, total)} de ${total}`;
        $('#pr-score', sh).textContent = `✓ ${right}   ✕ ${wrongN}`;
        $('#pr-fill', sh).style.width = (done / total * 100) + '%';
      };
      const show = () => {
        meta();
        if (!queue.length) {
          const missed = pool.filter(q => S.guide[q.id] === -1);
          stage.innerHTML = `<div class="pr-done"><span class="big">${Math.round(right / Math.max(1, right + wrongN) * 100)}%</span><b style="font-size:20px">Sessão concluída</b>
            <div class="row2"><span style="color:var(--green)">✓ ${right} certas</span><span style="color:var(--red)">✕ ${wrongN} erradas</span></div>
            ${missed.length ? `<button class="btn btn-prim glass press" id="pr-again">Praticar as ${missed.length} que falhei</button>` : ''}<button class="btn glass press" data-close>Fechar</button></div>`;
          const again = $('#pr-again', sh);
          again && again.addEventListener('click', () => { close(); setTimeout(() => openPractice(sid, 'wrong'), 450); });
          haptic(); return;
        }
        const q = queue[0];
        stage.innerHTML = `<div class="pr-card">${qCard((q.tag ? q.tag + ' · ' : '') + q.ch.title.replace(/^[\d.]+\s*(·\s*)?/, '') + ' · ' + q.q, '?? ' + q.a, { ch: q.ch.id, q: +q.id.split(':')[1] })}</div>`;
        const card = $('.qcard', stage);
        card.querySelector('.qhead').lastChild.textContent = (q.tag ? q.tag + ' · ' : '') + q.ch.title;
        card.querySelector('.qtext').innerHTML = mdBlock(q.q, { ch: q.ch.id, q: 0 });
        card.querySelector('.qreveal').addEventListener('click', e => { e.stopPropagation(); card.classList.add('open'); });
        card.querySelectorAll('[data-action="q-grade"]').forEach(b => b.addEventListener('click', e => {
          e.stopPropagation();
          const v = +b.dataset.v; gradeQ(q.id, v); haptic();
          queue.shift();
          if (v === 1) { right++; done++; } else { wrongN++; queue.splice(Math.min(3, queue.length), 0, q); }
          const pc = $('.pr-card', stage); pc.classList.add('out'); setTimeout(show, 230);
        }));
      };
      show();
    }
  });
}

ACTIONS['open-guide'] = el => openGuide(el.dataset.id);
ACTIONS['open-chapter'] = el => openChapter(el.dataset.id, +el.dataset.ch);
ACTIONS['open-qset'] = el => openQSet(el.dataset.id, +el.dataset.set, el.dataset.q);
ACTIONS['goto-chapter'] = el => { const p = pages.pop(); openChapter(el.dataset.id, +el.dataset.ch); if (p) { p.classList.remove('in'); setTimeout(() => p.remove(), 520); } };
ACTIONS['practice'] = el => openPractice(el.dataset.id, el.dataset.scope, +el.dataset.ch);
ACTIONS['q-reveal'] = el => el.closest('.qcard').classList.add('open');
ACTIONS['q-grade'] = el => { const c = el.closest('.qcard'); gradeQ(c.dataset.qid, +el.dataset.v); haptic(); };

/* ---------- Boot ---------- */
applySettings();
render();
views[S.tab].classList.add('active');
layoutBar();
updateNav();
if (S.focus.running) { if (focusRemaining() <= 0) focusComplete(); else startTicker(); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => placeSegs());
})();
</script>
</body>
</html>
