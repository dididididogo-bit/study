*Não, em geral.** As cordas vocais funcionam normalmente; a dificuldade em falar vem de **não ouvirem** os sons para os imitar. Muitos surdos aprendem a falar com terapia da fala. O termo correto é \"surdo\", não \"surdo-mudo\".\n:::\n:::q Investigo e comunico · p. 48 · Q3 — Gestos para \"olá\" e \"obrigado(a)\" em LGP e em BSL.\n?? Pesquisa visual (vídeos). A **LGP** é reconhecida na **Constituição Portuguesa desde 1997**. Em LGP, \"olá\" faz-se geralmente com a mão aberta a acenar junto à cabeça, e \"obrigado\" com a mão aberta que parte do queixo/boca para a frente. Em BSL, \"thank you\" também parte do queixo para a frente. Confirma num dicionário de LGP/BSL em vídeo.\n*Nota:* o livro diz \"uma das três línguas oficiais\"; as outras são o português e o mirandês.\n:::\n:::q Investigo e comunico · p. 48 · Q4 — É possível apreciar música sem a ouvir?\n?? **Sim.** As vibrações sonoras propagam-se nos **sólidos** (chão, corpo, instrumentos) e podem ser **sentidas pelo tato**. Muitos surdos sentem o ritmo e os graves pelas vibrações (ex.: a percussionista Evelyn Glennie, que é surda, toca descalça para sentir as vibrações).\n:::\n## Para aplicar (p. 49)\n:::q Para aplicar · p. 49 · Q1 — Pela infografia do verso da capa, V/F: A. O morcego produz alguns sons audíveis ao ser humano e outros que não. B. O cão ouve infrassons. C. O gato é o que ouve maior gama de sons. D. O golfinho apenas ouve ultrassons. E. O morcego tem dificuldade em ouvir sons graves.\n?? **A – V** (produz ≈ 10 000–120 000 Hz: até 20 000 Hz é audível). **B – F** (o cão ouve a partir de ≈ 40 Hz). **C – F** (são os **cetáceos**, ≈ 150–150 000 Hz). **D – F** (também ouve sons audíveis, a partir de ≈ 150 Hz). **E – V** (só ouve a partir de ≈ 1000 Hz).\n:::\n:::q Para aplicar · p. 49 · Q2.1 — Apito canino \"silencioso\": 98,2 dB, 5400 Hz a 12 800 Hz. Que grandezas?\n?? **Nível de intensidade sonora** (98,2 dB) e **frequência** (5400–12 800 Hz).\n:::\n:::q Para aplicar · p. 49 · Q2.2 — Classifica os sons (infrassons, audíveis, ultrassons).\n?? **Sons audíveis** — estão todos entre 20 Hz e 20 000 Hz.\n:::\n:::q Para aplicar · p. 49 · Q2.3 — O apito é verdadeiramente silencioso para o ser humano?\n?? **Não.** As frequências (5400–12 800 Hz) estão na gama **audível** e o nível (98,2 dB) é **muito superior ao limiar da audição** — o ser humano ouve-o (e até é um som muito forte).\n:::\n:::q Para aplicar · p. 49 · Q2.4 — Instrumento para confirmar os 98,2 dB.\n?? O **sonómetro**.\n:::\n:::q Para aplicar · p. 49 · Q3.1 — Duas situações do quotidiano com poluição sonora.\n?? **Trânsito** numa avenida movimentada; **obras** na rua (broca pneumática). (Também: aeroportos, discotecas, intervalos no recreio.)\n:::\n:::q Para aplicar · p. 49 · Q3.2 — Dois problemas da exposição à poluição sonora.\n?? **Perda de audição** e **perturbações do sono** (também stresse, ansiedade, falta de concentração).\n:::\n:::q Para aplicar · p. 49 · Q3.3 — Duas medidas em ambiente laboral.\n?? Usar **abafadores ou tampões auditivos**; **enclausurar as máquinas** em cabines acústicas (ou fazer **rotação** dos trabalhadores expostos).\n:::\n:::q Para aplicar · p. 49 · Q4.1 — \"Qualquer som entre 20 Hz e 20 kHz é audível.\" Concordas?\n?? **Não.** Também depende do **nível de intensidade sonora**: o som tem de estar **acima do limiar da audição** (linha a) para essa frequência. Um som de 20 Hz muito fraco não se ouve.\n:::\n:::q Para aplicar · p. 49 · Q4.2 — Associa os limiares às linhas a e b.\n?? **a – limiar da audição**; **b – limiar da dor**.\n:::\n:::q Para aplicar · p. 49 · Q4.3 — O que significa limiar da audição?\n?? O **nível de intensidade sonora mínimo** que um ser humano consegue ouvir (para cada frequência).\n:::\n:::q Para aplicar · p. 49 · Q4.4 — Limiar da audição para 1000 Hz.\n?? Cerca de **10 dB** (lido na curva a, no gráfico ≈ 10–15 dB).\n:::\n:::q Para aplicar · p. 49 · Q5.1 — Audiograma: ouvido esquerdo (●, ≈ 0–10 dB) e direito (×, 25 a 70 dB). Qual tem o limiar mais elevado?\n?? O **ouvido direito** (×).\n:::\n:::q Para aplicar · p. 49 · Q5.2 — Qual apresenta problemas auditivos?\n?? O **ouvido direito** — os seus pontos estão **fora** da zona normal (0–25 dB), chegando a ≈ 70 dB.\n:::\n:::q Para aplicar · p. 49 · Q5.3 — Frequência com maiores problemas.\n?? Por volta dos **1000 Hz** (≈ 70 dB, o ponto mais baixo do gráfico).\n:::", "chapter": "26-poluicao-sonora"}, {"id": "27-fenomenos-acusticos", "title": "2.4 Fenómenos acústicos — reflexão, absorção, reverberação e eco", "pages": "Som 50–57", "part": "Som", "md": "## Exercício resolvido — sonar de 100 kHz (p. 56)\n:::q Exercício resolvido · p. 56 · a) Em qual das situações é maior o intervalo de tempo entre o som emitido e o recebido?\n?? Em **B**. Com a velocidade do som na água constante, em B a distância é **maior** (até ao fundo do mar), logo o som demora mais.\n:::\n:::q Exercício resolvido · p. 56 · b) Classifica os sons emitidos.\n?? **Ultrassons** (100 kHz = 100 000 Hz > 20 000 Hz).\n:::\n:::q Exercício resolvido · p. 56 · c) O ser humano ouve-os? E os golfinhos?\n?? O ser humano **não**. Os golfinhos ouvem entre **7 kHz e 150 kHz**, por isso **conseguem** ouvir estes sons.\n:::\n:::q Exercício resolvido · p. 56 · d) v = 1450 m/s, Δt = 0,8 s (B). Distância ao fundo do mar.\n?? v = d(ida+volta)/Δt ⟺ d(ida+volta) = 1450 × 0,8 = **1160 m**.\nA distância ao fundo é só a **ida**: d = 1160/2 = **580 m**.\n:::\n## Investigo e comunico — O som do silêncio (p. 58)\n:::q Investigo e comunico · p. 58 · a) O que é uma câmara anecoica?\n?? Uma sala cujas paredes, teto e chão estão revestidos de materiais (cunhas de espuma ou fibra) que **absorvem quase totalmente o som**, de modo que **não há reflexões** — é um espaço praticamente sem eco nem reverberação (\"anecoica\" = sem eco).\n:::\n:::q Investigo e comunico · p. 58 · b) Que fenómeno está ausente?\n?? A **reflexão** do som (e, por isso, o **eco** e a **reverberação**).\n:::\n:::q Investigo e comunico · p. 58 · c) Há câmaras anecoicas em Portugal?\n?? **Sim** — existem em universidades e laboratórios de acústica (por exemplo, na **Faculdade de Engenharia da Universidade do Porto** e no **LNEC**, em Lisboa). *Confirma a localização exata na tua pesquisa.*\n:::\n:::q Investigo e comunico · p. 58 · d) Uma função destas câmaras.\n?? **Testar e medir** o som de equipamentos (altifalantes, microfones, auscultadores, eletrodomésticos, motores) sem interferência de reflexões; também testes de antenas e radares.\n:::\n:::q Investigo e comunico · p. 58 · e) Um efeito físico relatado após a permanência numa câmara anecoica.\n?? **Desorientação e perda de equilíbrio** (o cérebro usa os sons refletidos para se orientar); há quem ouça o **próprio coração** e o sangue a circular, sinta **zumbidos**, ansiedade ou até **alucinações** auditivas.\n:::\n## Para aplicar (p. 59)\n:::q Para aplicar · p. 59 · Q1 — Absorção ou reflexão: A. O som encontra um obstáculo e muda de sentido. B. Sensação de prolongamento do som. C. Usado para detetar obstáculos com sonares. D. Justifica que o som refletido tem menor intensidade.\n?? **A – reflexão**; **B – reflexão** (reverberação); **C – reflexão**; **D – absorção** (parte da energia é absorvida pelo obstáculo).\n:::\n:::q Para aplicar · p. 59 · Q2 — Reverberação e/ou eco: A. Não há variação da velocidade. B. Distingue-se claramente o som refletido. C. Fonte e obstáculo a pelo menos 17 m. D. Prolongamento e amplificação do som.\n?? **A – reverberação e eco** (ambos são reflexão no mesmo meio). **B – eco.** **C – eco.** **D – reverberação.**\n:::\n:::q Para aplicar · p. 59 · Q3.1 — Um tripulante ouve o som emitido pelo sonar?\n?? **Não.** O sonar emite **ultrassons** (frequência > 20 000 Hz), inaudíveis para o ser humano.\n:::\n:::q Para aplicar · p. 59 · Q3.2 — Fundo do mar a 1,2 km, v = 1490 m/s. Intervalo de tempo entre emissão e receção.\n?? Distância de ida e volta: 2 × 1200 = **2400 m**. Δt = d/v = 2400/1490 ≈ **1,6 s**.\n:::\n:::q Para aplicar · p. 59 · Q3.3 — Porque é que os ultrassons dos sonares podem afetar os golfinhos?\n?? Os golfinhos **ouvem** ultrassons (7–150 kHz) e os sons do sonar são **muito intensos** → danos auditivos; fogem mergulhando demasiado fundo e, em stresse, sobem depressa demais → **descompressão** (bolhas no sangue), podendo **morrer**. Também interfere com a sua **ecolocalização**.\n:::\n:::q Para aplicar · p. 59 · Q4 — Materiais para isolar acusticamente uma sala: A. Aço; B. Cortiça; C. Esferovite; D. Madeira não polida.\n?? **B, C e D** — materiais **porosos/absorventes**. O aço é polido e **reflete** o som.\n:::\n:::q Para aplicar · p. 59 · Q5 — O que é a ecolocalização; exemplos.\n?? É a **emissão de sons** (geralmente ultrassons) e a **análise do tempo** que o eco demora a voltar, para localizar obstáculos e presas. Exemplos: **morcegos**, **golfinhos** (e baleias/cachalotes; algumas aves de cavernas).\n:::\n:::q Para aplicar · p. 59 · Q6.1 — José a 10 m do obstáculo; Clara recebe o eco 0,07 s depois. Algum ouviu eco?\n?? **Nenhum.** O José está a **menos de 17 m** (10 m), e para a Clara o intervalo é **0,07 s < 0,1 s**. Ambos ouvem **reverberação**, não eco.\n:::\n:::q Para aplicar · p. 59 · Q6.2 — Os sons recebidos são mais ou menos intensos do que os emitidos?\n?? **Menos intensos**: parte da energia é **absorvida** pelo obstáculo e a amplitude diminui com a **distância** percorrida.\n:::\n:::q Para aplicar · p. 59 · Q6.3 — A velocidade do som do José é ___ da do som da Clara porque ___.\n?? **C. igual à … os dois sons se propagam no mesmo meio.**\n:::\n## Para aplicar + (pp. 60–61) — revisão do capítulo 2 (Som)\n:::q Para aplicar + · p. 60 · Q1.1 — Krakatoa (1883): som de 172 dB a 150 km. O som emitido pelo vulcão: A. está abaixo do limiar da audição; B. está acima do limiar da dor; C. foi classificado como muito alto; D. propagou-se a 172 dB.\n?? **B** (172 dB > 120 dB). (C está errada: \"alto\" refere-se à **altura/frequência**, não à intensidade; D confunde nível de intensidade com velocidade.)\n:::\n:::q Para aplicar + · p. 60 · Q1.2 — Muito ou pouco intenso?\n?? **Muito intenso.**\n:::\n:::q Para aplicar + · p. 60 · Q1.3 — \"À medida que nos afastamos de uma fonte, a ___ do som ___.\"\n?? **D. intensidade … diminui.**\n:::\n:::q Para aplicar + · p. 60 · Q2.1 — Gráficos A (≈ 2 vibrações em 0,08 s) e B (≈ 4 vibrações em 0,08 s), mesma amplitude. Correspondem a sons com: A. igual altura e intensidade; B. diferentes altura e intensidade; C. igual intensidade e diferente altura; D. igual altura e diferente intensidade.\n?? **C** — **mesma amplitude** (igual intensidade) e **frequências diferentes** (diferente altura; B é mais agudo).\n:::\n:::q Para aplicar + · p. 60 · Q2.2 — O som A é audível? Justifica com cálculos.\n?? Em A há cerca de **2 vibrações em 0,08 s** → T = 0,08/2 = **0,04 s** → f = 1/T = 1/0,04 = **25 Hz**. Como 25 Hz > 20 Hz, **é audível** (é um som muito grave). *(Lendo o gráfico com mais rigor dá ≈ 28 Hz — continua audível.)*\n:::\n:::q Para aplicar + · p. 60 · Q3.1 — Elefantes: macho ≈ 12 Hz, fêmea ≈ 13 Hz, filhote ≈ 22 Hz. Que grandeza?\n?? **Frequência.**\n:::\n:::q Para aplicar + · p. 60 · Q3.2 — Localiza no espetro sonoro.\n?? Macho (12 Hz) e fêmea (13 Hz): **infrassons** (< 20 Hz). Filhote (22 Hz): **som audível** (muito grave).\n:::\n:::q Para aplicar + · p. 60 · Q3.3 — Qual é o mais grave?\n?? O do **macho (12 Hz)** — menor frequência.\n:::\n:::q Para aplicar + · p. 60 · Q4 — V/F: A. A altura classifica os sons em agudos e graves. B. Duas cordas iguais a vibrar com intensidades diferentes produzem sons de alturas diferentes. C. A intensidade aumenta com a distância à fonte. D. O timbre da flauta e do saxofone é igual por serem de sopro. E. A altura relaciona-se com a frequência.\n?? **A – V.** **B – F** (produzem a **mesma altura**, com **intensidades** diferentes). **C – F** (diminui). **D – F** (cada instrumento tem o seu timbre). **E – V.**\n:::\n:::q Para aplicar + · p. 60 · Q5 — \"Nos sonares/ecógrafos, são emitidos sons audíveis/ultrassons que se propagam na água até serem apenas refletidos/refletidos e absorvidos por um obstáculo. Quanto maior o intervalo de tempo, menor/maior é a distância.\"\n?? **sonares** · **ultrassons** · **refletidos e absorvidos** · **maior**.\n:::\n:::q Para aplicar + · p. 61 · Q6.1 — Audiograma do Pedro: grandezas expressas.\n?? **Nível de intensidade sonora** (dB) e **frequência** (Hz).\n:::\n:::q Para aplicar + · p. 61 · Q6.2 — Estão referidas todas as frequências do espetro sonoro?\n?? **Não.** O audiograma só testa cerca de **125 Hz a 8000 Hz**; o espetro sonoro inclui infrassons, todos os sons audíveis (20–20 000 Hz) e ultrassons.\n:::\n:::q Para aplicar + · p. 61 · Q6.3 — Em que ouvido a audição está mais afetada?\n?? No **ouvido esquerdo** (●, cerca de 35–45 dB — fora da zona normal de 0–25 dB). O direito (×) está perto de 0–10 dB.\n:::\n:::q Para aplicar + · p. 61 · Q7.1 — \"Níveis sonoros superiores a 65 dB são ruído.\" a) grandeza; b) em bel; c) instrumento.\n?? a) **Nível de intensidade sonora**. b) 65 dB = 65 × 0,1 = **6,5 B**. c) **Sonómetro**.\n:::\n:::q Para aplicar + · p. 61 · Q7.2 — Duas consequências da exposição permanente a ruídos.\n?? **Perda de audição** e **stresse/perturbações do sono** (também fadiga, ansiedade, falta de concentração).\n:::\n:::q Para aplicar + · p. 61 · Q7.3 — Proteção para quem orienta o estacionamento de aviões.\n?? **Abafadores** (protetores auditivos).\n:::\n:::q Para aplicar + · p. 61 · Q7.4 — Define limiar da dor.\n?? O **nível de intensidade sonora mínimo a partir do qual um som provoca dor** (≥ 120 dB).\n:::\n:::q Para aplicar + · p. 61 · Q7.5 — Dois materiais para isolar acusticamente uma casa.\n?? **Cortiça** e **esferovite** (ou lã de rocha, madeira não polida, tecidos/cortinas).\n:::\n:::q Para aplicar + · p. 61 · Q8.1 — Som de A até C pelo trajeto ABC (AB = BC = 5 m, v = 340 m/s). Fenómeno?\n?? A **reflexão** do som (no teto, em B).\n:::\n:::q Para aplicar + · p. 61 · Q8.2 — Por que trajeto chega mais cedo a C?\n?? Pelo trajeto **AC** (direto): é **mais curto** (num triângulo, AC < AB + BC) e a velocidade é a mesma.\n:::\n:::q Para aplicar + · p. 61 · Q8.3 — Tempo pelo trajeto ABC.\n?? d = 5 + 5 = **10 m**. Δt = d/v = 10/340 ≈ **0,029 s** (≈ 0,03 s).\n:::\n:::q Para aplicar + · p. 61 · Q9 — Verdadeiras: A. Só se distinguem sons que chegam ao ouvido com diferença ≥ 0,1 s. B. A reverberação não é consequência da reflexão. C. Sonares e ecografias são aplicações da reflexão. D. Na reflexão há variação da velocidade.\n?? **A e C.** (B: a reverberação **é** consequência da reflexão. D: **não** há variação da velocidade — mesmo meio.)\n:::\n:::q Para aplicar + · p. 61 · Q10 — Ecografia aos rins (quistos). V/F: A. Foram usados sons audíveis. B. O som é usado em medicina para diagnóstico. C. Numa ecografia envia-se um som e recebe-se o eco. D. A ecografia dá fotografias do interior do corpo.\n?? **A – F** (usam-se **ultrassons**). **B – V.** **C – V.** **D – F** (gera **imagens digitais**, não fotografias).\n:::", "chapter": "27-fenomenos-acusticos"}, {"id": "30-propagacao-luz", "title": "3.1 Propagação da luz — corpos luminosos, trajetória, feixes e meios", "pages": "Luz 64–69", "part": "Luz", "md": "## Atividade prática 10 — Como é a trajetória da luz? (p. 66)\n:::q AP10 · p. 66 · O que observas em cada situação?\n?? **Situação 1** (alinhados): **vê-se** a chama da vela. **Situação 2** (desalinhados): **não se vê** a chama.\n:::\n:::q AP10 · p. 66 · Esquema do percurso da luz.\n?? Na situação 1, desenha-se uma **linha reta** desde a chama, que passa pelos dois orifícios até ao olho. Na situação 2, a linha reta que sai da chama passa pelo primeiro orifício mas **bate no segundo cartão** — não chega ao olho.\n:::\n:::q AP10 · p. 66 · Qual a forma da trajetória da luz? (Questão-problema)\n?? **Retilínea** — a luz desloca-se em **linha reta**. Por isso só a vemos quando os orifícios estão alinhados com a chama.\n:::", "chapter": "30-propagacao-luz"}, {"id": "31-materiais-sombras-velocidade-luz", "title": "3.2 Materiais e luz, sombras, eclipses e velocidade da luz", "pages": "Luz 70–73", "part": "Luz", "md": "## Atividade prática 11 (p. 70)\n:::q AP11 · Parte 1 · p. 70 · O que observas com cada material (imagem nítida, pouco nítida ou não visível)?\n?? **Acetato** e **celofane colorido**: **imagem nítida** da vela. **Papel vegetal** e **vidro fosco**: **imagem pouco nítida**. **Cartolina preta** e **tecido escuro**: **não é visível** a imagem.\n:::\n:::q AP11 · Parte 2 · p. 70 · Gráfico da iluminância: que materiais se deixaram atravessar pela luz?\n?? A iluminância é **alta** com o acetato (deixa passar quase toda a luz), **intermédia** com o papel vegetal (passa parte da luz) e praticamente **nula** com a cartolina preta (não deixa passar luz). Deixaram-se atravessar o **acetato** e, em parte, o **papel vegetal**.\n:::\n:::q AP11 · p. 70 · Definições: transparente, translúcido e opaco. Questão-problema.\n?? **Transparente:** deixa passar **toda (quase toda) a luz** — vê-se uma imagem **nítida** (vidro, acetato, água limpa). **Translúcido:** deixa passar **só parte** da luz — vê-se uma imagem **pouco nítida** (papel vegetal, vidro fosco). **Opaco:** **não** deixa passar a luz — não se vê nada através dele (cartolina preta, madeira, metal).\nResposta: a luz atravessa os materiais **transparentes** e **translúcidos**, mas não os **opacos**.\n:::\n## Atividade prática 12 — Como se forma uma sombra? (p. 72)\n:::q AP12 · p. 72 · O ecrã continua totalmente iluminado? Representa e legenda (sombra, penumbra).\n?? **Não.** Atrás da bola aparece uma zona **escura** no ecrã — a **sombra** — rodeada por uma zona **menos escura** — a **penumbra**. O resto do ecrã fica iluminado. No esquema: lanterna → bola → ecrã, com um círculo escuro (sombra) e um anel cinzento à volta (penumbra).\n:::\n:::q AP12 · p. 72 · Questão-problema: como se forma uma sombra?\n?? Quando um **objeto opaco** (a bola) se coloca no caminho da luz, ela **não o atravessa** e, como se propaga em **linha reta**, não o contorna: forma-se atrás dele uma zona **sem luz** (sombra). A **penumbra** forma-se onde só chega **parte** da luz da fonte.\n:::\n## Exercício resolvido — Luz do Sol até à Terra (p. 73)\n:::q Exercício resolvido · p. 73 · a) Quanto tempo, em minutos, demora a luz do Sol a chegar à Terra?\n?? **1.º** 150 000 000 km = **150 000 000 000 m**.\n**2.º** v = d/Δt ⟺ Δt = 150 000 000 000 / 300 000 000 = **500 s**.\n**3.º** 500 s ÷ 60 ≈ **8 min** (8,3 min).\n:::\n:::q Exercício resolvido · p. 73 · b) Uma explosão solar seria observada na Terra quanto tempo depois?\n?? Cerca de **8 minutos** depois.\n:::\n## Investigo e comunico — Eclipses, sombra e penumbra (p. 74)\n:::q Investigo e comunico · p. 74 · Q1 — Raios luminosos a) A→C; b) A→D; c) B→C; d) B→D.\n?? Desenham-se quatro **retas** a partir do Sol, prolongadas para lá da Terra:\na) e d) **A→C** e **B→D**: raios \"exteriores\" (de cima para cima, de baixo para baixo), que se aproximam até à Terra e, depois dela, limitam a **sombra**, que vai estreitando (cone).\nb) e c) **A→D** e **B→C**: raios que se **cruzam** entre o Sol e a Terra e, depois da Terra, **afastam-se** — limitam a **penumbra** (que vai alargando).\n:::\n:::q Investigo e comunico · p. 74 · Q2a — Zonas de período diurno e noturno na Terra.\n?? O lado da Terra **voltado para o Sol** está iluminado — **período diurno (dia)**. O lado **oposto ao Sol** — **período noturno (noite)**.\n:::\n:::q Investigo e comunico · p. 74 · Q2b — Sombra e penumbra projetadas pela Terra.\n?? **Sombra:** zona atrás da Terra, entre os raios A→C e B→D (aonde **não chega** luz do Sol) — onde a Lua entra no eclipse total. **Penumbra:** zonas de cada lado da sombra, entre os raios A→C/B→C e B→D/A→D, onde chega **só parte** da luz.\n:::\n## Para aplicar (p. 75)\n:::q Para aplicar · p. 75 · Q1.1 — Cinema ao ar livre (ecrã, luzes penduradas, público, árvores). Corpos luminosos.\n?? O **ecrã/projetor** (o feixe do projetor) e as **lâmpadas** (luzes penduradas). *(Rigorosamente, o ecrã é iluminado pelo projetor; a fonte de luz é o projetor.)*\n:::\n:::q Para aplicar · p. 75 · Q1.2 — Corpos iluminados.\n?? As **pessoas** (público), as **cadeiras**, as **árvores** — e o **ecrã** (que reflete a luz do projetor).\n:::\n:::q Para aplicar · p. 75 · Q1.3 — Fontes e recetores de luz.\n?? **Fontes de luz:** os corpos luminosos (lâmpadas, projetor). **Recetores de luz:** os corpos iluminados (pessoas, árvores, cadeiras, ecrã).\n:::\n:::q Para aplicar · p. 75 · Q2.1 — Bola de Berlim, diamante lapidado, espelho, lentes de óculos, calças de ganga, vitral de uma igreja: transparentes, translúcidos ou opacos?\n?? **Transparentes:** **diamante lapidado** e **lentes de óculos**. **Translúcido:** **vitral de uma igreja**. **Opacos:** **bola de Berlim**, **espelho** e **calças de ganga**.\n:::\n:::q Para aplicar · p. 75 · Q2.2 — a) atravessados completamente; b) não atravessados; c) atravessados parcialmente.\n?? a) **diamante lapidado, lentes de óculos**. b) **bola de Berlim, espelho, calças de ganga**. c) **vitral**.\n:::\n:::q Para aplicar · p. 75 · Q3.1 — Esquema: vela com raios e linhas que contornam uma pilha de livros. Identifica a fonte de luz.\n?? A **vela** (a chama).\n:::\n:::q Para aplicar · p. 75 · Q3.2 — O desenho dos raios está correto?\n?? **Não.** Os raios que vão para os livros estão desenhados a **dobrar em ângulo reto e a contornar** os livros. A luz propaga-se em **linha reta** e **não contorna** objetos opacos (forma-se uma **sombra** atrás deles). Também os raios devem sair da chama, não de um ponto ao lado.\n:::\n:::q Para aplicar · p. 75 · Q3.3 — Desenha corretamente.\n?? Desenha **raios retilíneos** a sair da **chama** em todas as direções (setas a afastar-se da vela). Os raios que atingem os livros **param** neles (os livros são opacos e ficam iluminados); atrás dos livros fica uma zona de **sombra**. Nenhum raio pode mudar de direção para os contornar.\n:::\n:::q Para aplicar · p. 75 · Q4 — V/F: A. A luz necessita de um meio material. B. Para se formar uma sombra, a luz tem de incidir num objeto transparente. C. Para ver um objeto sem luz própria, ele tem de refletir luz em direção ao observador.\n?? **A – F** (propaga-se no vazio). **B – F** (num objeto **opaco**). **C – V.**\n:::\n:::q Para aplicar · p. 75 · Q5.1 — A visibilidade nas noites de Lua Cheia explica-se por a Lua ser um corpo ___, que ___.\n?? **C. iluminado; reflete a luz proveniente do Sol.**\n:::\n:::q Para aplicar · p. 75 · Q5.2 — Lua a 384 400 km, c = 3 × 10⁸ m/s. Tempo que a luz demora a chegar à Terra.\n?? d = 384 400 km = **384 400 000 m**. Δt = d/c = 384 400 000 / 300 000 000 ≈ **1,3 s**.\n:::\n:::q Para aplicar · p. 75 · Q6.1 — Em que condições se forma um eclipse lunar?\n?? Quando o **Sol, a Terra e a Lua** estão **alinhados**, com a **Terra entre o Sol e a Lua** (Lua Cheia). A Lua entra na **sombra da Terra**.\n:::\n:::q Para aplicar · p. 75 · Q6.2 — Porque se forma a zona de sombra atrás da Terra?\n?? A Terra é **opaca** e a luz propaga-se em **linha reta**: a luz do Sol **não atravessa nem contorna** a Terra, ficando atrás dela uma zona sem luz.\n:::", "chapter": "31-materiais-sombras-velocidade-luz"}, {"id": "32-radiacao-eletromagnetica", "title": "3.3 Ondas de luz — radiação e espetro eletromagnético", "pages": "Luz 76–81", "part": "Luz", "md": "## Investigo e comunico — Qual é a radiação do meu telemóvel? (p. 82)\n:::q Investigo e comunico · p. 82 · Q1 — Localiza no espetro a radiação emitida/recebida pela antena do telemóvel.\n?? **Micro-ondas** (entre as ondas de rádio e os infravermelhos; as redes móveis usam ≈ 0,7–3,5 GHz, ou seja, ≈ 10⁹ Hz).\n:::\n:::q Investigo e comunico · p. 82 · Q2 — Pode ser prejudicial à saúde?\n?? Nos níveis usados, **não há evidência** de que seja perigosa: as micro-ondas são radiação **não ionizante** (não têm energia para transformar átomos em iões). Por precaução, recomenda-se usar auriculares/alta-voz e não dormir com o telemóvel encostado à cabeça.\n:::\n:::q Investigo e comunico · p. 82 · Q3 — Velocidade entre a antena do telemóvel e a da estação-base.\n?? A da luz no ar: **≈ 3 × 10⁸ m/s** (300 000 km/s).\n:::\n## Para aplicar (p. 83)\n:::q Para aplicar · p. 83 · Q1.1 — A (mais oscilações) e B (menos oscilações), na mesma escala, uma é micro-ondas e outra visível. Qual tem maior frequência?\n?? A **radiação visível** — onda **A** (mais oscilações no mesmo tempo).\n:::\n:::q Para aplicar · p. 83 · Q1.2 — Qual tem menor energia?\n?? As **micro-ondas** (onda **B**) — menor frequência.\n:::\n:::q Para aplicar · p. 83 · Q1.3 — Que onda pode representar a radiação visível?\n?? A **onda A**.\n:::\n:::q Para aplicar · p. 83 · Q1.4 — Que fonte é detetável pelo olho humano?\n?? A fonte de **radiação visível** (onda A).\n:::\n:::q Para aplicar · p. 83 · Q2 — \"A luz transporta ___ e a sua propagação representa-se por uma onda ___ que ___ de um meio material.\"\n?? **C. energia; eletromagnética; não necessita.**\n:::\n:::q Para aplicar · p. 83 · Q3 — a) forno tradicional; b) lâmpada de retroprojetor; c) comando para abrir o carro; d) radiografia; e) reatores das centrais nucleares.\n?? a) **Infravermelho**; b) **Visível**; c) **Infravermelho** (ou ondas de rádio, conforme o comando); d) **Raios X**; e) **Raios gama**.\n:::\n:::q Para aplicar · p. 83 · Q4.1 — Ordem decrescente de energia.\n?? **Raios gama > Raios X > Ultravioleta > Visível > Infravermelho > Micro-ondas > Ondas de rádio.**\n:::\n:::q Para aplicar · p. 83 · Q4.2 — Ordem crescente de frequência.\n?? **Ondas de rádio < Micro-ondas < Infravermelho < Visível < Ultravioleta < Raios X < Raios gama.**\n:::\n:::q Para aplicar · p. 83 · Q5.1 — Valores numéricos: A = 2,1 × 10⁴ Hz; B = 3,0 × 10⁹ Hz; C = 4,3 × 10¹³ Hz.\n?? A = **21 000 Hz**; B = **3 000 000 000 Hz**; C = **43 000 000 000 000 Hz**.\n*(Atenção: na digitalização os expoentes são difíceis de ler — confirma no teu livro. Se C for 4,3 × 10¹⁵ Hz, escreve 4 300 000 000 000 000 Hz.)*\n:::\n:::q Para aplicar · p. 83 · Q5.2 — Frequência de A em kHz.\n?? 21 000 Hz ÷ 1000 = **21 kHz** (1 kHz = 1000 Hz).\n:::\n:::q Para aplicar · p. 83 · Q5.3 — Ordem decrescente de frequência.\n?? **C > B > A.**\n:::\n:::q Para aplicar · p. 83 · Q5.4 — Maior energia.\n?? A radiação **C** (maior frequência).\n:::\n:::q Para aplicar · p. 83 · Q5.5 — Região do espetro (p. 78) de cada uma.\n?? **A** (≈ 10⁴ Hz) — **ondas de rádio**; **B** (≈ 10⁹ Hz) — **micro-ondas** (fronteira com as ondas de rádio); **C** (≈ 10¹³ Hz) — **infravermelho** (se for 10¹⁵ Hz: **ultravioleta**).\n:::\n:::q Para aplicar · p. 83 · Q6 — Características da onda eletromagnética: A. É mecânica. B. No ar, velocidade praticamente igual à do vazio. C. Propagação perpendicular à oscilação eletromagnética. D. Amplitude, frequência e período. E. Frequência da mesma ordem que a do som.\n?? **B, C e D.** (A: **não** é mecânica. E: a frequência é **muito maior** — até ≈ 10¹⁴ Hz no visível vs. 20 000 Hz no som audível.)\n:::\n## Para aplicar + (pp. 84–85) — revisão do capítulo 3 (Luz)\n:::q Para aplicar + · p. 84 · Q1 — Criança a pintar: A (raios da janela → tinta → olho) ou B (raios do olho → tinta → janela)?\n?? **A.** A luz vem da **fonte** (janela/Sol), incide na tinta e é **refletida** para o **olho** (detetor). Em B as setas estão ao contrário — os olhos não emitem luz.\n:::\n:::q Para aplicar + · p. 84 · Q2.1 — Estúdio: luminosos ou iluminados?\n?? **Luminosos:** os **focos/projetores de luz** (e o flash). **Iluminados:** a **modelo**, o **fotógrafo**, a **câmara**, o **fundo/pano** e os suportes.\n:::\n:::q Para aplicar + · p. 84 · Q2.2 — Percurso de um raio do foco até à câmara.\n?? Uma **linha reta** com seta do **foco** até à **modelo** e, depois de refletida, outra linha reta com seta da **modelo** até à **objetiva da câmara**.\n:::\n:::q Para aplicar + · p. 84 · Q3 — Museu: o visitante, voltado para os quadros A e B (com uma estátua à frente de B), o que não consegue ver na totalidade?\n?? O **quadro B**. A luz refletida por parte do quadro B, que se propaga em **linha reta**, é **bloqueada pela estátua** (opaca) e **não chega aos olhos** do visitante.\n:::\n:::q Para aplicar + · p. 84 · Q4 — Feixes 1 (raios paralelos), 2 e 3.\n?? **1 – paralelo**; **2 – divergente** (raios a separarem-se a partir de um ponto); **3 – convergente** (raios a dirigirem-se para um ponto). *(Confirma o sentido das setas no livro: setas a sair do ponto = divergente; a entrar = convergente.)*\n:::\n:::q Para aplicar + · p. 84 · Q5.1 — Sol, Lua, Terra alinhados: luminoso ou iluminado?\n?? **Sol – luminoso**; **Lua – iluminada**; **Terra – iluminada**.\n:::\n:::q Para aplicar + · p. 84 · Q5.2 — Raios do Sol que formam a sombra e a penumbra.\n?? Desenham-se **retas** desde o topo e a base do Sol, **tangentes à Lua**: as que não se cruzam (topo→topo, base→base) limitam o **cone de sombra** da Lua; as que se cruzam (topo→base, base→topo) limitam a **penumbra**.\n:::\n:::q Para aplicar + · p. 84 · Q5.3 — Onde ocorre o eclipse total do Sol? Define zona de sombra.\n?? Na zona da Terra atingida pela **sombra da Lua**. A **zona de sombra** é a zona do espaço onde **não chega luz** visível, porque a Lua (opaca) a bloqueia — daí o Sol ficar **totalmente tapado**.\n:::\n:::q Para aplicar + · p. 84 · Q6.1 — Elementos necessários para ver um objeto que não emite luz.\n?? **Fonte de luz** (corpo luminoso), **objeto** (corpo iluminado/recetor) e **olho** (detetor de luz).\n:::\n:::q Para aplicar + · p. 84 · Q6.2 — Projetor, bola e olho: percurso de um raio.\n?? Linha reta com seta do **projetor** até à **bola**, e outra da **bola** até ao **olho**.\n:::\n:::q Para aplicar + · p. 84 · Q6.3 — Como se chama esse esquema?\n?? **Triângulo de visão.**\n:::\n:::q Para aplicar + · p. 85 · Q7 — O teatro de sombras acontece porque ___.\n?? **A. as mãos são opacas e a luz propaga-se em linha reta.**\n:::\n:::q Para aplicar + · p. 85 · Q8.1 — \"As ondas eletromagnéticas transportam ___ mas não transportam ___.\"\n?? **energia** · **matéria**.\n:::\n:::q Para aplicar + · p. 85 · Q8.2 — As ondas eletromagnéticas viajam ___: A. a 340 m/s no vazio; B. no ar, mas não no vazio; C. mais rápido num vidro do que no ar; D. mais rápido no ar do que na água.\n?? **D.**\n:::\n:::q Para aplicar + · p. 85 · Q9.1 — Ondas A (frequência alta, amplitude média), B (frequência baixa, amplitude média), C (frequência baixa, amplitude grande), D (frequência baixa, amplitude pequena). Mais intensa?\n?? A **onda C** (maior amplitude).\n:::\n:::q Para aplicar + · p. 85 · Q9.2 — A ou B: qual é a mais energética?\n?? A **onda A** (maior frequência).\n:::\n:::q Para aplicar + · p. 85 · Q9.3 — Duas ondas com a mesma frequência.\n?? Por exemplo **B e D** (também **C** tem a mesma frequência que B e D).\n:::\n:::q Para aplicar + · p. 85 · Q9.4 — Onda com maior frequência.\n?? A **onda A**.\n:::\n:::q Para aplicar + · p. 85 · Q10.1 — Notação científica (décimas): ar 299 702 547; álcool 220 435 631; vidro 199 861 638 m/s.\n?? Ar: **3,0 × 10⁸ m/s**; álcool etílico: **2,2 × 10⁸ m/s**; vidro: **2,0 × 10⁸ m/s**.\n:::\n:::q Para aplicar + · p. 85 · Q10.2 — Converte para km/s.\n?? Divide por 1000: ar **≈ 299 703 km/s** (3,0 × 10⁵); álcool **≈ 220 436 km/s** (2,2 × 10⁵); vidro **≈ 199 862 km/s** (2,0 × 10⁵).\n:::\n:::q Para aplicar + · p. 85 · Q10.3 — Ordem crescente.\n?? **Vidro < Álcool etílico < Ar.**\n:::\n:::q Para aplicar + · p. 85 · Q11 — Tempo, em minutos, da luz do Sol até Vénus (1,1 × 10⁸ km; c ≈ 3 × 10⁸ m/s).\n?? d = 1,1 × 10⁸ km = **1,1 × 10¹¹ m**. Δt = d/c = 1,1 × 10¹¹ / 3 × 10⁸ ≈ **367 s**. Em minutos: 367/60 ≈ **6,1 min**.\n:::\n:::q Para aplicar + · p. 85 · Q12.1 — A radiação infravermelha do comando é visível?\n?? **Não** — é radiação **não visível** (frequência inferior à do vermelho).\n:::\n:::q Para aplicar + · p. 85 · Q12.2 — É mais ou menos energética do que a visível?\n?? **Menos** energética (menor frequência).\n:::\n:::q Para aplicar + · p. 85 · Q12.3 — Tempo para percorrer 3 m (s e µs).\n?? Δt = d/c = 3 / (3 × 10⁸) = **1 × 10⁻⁸ s** = 0,01 × 10⁻⁶ s = **0,01 µs**.\n:::", "chapter": "32-radiacao-eletromagnetica"}, {"id": "40-reflexao-luz", "title": "4.1 Reflexão e absorção da luz, leis da reflexão", "pages": "Luz 86–89", "part": "Luz", "md": "## Atividade prática 13 — Verificar as leis da reflexão no laboratório (p. 90)\n:::q AP13 · p. 90 · Tabela de resultados esperada.\n?? | αᵢ | αᵣ |\n|---|---|\n| 0° | 0° (o raio volta pelo mesmo caminho) |\n| 15° | 15° |\n| 45° | 45° |\n| 75° | 75° |\nEm todos os ensaios, o raio incidente, o refletido e a normal ficam **no mesmo plano** (o da folha/mesa).\n:::\n:::q AP13 · p. 90 · Esboços para 0° e 15°.\n?? **0°:** raio incidente **sobre a normal**, perpendicular ao espelho; o raio refletido volta **pela mesma linha** (αᵢ = αᵣ = 0°). **15°:** normal tracejada; raio incidente a 15° de um lado da normal e raio refletido a 15° do outro lado, ambos a partir do ponto de incidência.\n:::\n:::q AP13 · p. 90 · Foi possível verificar as leis da reflexão? Justifica.\n?? **Sim**: em todos os ensaios **αᵢ = αᵣ** (1.ª lei) e os raios e a normal estavam **no mesmo plano** (2.ª lei). (Pequenas diferenças devem-se a erros de medição.)\n:::\n:::q AP13 · p. 90 · Compara a intensidade do raio incidente com a do refletido.\n?? O raio **refletido é menos intenso**, porque parte da energia luminosa é **absorvida** pelo espelho (e/ou sofre refração no vidro).\n:::\n:::q AP13 · p. 90 · Questão-problema.\n?? Fazendo incidir um raio laser num espelho plano sobre um transferidor, com vários ângulos de incidência, e **medindo o ângulo de reflexão** em relação à normal: verifica-se que **αᵢ = αᵣ** e que os três (raio incidente, raio refletido e normal) estão **no mesmo plano**.\n:::\n## Atividade prática 14 — Reflexão difusa vs. especular (p. 91)\n:::q AP14 · p. 91 · Em qual ocorreu reflexão especular? Justifica.\n?? No **espelho**: é uma superfície **polida**; os raios refletidos continuaram **paralelos** entre si.\n:::\n:::q AP14 · p. 91 · Em qual ocorreu reflexão difusa? Justifica.\n?? No **papel de alumínio amarrotado**: superfície **rugosa**; os raios refletidos saíram em **várias direções** (não paralelos).\n:::\n:::q AP14 · p. 91 · Questão-problema.\n?? Na reflexão **especular** os raios refletidos mantêm-se **paralelos** (e forma-se imagem nítida); na **difusa** espalham-se em **todas as direções** (imagem pouco nítida ou nenhuma).\n:::\n## Exercício resolvido — Medidor laser (p. 93)\n:::q Exercício resolvido · p. 93 · a) Converte o tempo para SI.\n?? 0,015 µs = 0,015 × 10⁻⁶ s = **1,5 × 10⁻⁸ s**.\n:::\n:::q Exercício resolvido · p. 93 · b) Altura da sala.\n?? **1.º** Só a ida até ao teto: 1,5 × 10⁻⁸ ÷ 2 = **7,5 × 10⁻⁹ s**.\n**2.º** d = c × Δt = 3 × 10⁸ × 7,5 × 10⁻⁹ = **2,3 m** (2,25 m).\n:::", "chapter": "40-reflexao-luz"}, {"id": "41-espelhos", "title": "4.2 Espelhos planos e curvos — imagens", "pages": "Luz 96–105", "part": "Luz", "md": "## Atividade prática 15 (em estações) — Imagem num espelho plano (pp. 97–98)\n:::q AP15 · Estação 1 · p. 97 · Características da imagem do F (classificação, tamanho, orientação, distância, simetria).\n?? **Virtual**, **do mesmo tamanho** (3 cm), **direita**, à **mesma distância** do espelho (10 cm atrás) e **simétrica** em relação ao objeto (o F aparece \"ao contrário\", da direita para a esquerda).\n:::\n:::q AP15 · Estação 1 · p. 97 · Alterações ao variar a distância.\n?? **Nenhuma**, exceto a distância: a imagem fica sempre à **mesma distância** do espelho que o objeto (se o F se afasta, a imagem também se afasta). Continua virtual, direita, do mesmo tamanho e simétrica.\n:::\n:::q AP15 · Estação 2 · p. 98 · Distância entre a vela apagada e o acetato.\n?? **10 cm** — a mesma da vela acesa ao acetato. A imagem forma-se atrás do \"espelho\", à mesma distância do objeto.\n:::\n:::q AP15 · p. 98 · Questão-problema: como se descreve a imagem num espelho plano?\n?? **Virtual**, **direita**, **do mesmo tamanho** do objeto, à **mesma distância** do espelho e **simétrica** em relação ao objeto.\n:::\n## Atividade prática 16 — Imagem em espelhos curvos (p. 101)\n:::q AP16 · p. 101 · Características da imagem no espelho côncavo e como mudam ao aproximar.\n?? Com a vela **longe** do espelho (para lá do foco), forma-se no **alvo** uma imagem **real**, **invertida** (e menor, igual ou maior, conforme a distância). Ao aproximar a vela até **entre o foco e o espelho**, deixa de haver imagem no alvo; vê-se **no espelho** uma imagem **virtual**, **direita** e **maior**.\n:::\n:::q AP16 · p. 101 · E no espelho convexo?\n?? Nunca se forma imagem no alvo. No espelho vê-se sempre uma imagem **virtual**, **direita** e **menor** do que o objeto, qualquer que seja a distância.\n:::\n:::q AP16 · p. 101 · Questão-problema.\n?? Pela **classificação** (real/virtual), **tamanho**, **orientação** e **distância**: no **côncavo** depende da distância do objeto (longe → real e invertida; perto → virtual, direita e maior); no **convexo** é sempre **virtual, direita e menor**.\n:::\n## Investigo e comunico — Quem foi o padre Himalaya? (p. 104)\n:::q Investigo e comunico · p. 104 · Q1 — Datas de nascimento e morte; explicação da alcunha.\n?? Nasceu em **1868** (9 de dezembro, Cendufe, Arcos de Valdevez) e morreu em **1933** (21 de dezembro, Viana do Castelo). A alcunha \"**Himalaya**\" vem da sua **elevada estatura** (era muito alto) — os colegas do seminário compararam-no à cordilheira dos Himalaias. *(Confirma as datas na tua pesquisa.)*\n:::\n:::q Investigo e comunico · p. 104 · Q2 — Que tipo de reflexão ocorre num espelho?\n?? **Reflexão especular** (superfície polida; raios refletidos paralelos).\n:::\n:::q Investigo e comunico · p. 104 · Q3 — Quantos espelhos tinha o pireliόforo?\n?? Cerca de **6117 pequenos espelhos** dispostos num grande refletor (forma de espelho côncavo), apresentado na Exposição de Saint Louis (EUA) em **1904**. *(Confirma o número na tua pesquisa.)*\n:::\n:::q Investigo e comunico · p. 104 · Q4 — Fundir materiais: transformação química ou física?\n?? **Física** — a **fusão** é uma **mudança de estado** (sólido → líquido); não se formam novas substâncias.\n:::\n:::q Investigo e comunico · p. 104 · Q5 — Como construir um forno solar simples.\n?? Exemplo: uma **caixa de cartão** forrada por dentro com **papel de alumínio** (refletor), fundo pintado de **preto** (absorve a radiação), tampa com **película transparente** (efeito de estufa) e uma aba com alumínio para **refletir** a luz do Sol para dentro. Põe-se ao sol, virado para ele, com um alimento (ex.: derreter chocolate).\n:::\n## Para aplicar (p. 105)\n:::q Para aplicar · p. 105 · Q1.1 — Classifica A, B e C (superfície espelhada assinalada).\n?? **A – plano**; **B – convexo** (a superfície espelhada é o lado de **fora** da curva); **C – côncavo** (a superfície espelhada é o lado de **dentro** da curva).\n:::\n:::q Para aplicar · p. 105 · Q1.2 — Uma aplicação de cada.\n?? **Plano:** espelho da casa de banho (ou periscópio). **Convexo:** retrovisor de carro (ou espelho de cruzamento). **Côncavo:** espelho de maquilhagem (ou de dentista, faróis, telescópio refletor).\n:::\n:::q Para aplicar · p. 105 · Q2 — Características da imagem da vela num espelho plano.\n?? **Virtual**, **direita**, **do mesmo tamanho** da vela, à **mesma distância** do espelho e **simétrica**.\n:::\n:::q Para aplicar · p. 105 · Q3 — Imagem da palavra \"FAQ8\" num espelho plano.\n?? A palavra fica **simétrica** (espelhada esquerda-direita): as letras aparecem pela **ordem inversa** e cada uma **virada ao contrário** → lê-se da direita para a esquerda \"8QAF\", com o F e o Q espelhados (o A e o 8 ficam iguais, por serem simétricos). A imagem continua **direita** (não fica de pernas para o ar).\n:::\n:::q Para aplicar · p. 105 · Q4.1 — Porque se chamam convergentes os espelhos côncavos?\n?? Porque os raios luminosos **paralelos** que neles incidem são refletidos de forma a **convergir** (juntar-se) num ponto — o **foco**.\n:::\n:::q Para aplicar · p. 105 · Q4.2 — Características possíveis das imagens.\n?? Objeto **afastado** (para lá do foco): **real, invertida**, menor, do mesmo tamanho ou maior. Objeto **próximo** (entre o foco e o espelho): **virtual, direita e maior**.\n:::\n:::q Para aplicar · p. 105 · Q5.1 — Porque se chamam divergentes os espelhos convexos?\n?? Porque os raios **paralelos** que neles incidem são refletidos a **afastar-se** uns dos outros (**divergem**); só os seus **prolongamentos** se encontram, atrás do espelho, no foco.\n:::\n:::q Para aplicar · p. 105 · Q5.2 — Características da imagem neste espelho divergente.\n?? **Virtual**, **direita** e **menor** do que o objeto (forma-se atrás do espelho, entre o espelho e o foco).\n:::\n:::q Para aplicar · p. 105 · Q6.1 — Classifica o espelho (observador, cartolina, frutas).\n?? **Plano.**\n:::\n:::q Para aplicar · p. 105 · Q6.2 — Mede o ângulo de reflexão.\n?? Cerca de **30°–35°** em relação à normal (na figura o raio refletido faz ≈ 33° com a normal). *(Mede com o transferidor no teu livro: o valor exato depende da impressão.)*\n:::\n:::q Para aplicar · p. 105 · Q6.3 — Desenha o raio incidente e legenda.\n?? Do **ponto de incidência**, desenha um raio do outro lado da **normal**, com o **mesmo ângulo** (αᵢ = αᵣ), a subir para a **direita**, com a seta **a apontar para o espelho**. Legenda: **raio incidente**, **raio refletido**, **normal**, **ângulo de incidência (αᵢ)**, **ângulo de reflexão (αᵣ)**, **ponto de incidência**.\n:::\n:::q Para aplicar · p. 105 · Q6.4 — Que fruta(s) vê o observador no espelho?\n?? A **pera**. O raio incidente, simétrico do refletido em relação à normal, vem da zona da **pera**. (A banana fica demasiado perto da normal, e o ananás demasiado afastado.)\n:::", "chapter": "41-espelhos"}]}, "CN": {"title": "Ciências Naturais", "subtitle": "Guia de estudo · 8.º ano · Teste 1", "missing": ["Domínio 1 (Teste 1) está completo: Manual pp. 8–45, Caderno pp. 2–17 com as soluções do livro, PPTs, fichas de preparação e OneNote.", "O Domínio 2 (Sustentabilidade na Terra) do Manual e do Caderno está a ser adicionado.", "Respostas marcadas \"resolução própria\" não vêm do livro: o Manual não tem soluções.", "As páginas \"Trabalho prático\", \"Atividade prática\" e \"Vídeo\" do OneNote não estavam nas capturas de ecrã."], "chapters": [{"id": "00-matriz-teste", "title": "Teste 1 — o que sai (matriz)", "pages": "Manual pp. 8–45", "part": "Teste 1", "md": "# Teste 1 — matriz (outubro 2026)\n\n:::key\n**Estudar:** Manual (pp. **8–45**), caderno diário, Caderno de atividades (**Fichas 1, 2, 3 e Ficha de Avaliação 1**) e OneNote.\n:::\n\n## Conteúdos\n**Domínio 1 — Terra, um planeta com vida**\n\n**Subdomínio 1 — Vida na Terra**\n- Identificar e explicar as características da Terra que permitem a manutenção da vida.\n- Compreender a importância da atmosfera, da camada de ozono e dos gases com efeito de estufa para a vida.\n- Compreender a evolução da atmosfera terrestre.\n\n**Subdomínio 2 — Subsistemas da Terra**\n- Identificar os subsistemas do sistema Terra.\n- Compreender as interações entre os subsistemas terrestres.\n- Compreender a importância do solo para a vida.\n\n**Subdomínio 3 — Diversidade celular**\n- Célula como unidade básica da biodiversidade.\n- Identificar os diferentes tipos de seres, de células e as suas estruturas.\n\n## Tipos de perguntas\nO teste está organizado por **grupos** de itens, com documentos de apoio (imagens, esquemas, textos).\n- **Itens de seleção:** escolha múltipla, associação/correspondência, ordenação, verdadeiro/falso.\n- **Itens de construção:** resposta curta e resposta restrita (explicar por palavras tuas).\n\n## Planificação anual (1.º semestre)\n- **Domínio 1 — Terra, um planeta com vida:** 1.1 Vida na Terra (condições para a vida; evolução da atmosfera) · 1.2 Subsistemas da Terra · 1.3 Diversidade celular (a célula; níveis de organização biológica).\n- **Domínio 2 — Sustentabilidade na Terra:** 2.1 Ecossistemas — organização e dinâmica (interação seres vivos–ambiente), fluxos de energia e ciclos de matéria, perturbações no equilíbrio dos ecossistemas e medidas de conservação."}, {"id": "01-vida-na-terra", "title": "1.1 Vida na Terra", "pages": "Manual pp. 8–21 · Caderno pp. 2–3 · PPT Vida na Terra · Resumo OneNote", "part": "Domínio 1 · Terra, um planeta com vida", "md": "# Vida na Terra\n\n## Sistema Solar\n- Constituído por uma **estrela (Sol)**, **planetas** (principais, secundários e anões), **cometas**, **asteroides**, **meteoroides**, **gases e poeiras**.\n- **Planetas rochosos (telúricos) e interiores:** Mercúrio, Vénus, **Terra**, Marte.\n- **Planetas gasosos e exteriores:** Júpiter, Saturno, Úrano, Neptuno.\n- A Terra é o **3.º planeta a contar do Sol** e é **telúrica (rochosa)**.\n\n## O Sistema Solar planeta a planeta (Manual pp. 8–9)\n- O Sistema Solar é formado pelo **Sol** e por todos os astros que o orbitam: planetas, asteroides, satélites naturais (luas), gases e poeiras.\n- A **Terra** é o **terceiro planeta** a contar do Sol e o **quinto maior** do sistema. O nome vem do latim e está ligado a «solo», «chão», «região», porque as primeiras civilizações eram agrícolas. É o **único** planeta cujo nome não vem da mitologia greco-romana.\n- A Terra é um **planeta telúrico**; a sua estrutura interna divide-se em **crosta, manto e núcleo**.\n- Até hoje descobriram-se mais de **4000 exoplanetas** (planetas fora do Sistema Solar que orbitam outra estrela), alguns com características semelhantes às da Terra, mas a Terra é o **único** planeta onde se conhece vida.\n\n| Planeta | Distância média ao Sol | Temperatura média | Atmosfera (gases principais) | Tipo | Água líquida |\n|---|---|---|---|---|---|\n| Mercúrio | 5,79 × 10⁷ km | 85 °C (mín. −180 °C; máx. 430 °C) | **ausente** | interior e rochoso | ausente |\n| Vénus | 1,06 × 10⁸ km | **471 °C** | dióxido de carbono e dinitrogénio | interior e rochoso | ausente |\n| **Terra** | **1,50 × 10⁸ km** | **15 °C** | **dinitrogénio e dioxigénio** | interior e rochoso | **presente** |\n| Marte | 2,27 × 10⁸ km | −28 °C | dióxido de carbono e dinitrogénio | interior e rochoso | ausente |\n| Júpiter | 7,78 × 10⁸ km | −108 °C | di-hidrogénio e hélio | exterior e gasoso | ausente |\n| Saturno | 1,43 × 10⁹ km | −138 °C | metano, di-hidrogénio e hélio | exterior e gasoso | ausente |\n| Úrano | 2,87 × 10⁹ km | −195 °C | metano, di-hidrogénio e hélio | exterior e gasoso | ausente |\n| Neptuno | 4,5 × 10⁹ km | −201 °C | metano, di-hidrogénio e hélio | exterior e gasoso | ausente |\n\n:::note\n**Notas para o aluno:** **planetas telúricos** = rochosos · **exoplanetas** = fora do Sistema Solar, orbitam outra estrela · **planetas interiores** = entre o Sol e a Cintura de asteroides · **planetas exteriores** = para lá da Cintura de asteroides.\n**Ecocuriosidade:** a primeira sonda a aterrar num satélite natural foi a soviética *Luna 2*, na Lua, em **1959**.\n:::\n\n:::tip\n**Porque é Vénus mais quente do que Mercúrio**, se está mais longe do Sol? Porque Vénus tem uma atmosfera **muito rica em CO₂** (gás com efeito de estufa) e Mercúrio **não tem atmosfera** (a sua massa é pequena demais para reter gases).\n:::\n\n## Características da Terra\n| Característica | Valor |\n|---|---|\n| Distância média ao Sol | **150 × 10⁶ km** (1,50 × 10⁸ km) |\n| Temperatura média | **15 °C** |\n| Atmosfera (principais constituintes) | **Dinitrogénio e dioxigénio** |\n| Tipo de planeta | **Interior e rochoso** |\n| Água no estado líquido | **Presente** |\n\n## Condições que permitem a vida na Terra\n| Condição | Porque é importante |\n|---|---|\n| **Distância da Terra ao Sol** | Permite uma **temperatura amena** e a existência de **água no estado líquido** |\n| **Massa da Terra** (força gravítica) que permite **reter uma atmosfera** | Atmosfera com **camada de ozono** e com **gases com efeito de estufa**, que mantêm uma temperatura amena |\n| **Campo magnético** | **Desvia a radiação nociva** emitida pelo Sol |\n\n:::key\nCondições para a vida: **distância ao Sol adequada**, **massa/gravidade para fixar uma atmosfera**, atmosfera com **camada de ozono** e **efeito de estufa**, **temperatura média amena (~15 °C)**, **água líquida** e **campo magnético**.\n:::\n\n- A Terra formou-se há cerca de **4600 milhões de anos (Ma)**. A superfície é constantemente **reciclada** (meteorização, erosão e processos tectónicos destroem-na e constroem-na), por isso restam poucos vestígios da atividade geológica passada.\n- **71 %** da superfície da Terra está coberta de água.\n\n## A atmosfera — ozono e efeito de estufa\n- A **camada de ozono** é constituída por cerca de **90 % do gás ozono (O₃)** e funciona como uma barreira contra os raios **UV-B e UV-C**, que podem afetar a saúde humana e o ambiente. O seu aparecimento permitiu a **colonização do meio terrestre** (há cerca de **400 Ma**).\n- Os **gases com efeito de estufa** (vapor de água, dióxido de carbono, óxido nitroso, metano) **retêm o calor** e permitem que a temperatura média seja superior à que existiria sem eles (sem efeito de estufa seria cerca de **−18 °C**).\n- **Camada de ozono (A):** grande parte da **radiação ultravioleta** (UV-B e UV-C) é **absorvida** e não alcança a superfície. O seu aparecimento foi fundamental para a **colonização do meio terrestre**.\n- **Efeito de estufa (B):**\n  - a radiação solar atravessa a atmosfera; a maior parte é **absorvida pela superfície**, que aquece;\n  - alguma radiação é **refletida** pela Terra e pela atmosfera e volta ao Espaço;\n  - parte da **radiação infravermelha** emitida pela superfície é **reenviada** pela camada de gases com efeito de estufa, **aquecendo a atmosfera**.\n- O efeito de estufa permite uma **temperatura média amena** e foi determinante para o surgimento e diversificação da vida.\n\n:::warn\nNão confundas: o **ozono** **filtra a radiação UV**; o **efeito de estufa** **mantém a temperatura amena**.\n:::\n\n## Evolução da atmosfera terrestre\n**Etapas (resumo do caderno):**\n1. **Formação da Terra** → (atividade vulcânica) → **formação da atmosfera primitiva**.\n2. **Arrefecimento + condensação** do vapor de água → nuvens e chuvas → **oceanos primitivos**.\n3. **Aparecimento da vida** (bactérias simples) **nos oceanos** — há cerca de **3800 a 3500 Ma**.\n4. **Bactérias fotossintéticas (cianobactérias)** → **↑ O₂, ↓ CO₂**.\n5. **Atmosfera atual** → **camada de ozono (O₃)** → **vida continental** (colonização dos continentes).\n\n- Há cerca de **4000 Ma**, por ação da **força gravítica**, fixaram-se os gases da **intensa atividade vulcânica** e dos **impactos de meteoritos** → atmosfera primitiva.\n- **Atmosfera primitiva:** di-hidrogénio, metano, amoníaco, monóxido de carbono, **dióxido de carbono**, dinitrogénio (e muito vapor de água). **Sem dioxigénio**.\n- Os **seres fotossintéticos (cianobactérias)** libertavam **dioxigénio**. A acumulação significativa de O₂, há cerca de **2000 Ma**, levou à **camada de ozono**.\n- **Atmosfera atual:** **dinitrogénio (78 %)** e **dioxigénio (21 %)**; outros (1 %): dióxido de carbono, vapor de água, metano, árgon.\n\n### Porque diminuiu o CO₂?\n- **Dissolução** nos oceanos;\n- utilização pelos **seres fotossintéticos**;\n- formação de **rochas carbonatadas**.\n\n:::key\nAo longo do tempo geológico, a **temperatura** à superfície **diminuiu** porque **diminuiu a concentração de CO₂** — o principal gás com efeito de estufa.\n:::\n\n### Ler o gráfico de CO₂ e temperatura (600 Ma → hoje)\n- **Câmbrico:** CO₂ muito **alto** (até ~7000 ppm) e temperatura **alta** (~22 °C) — muito mais do que hoje.\n- **Pérmico → Triássico:** **subida brusca** da temperatura e do CO₂.\n- **Hoje:** CO₂ e temperatura **baixos** em relação à maior parte da história da Terra.\n- Em geral, **CO₂ e temperatura variam no mesmo sentido**.\n\n## Aquecimento global e camada de ozono (Manual p. 12)\n- O **aumento** dos gases com efeito de estufa (dióxido de carbono, metano, vapor de água, dióxido de enxofre, óxido nitroso…) com origem nas **atividades humanas** (queima de combustíveis fósseis: carvão, petróleo, gás natural) **acentua o efeito de estufa** e eleva a temperatura média → **aquecimento global**.\n- Os **CFC (clorofluorcarbonetos)** — usados em frigoríficos, ar condicionado, aerossóis e solventes — permanecem na atmosfera cerca de **50 anos** e são os grandes responsáveis pela **destruição do ozono** estratosférico («buraco» do ozono sobre a Antártida, descoberto em **1985**).\n- **1987 — Protocolo de Montreal:** acordo para controlar as emissões de gases nocivos para a camada de ozono. Em 2019 o «buraco» estava a diminuir, mas foram detetadas emissões de CFC na China (províncias de Shandong e Hebei).\n\n:::steps\n**Liga-te ao laboratório — Qual é a influência do efeito de estufa na temperatura? (p. 13)**\nMaterial: dois copos com 100 ml de água, papel de alumínio, caixa de sapatos, tesoura, película aderente, termómetro digital.\n1. Forra o interior da caixa com papel de alumínio.\n2. Coloca um copo com água (A) dentro da caixa.\n3. Regista a temperatura da água nos dois copos.\n4. Tapa a caixa com película aderente.\n5. Coloca a caixa (com o copo A) e o copo B ao Sol ou sob uma lâmpada acesa.\n6. Após 30 minutos, regista a temperatura nos dois copos.\n**Resultado esperado:** a água do copo **A** (dentro da caixa tapada) aquece **mais**: a película deixa entrar a radiação mas **retém o calor** — tal como os gases com efeito de estufa na atmosfera.\n:::\n\n## Mais sobre a evolução da atmosfera (Manual pp. 14–15)\n- Há cerca de 4000 Ma a atmosfera primitiva era **densa** e os raios solares tinham **dificuldade em atravessá-la**; hoje atravessam-na com **maior facilidade**.\n- Os oceanos primitivos tinham **águas quentes e matéria orgânica**; aí surgiram os primeiros seres vivos (bactérias muito simples) há **3800 a 3500 Ma**.\n- **Quimiossíntese e fotossíntese:** reações químicas que permitem produzir compostos orgânicos a partir de compostos inorgânicos.\n- A **luminosidade** que atinge a superfície foi **aumentando** ao longo do tempo, devido às alterações na composição da atmosfera.\n- Composição típica da atmosfera primitiva (gráfico do Manual): **dinitrogénio 40 %**, **dióxido de carbono 30 %**, **vapor de água 25 %**, **metano 5 %** e vestígios de amoníaco. Atual: **dinitrogénio 78 %**, **dioxigénio 21 %**, outros 1 %.\n\n:::key\n**Recorda (Manual p. 18)**\n- **Características da Terra que permitiram a vida:** planeta telúrico (crosta, manto, núcleo) · distância ao Sol adequada (1,5 × 10⁸ km) · massa e força gravítica que fixam uma atmosfera · atmosfera com camada de ozono e efeito de estufa · campo magnético que desvia a radiação nociva · água líquida · temperatura média de 15 °C.\n- **Importância da atmosfera:** a camada de ozono absorve grande parte da UV-B e UV-C; o efeito de estufa (vapor de água, CO₂, óxido nitroso, metano) retém o calor e foi fundamental para o aparecimento e manutenção da vida.\n- **Evolução da atmosfera:** primitiva — di-hidrogénio, metano, amoníaco, dióxido e monóxido de carbono e dinitrogénio; as bactérias fotossintéticas libertaram e acumularam **dioxigénio**; atual — dinitrogénio e dioxigénio (+ CO₂, vapor de água, metano em pequenas quantidades).\n:::"}, {"id": "02-subsistemas", "title": "1.2 Subsistemas da Terra e o solo", "pages": "Manual pp. 22–29 · PPT Subsistemas", "part": "Domínio 1 · Terra, um planeta com vida", "md": "# Subsistemas da Terra\n\n## Tipos de sistemas\n| Sistema | Trocas com o meio |\n|---|---|\n| **Aberto** | Troca **energia e matéria** |\n| **Fechado** | Troca **só energia** |\n| **Isolado** | **Não troca** energia nem matéria |\n\n- A **Terra** é um **sistema fechado**: não há trocas de matéria significativas com o exterior, só **trocas de energia** (recebe radiação solar, emite radiação para o Espaço). Os recursos naturais são **finitos** e os poluentes **ficam no sistema**.\n- Os **subsistemas** são **sistemas abertos** (trocam matéria e energia entre si), **dinâmicos** e **interdependentes**: a alteração de um provoca alterações nos outros.\n\n## Os quatro subsistemas\n| Subsistema | O que é |\n|---|---|\n| **Atmosfera** | Camada **gasosa** que envolve a Terra (gases, partículas sólidas e líquidas), mantida pela **gravidade**. **Dinitrogénio 78 %, dioxigénio 21 %, outros 1 %**. Escudo protetor contra radiações solares e cósmicas e impacto de meteoritos. |\n| **Hidrosfera** | **Toda a água** da Terra: oceanos, mares, rios, lagos, águas subterrâneas (aquíferos), neve e gelo (**criosfera**), vapor de água. **Salgada 97 %, doce 3 %**; água doce à superfície só **1 %**. Circula no **ciclo hidrológico**. |\n| **Geosfera** | **Parte rochosa** da Terra e materiais do seu interior. A parte mais superficial (**crosta**) é suporte da vida e onde existem os **solos**. |\n| **Biosfera** | **Todos os seres vivos** (das bactérias ao ser humano) e os seus **habitats** (solo, ar, água; das altas montanhas à Fossa das Marianas). |\n\n:::tip\n**Ecocuriosidade:** existem \"rios atmosféricos\" — faixas longas e estreitas de ar com muito vapor de água, formadas na região do equador.\n:::\n\n## Interações entre subsistemas (exemplos)\n| Interação | Exemplo |\n|---|---|\n| **Biosfera – Atmosfera** | Seres fotossintéticos **absorvem CO₂ e libertam O₂** |\n| **Biosfera – Hidrosfera** | Os animais **precisam de beber água** para sobreviver |\n| **Hidrosfera – Geosfera** | A água é agente de **meteorização e erosão** das rochas |\n| **Biosfera – Geosfera** | **Raízes** das plantas fixam-se no solo e desgastam as rochas; plantas absorvem **água e sais minerais** do solo; o **coelho usa o solo como habitat e abrigo** |\n| **Geosfera – Atmosfera** | **Vulcões** libertam gases durante as erupções |\n| **Hidrosfera – Atmosfera** | **Evaporação, condensação e precipitação** (ciclo da água) |\n\n- **O ser humano** é o principal responsável por alterações drásticas: poluentes industriais → **chuvas ácidas** que contaminam a **água** (hidrosfera) e o **solo** (geosfera), matam seres vivos (biosfera) e provocam a erosão das rochas.\n\n## O solo\n- Faz parte da **geosfera**. Forma-se a partir da **alteração (meteorização) das rochas-mãe** por **agentes erosivos**, durante **milhões de anos** — processo **lento**.\n- **Fases da formação (Fig. 1.011):** meteorização e erosão da rocha-mãe → presença de material orgânico → início da diferenciação dos horizontes → **solo maduro**.\n- **Horizontes:** **O** (folhas e restos orgânicos — **mais rico em matéria orgânica / húmus**), **A**, **B**, **C**, e por baixo a **rocha-mãe**.\n- É constituído **na sua maioria por matéria mineral**.\n- Importância: **reservas de água e sais minerais** para as plantas produzirem matéria orgânica; **suporte** das plantas; **habitat** de muitas espécies. Base de **~90 % da produção de alimentos**; purifica e regula a água; motor dos ciclos de nutrientes.\n\n:::key\n**Papel da água na geosfera:** a água é um **agente erosivo e de transporte** que atua sobre as rochas, provocando a sua **alteração (meteorização)** e a **modelação do relevo** da superfície terrestre.\n:::\n\n## Recorda (Manual p. 26)\n- A Terra é um **sistema fechado** constituído por quatro **subsistemas** interligados: **atmosfera, hidrosfera, geosfera e biosfera**.\n- **Atmosfera:** camada gasosa que envolve a Terra. **Biosfera:** todos os seres vivos. **Geosfera:** parte rochosa da Terra e materiais do seu interior. **Hidrosfera:** toda a água do planeta.\n- Os **solos** formam-se a partir da **meteorização e alteração das rochas-mãe**, servem de **suporte à vida** e são fundamentais à **biodiversidade**.\n- Os solos são constituídos pelos **horizontes O, A, B e C** e pela **rocha-mãe**.\n\n:::tip\n**Consigo (autoavaliação, p. 27):**\n- Distinguir o sistema Terra dos seus subsistemas e as potencialidades de cada um na geração da vida (p. 22).\n- Analisar criticamente o papel das rochas e do solo na existência de vida no meio terrestre e dos subsistemas na manutenção da vida (p. 24).\n- Praticar mais: **Caderno de atividades, Ficha 2**.\n:::"}, {"id": "03-diversidade-celular", "title": "1.3 Diversidade celular e níveis de organização", "pages": "Manual pp. 30–45 · Caderno pp. 9–11 · PPT Célula", "part": "Domínio 1 · Terra, um planeta com vida", "md": "# Diversidade celular\n\n## A célula e a teoria celular\n- **1663 — Robert Hooke** observou cortes de **cortiça** (viu as paredes celulares) e usou pela primeira vez o termo **«célula»**.\n- **1839 — teoria celular** (graças à evolução da microscopia):\n  - a célula é a **unidade estrutural e funcional** de todos os seres vivos;\n  - todas as células resultam de **células preexistentes** (divisão celular);\n  - a célula contém **informação genética** passada às células-filhas;\n  - as **reações metabólicas** ocorrem no interior das células.\n\n:::key\nO desenvolvimento tecnológico do **microscópio** (maior poder de **ampliação** e melhor **resolução**) permitiu observar com mais detalhe os organelos e conhecer melhor a **constituição e estrutura da célula**.\n:::\n\n## História da descoberta da célula (Manual pp. 30–31)\n- A vida começou há cerca de **3800 Ma** com seres muito simples, como as bactérias, formadas por uma única célula (**unicelulares**). Os dinossauros só apareceram há cerca de 250 Ma.\n\n| Ano | Cientista | Contributo |\n|---|---|---|\n| **1590** | **Zacharias Jansen** (e o pai, Hans Jansen) | Constroem o **primeiro microscópio** |\n| **1663** | **Robert Hooke** (biólogo) | Analisa cortes de **cortiça**, observa as paredes celulares e chama-lhes **«células»** |\n| **1674** | **Antony Leeuwenhoek** | Aperfeiçoa os microscópios e observa os primeiros materiais biológicos: **protozoários, bactérias e espermatozoides** |\n| **1838** | **Mathias Schleiden** (botânico) | A célula é a unidade básica dos **vegetais** |\n| **1839** | **Theodor Schwann** (zoologista) | Todos os **animais** são formados por células |\n| **1885** | **Rudolf Virchow** (médico) | «***Omnis cellula ex cellula***» — qualquer célula tem origem noutra célula |\n| **1931** | **Ernst Ruska** (físico) | Inventa o **microscópio eletrónico** (amplia cerca de **500 mil vezes**; revela moléculas orgânicas e vírus) |\n\n- Hoje, os **microscópios eletrónicos** e os **microscópios de força atómica** permitem ver estruturas nunca antes observadas.\n\n## Microscópio ótico composto\n**Partes:** ocular · tubo (canhão) · revólver · objetivas · braço (coluna) · platina com pinças · condensador e diafragma · fonte de luz · parafuso **macrométrico** · parafuso **micrométrico** · pé (base).\n\n:::steps\n**Como observar**\n1. Verificar que está colocada a **objetiva de menor ampliação**.\n2. **Iluminar** o campo; abrir/fechar o **diafragma** para regular a luz.\n3. Colocar a **preparação** na platina.\n4. Com o **macrométrico**, aproximar lentamente a platina da objetiva.\n5. Olhar pela **ocular** e afastar lentamente até ver a primeira imagem.\n6. Tornar a imagem **nítida** com o **micrométrico**.\n:::\n\n### Funções das partes (Manual p. 33)\n| Parte | Função |\n|---|---|\n| **Ocular** | Sistema de lentes que **amplia a imagem** |\n| **Objetivas** | Sistemas de lentes que projetam a imagem ampliada da amostra em direção à ocular |\n| **Revólver** | **Suporte das objetivas** |\n| **Platina com pinças** | Onde se coloca e prende a preparação |\n| **Condensador** | Lentes que **concentram os raios luminosos** da fonte de luz na preparação |\n| **Diafragma** | **Regula a intensidade luminosa** no campo visual |\n| **Parafuso macrométrico** | Movimentos **amplos e rápidos** da platina (aproximar/afastar das objetivas) |\n| **Parafuso micrométrico** | Movimentos **restritos e rigorosos** — focagem fina |\n| Tubo ou canhão · Braço ou coluna · Pé ou base · Fonte de luz | Estrutura e iluminação |\n\nO microscópio ótico composto amplia imagens de estruturas muito pequenas graças ao seu **poder de resolução**; tem **dois sistemas de lentes: ocular e objetivas**. *(Ampliação total = ampliação da ocular × ampliação da objetiva.)*\n\n:::warn\n**Cuidados com o microscópio:** transporta-o com **as duas mãos** (uma na base, outra na coluna) · coloca-o sobre a mesa, afastado do bordo · não molhes a platina · limpa as lentes com material próprio, em movimentos circulares · no fim, guarda-o com a **objetiva de menor ampliação** selecionada e protegido.\n:::\n\n:::steps\n**Como montar uma preparação (p. 33)**\n1. Coloca uma gota de água no centro da **lâmina**.\n2. Em cima da gota, coloca a amostra.\n3. Cobre com uma **lamela**: encosta-a à lâmina num ângulo de **45°** e, com uma agulha de dissecação, deixa-a cair lentamente.\n4. Retira o excesso de água com **papel de filtro**.\n:::\n\n## Organismos\n- **Unicelulares:** uma só célula (ex.: bactérias).\n- **Pluricelulares (multicelulares):** duas ou mais células.\n\n## Tipos de células\n| | **Procarióticas** | **Eucarióticas** |\n|---|---|---|\n| Complexidade | **Muito simples**, pequenas | **Complexas**, maiores |\n| Organelos membranares | **Não** | **Sim** |\n| Material genético (ADN) | Disperso no citoplasma, no **nucleoide** | Dentro de um **núcleo** (membrana nuclear) |\n| Exemplos | **Bactérias** e arqueobactérias | **Protistas, fungos, plantas e animais** |\n\n- Existe uma grande diversidade de células, que diferem na **forma e tamanho** consoante o organismo e a função. Exemplos de **unicelulares**: *Bacillus subtilis*, *Nostoc*, *Vorticella*, *Euglena*. **Pluricelulares**: *Elodea* (planta), *Homo sapiens*, *Agaricus bisporus* (cogumelo).\n- Os seres vivos formados por células procarióticas chamam-se **procariontes** (bactérias e arqueobactérias); os formados por células eucarióticas chamam-se **eucariontes** (protistas, fungos, plantas e animais).\n- O **nucléolo** é uma região do núcleo com grande concentração de material genético. O núcleo é rodeado pela **membrana nuclear**.\n- **Ecocuriosidade:** o **óvulo** é a maior célula do corpo humano (cerca de **0,12 mm**) e pode ver-se a olho nu.\n\n**Estruturas da célula procariótica:** fímbrias (adesão), ribossomas (síntese de proteínas), parede celular (proteção), citoplasma, membrana celular, flagelo (mobilidade), nucleoide (material genético).\n\n**Eucarióticas animais vs. vegetais:**\n- **Animais:** **sem cloroplastos nem parede celular**; vários vacúolos **pequenos**.\n- **Vegetais:** **com cloroplastos e parede celular**; normalmente **um grande vacúolo**.\n\n## Organelos e funções\n| Estrutura | Função |\n|---|---|\n| **Membrana celular** | Delimita a célula e **regula a entrada e saída** de substâncias |\n| **Citoplasma** | Meio intracelular (espaço interno) que contém os organelos |\n| **Núcleo** | Contém o **material genético (ADN)** e controla a atividade celular |\n| **Parede celular** | Confere **proteção** (e forma) à célula |\n| **Mitocôndria** | **Respiração celular** → produção de **energia** |\n| **Cloroplasto** | **Fotossíntese** |\n| **Vacúolo** | Reservatório de **água e outras substâncias** |\n| **Complexo de Golgi** | **Transformação de proteínas** |\n| **Retículo endoplasmático** | Produção e armazenamento de proteínas; síntese de membranas |\n| **Ribossomas** | Síntese de proteínas |\n\n| | Procariótica | Eucariótica animal | Eucariótica vegetal |\n|---|---|---|---|\n| Membrana celular | ✔ | ✔ | ✔ |\n| Citoplasma | ✔ | ✔ | ✔ |\n| Ribossomas | ✔ | ✔ | ✔ |\n| Núcleo | ✗ | ✔ | ✔ |\n| Parede celular | ✔ | ✗ | ✔ |\n| Mitocôndrias | ✗ | ✔ | ✔ |\n| Cloroplastos | ✗ | ✗ | ✔ |\n| Vacúolo | ✗ | ✔ (pequenos, numerosos) | ✔ (um, grande) |\n| Complexo de Golgi | ✗ | ✔ | ✔ |\n| Retículo endoplasmático | ✗ | ✔ | ✔ |\n\n:::tip\n**Truques do caderno:** membrana, citoplasma (e ribossomas) são **comuns a todas**. O **núcleo** só falta nas **procarióticas**. A **parede celular** só falta nas **eucarióticas animais**. Os **cloroplastos** só existem nas **eucarióticas vegetais**.\n:::\n\n## Biodiversidade e níveis de organização biológica\n**Biodiversidade** = enorme variedade de organismos, organizada do nível mais simples ao mais complexo:\n\n| Nível | Definição |\n|---|---|\n| **Átomo** | Unidade básica da matéria |\n| **Molécula** | Conjunto de átomos ligados entre si |\n| **Célula** | Unidade básica dos seres vivos |\n| **Tecido** | Conjunto de células com a mesma função |\n| **Órgão** | Conjunto de tecidos com determinada função |\n| **Sistema de órgãos** | Conjunto de órgãos interligados responsáveis por uma função |\n| **Organismo** | Conjunto de sistemas de órgãos que funcionam como um todo |\n| **População** | Organismos da **mesma espécie** que vivem no mesmo local |\n| **Comunidade** | Diferentes **populações** que habitam um local e interagem |\n| **Ecossistema** | Seres vivos de diferentes espécies que se relacionam entre si **e com o ambiente** |\n| **Biosfera** | Conjunto de **todos os ecossistemas** da Terra |\n\n:::tip\nOrdem: **Átomo → Molécula → Célula → Tecido → Órgão → Sistema de órgãos → Organismo → População → Comunidade → Ecossistema → Biosfera**.\n:::\n\n## Liga-te ao laboratório — procarióticas vs. eucarióticas (Manual pp. 38–39)\n- **Atividade 1 — epitélio lingual (bochecha/gengiva) e bactérias:** gota de **azul de metileno** na lâmina; raspa-se a gengiva com um palito; cobre-se com lamela; observa-se. Vêem-se **células do epitélio** (eucarióticas animais: membrana, citoplasma, **núcleo**) e **bactérias** (procarióticas, muito mais pequenas, sem núcleo). O azul de metileno é um **corante** que permite ver melhor as estruturas (o núcleo).\n- **Atividade 2 — filídios de musgo:** gota de água na lâmina, filídio de musgo com pinça, lamela. Vêem-se células **eucarióticas vegetais** com **parede celular** e muitos **cloroplastos** (verdes).\n\n## Biodiversidade e classificação (Manual pp. 40–41)\n- A **biologia** é a ciência que estuda a vida e permitiu classificar os seres vivos conhecidos. Hoje usam-se categorias **desde o reino até à espécie**, com base no **parentesco ao longo da evolução**.\n- **Ecocuriosidade:** **Aristóteles** (384–322 a.C.) foi o primeiro a agrupar os seres vivos em dois grupos: **animais** (que se moviam) e **plantas** (que não se moviam); considerava que as espécies não evoluíam.\n\n:::key\n**Recorda (Manual p. 42)**\n- A **célula** é a mais pequena unidade funcional e estrutural comum a todos os seres vivos.\n- As células classificam-se em **procarióticas** e **eucarióticas** conforme a presença ou ausência de **organitos**.\n- A observação de células só foi possível com os **microscópios**.\n- **Procarióticas:** muito simples, **sem núcleo**; têm **parede celular** e algumas têm **flagelo** → seres **procariontes**.\n- **Eucarióticas:** com núcleo, maiores e complexas; presentes em **protistas, fungos, plantas e animais** → seres **eucariontes**. **Animais:** sem cloroplastos nem parede, vários vacúolos pequenos. **Vegetais:** cloroplastos, parede celular e um vacúolo grande e central.\n- **Biodiversidade** = variedade e diversidade de organismos. **Níveis:** átomo, molécula, célula, tecido, órgão, sistema de órgãos, organismo, população, comunidade, ecossistema, biosfera.\n:::"}], "qsets": [{"id": "90-perguntas-0", "title": "PPT 1.1 — Vida na Terra (Coloca-te à prova)", "pages": "PPTs · Ficha de preparação Teste 1", "part": "PPTs e ficha de preparação", "md": ":::q PPT Vida na Terra · Q1 · A Terra é o ___ planeta a contar do Sol, sendo classificado como um planeta ___. (A) quarto…gasoso (B) quarto…telúrico (C) terceiro…gasoso (D) terceiro…telúrico\n?? **(D) terceiro … telúrico.**\n:::\n:::q PPT Vida na Terra · Q2 · Opção que NÃO corresponde a uma característica que permita a vida: (A) água líquida (B) temperatura amena (C) ausência de campo magnético (D) gases com efeito de estufa\n?? **(C)** — a Terra **tem** campo magnético, que desvia a radiação nociva do Sol.\n:::\n:::q PPT Vida na Terra · Q3 · O efeito de estufa existente na Terra… (A) permite temperatura média amena (B) protege de meteoritos (C) filtra a radiação UV (D) permite temperatura elevada\n?? **(A)**. (Filtrar a radiação UV é função da **camada de ozono**.)\n:::\n:::q PPT Vida na Terra · Q4 · O gráfico (dinitrogénio 78 %, dioxigénio 21 %, outros 1 %) corresponde à atmosfera ___, mais ___ em CO₂ e vapor de água do que a atmosfera ___.\n?? **(A) atual … pobre … primitiva.** O gráfico tem 21 % de O₂, logo é a atmosfera **atual**; a primitiva era rica em CO₂ e vapor de água.\n:::\n:::q PPT Vida na Terra · Q5 · O dioxigénio surgiu na atmosfera como resultado da (A) atividade vulcânica (B) respiração (C) fotossíntese das cianobactérias (D) fotossíntese das plantas\n?? **(C)** — as primeiras a libertar O₂ foram as **cianobactérias** (as plantas surgiram muito depois).\n:::\n:::q PPT Vida na Terra · Q6 · A colonização do meio terrestre ocorreu devido ao aparecimento ___, que ___.\n?? **(C) da camada de ozono … filtra a radiação ultravioleta nociva.**\n:::\n:::q PPT Vida na Terra · Q7 · Ao longo do tempo geológico verificou-se ___ de CO₂, levando ___ da temperatura.\n?? **(C) uma diminuição … à diminuição.**\n:::"}, {"id": "90-perguntas-1", "title": "PPT 1.2 — Subsistemas da Terra", "pages": "PPTs · Ficha de preparação Teste 1", "part": "PPTs e ficha de preparação", "md": ":::q PPT Subsistemas · Q1 · A Terra é um sistema ___, verificando-se apenas trocas de ___ com o meio envolvente.\n?? **(A) fechado … energia.**\n:::\n:::q PPT Subsistemas · Q2 · A hidrosfera refere-se (A) aos materiais rochosos (B) à água existente no planeta (C) aos gases (D) aos seres vivos\n?? **(B)** à água existente no planeta.\n:::\n:::q PPT Subsistemas · Q3 · A biosfera refere-se (A) aos materiais rochosos (B) à água (C) aos gases (D) a todos os seres vivos e seus habitats\n?? **(D).**\n:::\n:::q PPT Subsistemas · Q4 · Um exemplo de interação biosfera–geosfera: (A) plantas absorvem do solo água e sais minerais (B) condensação e precipitação (C) gases das erupções (D) plantas libertam O₂ e absorvem CO₂\n?? **(A).** (B: hidrosfera–atmosfera; C: geosfera–atmosfera; D: biosfera–atmosfera.)\n:::\n:::q PPT Subsistemas · Q5 · V/F: \"O solo forma-se a partir da meteorização e erosão das rochas-mãe, ao longo de milhões de anos.\"\n?? **Verdadeira.**\n:::"}, {"id": "90-perguntas-2", "title": "PPT 1.3 — Diversidade celular", "pages": "PPTs · Ficha de preparação Teste 1", "part": "PPTs e ficha de preparação", "md": ":::q PPT Célula · Q1 · As bactérias são seres ___, constituídos por ___.\n?? **(A) unicelulares … uma só célula.**\n:::\n:::q PPT Célula · Q2 · As células ___ apresentam núcleo e organelos ___.\n?? **(C) eucarióticas … membranares.**\n:::\n:::q PPT Célula · Q3 · Um ser procarionte tem uma célula ___, cujo material genético se encontra ___.\n?? **(B) procariótica … espalhado numa região do citoplasma, denominada nucleoide.**\n:::\n:::q PPT Célula · Q4 · A célula da imagem (verde, com parede e cloroplastos) é eucariótica ___, pois ___.\n?? **(C) vegetal … apresenta cloroplastos e parede celular.**\n:::\n:::q PPT Célula · Q5 · A mitocôndria é o local onde ocorre ___ e corresponde ao algarismo ___ (1 = retículo/organelo dobrado; 2 = organelo oval com cristas).\n?? **(D) respiração celular … 2.** *(Na imagem, o 2 aponta para o organelo oval com pregas internas — a mitocôndria. Confirma no PPT.)*\n:::\n:::q PPT Célula · Q6 · A parede celular (A) controla as atividades (B) confere proteção à célula (C) regula as trocas (D) faz fotossíntese\n?? **(B).** (A = núcleo; C = membrana celular; D = cloroplasto.)\n:::\n:::q PPT Célula · Q7 · Na imagem (vários pinguins da mesma espécie) está representada uma ___, pois observa-se um conjunto de ___.\n?? **(B) população … organismos da mesma espécie.**\n:::\n:::q PPT Célula · Q8 · Ordem crescente de níveis de organização biológica.\n?? **(A) Célula – Sistema de órgãos – População – Comunidade – Ecossistema.**\n:::"}, {"id": "90-perguntas-3", "title": "Ficha de preparação — Teste 1 (respostas da correção do professor)", "pages": "PPTs · Ficha de preparação Teste 1", "part": "PPTs e ficha de preparação", "md": "### Grupo I — gráfico de CO₂ e temperatura (600 Ma até hoje)\n:::q Ficha · Grupo I · Q1 · Durante o Câmbrico a atmosfera era, relativamente à atual, mais (A) pobre em CO₂, temp. mais elevada (B) pobre, menos elevada (C) rica, menos elevada (D) rica em CO₂ e temperatura mais elevada\n?? **(D).**\n:::\n:::q Ficha · Grupo I · Q2 · No Pérmico ocorreu (A) abaixamento da temperatura e do CO₂ (B) subida brusca da temperatura e do CO₂ (C) subida da temperatura e descida do CO₂ (D) abaixamento da temperatura e subida do CO₂\n?? **(B).**\n:::\n:::q Ficha · Grupo I · Q3 · Na atmosfera atual os gases mais abundantes são o\n?? **(C) nitrogénio e o oxigénio.**\n:::\n:::q Ficha · Grupo I · Q4 · O aparecimento de seres fotossintéticos levou ___ da concentração de oxigénio e ___ de dióxido de carbono.\n?? **(D) ao aumento … à diminuição.**\n:::\n:::q Ficha · Grupo I · Q5 · Refere três condições que permitiram o desenvolvimento e manutenção da vida na Terra.\n?? Qualquer três de: **camada de ozono**; **efeito de estufa**; **água no estado líquido**; **substrato rochoso**; **distância ao Sol** que permite uma **temperatura amena**; campo magnético.\n:::\n### Grupo II — o solo (figura: coelho na toca)\n:::q Ficha · Grupo II · Q1 · O enraizamento das plantas no solo é um exemplo de interação\n?? **(C) biosfera – geosfera.**\n:::\n:::q Ficha · Grupo II · Q2 · O coelho usa o solo como\n?? **(B) habitat e abrigo.**\n:::\n:::q Ficha · Grupo II · Q3 · O solo é constituído na sua maioria por\n?? **(A) matéria mineral.**\n:::\n:::q Ficha · Grupo II · Q4 · \"A formação do solo é um processo (a) (rápido/lento), onde intervêm agentes (b) (geológicos/biológicos)…, interação geosfera – (c) (biosfera/atmosfera). Uma das funções do solo é (d) (o suporte/o alimento) das plantas.\"\n?? (a) **lento**; (b) **biológicos**; (c) **biosfera**; (d) **o suporte**. *(Segundo a correção do professor.)*\n:::\n:::q Ficha · Grupo II · Q5 · Refere o papel da água na alteração da geosfera.\n?? A água é um **agente erosivo e de transporte** que atua sobre as rochas, provocando a sua **alteração (meteorização)** e a **modelação do relevo** da superfície terrestre.\n:::\n### Grupo III — célula de cebola ao microscópio\n:::q Ficha · Grupo III · Q1 · A célula da figura 3 (epiderme de cebola) pode ser classificada como\n?? **(C) eucariótica vegetal.**\n:::\n:::q Ficha · Grupo III · Q2 · A célula da figura 3 difere de uma célula da pele humana, pois apresenta\n?? **(A) parede celular.**\n:::\n:::q Ficha · Grupo III · Q3 · A letra C (ponto escuro dentro da célula) assinala\n?? **(B) o núcleo.**\n:::\n:::q Ficha · Grupo III · Q4 · A letra A (contorno da célula) assinala\n?? **(D) a parede celular.**\n:::\n:::q Ficha · Grupo III · Q5 · Relaciona: a) Núcleo b) Mitocôndria c) Cloroplasto d) Vacúolo e) Citoplasma ↔ 1) obtenção de energia 2) armazena substâncias 3) espaço interno onde estão os organelos 4) onde está o DNA 5) fotossíntese\n?? **a–4; b–1; c–5; d–2; e–3.**\n:::\n:::q Ficha · Grupo III · Q6 · Ordena do mais simples ao mais complexo: A. Epitélio da cebola B. Cebola C. Horta de cebolas D. Célula de cebola E. Campo de cebolas e cenouras\n?? **D → A → B → C → E** (célula → tecido → organismo → população → comunidade).\n:::\n:::q Ficha · Grupo III · Q7 · Relaciona a importância do desenvolvimento tecnológico do microscópio para a melhoria do conhecimento sobre a célula.\n?? Permitiu a **observação com maior detalhe dos organelos celulares** e um **maior e melhor conhecimento da constituição e estrutura celular**, através de microscópios com **maior poder de ampliação e melhor resolução** para observar material biológico.\n:::"}, {"id": "91-caderno-dominio1-0", "title": "Ficha 1 · Vida na Terra (pp. 4–5)", "pages": "Caderno pp. 4–17 · Soluções pp. 107–108", "part": "Caderno de atividades", "md": ":::q Ficha 1 · 1.1 · Faz a legenda da Fig. 1 (Sistema Solar: astros 1 a 8, a partir do Sol).\n?? 1 **Mercúrio**; 2 **Vénus**; 3 **Terra**; 4 **Marte**; 5 **Júpiter**; 6 **Saturno**; 7 **Úrano**; 8 **Neptuno**.\n:::\n:::q Ficha 1 · 1.2 · Indica a posição da Terra relativamente ao Sol.\n?? A Terra é o **terceiro planeta** a contar do Sol
