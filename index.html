<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Layout: an iOS-style app. Content layer (grouped lists, widgets) scrolls under a floating
   Liquid Glass navigation layer (nav buttons, tab bar, menus, sheets). Apple system colours. */
:root {
  /* Apple system colours (light) */
  --red: #FF3B30; --orange: #FF9500; --yellow: #FFCC00; --green: #34C759; --mint: #00C7BE;
  --teal: #30B0C7; --cyan: #32ADE6; --blue: #007AFF; --indigo: #5856D6; --purple: #AF52DE;
  --pink: #FF2D55; --brown: #A2845E; --gray: #8E8E93;
  --accent: var(--blue);

  /* Semantic surfaces & labels */
  --bg: #F2F2F7;
  --bg2: #FFFFFF;
  --card: rgba(255, 255, 255, .78);
  --sheet-bg: rgba(242, 242, 247, .82);
  --sheet-card: #FFFFFF;
  --label: #000000;
  --label2: rgba(60, 60, 67, .6);
  --label3: rgba(60, 60, 67, .3);
  --sep: rgba(60, 60, 67, .2);
  --fill: rgba(120, 120, 128, .2);
  --fill2: rgba(118, 118, 128, .12);
  --scrim: rgba(0, 0, 0, .16);
  --on-accent: #FFFFFF;

  /* Liquid Glass */
  --glass: rgba(255, 255, 255, .5);
  --glass-strong: rgba(250, 250, 252, .78);
  --glass-rim: rgba(255, 255, 255, .95);
  --glass-rim2: rgba(255, 255, 255, .35);
  --glass-shade: rgba(0, 0, 0, .05);
  --glass-shadow: rgba(0, 0, 0, .14);
  --lens: rgba(120, 120, 128, .16);
  --lens-press: rgba(255, 255, 255, .28);
  --seg-thumb: #FFFFFF;
  --edge: rgba(242, 242, 247, .7);
  --wall-o: .32;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

  --ease: cubic-bezier(.25, .1, .25, 1);
  --ease-sheet: cubic-bezier(.32, .72, 0, 1);
  --ease-bounce: cubic-bezier(.34, 1.36, .64, 1);
  --ease-soft: cubic-bezier(.22, 1.2, .36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --red: #FF453A; --orange: #FF9F0A; --yellow: #FFD60A; --green: #30D158; --mint: #63E6E2;
    --teal: #40C8E0; --cyan: #64D2FF; --blue: #0A84FF; --indigo: #5E5CE6; --purple: #BF5AF2;
    --pink: #FF375F; --brown: #AC8E68; --gray: #8E8E93;
    --bg: #000000; --bg2: #1C1C1E; --card: rgba(28, 28, 30, .74);
    --sheet-bg: rgba(28, 28, 30, .8); --sheet-card: #2C2C2E;
    --label: #FFFFFF; --label2: rgba(235, 235, 245, .6); --label3: rgba(235, 235, 245, .3);
    --sep: rgba(84, 84, 88, .6); --fill: rgba(120, 120, 128, .36); --fill2: rgba(118, 118, 128, .24);
    --scrim: rgba(0, 0, 0, .42);
    --glass: rgba(40, 40, 44, .42); --glass-strong: rgba(44, 44, 48, .76);
    --glass-rim: rgba(255, 255, 255, .42); --glass-rim2: rgba(255, 255, 255, .1);
    --glass-shade: rgba(0, 0, 0, .25); --glass-shadow: rgba(0, 0, 0, .5);
    --lens: rgba(255, 255, 255, .12); --lens-press: rgba(255, 255, 255, .16);
    --seg-thumb: #636366; --edge: rgba(0, 0, 0, .6); --wall-o: .26;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --red: #FF453A; --orange: #FF9F0A; --yellow: #FFD60A; --green: #30D158; --mint: #63E6E2;
  --teal: #40C8E0; --cyan: #64D2FF; --blue: #0A84FF; --indigo: #5E5CE6; --purple: #BF5AF2;
  --pink: #FF375F; --brown: #AC8E68; --gray: #8E8E93;
  --bg: #000000; --bg2: #1C1C1E; --card: rgba(28, 28, 30, .74);
  --sheet-bg: rgba(28, 28, 30, .8); --sheet-card: #2C2C2E;
  --label: #FFFFFF; --label2: rgba(235, 235, 245, .6); --label3: rgba(235, 235, 245, .3);
  --sep: rgba(84, 84, 88, .6); --fill: rgba(120, 120, 128, .36); --fill2: rgba(118, 118, 128, .24);
  --scrim: rgba(0, 0, 0, .42);
  --glass: rgba(40, 40, 44, .42); --glass-strong: rgba(44, 44, 48, .76);
  --glass-rim: rgba(255, 255, 255, .42); --glass-rim2: rgba(255, 255, 255, .1);
  --glass-shade: rgba(0, 0, 0, .25); --glass-shadow: rgba(0, 0, 0, .5);
  --lens: rgba(255, 255, 255, .12); --lens-press: rgba(255, 255, 255, .16);
  --seg-thumb: #636366; --edge: rgba(0, 0, 0, .6); --wall-o: .26;
  color-scheme: dark;
}
:root[data-accent="red"] { --accent: var(--red) }
:root[data-accent="orange"] { --accent: var(--orange) }
:root[data-accent="yellow"] { --accent: var(--yellow) }
:root[data-accent="green"] { --accent: var(--green) }
:root[data-accent="mint"] { --accent: var(--mint) }
:root[data-accent="teal"] { --accent: var(--teal) }
:root[data-accent="cyan"] { --accent: var(--cyan) }
:root[data-accent="blue"] { --accent: var(--blue) }
:root[data-accent="indigo"] { --accent: var(--indigo) }
:root[data-accent="purple"] { --accent: var(--purple) }
:root[data-accent="pink"] { --accent: var(--pink) }
:root[data-accent="brown"] { --accent: var(--brown) }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { height: 100% }
body {
  margin: 0; background: var(--bg); color: var(--label);
  font: 400 17px/1.29 var(--font); letter-spacing: -.022em;
  -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; letter-spacing: inherit; text-align: inherit }
input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; -webkit-user-select: text; user-select: text }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.ic { width: 22px; height: 22px; flex: none; display: block }

/* ---------- Scene ---------- */
#app { position: fixed; inset: 0; background: #000; overflow: hidden }
.scene {
  position: absolute; inset: 0; background: var(--bg); overflow: hidden;
  transform-origin: 50% 0; transition: transform .5s var(--ease-sheet), border-radius .5s var(--ease-sheet), filter .5s;
}
.scene.pushed { transform: translateY(calc(env(safe-area-inset-top, 0px) + 10px)) scale(.93); border-radius: 24px; filter: brightness(.9) }
.wallpaper { position: absolute; inset: 0; pointer-events: none; opacity: var(--wall-o); transition: opacity .6s }
.wallpaper i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; animation: drift 34s var(--ease) infinite alternate }
.wallpaper i:nth-child(1) { background: radial-gradient(circle, var(--accent) 0, transparent 62%); left: -30vmax; top: -30vmax }
.wallpaper i:nth-child(2) { background: radial-gradient(circle, var(--pink) 0, transparent 62%); right: -34vmax; top: 10vh; animation-duration: 41s; animation-delay: -12s }
.wallpaper i:nth-child(3) { background: radial-gradient(circle, var(--mint) 0, transparent 62%); left: -10vmax; bottom: -40vmax; animation-duration: 37s; animation-delay: -6s }
.wallpaper i:nth-child(4) { background: radial-gradient(circle, var(--orange) 0, transparent 62%); right: -30vmax; bottom: -30vmax; animation-duration: 45s; animation-delay: -20s; opacity: .7 }
@keyframes drift { 0% { transform: translate(0, 0) scale(1) } 50% { transform: translate(8vmax, 6vmax) scale(1.12) } 100% { transform: translate(-6vmax, 10vmax) scale(.95) } }
.nowall .wallpaper { opacity: 0 }

/* ---------- Views ---------- */
.view {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain;
  opacity: 0; visibility: hidden; transform: scale(.985);
  transition: opacity .18s var(--ease), transform .18s var(--ease), visibility 0s .18s;
  scrollbar-width: none;
}
.view::-webkit-scrollbar { display: none }
.view.active { opacity: 1; visibility: visible; transform: none; transition: opacity .28s var(--ease), transform .42s var(--ease-soft), visibility 0s }
.content {
  max-width: 720px; margin: 0 auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 56px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 124px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 26px;
}
.head { display: flex; flex-direction: column; gap: 2px; padding: 0 4px; transform-origin: 0 50% }
.eyebrow { margin: 0; font: 600 13px/18px var(--font); text-transform: uppercase; letter-spacing: .03em; color: var(--label2) }
.lt { margin: 0; font: 700 34px/41px var(--font-display); letter-spacing: .01em; text-wrap: balance }
.subtitle { margin: 0; font: 400 15px/20px var(--font); color: var(--label2) }
.sec { display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.sec-h { margin: 0; padding: 0 4px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font: 700 21px/26px var(--font-display); letter-spacing: .01em }
.sec-h .link { font: 400 17px var(--font); color: var(--accent); letter-spacing: -.02em }
.sec-foot { margin: 0; padding: 0 16px; font: 400 13px/18px var(--font); color: var(--label2) }

/* ---------- Grouped lists ---------- */
.group {
  background: var(--card); border-radius: 26px; overflow: hidden;
  -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6);
  display: flex; flex-direction: column;
}
.row {
  position: relative; display: flex; align-items: center; gap: 14px; width: 100%;
  min-height: 52px; padding-left: 16px; text-align: left; transition: background .25s;
}
.row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 0; min-height: 52px; align-self: stretch }
.row:not(:last-child) .row-main { box-shadow: inset 0 -.5px 0 var(--sep) }
.row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px }
.row-title { font: 400 17px/22px var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.row-sub { font: 400 14px/19px var(--font); color: var(--label2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.row-val { color: var(--label2); font-variant-numeric: tabular-nums; white-space: nowrap }
.chev { color: var(--label3) }
.chev .ic { width: 15px; height: 15px; stroke-width: 2.8 }
button.row:active, .row.tap:active, .row.pressing { background: var(--fill2) }
.star-on { color: var(--yellow) }
.star-on .ic { width: 16px; height: 16px; fill: currentColor; stroke-width: 1.6 }

/* Subject icons (app-icon squircles) */
.sicon {
  --s: 32px; width: var(--s); height: var(--s); border-radius: calc(var(--s) * .26); flex: none;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 78%, #fff), var(--c) 70%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 -1px 1px rgba(0, 0, 0, .1), 0 1px 2px rgba(0, 0, 0, .08);
}
.sicon .ic { width: calc(var(--s) * .6); height: calc(var(--s) * .6); stroke-width: 2.1 }
.sicon b { font: 700 calc(var(--s) * .44)/1 var(--font-round); letter-spacing: -.03em }
.sicon.m { --s: 44px }
.sicon.l { --s: 58px }
.sicon.xl { --s: 88px; box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .4), inset 0 -2px 3px rgba(0, 0, 0, .1), 0 10px 30px color-mix(in srgb, var(--c) 40%, transparent) }

/* Grid of subjects */
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 12px }
.scard {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
  padding: 14px; border-radius: 24px; background: var(--card); min-width: 0;
  -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6);
  transition: transform .35s var(--ease-bounce);
}
.scard:active, .scard.pressing { transform: scale(.97) }
.scard .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; width: 100% }
.scard .code { font: 600 12px/16px var(--font); color: var(--label2); text-transform: uppercase; letter-spacing: .04em }
.scard .name { font: 600 16px/21px var(--font); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.scard .who { font: 400 13px/18px var(--font); color: var(--label2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100% }
.scard .star-on { position: absolute; top: 14px; right: 14px }

/* ---------- Liquid Glass ---------- */
.glass {
  position: relative; isolation: isolate;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(1.9) brightness(1.04);
  backdrop-filter: blur(14px) saturate(1.9) brightness(1.04);
  box-shadow:
    inset 0 1px 0 -.5px var(--glass-rim),
    inset 0 -1px 0 -.5px var(--glass-rim2),
    inset 0 0 12px var(--glass-shade),
    0 6px 22px -4px var(--glass-shadow),
    0 1px 2px rgba(0, 0, 0, .06);
}
.glass::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1px;
  background: linear-gradient(135deg, var(--glass-rim) 0%, transparent 32%, transparent 64%, var(--glass-rim2) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  opacity: .9;
}
.glass-strong { background: var(--glass-strong) }
.rt .glass, .rt .group, .rt .scard, .rt .widget, .rt .menu, .rt .sheet { -webkit-backdrop-filter: none !important; backdrop-filter: none !important }
.rt .glass { background: var(--bg2) }
.rt .glass-strong, .rt .menu, .rt .sheet { background: var(--bg2) }
.rt .group, .rt .scard, .rt .widget { background: var(--bg2) }

/* Refraction (Chromium only: SVG displacement inside backdrop-filter) */
.refract .tabbar { -webkit-backdrop-filter: url(#lg-bar) blur(5px) saturate(1.9) brightness(1.05); backdrop-filter: url(#lg-bar) blur(5px) saturate(1.9) brightness(1.05) }
.refract .tabbar.min { -webkit-backdrop-filter: url(#lg-min) blur(5px) saturate(1.9); backdrop-filter: url(#lg-min) blur(5px) saturate(1.9) }
.refract .nbtn { -webkit-backdrop-filter: url(#lg-btn) blur(4px) saturate(1.9); backdrop-filter: url(#lg-btn) blur(4px) saturate(1.9) }
.refract .round { -webkit-backdrop-filter: url(#lg-round) blur(6px) saturate(1.9); backdrop-filter: url(#lg-round) blur(6px) saturate(1.9) }
.refract .lens.drag { -webkit-backdrop-filter: url(#lg-lens) saturate(1.6) brightness(1.08); backdrop-filter: url(#lg-lens) saturate(1.6) brightness(1.08) }
.rt.refract .tabbar, .rt.refract .nbtn, .rt.refract .round, .rt.refract .lens.drag { -webkit-backdrop-filter: none; backdrop-filter: none }

/* Interactive glass: grows and lights up when pressed */
.press { transition: transform .45s var(--ease-bounce), filter .3s, box-shadow .3s }
.press:active { transform: scale(1.08); filter: brightness(1.08) }
.press-in { transition: transform .4s var(--ease-bounce) }
.press-in:active { transform: scale(.96) }

/* ---------- Nav bar ---------- */
.navbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20; pointer-events: none;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav-inner { position: relative; max-width: 720px; margin: 0 auto; height: 56px; display: flex; align-items: center; justify-content: space-between }
.nav-slot { display: flex; gap: 10px; pointer-events: auto; min-width: 44px }
.nav-title {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -30%); opacity: 0;
  font: 600 17px/22px var(--font); transition: opacity .25s, transform .35s var(--ease-soft); white-space: nowrap;
}
.navbar.scrolled .nav-title { opacity: 1; transform: translate(-50%, -50%) }
.nbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--label) }
.nbtn .ic { width: 20px; height: 20px; stroke-width: 2.2 }
.nbtn.tint { background: var(--accent); color: var(--on-accent) }
.nbtn.tint::after { opacity: .6 }
.nbtn[disabled] { opacity: .4; pointer-events: none }
.nbtn.fav-on { color: var(--yellow) }
.nbtn.fav-on .ic { fill: currentColor }
.edge {
  position: absolute; left: 0; right: 0; z-index: 15; pointer-events: none;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  background: linear-gradient(var(--edge), transparent);
  transition: opacity .3s;
}
.edge.top { top: 0; height: calc(env(safe-area-inset-top, 0px) + 80px); opacity: 0;
  -webkit-mask-image: linear-gradient(#000 45%, transparent); mask-image: linear-gradient(#000 45%, transparent) }
.edge.top.on { opacity: 1 }
.edge.bottom { bottom: 0; height: calc(env(safe-area-inset-bottom, 0px) + 72px);
  background: linear-gradient(transparent, var(--edge));
  -webkit-mask-image: linear-gradient(transparent, #000 60%); mask-image: linear-gradient(transparent, #000 60%) }

/* ---------- Tab bar ---------- */
.tabbar {
  --itemw: 72px;
  position: absolute; z-index: 30; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); left: 16px; width: 360px;
  height: 64px; border-radius: 32px; padding: 4px; touch-action: none;
  transition: width .6s var(--ease-bounce), left .6s var(--ease-bounce);
}
.tabclip { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; z-index: 2 }
.tabtrack { position: absolute; left: 4px; top: 4px; height: 56px; display: flex; transition: transform .6s var(--ease-bounce) }
.tab {
  width: var(--itemw); flex: none; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--label); transition: color .25s, opacity .3s;
}
.tab .ic { width: 25px; height: 25px; stroke-width: 1.9; transition: transform .5s var(--ease-bounce), stroke-width .2s }
.tab-label { font: 600 10px/12px var(--font); letter-spacing: .01em; transition: opacity .25s }
.tab.on, .tab.hover { color: var(--accent) }
.tab.on .ic { stroke-width: 2.3 }
.tab.bounce .ic { animation: symBounce .5s var(--ease) }
@keyframes symBounce { 0% { scale: 1 } 30% { scale: .78 } 65% { scale: 1.14 } 100% { scale: 1 } }
.lens {
  position: absolute; left: 4px; top: 4px; height: 56px; width: var(--itemw); border-radius: 28px; z-index: 1;
  background: var(--lens); transform: translateX(var(--lx, 0px));
  transition: transform .55s var(--ease-bounce), scale .45s var(--ease-bounce), background .25s, box-shadow .25s, opacity .25s;
}
.lens.drag {
  z-index: 3; scale: 1.16 1.2; background: var(--lens-press);
  box-shadow: inset 0 1px 0 -.5px var(--glass-rim), inset 0 -1px 0 -.5px var(--glass-rim2), inset 0 0 10px rgba(255, 255, 255, .25), 0 8px 24px -6px var(--glass-shadow);
}
.lens.follow { transition: scale .45s var(--ease-bounce), background .25s, box-shadow .25s }
.tabbar.min .lens { opacity: 0 }
.tabbar.min .tab-label { opacity: 0 }
.tabbar.min .tab .ic { transform: translateY(7px) }
.tabbar.min .tab:not(.on) { opacity: 0 }

/* ---------- Search, chips, segmented ---------- */
.search { display: flex; align-items: center; gap: 8px; height: 46px; border-radius: 23px; padding: 0 8px 0 14px; color: var(--label2) }
.search .ic { width: 19px; height: 19px; stroke-width: 2.3 }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: 17px; color: var(--label) }
.search input::placeholder { color: var(--label2) }
.search input::-webkit-search-cancel-button { display: none }
.clear { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--label2); transition: opacity .2s, transform .3s var(--ease-bounce) }
.clear .ic { width: 18px; height: 18px }
.clear[hidden] { display: none }
.chips {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 4px max(16px, env(safe-area-inset-left, 0px)) 10px;
  margin-block: -4px -10px;
}
.chips::-webkit-scrollbar { display: none }
.chip { flex: none; height: 36px; padding: 0 16px; border-radius: 18px; font: 600 15px/36px var(--font); white-space: nowrap; transition: transform .45s var(--ease-bounce), background .25s, color .25s }
.chip.on { background: var(--accent); color: var(--on-accent) }
.chip:active { transform: scale(1.08) }
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border-radius: 999px; background: var(--fill2) }
.seg > button { position: relative; z-index: 1; height: 34px; padding: 0 10px; border-radius: 999px; font: 500 14px/34px var(--font); text-align: center; white-space: nowrap; transition: font-weight .2s }
.seg > button.on { font-weight: 600 }
.seg-thumb {
  position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 999px; background: var(--seg-thumb);

const initials = n => n.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();

/* ---------- Dates ---------- */
const DAY = 864e5;
const sod = (t = Date.now()) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const isoDay = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const parseDay = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1).getTime(); };
const dueDiff = t => Math.round((parseDay(t.due) - sod()) / DAY);
function dueLabel(t) {
  const d = dueDiff(t), at = new Date(parseDay(t.due));
  if (d < 0) return 'Overdue · ' + at.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  if (d === 0) return 'Today';
  if (d === 1) return 'Tomorrow';
  if (d < 7) return at.toLocaleDateString('en-GB', { weekday: 'long' });
  return at.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
const fmtMin = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}`;
const fmtClock = ms => { const s = Math.ceil(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };

/* ---------- State ---------- */
function sampleTasks() {
  const t = sod();
  return [
    { id: uid(), title: 'Exercícios da página 48', subj: 'MAT', type: 'Homework', due: isoDay(t + DAY), done: false, example: true },
    { id: uid(), title: 'Teste de Ciências Naturais', subj: 'CN', type: 'Test', due: isoDay(t + 3 * DAY), done: false, example: true },
    { id: uid(), title: 'Reading log, chapter 4', subj: 'ENGLISH', type: 'Homework', due: isoDay(t + 5 * DAY), done: false, example: true },
    { id: uid(), title: 'Project draft', subj: 'Global_P', type: 'Project', due: isoDay(t + 9 * DAY), done: false, example: true }
  ];
}
const S = {
  tab: store.get('tab', 'study'),
  favs: store.get('favs', []),
  tasks: store.get('tasks', null) || sampleTasks(),
  sessions: store.get('sessions', []),
  notes: store.get('notes', {}),
  view: store.get('view', 'list'),
  sort: store.get('sort', 'category'),
  filter: 'all', query: '', taskSeg: 'upcoming',
  settings: Object.assign({ theme: 'auto', accent: 'blue', minimize: true, rt: false, wall: true, goal: 60 }, store.get('settings', {})),
  focus: Object.assign({ dur: 25, subj: 'MAT', running: false, endAt: 0, remaining: 25 * 60000 }, store.get('focus', {}))
};
if (!TABS.some(t => t.id === S.tab)) S.tab = 'study';
if (!BY[S.focus.subj]) S.focus.subj = 'MAT';
const save = (...k) => k.forEach(key => store.set(key, S[key]));

const minutesSince = (t0, subj) => S.sessions.filter(x => x.at >= t0 && (!subj || x.subj === subj)).reduce((a, x) => a + x.min, 0);
const openTasks = () => S.tasks.filter(t => !t.done).sort((a, b) => parseDay(a.due) - parseDay(b.due));

/* ---------- Theme ---------- */
const root = document.documentElement;
const hostTheme = root.getAttribute('data-theme');
function applySettings() {
  const t = S.settings.theme;
  if (t === 'auto') { hostTheme ? root.setAttribute('data-theme', hostTheme) : root.removeAttribute('data-theme'); }
  else root.setAttribute('data-theme', t);
  root.dataset.accent = S.settings.accent;
  root.classList.toggle('rt', !!S.settings.rt);
  root.classList.toggle('nowall', !S.settings.wall);
}

/* ---------- Components ---------- */
function seg(key, opts, value, extra = '') {
  return `<div class="seg noanim ${extra}" data-seg="${key}" role="radiogroup"><span class="seg-thumb"></span>${opts.map(([v, l]) =>
    `<button role="radio" aria-checked="${v === value}" class="${v === value ? 'on' : ''}" data-action="seg" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</div>`;
}
function placeSegs(scope = document) {
  $$('.seg', scope).forEach(s => {
    const on = $('button.on', s), th = $('.seg-thumb', s);
    if (!on || !th) return;
    th.style.width = on.offsetWidth + 'px';
    th.style.transform = `translateX(${on.offsetLeft}px)`;
    if (s.classList.contains('noanim')) requestAnimationFrame(() => requestAnimationFrame(() => s.classList.remove('noanim')));
  });
}
const sw = (key, on, label) => `<button class="switch" role="switch" aria-checked="${!!on}" aria-label="${esc(label)}" data-action="switch" data-key="${key}"></button>`;
const emptyState = (ic, title, text, btn = '') => `<div class="empty">${icon(ic)}<b>${esc(title)}</b><p>${esc(text)}</p>${btn}</div>`;

function subjectRow(s) {
  const fav = S.favs.includes(s.id);

    ${sicon(s)}
    <span class="row-main"><span class="row-text"><span class="row-title">${esc(s.name)}</span><span class="row-sub">${esc(s.id)} · ${esc(s.teachers.join(', '))}</span></span>
    ${fav ? `<span class="star-on" aria-label="Favourite">${icon('star')}</span>` : ''}<span class="chev">${icon('chevron')}</span></span></button>`;
}
function subjectCard(s) {
  const fav = S.favs.includes(s.id);
  return `<button class="scard" data-action="open-subj" data-id="${s.id}" data-ctx="subj">
    ${sicon(s, 'm')}${fav ? `<span class="star-on">${icon('star')}</span>` : ''}
    <span class="t"><span class="code">${esc(s.id)}</span><span class="name">${esc(s.name)}</span><span class="who">${esc(s.teachers.join(', '))}</span></span></button>`;
}
function taskRow(t) {
  const s = BY[t.subj] || SUBJECTS[0], d = dueDiff(t);
  return `<div class="row task tap ${t.done ? 'done' : ''}" data-ctx="task" data-id="${t.id}" style="--c:var(--${s.color})">
    <button class="check" data-action="toggle-task" data-id="${t.id}" aria-label="${t.done ? 'Mark as not done' : 'Mark as done'}">${icon('check')}</button>
    <span class="row-main" data-action="open-subj" data-id="${s.id}"><span class="row-text"><span class="row-title">${esc(t.title)}</span>
    <span class="row-sub"><span class="tag">${esc(s.id)}</span> ${esc(t.type)} · <span class="${!t.done && d < 0 ? 'overdue' : ''}">${esc(dueLabel(t))}</span>${t.example ? '<span class="example">Example</span>' : ''}</span></span></span></div>`;
}

/* ---------- Views ---------- */
function renderToday() {
  const t0 = sod(), mins = minutesSince(t0), goal = S.settings.goal, pct = Math.min(1, mins / goal);
  const open = openTasks(), week = open.filter(t => dueDiff(t) < 7), next = open.slice(0, 3);
  const favs = S.favs.map(id => BY[id]).filter(Boolean);
  const totals = {};
  S.sessions.filter(x => x.at >= t0 - 6 * DAY).forEach(x => { totals[x.subj] = (totals[x.subj] || 0) + x.min; });
  const top = Object.entries(totals).filter(([id]) => BY[id]).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const max = top.length ? top[0][1] : 1;
  const C = 2 * Math.PI * 24;
  const date = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  const hr = new Date().getHours();
  const greet = hr < 12 ? 'Good morning' : hr < 19 ? 'Good afternoon' : 'Good evening';
  return `
  <div class="head"><p class="eyebrow">${esc(date)}</p><h1 class="lt">Today</h1><p class="subtitle">${greet}. ${open.length ? `You have ${open.length} open task${open.length > 1 ? 's' : ''}.` : 'Nothing due. Enjoy it.'}</p></div>
  <div class="widgets">
    <button class="widget press-in" data-action="go" data-go="focus">
      <span class="w-label" style="color:var(--green)">${icon('timer')}Focus</span>
      <span class="w-ring"><svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="24" fill="none" stroke="var(--fill2)" stroke-width="7"/>
        <circle cx="29" cy="29" r="24" fill="none" stroke="var(--green)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" style="transition:stroke-dashoffset 1s var(--ease-soft)"/></svg>
        <span><span class="w-big">${mins}<small>min</small></span></span></span>
      <span class="w-note">${mins >= goal ? 'Daily goal reached.' : `${goal - mins} min left of your ${goal} min goal`}</span>
    </button>
    <button class="widget press-in" data-action="go" data-go="tasks">
      <span class="w-label" style="color:var(--orange)">${icon('calendar')}This Week</span>
      <span class="w-big">${week.length}<small>due</small></span>
      <span class="w-note">${next[0] ? esc(next[0].title) + ' · ' + esc(dueLabel(next[0])) : 'No tasks due in the next 7 days.'}</span>
    </button>
  </div>
  <section class="sec">
    <h2 class="sec-h">Favourites <button class="link" data-action="go" data-go="study">All Subjects</button></h2>
    ${favs.length ? `<div class="favs">${favs.map(s => `<button class="fav press-in" data-action="open-subj" data-id="${s.id}" data-ctx="subj">${sicon(s, 'l')}<span>${esc(s.id)}</span></button>`).join('')}</div>`
      : `<div class="group">${emptyState('star', 'No Favourites Yet', 'Touch and hold a subject in Study, then choose Add to Favourites.')}</div>`}
  </section>
  <section class="sec">
    <h2 class="sec-h">Up Next <button class="link" data-action="add-task">Add Task</button></h2>
    <div class="group">${next.length ? next.map(taskRow).join('') : emptyState('check', 'All Caught Up', 'Homework, tests and projects you add will appear here.')}</div>
  </section>
  <section class="sec">
    <h2 class="sec-h">Focus This Week</h2>
    <div class="group">${top.length ? top.map(([id, m]) => { const s = BY[id]; return `<div class="bar-row" style="--c:var(--${s.color})">${sicon(s)}<div class="bt"><span class="bn">${esc(s.name)}</span><span class="bar"><i style="width:${Math.max(4, m / max * 100)}%"></i></span></div><span class="row-val">${fmtMin(m)}</span></div>`; }).join('')
      : emptyState('timer', 'No Sessions Yet', 'Start a focus session and your time per subject shows up here.', '<button class="btn btn-prim glass press" data-action="go" data-go="focus">Start Focus</button>')}</div>
  </section>`;
}

function renderStudyShell() {
  return `
  <div class="head"><h1 class="lt">Study</h1><p class="subtitle">${SUBJECTS.length} subjects · ${TEACHERS.length} teachers</p></div>
  <label class="search glass">${icon('search')}<input id="q" type="search" placeholder="Subjects, codes, teachers" autocomplete="off" enterkeyhint="search" aria-label="Search subjects"><button class="clear" id="q-clear" data-action="clear-search" aria-label="Clear search" hidden>${icon('xfill')}</button></label>
  <div class="chips" id="chips" role="tablist" aria-label="Filter"></div>
  <div id="study-results" style="display:flex;flex-direction:column;gap:26px"></div>`;
}
function renderChips() {
  const opts = [['all', 'All'], ['fav', 'Favourites'], ...CATS.map(c => [c.id, c.short])];
  return opts.map(([v, l]) => `<button class="chip ${v === S.filter ? 'on' : 'glass'}" role="tab" aria-selected="${v === S.filter}" data-action="filter" data-v="${v}">${l}</button>`).join('');
}
function renderStudyResults() {
  const q = fold(S.query.trim());
  let list = SUBJECTS.filter(s => {
    if (S.filter === 'fav' && !S.favs.includes(s.id)) return false;
    if (S.filter !== 'all' && S.filter !== 'fav' && s.cat !== S.filter) return false;
    if (!q) return true;
    return fold([s.id, s.name, s.full || '', s.teachers.join(' '), CAT[s.cat].name].join(' ')).includes(q);
  });
  if (!list.length) {
    if (S.filter === 'fav' && !q) return `<div class="group">${emptyState('star', 'No Favourites', 'Touch and hold any subject, then choose Add to Favourites.')}</div>`;
    return emptyState('search', `No Results for “${S.query.trim()}”`, 'Check the spelling or try a subject code, like MAT or HIST.');
  }
  let sections;
  if (S.sort === 'name') {
    sections = [{ title: 'A–Z', items: [...list].sort((a, b) => a.name.localeCompare(b.name, 'pt')) }];
  } else if (S.sort === 'teacher') {
    const m = new Map();
    list.forEach(s => s.teachers.forEach(t => { if (!m.has(t)) m.set(t, []); m.get(t).push(s); }));
    sections = [...m.entries()].sort((a, b) => a[0].localeCompare(b[0], 'pt')).map(([t, items]) => ({ title: t, items }));
  } else {
    sections = CATS.map(c => ({ title: c.name, items: list.filter(s => s.cat === c.id) })).filter(x => x.items.length);
  }
  return sections.map(sec => `<section class="sec"><h2 class="sec-h">${esc(sec.title)}<span class="row-val" style="font-size:15px;font-weight:400">${sec.items.length}</span></h2>
    ${S.view === 'grid' ? `<div class="sgrid">${sec.items.map(subjectCard).join('')}</div>` : `<div class="group">${sec.items.map(subjectRow).join('')}</div>`}</section>`).join('');
}

function renderTasks() {
  const t0 = sod();
  let body;
  if (S.taskSeg === 'upcoming') {
    const open = openTasks();
    const buckets = [['Overdue', t => dueDiff(t) < 0], ['Today', t => dueDiff(t) === 0], ['Tomorrow', t => dueDiff(t) === 1], ['This Week', t => dueDiff(t) > 1 && dueDiff(t) < 7], ['Later', t => dueDiff(t) >= 7]];
    body = open.length ? buckets.map(([n, f]) => { const it = open.filter(f); return it.length ? `<section class="sec"><h2 class="sec-h ${n === 'Overdue' ? 'overdue' : ''}">${n}</h2><div class="group">${it.map(taskRow).join('')}</div></section>` : ''; }).join('')
      : emptyState('check', 'All Caught Up', 'Tap + to add homework, tests and projects.', '<button class="btn btn-prim glass press" data-action="add-task">' + icon('plus') + 'New Task</button>');
  } else {
    const done = S.tasks.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    body = done.length ? `<section class="sec"><h2 class="sec-h">Completed <button class="link" data-action="clear-done">Clear</button></h2><div class="group">${done.map(taskRow).join('')}</div></section>`
      : emptyState('tasks', 'Nothing Completed', 'Tasks you tick off are kept here.');
  }
  return `<div class="head"><h1 class="lt">Tasks</h1><p class="subtitle">${S.tasks.filter(t => !t.done).length} open · ${S.tasks.filter(t => t.done).length} done</p></div>
    ${seg('taskSeg', [['upcoming', 'Upcoming'], ['done', 'Completed']], S.taskSeg)}${body}`;
}

/* ---------- Liquid Glass refraction maps ---------- */
const refractOK = /Chrome\/\d+/.test(navigator.userAgent) && !/Firefox/.test(navigator.userAgent) && typeof CSS !== 'undefined';
function dispMap(w, h, r, edge) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'), img = ctx.createImageData(w, h), D = img.data;
  const hw = w / 2, hh = h / 2;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const px = x + .5 - hw, py = y + .5 - hh;
    const qx = Math.abs(px) - (hw - r), qy = Math.abs(py) - (hh - r);
    const ox = Math.max(qx, 0), oy = Math.max(qy, 0);
    const sd = Math.hypot(ox, oy) + Math.min(Math.max(qx, qy), 0) - r;
    let gx = 0, gy = 0;
    if (qx > 0 && qy > 0) { const l = Math.hypot(qx, qy) || 1; gx = qx / l; gy = qy / l; }
    else if (qx > qy) gx = 1; else gy = 1;
    gx *= Math.sign(px) || 1; gy *= Math.sign(py) || 1;
    const dist = -sd, t = dist < edge ? Math.pow(1 - Math.max(0, dist) / edge, 2) : 0;
    const i = (y * w + x) * 4;
    D[i] = 128 - gx * t * 127; D[i + 1] = 128 - gy * t * 127; D[i + 2] = 128; D[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c.toDataURL();
}
const glassFilter = (id, w, h, r, edge, scale) => {
  w = Math.round(w); h = Math.round(h);
  return `<filter id="${id}" x="0" y="0" width="${w}" height="${h}" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feImage href="${dispMap(w, h, Math.min(r, w / 2, h / 2), edge)}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="m"/>
    <feDisplacementMap in="SourceGraphic" in2="m" scale="${scale}" xChannelSelector="R" yChannelSelector="G"/></filter>`;
};
let builtW = 0;
function buildGlassFilters() {
  if (!refractOK || builtW === barW) return;
  builtW = barW;

    glassFilter('lg-bar', barW, 64, 32, 20, 34),
    glassFilter('lg-min', 64, 64, 32, 18, 26),
    glassFilter('lg-btn', 44, 44, 22, 14, 20),

  document.body.appendChild(layer);

  let closed = false;
  const close = () => {
    if (closed) return; closed = true;

    layer.classList.remove('open');

  };

    if (!e.target.closest('.grabber, .sheet-head') || e.target.closest('button')) return;
    d = { y0: e.clientY, t0: performance.now(), dy: 0 };
    sheet.style.transition = 'none';

      <button class="nbtn glass press ${fav ? 'fav-on' : ''}" id="sh-fav" aria-label="${fav ? 'Remove from favourites' : 'Add to favourites'}">${icon('star')}</button></div>
      <div class="sheet-body">
        <div class="hero">${sicon(s, 'xl')}<h2>${esc(s.full || s.name)}</h2><p>${esc(s.id)} · ${esc(CAT[s.cat].name)}</p></div>
        <div class="stats"><div class="stat"><b>${fmtMin(total)}</b><span>Total focus</span></div><div class="stat"><b>${fmtMin(week)}</b><span>This week</span></div><div class="stat"><b>${tasks.length}</b><span>Open tasks</span></div></div>
        <div class="btn-row"><button class="btn btn-prim glass press" id="sh-focus">${icon('timer')}Focus</button><button class="btn glass press" id="sh-task">${icon('plus')}Task</button></div>
        <section class="sec"><h2 class="sec-h">${s.teachers.length > 1 ? 'Teachers' : 'Teacher'}</h2><div class="group">${s.teachers.map(t => `<div class="row"><span class="avatar">${esc(initials(t))}</span><span class="row-main"><span class="row-text"><span class="row-title">${esc(t)}</span><span class="row-sub">${esc(SUBJECTS.filter(x => x.teachers.includes(t)).map(x => x.id).join(' · '))}</span></span></span></div>`).join('')}</div></section>
        <section class="sec"><h2 class="sec-h">Upcoming</h2><div class="group">${tasks.length ? tasks.map(taskRow).join('') : `<div class="row"><span class="row-main"><span class="row-text"><span class="row-sub">No upcoming tasks for ${esc(s.id)}.</span></span></span></div>`}</div></section>
        <section class="sec"><h2 class="sec-h">Notes</h2><div class="group"><textarea class="notes" id="sh-notes" placeholder="Write notes for ${esc(s.name)}…" aria-label="Notes">${esc(S.notes[id] || '')}</textarea></div></section>
      </div>`,
    onMount(sh, close) {
      const fb = $('#sh-fav', sh);
      fb.addEventListener('click', () => { toggleFav(id); const on = S.favs.includes(id); fb.classList.toggle('fav-on', on); haptic(); });
      $('#sh-focus', sh).addEventListener('click', () => { if (!S.focus.running) setFocusSubj(id); close(); setTimeout(() => selectTab(3), 200); });
      $('#sh-task', sh).addEventListener('click', () => { close(); setTimeout(() => openAddTask(id), 320); });
      let nt; $('#sh-notes', sh).addEventListener('input', e => { clearTimeout(nt); nt = setTimeout(() => { S.notes[id] = e.target.value; save('notes'); }, 300); });
    }
  });
}

function openAddTask(preset) {
  const subj = preset || (S.tab === 'focus' ? S.focus.subj : 'MAT');
  openSheet({
    html: `<div class="sheet-head"><button class="nbtn glass press" data-close aria-label="Cancel">${icon('x')}</button><div class="sheet-title">New Task</div>
      <button class="nbtn glass press tint" id="nt-add" aria-label="Add task" disabled>${icon('check')}</button></div>
      <div class="sheet-body">
        <div class="group"><input class="field" id="nt-title" placeholder="Title" maxlength="120" autocomplete="off" enterkeyhint="done" aria-label="Title"></div>
        <div class="group">
          <label class="frow"><span>Subject</span><select id="nt-subj">${CATS.map(c => `<optgroup label="${esc(c.name)}">${SUBJECTS.filter(s => s.cat === c.id).map(s => `<option value="${s.id}" ${s.id === subj ? 'selected' : ''}>${esc(s.id)} · ${esc(s.name)}</option>`).join('')}</optgroup>`).join('')}</select></label>
          <label class="frow"><span>Due</span><input type="date" id="nt-due" value="${isoDay(sod() + DAY)}"></label>
        </div>
        ${seg('nt-type', [['Homework', 'Homework'], ['Test', 'Test'], ['Project', 'Project']], 'Homework')}
      </div>`,
    onMount(sh, close) {
      const ti = $('#nt-title', sh), add = $('#nt-add', sh);
      ti.addEventListener('input', () => { add.disabled = !ti.value.trim(); });
      const submit = () => {
        const title = ti.value.trim(); if (!title) return;
        const due = $('#nt-due', sh).value || isoDay(sod() + DAY);
        S.tasks.push({ id: uid(), title, subj: $('#nt-subj', sh).value, type: $('.seg .on', sh).dataset.v, due, done: false });
        save('tasks'); render(); close(); toast('Task Added');
      };
      add.addEventListener('click', submit);
      ti.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
      setTimeout(() => ti.focus({ preventScroll: true }), 420);
    }
  });
}

function confirmSheet({ title, msg, label, run }) {
  openSheet({
    push: false,
    html: `<div class="sheet-body as"><div class="as-text"><b>${esc(title)}</b><p>${esc(msg)}</p></div>
      <button class="btn btn-red glass press" id="as-go">${esc(label)}</button><button class="btn glass press" data-close>Cancel</button></div>`,
    onMount(sh, close) { $('#as-go', sh).addEventListener('click', () => { run(); close(); }); }
  });
}

/* ---------- Actions ---------- */
function toggleFav(id) {
  const on = S.favs.includes(id);
  S.favs = on ? S.favs.filter(x => x !== id) : [...S.favs, id];
  save('favs'); render('today'); renderStudy();
  toast(on ? 'Removed from Favourites' : 'Added to Favourites', 'star');
}
function toggleTask(id, el) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  t.done = !t.done; t.doneAt = t.done ? Date.now() : 0; save('tasks'); haptic();
  const row = el && el.closest('.task');
  if (row) {
    row.classList.toggle('done', t.done);
    row.classList.add('leaving');
    setTimeout(render, 820);
  } else render();
}
function setFocusSubj(id) { S.focus.subj = id; save('focus'); render('focus'); }

/* Focus timer */
function focusRemaining() { const f = S.focus; return f.running ? Math.max(0, f.endAt - Date.now()) : f.remaining; }
let ticker = null;
function tick() {
  const f = S.focus; if (!f.running) return;
  const rem = focusRemaining();
  const te = $('#ring-time'), pr = $('#ring-prog');
  if (te) te.textContent = fmtClock(rem);
  if (pr) { const C = 2 * Math.PI * 130; pr.style.strokeDashoffset = C * (rem / (f.dur * 60000)); }
  if (rem <= 0) focusComplete();
}
function startTicker() { clearInterval(ticker); ticker = setInterval(tick, 250); }
function logSession(min) { S.sessions.push({ subj: S.focus.subj, min, at: Date.now() }); save('sessions'); }
function resetFocus() { const f = S.focus; f.running = false; f.endAt = 0; f.remaining = f.dur * 60000; clearInterval(ticker); save('focus'); }
function focusComplete() {
  const f = S.focus; logSession(f.dur); resetFocus();
  try { navigator.vibrate && navigator.vibrate([30, 60, 30]); } catch (e) {}
  render(); toast(`${f.dur} min of ${BY[f.subj].name} logged`, 'check');
}
const ACTIONS = {
  tab: el => { if (tabSuppress) return; if (minimized) { setMin(false); return; } selectTab(TABS.findIndex(t => t.id === el.dataset.tab)); },
  go: el => selectTab(TABS.findIndex(t => t.id === el.dataset.go)),
  'open-subj': el => openSubject(el.dataset.id),
  'add-task': () => openAddTask(),
  'toggle-task': el => toggleTask(el.dataset.id, el),
  filter: el => { S.filter = el.dataset.v; renderStudy(); el = $(`#chips [data-v="${S.filter}"]`); el && el.scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' }); },
  'clear-search': () => { const q = $('#q'); q.value = ''; S.query = ''; $('#q-clear').hidden = true; renderStudy(); q.focus(); },
  'study-view': () => { S.view = S.view === 'grid' ? 'list' : 'grid'; save('view'); renderStudy(); updateNav(); },
  'study-menu': el => showMenu(el, [
    { head: 'View as' },
    { label: 'List', icon: 'list', checked: S.view === 'list', run: () => { S.view = 'list'; save('view'); renderStudy(); updateNav(); } },
    { label: 'Grid', icon: 'grid', checked: S.view === 'grid', run: () => { S.view = 'grid'; save('view'); renderStudy(); updateNav(); } },
    { sep: true }, { head: 'Group by' },
    { label: 'Category', icon: 'folder', checked: S.sort === 'category', run: () => { S.sort = 'category'; save('sort'); renderStudy(); } },
    { label: 'Name', icon: 'textsort', checked: S.sort === 'name', run: () => { S.sort = 'name'; save('sort'); renderStudy(); } },
    { label: 'Teacher', icon: 'person', checked: S.sort === 'teacher', run: () => { S.sort = 'teacher'; save('sort'); renderStudy(); } }
  ]),
  seg: el => {
    const sg = el.closest('.seg'); if (el.classList.contains('on')) return;
    $$('button', sg).forEach(b => { const on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    placeSegs(sg); haptic();
    const k = sg.dataset.seg, v = el.dataset.v;
    setTimeout(() => {
      if (k === 'taskSeg') { S.taskSeg = v; render('tasks'); }
      else if (k === 'theme') { S.settings.theme = v; save('settings'); applySettings(); }
      else if (k === 'dur') { if (S.focus.running) return; S.focus.dur = +v; S.focus.remaining = +v * 60000; save('focus'); render('focus'); }
    }, 260);
  },
  accent: el => { S.settings.accent = el.dataset.v; save('settings'); applySettings(); render('settings'); haptic(); },
  switch: el => {
    const k = el.dataset.key; S.settings[k] = !S.settings[k]; save('settings');
    el.setAttribute('aria-checked', S.settings[k]); applySettings(); haptic();
    if (k === 'minimize' && !S.settings.minimize) setMin(false);
  },
  goal: el => { S.settings.goal = Math.max(15, Math.min(240, S.settings.goal + +el.dataset.d)); save('settings'); render('settings'); },
  'reset-focus': () => confirmSheet({ title: 'Reset Focus History?', msg: 'All logged focus sessions will be removed from this device.', label: 'Reset History', run: () => { S.sessions = []; save('sessions'); render(); toast('Focus History Reset', 'undo'); } }),
  'delete-tasks': () => confirmSheet({ title: 'Delete All Tasks?', msg: `This removes ${S.tasks.length} task${S.tasks.length === 1 ? '' : 's'}, including completed ones.`, label: 'Delete All Tasks', run: () => { S.tasks = []; save('tasks'); render(); toast('Tasks Deleted', 'trash'); } }),
  'clear-done': () => { S.tasks = S.tasks.filter(t => !t.done); save('tasks'); render(); toast('Completed Tasks Cleared', 'trash'); },
  'focus-start': () => { const f = S.focus; f.endAt = Date.now() + f.remaining; f.running = true; save('focus'); render('focus'); startTicker(); haptic(); },
  'focus-pause': () => { const f = S.focus; f.remaining = focusRemaining(); f.running = false; clearInterval(ticker); save('focus'); render('focus'); haptic(); },
  'focus-cancel': () => {
    const f = S.focus, m = Math.floor((f.dur * 60000 - focusRemaining()) / 60000);
    if (m >= 1) { logSession(m); toast(`${m} min of ${BY[f.subj].name} logged`); }
    resetFocus(); render();
  },
  'focus-pick': el => {
    const items = [];
    CATS.forEach((c, i) => {
      if (i) items.push({ sep: true });
      items.push({ head: c.name });
      SUBJECTS.filter(s => s.cat === c.id).forEach(s => items.push({ label: s.name, sub: s.id, color: s.color, checked: s.id === S.focus.subj, run: () => setFocusSubj(s.id) }));
    });
    showMenu(el, items);
  }
};
document.addEventListener('click', e => {
  if (swallowClick) { swallowClick = false; e.preventDefault(); e.stopPropagation(); return; }
}, true);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.closest('.ctx-prev, .menu')) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  S.query = e.target.value; $('#q-clear').hidden = !S.query;
  $('#study-results').innerHTML = renderStudyResults();
});
document.addEventListener('keydown', e => {
  if (!openMenu) return;
  const items = $$('.menu:not(.out) .mi');
  if (e.key === 'Escape') { closeMenus(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const i = items.indexOf(document.activeElement), n = items.length;
    items[(i + (e.key === 'ArrowDown' ? 1 : -1) + n) % n]?.focus();
  }
});
addEventListener('resize', () => { layoutBar(); placeSegs(); closeMenus(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

/* ---------- Boot ---------- */
applySettings();
render();
views[S.tab].classList.add('active');
layoutBar();
updateNav();
if (S.focus.running) { if (focusRemaining() <= 0) focusComplete(); else startTicker(); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => placeSegs());
})();
</script>
</body>
</html>
