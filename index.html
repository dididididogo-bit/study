e potássio**.\n\n## Lei de Lavoisier (pp. 46–48)\nA **massa** é uma **grandeza escalar** (fica totalmente caracterizada por um **número e uma unidade**, ex.: T = 20 °C; t = 60 s) e mede-se com **balanças**.\n\n### Atividade prática 8 — O que acontece à massa total durante uma reação?\nMedir 20 mL de solução de sulfato de cobre(II) e 10 mL de hidróxido de sódio em gobelés separados, pesar tudo, juntar as soluções, voltar a pesar (com o gobelé vazio também na balança).\n\nDurante uma reação, a **massa dos reagentes diminui**, a **massa dos produtos aumenta**, mas a **massa total não varia** (figura 30: curva A desce, curva B sobe, linha C horizontal).\n\n- **Antoine Lavoisier** (1743–1794), \"pai\" da Química: *\"Na natureza, nada se cria, nada se perde, tudo se transforma.\"*\n\n:::key\n**Lei de Lavoisier ou Lei da Conservação da Massa:** numa reação química (em **sistema fechado**), a **massa total do sistema não varia** — a **massa total dos produtos formados é igual à massa total dos reagentes transformados**.\n:::\n\n### É sempre possível comprovar a conservação da massa?\n**Ácido acético (aq) + Hidrogenocarbonato de sódio (aq) → Acetato de sódio (aq) + Água (l) + Dióxido de carbono (g)**\nEm **sistema aberto**, a balança marca **menos massa** depois da reação: o **dióxido de carbono é gasoso e escapa** para a atmosfera, não sendo medido.\n\n:::note\n**Sistema aberto:** troca **matéria e energia** com o exterior. **Sistema fechado:** troca **só energia** (não troca matéria). **Sistema isolado:** **não troca** matéria nem energia.\n:::\n\nPara verificar a Lei de Lavoisier, a reação tem de ocorrer em **sistema fechado** (sem troca de matéria com o exterior).\n\n## Equações químicas (pp. 48–52)\n**Do ponto de vista microscópico:** os átomos dos produtos são **os mesmos** dos reagentes — **não há alteração do número total de átomos**; os átomos apenas **se ligam de forma diferente**.\nEx.: **C(s) + O₂(g) → CO₂(g)**. Antes: carbono e dioxigénio (m reagentes = 22,0 g, m produtos = 0 g). No fim: só dióxido de carbono (m produtos = 22,0 g). A massa total é sempre 22,0 g.\n\n:::key\nDurante uma **reação química**:\n- há **rearranjo** dos átomos dos reagentes, formando novas substâncias;\n- **não** se formam novos **elementos químicos**;\n- os átomos dos reagentes e dos produtos são os mesmos → o **número total de átomos de cada elemento mantém-se**;\n- há **conservação da massa total**.\n:::\n\nUma reação pode ser traduzida por uma **\"equação\" de palavras** (nomes das substâncias) ou por uma **equação química** (fórmulas químicas).\n\n### Exemplo 1 — Carbono + dioxigénio\n- \"Equação\" de palavras: **Carbono (s) + Dioxigénio (g) → Dióxido de carbono (g)**\n- Equação química: **C(s) + O₂(g) → CO₂(g)**\n- Reagentes: 1 átomo de C, 2 de O. Produto: 1 átomo de C, 2 de O → **já está acertada**.\n- Leitura: *Um átomo de carbono, no estado sólido, reage com uma molécula de dioxigénio, no estado gasoso, originando uma molécula de dióxido de carbono, no estado gasoso.*\n\n:::key\nAs equações químicas têm de traduzir a **Lei de Lavoisier** (Lei da Conservação da Massa).\n:::\n\n### Atividade prática 10 — Eletrólise da água (p. 50)\n**Eletrólise** = reação química de **decomposição** de uma substância por ação da **corrente elétrica**.\n\"Equação\" de palavras: **Água (l) → Dioxigénio (g) + Di-hidrogénio (g)**\n\n### Exemplo 2 — Eletrólise da água (acerto passo a passo)\n1. Sem acerto: H₂O(l) → O₂(g) + H₂(g). Reagente: 2 H, **1 O**; produtos: 2 H, **2 O** ✗ (não pode aparecer um O \"a mais\").\n2. Pôr **2** antes da água: 2 H₂O → O₂ + H₂. Reagente: **4 H**, 2 O; produtos: **2 H**, 2 O ✗.\n3. Pôr **2** antes do H₂: **2 H₂O(l) → O₂(g) + 2 H₂(g)**. Reagente: 4 H, 2 O; produtos: 4 H, 2 O ✓\n- Leitura: *Duas moléculas de água, no estado líquido, originam uma molécula de dioxigénio, no estado gasoso, e duas moléculas de di-hidrogénio, no estado gasoso.*\n\n### Exemplo 3 — Obtenção de amoníaco\n1. N₂(g) + H₂(g) → NH₃(g): reagentes 2 N, 2 H; produto 1 N, 3 H ✗\n2. Acertar o N: N₂ + H₂ → **2** NH₃ → produtos 2 N, **6 H** ✗\n3. Acertar o H: N₂ + **3** H₂ → 2 NH₃ → 2 N e 6 H de cada lado ✓\n- **N₂(g) + 3 H₂(g) → 2 NH₃(g)**\n- Leitura: *Uma molécula de dinitrogénio, no estado gasoso, reage com três moléculas de di-hidrogénio, no estado gasoso, originando duas moléculas de amoníaco, no estado gasoso.*\n\n:::key\nPara **acertar uma equação química** colocam-se **coeficientes** antes das fórmulas dos reagentes e/ou produtos. **Nunca se alteram os índices** (isso mudaria a substância!).\n:::\n\n:::steps\n**Método para acertar equações**\n1. Escreve a equação com as fórmulas corretas.\n2. Conta os átomos de cada elemento nos reagentes e nos produtos.\n3. Acerta primeiro os elementos que aparecem **numa só substância** de cada lado; deixa o **H e o O** (ou elementos isolados, como O₂) para o fim.\n4. Ajusta os coeficientes um a um e volta a contar.\n5. Confirma que **todos** os elementos têm o mesmo número de átomos dos dois lados.\n:::\n\n## Tem (cons)ciência! — Gastrenterologia: Álcool na juventude é uma má ideia! (p. 53)\n- Portugal é dos países europeus onde o consumo de bebidas alcoólicas entre adolescentes **mais se agravou**.\n- O vinho e a cerveja resultam da **fermentação alcoólica**: microrganismos (**leveduras**) transformam os açúcares da uva e dos cereais (glicose e frutose, C₆H₁₂O₆) em **álcool (etanol)** e **dióxido de carbono**:\n  **C₆H₁₂O₆(aq) → 2 C₂H₆O(aq) + 2 CO₂(g)**\n- **Porque não se deve beber na adolescência?**\n  - O sistema nervoso e o fígado ainda não estão desenvolvidos → **sem tolerância** aos efeitos tóxicos do etanol.\n  - Pode deixar **sequelas** emocionais e psicológicas: défice de memória, ansiedade, dificuldade de concentração → pior rendimento escolar.\n  - As expectativas (relaxar, desinibir, divertir) **intensificam os efeitos tóxicos**.\n  - O organismo tem muita **dificuldade em metabolizar** o etanol.\n  - Quem bebe em excesso tem **maior probabilidade de experimentar drogas ilícitas**.\n  - Aumenta o **risco de acidentes** (sobretudo de viação).\n  - Entre os 15 e os 49 anos, o álcool é o **principal fator de risco de morte prematura e doença crónica**.\n- **Mitos:** \"os outros irão aceitar-me melhor\", \"irei desinibir-me\", \"serei mais popular\", \"o meu desejo sexual aumentará\", \"conseguirei esquecer os meus problemas\" — **todos errados**.\n\n## Para resumir — Equação química (p. 54)\n- **Traduz simbolicamente** o que acontece numa **reação química**.\n- Reagentes e produtos apresentam-se pelas suas **fórmulas químicas**, separados por uma **seta**: reagente(s) → produto(s) da reação.\n- Diferentes reagentes (ou produtos) são associados pelo **sinal \"+\"**: reagente 1 + reagente 2 + … → produto 1 + produto 2 + …\n- Junto à fórmula indicam-se, entre parênteses, os **estados físicos** das substâncias.\n- Mostra que há **rearranjo dos átomos** dos reagentes, **mantendo-se o número total de átomos** de cada elemento.\n- Quando acertada, obedece à **Lei de Lavoisier** (Lei da Conservação da Massa)."}, {"id": "07-combustao", "title": "2.1 Reações de combustão e triângulo de fogo", "pages": "58–64", "part": "Reações Químicas", "md": "# Tipos de reações químicas — Reações de combustão\n\n## Um caso português — A empresa de conservas de peixe mais antiga do mundo (p. 58)\n- Em **1853**, em **Vila Real de Santo António** (Algarve), foi criada a primeira fábrica nacional de peixe em conserva, ainda em laboração.\n- Pioneira nas primeiras fábricas de latas do mundo e nas **latas de abertura fácil (com argola)**; cumpre padrões de pesca sustentável e tem laboratórios próprios (fases: preparação, enlatamento, esterilização e arrefecimento).\n- No enlatamento, antes de fechar a lata, **expulsa-se todo o ar** para retirar o **dioxigénio**, responsável por acelerar a **corrosão** do interior da lata e a **oxidação** do produto.\n- O **pH** no interior da lata deve ser **inferior a 4,5** para evitar a bactéria *Clostridium botulinum* (que se desenvolve mesmo sem dioxigénio).\n- Em **2015** abriu uma fábrica em Lavra (Matosinhos), com aproveitamento de águas residuais e iluminação natural — uma das 5 melhores unidades do setor agroalimentar a nível mundial.\n\n:::faq\n**Qual é a massa de dióxido de carbono produzida por um carro a gasóleo?** *(resposta na secção 2.2, p. 69)*\n:::\n\n## O que é uma reação de combustão? (p. 59)\nQuando o **carvão arde** (ex.: churrasco), ocorre uma **combustão**.\n\n**Atividade (figura 2):** carvão (m = 2,0 g) aceso com um fósforo, colocado num frasco com ar e água de cal, que depois se fecha. Passado algum tempo a combustão **parou**; o carvão que sobrou tem **m = 1,5 g** e a **água de cal turvou**.\n\n- Para o carvão arder é preciso **dioxigénio do ar** e **energia** (fornecida pela chama do fósforo) para a reação se iniciar.\n- Libertam-se gases → formam-se novas substâncias. A combustão do carvão é uma **reação química** que **liberta energia** (térmica e luminosa).\n- O carvão é essencialmente **carbono** — é o **combustível** (o material que **arde**).\n- O **dioxigénio** do ar é o **comburente** (o material que **permite a combustão**).\n- A combustão parou porque **acabou o dioxigénio** dentro do frasco. A massa de carvão diminuiu porque parte reagiu.\n- A **água de cal turvou** → formou-se **dióxido de carbono** (produto da reação).\n\n:::note\n**Teste químico do dióxido de carbono:** se a **água de cal** (límpida) **turvar** em contacto com uma amostra, a amostra contém **CO₂**.\n:::\n\n:::key\nUma **combustão com chama** é uma reação química que **liberta energia** e requer **três condições**: **combustível, comburente e fonte de energia**.\n:::\n\n:::warn\n**Cidadania consciente — Monóxido de carbono.** Em certas condições a combustão também produz **monóxido de carbono (CO)**, gasoso — muito perigoso porque **não tem cheiro nem cor** e é **altamente tóxico** (mal-estar, náuseas, vómitos, perda de consciência ou até a morte). **Areja os locais das combustões e mantém chaminés e exaustores limpos!**\n:::\n\n## O triângulo de fogo (p. 60)\nModelo que resume as **três condições** necessárias a uma combustão com chama:\n\n| Lado do triângulo | Exemplos |\n|---|---|\n| **Combustível** (material que arde) | Sólidos (madeira, plásticos…), líquidos (gasolina, gasóleo, álcool etílico…), gases (propano, butano, gás natural…) |\n| **Comburente** (permite a combustão de outro material) | Dioxigénio, água oxigenada concentrada, ácido nítrico concentrado, nitratos, nitritos, bromatos… |\n| **Fonte de energia** (inicia a combustão) | Chama, aquecimento, faísca… |\n\nPara o **carvão**: combustível = **carvão (carbono)**; comburente = **dioxigénio**; fonte de energia = **chama** (do fósforo).\n\n:::key\nPara **iniciar e manter** uma combustão com chama são necessárias três condições (**triângulo de fogo**):\n- **combustível** — material que arde;\n- **comburente** — material que permite a combustão de outro material;\n- **fonte de energia** — energia necessária para iniciar a combustão.\n:::\n\n## Equação química de uma combustão (pp. 60–61)\nTem **dois reagentes** e, se o comburente for o dioxigénio, forma-se **pelo menos um óxido**.\n**Combustão do carvão:** Carbono (s) + Dioxigénio (g) → Dióxido de carbono (g)\n**C(s) + O₂(g) → CO₂(g)** — C = reagente (combustível); O₂ = reagente (comburente); CO₂ = produto.\n\n:::key\n**Combustível + Comburente → Produto(s) da reação** (geralmente, um dos produtos é um **óxido**)\n:::\n\n:::tip\nA **ordem** dos reagentes (ou dos produtos) numa equação é **indiferente**: C(s) + O₂(g) → CO₂(g) ou O₂(g) + C(s) → CO₂(g).\n:::\n\n### Exercício resolvido — Combustão do propano (p. 61)\nNo fogão usa-se **gás propano (C₃H₈)**; a combustão dá chama azul. Produtos: dióxido de carbono e vapor de água.\n1. \"Equação\" de palavras: **Propano (g) + Dioxigénio (g) → Dióxido de carbono (g) + Água (g)**\n2. Equação acertada: **C₃H₈(g) + 5 O₂(g) → 3 CO₂(g) + 4 H₂O(g)**\n3. Modelos: 1 molécula de propano + 5 moléculas de O₂ → 3 moléculas de CO₂ + 4 moléculas de H₂O.\n\n:::steps\n**Como acertar uma combustão de um hidrocarboneto (CₓHᵧ)**\n1. Acerta o **C**: coeficiente do CO₂ = n.º de C. (C₃H₈ → 3 CO₂)\n2. Acerta o **H**: coeficiente da H₂O = n.º de H ÷ 2. (8 H → 4 H₂O)\n3. Conta os **O** nos produtos: 3 × 2 + 4 × 1 = 10 → precisas de 10 ÷ 2 = **5 O₂**.\n:::\n\n### Atividade prática 11 — Como distinguir o combustível do comburente? (p. 62)\nO professor faz as combustões do **enxofre** (numa colher de combustão, dentro de um erlenmeyer, numa *hotte*), da **palha de aço** e do **magnésio** (não olhar diretamente — brilho muito intenso!).\n\n:::note\n**Hotte** (nicho de exaustão): sistema de extração de gases, semelhante a um exaustor de cozinha, usado em atividades que libertam gases (sobretudo tóxicos).\n:::\n\nInformações: o enxofre produz **dióxido de enxofre** gasoso; a palha de aço é sobretudo **ferro**, que forma **óxido de ferro** e **trióxido de diferro**; o magnésio produz **óxido de magnésio**.\n\n## Os perigos e a segurança nas combustões (pp. 63–64)\nCombustões comuns: lenha na lareira, gás no fogão, queimadas. Sem cuidado podem dar origem a:\n- **Incêndio:** combustão **descontrolada**.\n- **Explosão:** libertação **muito rápida** de uma grande quantidade de gases (ex.: dinamite, combustíveis gasosos). Num incêndio os gases aquecem e expandem; num espaço pequeno, o **aumento de pressão** nas paredes pode provocar uma explosão.\n\n### Como parar uma combustão? — retirar um dos lados do triângulo\n| Retirar… | Como | Exemplo |\n|---|---|---|\n| **o combustível** | **Afastar** as fontes de combustível | Fechar bem as válvulas de segurança para evitar fugas de gás |\n| **o comburente** | **Abafar** — retirar o fluxo de ar (dioxigénio) | Óleo a arder na frigideira: **tapar com a tampa**; **nunca usar água** (projeções de óleo quente) |\n| **a fonte de energia** | **Arrefecer** — diminuir a energia | A **água** apaga fogos de papel ou madeira (bom sistema de arrefecimento) |\n\n:::key\nPara **extinguir uma combustão** (ou incêndio) retira-se uma das condições do triângulo de fogo: o **comburente (abafando)**, a **fonte de energia (arrefecendo)** ou o **combustível (impedindo o fornecimento de mais combustível)**.\n:::\n\n:::warn\n**A água não apaga todos os fogos!** Não se usa em combustíveis **líquidos** como gasolina, óleo ou álcool (projeta-os e espalha o incêndio) nem em combustíveis **gasosos**. Nesses casos usa-se um **extintor** (geralmente com **dióxido de carbono**) ou **abafa-se** com cobertores apropriados.\n:::\n\nNos locais públicos (escolas, áreas comerciais) devem existir **dispositivos de segurança contra incêndios**.\n\n### Atividade prática 12 — Dispositivos de segurança no laboratório escolar (p. 64)\n\n:::warn\n**Cidadania consciente — Como agir num incêndio na escola?** Presta atenção nos **simulacros**. A evacuação deve ser **rápida, ordeira e silenciosa**. Se puderes, **molha a roupa**; se a roupa começar a arder, **deita-te no chão e rebola**.\n**Evitar incêndios florestais:** não fazer fogueiras fora das zonas reservadas; não fumar na floresta ou perto; não deixar lixo no chão.\n:::"}, {"id": "08-efeito-estufa", "title": "2.2 Efeito de estufa e aquecimento global", "pages": "65–69", "part": "Reações Químicas", "md": "# O efeito de estufa\n\n## O que é o efeito de estufa? (p. 65)\n**Composição do ar (figura 6):** **dinitrogénio 78,08 %**, **dioxigénio 20,95 %**, árgon, dióxido de carbono, vapor de água e outros gases **0,97 %**.\n\n- O **vapor de água** e o **dióxido de carbono** são os principais responsáveis pelo **efeito de estufa natural** da Terra.\n\n:::note\n**Porquê \"efeito de estufa\"?** Porque o aquecimento do planeta é semelhante ao que ocorre nas **estufas agrícolas**, em que a radiação solar fica retida graças ao vidro ou plástico.\n:::\n\n## Como se explica o efeito de estufa natural? (pp. 65–66)\nDa radiação solar que chega à Terra:\n- **20 %** é **absorvida pela atmosfera**;\n- **30 %** é **reenviada para o espaço**;\n- **50 %** é **absorvida pela superfície terrestre**, que aquece e emite **radiação infravermelha**.\n\nDa radiação infravermelha emitida pela superfície:\n- cerca de **10 % escapa** para o espaço;\n- os restantes **90 %** são **reenviados para a superfície** pelos **gases com efeito de estufa (GEE)** — sobretudo **dióxido de carbono e vapor de água** — que \"retêm\" a energia e aquecem o planeta.\n\n- O efeito de estufa controla a **amplitude térmica** terrestre e mantém a **temperatura média** da Terra em cerca de **15 °C**. Sem ele, as noites seriam muito mais frias, os dias muito quentes e a temperatura média seria **abaixo de 0 °C**.\n- É **fundamental para a vida** na Terra (estabilidade da temperatura média e do clima).\n\n:::note\n**Amplitude térmica terrestre** = diferença entre a temperatura **máxima** e a temperatura **mínima** terrestre.\n:::\n\n:::key\nO **efeito de estufa** é um **fenómeno natural** em que os **gases de efeito de estufa (GEE)** **retêm a radiação infravermelha** emitida pela Terra. Influencia o clima e mantém a temperatura média do planeta **estável** e adequada à vida.\n:::\n\n## Pode a ação humana alterar o efeito de estufa? (p. 66)\nSim. Várias atividades humanas produzem GEE que se **acumulam** na atmosfera, **aumentando artificialmente** o efeito de estufa → **aumento da temperatura global** = **aquecimento global**. Estes gases também **diminuem a qualidade do ar**.\n\n:::warn\n**Cidadania consciente — Máscaras antes da covid-19?** Já se usavam em cidades com **má qualidade do ar** (proteção contra a poluição, sobretudo partículas dos escapes) e por pessoas com gripe para proteger os outros (Japão, China). **Desloca-te a pé ou de bicicleta sempre que possível!**\n:::\n\n## Principais GEE produzidos pelas atividades humanas (p. 67)\n| Gás | Origem humana |\n|---|---|\n| **Dióxido de carbono (CO₂)** | **Combustões** de combustíveis fósseis; **desflorestação** intensiva (menos árvores a absorver CO₂ pela fotossíntese); **incêndios florestais** |\n| **Monóxido de dinitrogénio (N₂O)** | **Fertilizantes** com nitrogénio; **indústria química** (produto indesejável) |\n| **Metano (CH₄)** | **Pecuária intensiva** (vacas e ovelhas libertam metano na digestão); **agricultura** (ex.: cultura do arroz) |\n\n:::note\n**Combustíveis fósseis** resultam da transformação de restos orgânicos acumulados há milhões de anos: **carvão, petróleo e gás natural**.\n**CFC** (clorofluorocarbonetos): gases usados em frigoríficos, congeladores e ares condicionados; **banidos** na década de 80 do séc. XX, mas ainda presentes na atmosfera.\n:::\n\n**Contribuição para o aumento do efeito de estufa (1750–2019, OMM):** **CO₂ 66 %**, **CH₄ 16 %**, **N₂O 7 %**, **CFC 7 %**, outros 4 %.\n\n:::key\nO **dióxido de carbono** é o gás emitido pela ação humana que **mais contribui** para o aquecimento global.\n:::\n\n## Aquecimento global e alterações climáticas (p. 68)\nA temperatura média global aumentou **mais de 1 °C** desde o início do séc. XX (figura 10 — desde ~1980 as temperaturas estão sempre acima da média de 1901–2000).\n\n**Consequências do aquecimento global:**\n- **Alterações climáticas:** temperaturas extremas (ondas de calor ou de frio), inundações, mais furacões e tempestades.\n- **Problemas de saúde** nos seres vivos (aumento de temperatura).\n- **Aquecimento da água** → perda de **biodiversidade aquática**.\n- **Subida do nível médio da água do mar** (degelo das calotes polares) → perda de terra; populações costeiras terão de se mudar.\n\n## Como minimizar as emissões? (p. 69)\n- **Evitar** o transporte motorizado individual (transporte público, meios não motorizados).\n- **Cuidar das florestas**, prevenir incêndios e apostar na **reflorestação**.\n- **Optar** por produtos de origem biológica e de proximidade (menos pesticidas).\n- **Reduzir** o consumo de **proteína animal** (menos pecuária intensiva).\n- **Reduzir** o consumo de **eletricidade** (desligar aparelhos).\n- **Recusar** produtos de uso único (compras a granel); **reduzir** materiais novos.\n- **Reutilizar** — evita produzir novos materiais.\n- **Recuperar** materiais existentes, dando-lhes nova vida.\n- **Reciclar** — materiais usados como matéria-prima, menos energia gasta.\n\n:::faq\n**Qual é a massa de dióxido de carbono produzida por um carro a gasóleo?**\nDepende da idade, motor, pneus, manutenção… Na UE, a emissão média dos carros novos é **107,8 g de CO₂ por km**. Em **100 km**: 107,8 × 100 = **10 780 g ≈ 10,8 kg de CO₂**. Prefere transportes públicos, bicicleta ou andar a pé!\n:::\n\n## Para resumir — Reação de combustão (p. 70)\n- Reação química que **liberta energia** e requer **três condições** (combustível, comburente e fonte de energia), resumidas no **triângulo de fogo**.\n- Segue o esquema **combustível + comburente → produto(s)** (se o comburente for o oxigénio, um dos produtos é um **óxido**).\n- Para extinguir uma combustão retira-se um elemento do triângulo: o **comburente (abafando)**, a **fonte de energia (arrefecendo)** ou o **combustível (impedindo o fornecimento de mais combustível)**.\n- As combustões emitem **dióxido de carbono**, que contribui para o **aumento do efeito de estufa** → **aquecimento global** e **alterações climáticas**.\n\n## Investigo e comunico — Vamos salvar o clima! (p. 70)\nO degelo das calotes polares faz subir o nível do mar. Localidades portuguesas em risco de inundação: Caminha, Viana do Castelo, Póvoa de Varzim, Vila do Conde, Esposende, Matosinhos, Espinho, Ovar, Aveiro, Montemor-o-Velho, Figueira da Foz, Nazaré, Peniche, Costa da Caparica, Barreiro, Moita, Montijo, Setúbal, Troia, Lagos, Portimão, Olhão, Faro e Vila Real de Santo António."}, {"id": "09-acidos-bases-ph", "title": "2.3 Ácidos, bases, pH e indicadores", "pages": "72–77", "part": "Reações Químicas", "md": "# Reações ácido-base — Ácidos e bases\n\n:::faq\n**Porque é que uma bebida gaseificada doce fica mais doce quando perde o gás?** *(resposta na secção 2.4, p. 85)*\n:::\n\n## O que são soluções aquosas? (p. 72)\nAo dissolver **sal (cloreto de sódio)** em água: o sal é o **soluto**, a água é o **solvente** e a mistura homogénea de água salgada é a **solução**. A nível submicroscópico, os iões **Na⁺** e **Cl⁻** ficam rodeados de moléculas de **H₂O**.\n\n:::key\nUma **solução** é uma **mistura homogénea**. Se o **solvente é a água**, diz-se **solução aquosa** (\"aquoso\" vem do latim *aqua* = água).\n:::\n\nQuanto às características ácido-base (**caráter químico**), uma solução aquosa pode ser: **ácida**, **neutra** ou **básica (alcalina)**.\n\n## Como se distinguem? (p. 73)\nTodas as soluções aquosas contêm moléculas de **H₂O**, iões **hidróxido (OH⁻)** e iões **hidrogénio (H⁺)**. Os iões H⁺, em contacto com a água, originam iões **oxónio (H₃O⁺)**. É a relação entre **H₃O⁺** e **OH⁻** que define o caráter:\n\n| Solução | Relação entre iões | Exemplo |\n|---|---|---|\n| **Ácida** | **mais H₃O⁺** do que OH⁻ | Solução aquosa de cloreto de hidrogénio |\n| **Neutra** | **igual** quantidade de H₃O⁺ e OH⁻ | Solução aquosa de cloreto de sódio |\n| **Básica** | **menos H₃O⁺** do que OH⁻ | Solução aquosa de hidróxido de sódio |\n\n## Solução ácida (pp. 73–74)\n**Onde há ácidos?**\n- **Alimentação:** citrinos (limão, laranja — **ácido cítrico**); café, vinho, bebidas gaseificadas; **vinagre (ácido acético)**.\n- **Saúde e higiene:** **aspirina (ácido acetilsalicílico)**; cremes para o acne.\n- **Produtos de limpeza:** **ácido muriático** (retira cimento de pisos) = **ácido clorídrico** (solução aquosa de cloreto de hidrogénio).\n- **Indústria e laboratório:** **ácido nítrico** (fabrico de adubos).\n\n**Tabela 1 — Alguns ácidos**\n\n| Nome comum | Nome sistemático | Fórmula |\n|---|---|---|\n| Ácido clorídrico | Solução aquosa de cloreto de hidrogénio | **HCl** |\n| Ácido sulfúrico | Di-hidrogenio(tetraoxidossulfato) | **H₂SO₄** |\n| Ácido nítrico | Hidrogenio(trioxidonitrato) | **HNO₃** |\n| Ácido fosfórico | Tri-hidrogenio(tetraoxidofosfato) | **H₃PO₄** |\n| Ácido acético | Ácido etanoico | **CH₃COOH** |\n| Ácido nitroso | Hidrogenio(dioxidonitrato) | **HNO₂** |\n| Ácido carbónico | Di-hidrogenio(trioxidocarbonato) | **H₂CO₃** |\n\n:::note\n**Nome sistemático:** nome a partir do qual se consegue determinar, **sem ambiguidade**, a fórmula química do composto.\n:::\n\n:::key\n**Propriedades das soluções ácidas:** sabor **azedo**; reagem com o **calcário** (carbonato de cálcio, CaCO₃); reagem com alguns **metais, corroendo-os**; **conduzem a corrente elétrica**.\n:::\n\n## Solução básica ou alcalina (pp. 74–75)\n**Onde há bases?**\n- **Alimentação:** **fermento** para bolos (bicarbonato de sódio = hidrogenocarbonato de sódio); **clara do ovo**.\n- **Saúde e higiene:** **pastas de dentes**; **leite de magnésia** (di-hidróxido de magnésio, contra a azia); **sabonetes**.\n- **Produtos de limpeza:** **detergentes amoniacais** (amoníaco); **lixívia** (hidróxido de sódio).\n- **Indústria/agricultura:** fertilizantes com **cal hidratada** (di-hidróxido de cálcio).\n\n:::warn\n**Cidadania consciente — Pilhas alcalinas:** têm este nome porque contêm substâncias **alcalinas**. Se entrarem em contacto com os solos podem **contaminá-los**. **Descarta as pilhas no pilhão!**\n:::\n\n**Tabela 2 — Algumas bases**\n\n| Nome comum | Nome sistemático | Fórmula |\n|---|---|---|\n| Amoníaco | Tri-hidreto de nitrogénio | **NH₃** |\n| Hipoclorito de sódio | Cloreto-oxigenato de sódio | **NaOCl** |\n| Hidrogenocarbonato de sódio | Trioxidocarbonato de hidrogénio e sódio | **NaHCO₃** |\n| Hidróxido de sódio | Hidróxido de sódio | **NaOH** |\n| Hidróxido de cálcio | Di-hidróxido de cálcio | **Ca(OH)₂** |\n| Hidróxido de magnésio | Di-hidróxido de magnésio | **Mg(OH)₂** |\n| Hidróxido de potássio | Hidróxido de potássio | **KOH** |\n\n:::note\nOs **hidróxidos** são compostos iónicos que contêm o anião **OH⁻**. Dissolvidos em água formam **soluções básicas**.\n:::\n\n:::key\n**Propriedades das soluções básicas:** sabor **amargo**; **escorregadias** ao tato; **conduzem a corrente elétrica**.\n:::\n\n## Solução neutra (p. 75)\nHá poucas no dia a dia. A **água destilada** (ex.: nos ferros de engomar) é neutra; dissolvendo **açúcar ou sal** em água destilada obtém-se uma solução neutra.\n\n:::note\nA **água destilada** acabada de destilar ou numa garrafa bem fechada tem **pH 7 a 25 °C**. Com a garrafa aberta, em contacto com o **CO₂ do ar**, fica **ligeiramente ácida** — tal como a **água da chuva**.\n:::\n\n:::key\nAs soluções aquosas podem ser **ácidas, básicas ou neutras**.\n:::\n\n### Atividade prática 13 — As soluções ácidas e básicas concentradas são perigosas? (p. 75)\n\nAs soluções ácidas e básicas concentradas são **corrosivas**: além do equipamento de proteção, devem ser **diluídas** com água antes de usar, e deve evitar-se inalar os vapores (trabalhar na *hotte*, arejar).\n\n:::key\nAs soluções **ácidas** ou **básicas concentradas** são **corrosivas**.\n:::\n\n:::warn\n**Como se diluem soluções concentradas?** A diluição liberta energia (aquece) e pode provocar **projeções**. Deve-se adicionar **sempre o ácido (ou a base) sobre a água, lentamente e com agitação** — **nunca** a água sobre o ácido.\n:::\n\n## Como identificar soluções ácidas, básicas ou neutras? (p. 76)\nOs ácidos alimentares são azedos e as bases amargas, mas no laboratório **é proibido provar**. Usam-se **indicadores ácido-base** e a **medição do pH**.\n\n## Escala de pH (p. 76)\nO **pH** é uma escala numérica de **0 a 14** (a **25 °C**) que permite avaliar se uma solução é ácida, básica ou neutra. Também se chama **escala de Sorensen** (químico dinamarquês **Soren Sorensen**, 1868–1939, criou-a em **1909**).\n\n| pH | Caráter | Regra |\n|---|---|---|\n| **pH < 7** | **Ácida** | A **acidez aumenta** com a **diminuição** do pH |\n| **pH = 7** | **Neutra** | — |\n| **pH > 7** | **Básica** | A **basicidade aumenta** com o **aumento** do pH |\n\n**Exemplos (figura 13):** ácido sulfúrico de baterias **0**; suco gástrico **1**; limão **2**; bebida com gás **3**; tomate **4**; café **5**; leite **6**; água destilada **7**; sangue **8**; clara de ovo **9**; pastilhas antiácido **10**; detergente amoniacal **11**; sabão **12**; lixívia **13**; soda cáustica **14**.\n\n## Como medir o pH? (p. 77)\n| Método | Como funciona | Vantagens / desvantagens |\n|---|---|---|\n| **Indicador universal** (em solução ou em papel) | O valor de pH é identificado **por comparação com uma tabela de cores** | **Mais fácil e rápido**, mas **menos rigoroso** |\n| **Medidor de pH** | Aparelho com elétrodo que mostra o valor | **Mais difícil** e demorado, mas **mais rigoroso** |\n\n:::key\nA **escala de pH** permite classificar as soluções em ácidas, básicas ou neutras. Mede-se o pH com o **indicador universal** ou com o **medidor de pH**.\n:::\n\n## Indicadores ácido-base (p. 77)\nSão soluções que se adicionam à solução em estudo e que **mudam de cor consoante o pH**, permitindo determinar o caráter ácido-base. Podem ser **sintéticos** (os mais comuns no laboratório) ou **naturais**.\n\n**Tabela 3 — Indicadores sintéticos**\n\n| Indicador (cor inicial) | Solução **ácida** | Solução **neutra** | Solução **básica** |\n|---|---|---|---|\n| **Fenolftaleína** (solução alcoólica; **incolor**) | **Incolor** | **Incolor** | **Carmim** (rosa-forte) |\n| **Tintura azul de tornesol** (**azul**) | **Vermelho** | **Azul-arroxeado** | **Azul** |\n\n:::tip\nA fenolftaleína **só distingue as bases** (fica carmim); nas ácidas e neutras fica incolor — não distingue uma ácida de uma neutra! O tornesol fica **vermelho** nos ácidos.\n:::\n\n### Indicadores naturais (p. 78)\nObtidos de extratos naturais, por exemplo a **água da cozedura da couve-roxa** ou da **beterraba**.\n\n**Tabela 4 — Indicador de couve-roxa (cor inicial: roxo)**\n\n| Solução ácida | Solução neutra | Solução básica |\n|---|---|---|\n| **Vermelho ou rosa** | **Roxo** | **Azul ou verde** |\n\n:::key\nUm **indicador ácido-base** permite determinar as **características ácido-base** de uma solução: **muda de cor consoante o pH** da solução a que é adicionado.\n:::\n\n### Atividade prática 14 (em estações) — Como determinar o caráter ácido-base e o pH? (pp. 78–79)\nA Sofia encontrou um frasco sem informação. Soluções a estudar: **vinagre, limpa-vidros, água da torneira, solução encontrada no laboratório**.\n- **Estação 1:** papel indicador de pH (0,5 cm numa caixa de Petri + 1–2 gotas; comparar com a escala do fabricante).\n- **Estação 2:** medidor de pH (lavar com água destilada e secar entre medições).\n- **Estação 3:** indicadores em solução numa placa de microanálise (3 gotas de solução + 3 gotas de fenolftaleína / tornesol).\n\n## Características ácido-base da água (p. 79)\nDependem do **tipo de solo** por onde a água passa até chegar aos **lençóis freáticos** (dissolve componentes do solo). Para a **água da torneira**, a lei obriga a que o **pH esteja entre 6,5 e 9,5**.\n\n:::warn\n**Cidadania consciente — Água.** Deves beber pelo menos **1–1,5 L de água por dia**. Mantém-te saudável: bebe água!\n:::\n\n## Características ácido-base da água da chuva (pp. 80–81)\n**Ciclo da água (hidrológico):** **evaporação** (mares e rios), **transpiração** (plantas), **condensação** (nuvens), **precipitação** (neve, chuva, granizo), **fusão** (gelo e neve), **infiltração** (nos solos).\n\n:::warn\n**Cidadania consciente — O ciclo hidrológico e a qualidade da água.** O ciclo purifica e faz circular a água e influencia o clima. A água é um **excelente solvente** e dissolve muitas substâncias ao longo do ciclo. **Evita fontes de poluição** que se dissolvam na água!\n:::\n\n### Atividade prática 16 — Características ácido-base da água da chuva (p. 81)\nDois gobelés com 50 mL de água destilada; soprar com uma palhinha num deles durante 20 s e medir o pH a cada 20 s até 200 s; medir também o gobelé exposto ao ar.\n\n- A água da chuva dissolve **CO₂** do ar, que reage com a água formando **ácido carbónico**:\n  **CO₂(g) + H₂O(l) → H₂CO₃(aq)**\n- Por isso a água da chuva é **naturalmente ligeiramente ácida**, até um **pH de 5,6 a 25 °C**.\n- Outros gases que acidificam a chuva: **óxidos de enxofre** (erupções vulcânicas) e **óxidos de nitrogénio** (combustão de combustíveis fósseis).\n\n:::key\n**Estará a chuva a ficar mais ácida?** A água da chuva normal é ácida (pH ligeiramente inferior a 7). Quando o **pH é inferior a 5,6** diz-se que a **chuva é ácida** — por causa de gases libertados por atividades humanas.\n:::"}, {"id": "10-reacoes-acido-base", "title": "2.4 Chuva ácida e reações ácido-base (neutralização)", "pages": "82–85", "part": "Reações Químicas", "md": "# Chuva ácida e reações ácido-base\n\n## Formação da chuva ácida (p. 82)\n- **Fábricas, centrais térmicas e transportes** emitem gases poluentes: **óxidos de enxofre (SO₂)** e **óxidos de nitrogénio (NO₂)**.\n- A água da chuva reage com esses gases formando **ácido sulfuroso (H₂SO₃)**, **ácido sulfúrico (H₂SO₄)** e **ácido nítrico (HNO₃)**, que se dissolvem na chuva e a **acidificam**.\n\n**Consequências da chuva ácida:**\n- **Danifica as plantas** (folhagens e raízes) e **acidifica o solo** (as plantas não obtêm nutrientes).\n- **Danifica monumentos de mármore** e **corrói elementos metálicos**.\n- **Acidifica os lagos** → perturba os ecossistemas aquáticos e pode **matar os seres vivos**.\n\n## O que acontece quando se mistura um ácido com uma base? (pp. 82–83)\n**Experiência (figura 17):** fenolftaleína em **ácido clorídrico (pH 2,0)**; adiciona-se lentamente, com agitação, **hidróxido de sódio** (base), medindo o pH:\n- **A** — Início da adição: o pH **sobe** mas fica **abaixo de 7** (pH 4,0) → solução ainda **ácida** (incolor).\n- **B** — Continuando: o pH chega a **7,0** → solução **neutra** (incolor).\n- **C** — Continuando: o pH fica **acima de 7** (pH 8,0) → solução **básica** (a fenolftaleína fica **carmim**).\n\nEsta reação chama-se **reação ácido-base**.\n\n:::note\n**Evidências de uma reação ácido-base** (HCl + NaOH): **aumento de temperatura** do sistema e **variação do pH** da solução.\n:::\n\n**Gráfico do pH em função do volume de base adicionado (figura 18):** começa em pH ≈ 2, sobe devagar, dá um **salto brusco** perto dos 12 mL (passa pelo 7) e estabiliza em pH ≈ 12.\nSe se adicionasse **ácido a uma base**, o pH **desceria**.\n\n:::key\nA reação entre um **ácido** e uma **base** é uma **reação ácido-base**; durante a reação **varia o pH**.\n- Adicionar **base a um ácido** → o pH **aumenta**.\n- Adicionar **ácido a uma base** → o pH **diminui**.\n:::\n\n## Reação de neutralização (pp. 83–84)\nQuando de uma reação ácido-base resulta uma **solução neutra**, chama-se **reação de neutralização**.\n- Em solução aquosa, o HCl origina iões **H⁺** e **Cl⁻**, e o NaOH origina **Na⁺** e **OH⁻**. Os iões chocam e **recombinam-se**: **Na⁺ + Cl⁻ → NaCl** e **H⁺ + OH⁻ → H₂O**.\n\n**HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l)**\nÁcido clorídrico (aq) + Hidróxido de sódio (aq) → Cloreto de sódio (aq) + Água (l)\n\n- **Cloreto de sódio** — sal **solúvel** em água (por isso \"aquoso\").\n- **Água** no estado líquido.\n\n:::key\nAs reações de neutralização formam um **sal** (composto iónico) e **água**:\n**Ácido (aq) + Base (aq) → Sal (aq) + Água (l)**\n:::\n\n### Atividade prática 17 — Como se ajusta o pH da água de uma piscina? (pp. 84–85)\nO pH de uma piscina deve estar entre **7,2 e 7,6**. A água do Raul tem **pH 6,8**. Tem dois produtos: **hidrogenossulfato de sódio (ácido)** e **carbonato de sódio (base)**.\nProcedimento: 40,0 mL de água + 4 gotas de fenolftaleína + base gota a gota; outra amostra + 4 gotas de tornesol + ácido gota a gota.\n\n### Exercício resolvido (p. 85)\n:::steps\n**Passo a passo:** 1) aplicar o esquema da reação ácido-base e escrever a \"equação\" de palavras; 2) escrever a equação química; 3) verificar se é preciso acertar.\n:::\n- **a) Ácido clorídrico + di-hidróxido de cálcio**\n  Ácido clorídrico (aq) + Di-hidróxido de cálcio (aq) → Dicloreto de cálcio (aq) + Água (l)\n  HCl(aq) + Ca(OH)₂(aq) → CaCl₂(aq) + H₂O(l) → acertada: **2 HCl(aq) + Ca(OH)₂(aq) → CaCl₂(aq) + 2 H₂O(l)**\n- **b) Ácido sulfúrico + di-hidróxido de magnésio**\n  Ácido sulfúrico (aq) + Di-hidróxido de magnésio (aq) → Sulfato de magnésio (aq) + Água (l)\n  **H₂SO₄(aq) + Mg(OH)₂(aq) → MgSO₄(aq) + 2 H₂O(l)**\n- **c) Ácido nitroso + hidróxido de sódio**\n  Ácido nitroso (aq) + Hidróxido de sódio (aq) → Nitrito de sódio (aq) + Água (l)\n  **HNO₂(aq) + NaOH(aq) → NaNO₂(aq) + H₂O(l)** — já obedece à Lei de Lavoisier, não é preciso acertar.\n\n:::tip\nTruque para o sal: junta o **catião da base** (Na⁺, Ca²⁺, Mg²⁺…) com o **anião do ácido** (Cl⁻ do HCl, SO₄²⁻ do H₂SO₄, NO₃⁻ do HNO₃, NO₂⁻ do HNO₂). Cada H do ácido + cada OH da base dá **uma molécula de água**.\n:::\n\n:::faq\n**Porque é que uma bebida gaseificada doce fica mais doce quando perde o gás?**\nTem **dióxido de carbono**, **água** e **açúcar**. A água e o CO₂ reagem e formam **ácido carbónico** (trioxidocarbonato de di-hidrogénio) → a bebida é **ácida**. Se perder o CO₂, fica **menos ácida** e o sabor **doce acentua-se** (a acidez \"disfarçava\" o açúcar, que continua lá). Consome com muita moderação!\n:::\n\n## Para resumir — Soluções aquosas e reações ácido-base (p. 86)\n- **Solução ácida (pH < 7,0)** · **Solução neutra (pH = 7)** · **Solução básica ou alcalina (pH > 7,0)**.\n- A **acidez aumenta** com a **diminuição** do pH; a **basicidade aumenta** com o **aumento** do pH.\n- Para **identificar** as características ácido-base: medir o pH (**indicador universal** em papel ou solução, ou **medidor de pH**) ou usar **indicadores ácido-base** (fenolftaleína, tintura azul de tornesol).\n- Numa **reação ácido-base**: base adicionada a ácido → pH **aumenta**; ácido adicionado a base → pH **diminui**; se o pH final for **7,0** → **reação de neutralização**.\n- **Ácido (aq) + Base (aq) → Sal (aq) + Água (l)**\n\n## Investigo e comunico — O aquário saudável (p. 86)\nOs peixes precisam de **pH entre 6 e 8** (consoante a espécie). O metabolismo dos peixes e a decomposição de restos libertam **amoníaco**, que as bactérias transformam em **ácido nitroso** e depois **ácido nítrico** → o pH vai mudando.\n\n## Para aplicar (p. 87)\nSoluções a 25 °C: **A pH 2,0; B pH 13,0; C pH 4,0; D pH 1,0; E pH 8,0; F pH 7,4**."}, {"id": "11-precipitacao", "title": "2.5 Solubilidade e reações de precipitação", "pages": "88–97", "part": "Reações Químicas", "md": "# Reações de precipitação\n\n:::faq\n**Como aparecem pedras nos rins?** *(resposta na secção 2.6, p. 100)*\n:::\n\n## Solubilidade dos sais em água (p. 88)\n**Experiência (figura 20):** em 100 mL de água a 25 °C conseguiu dissolver-se **35,9 g de cloreto de sódio (NaCl)** mas só **0,99 g de dicloreto de chumbo (PbCl₂)** até se obterem soluções saturadas.\n- O cloreto de sódio é **muito solúvel**; o dicloreto de chumbo é **pouco solúvel** em água.\n\n:::note\n**Solução saturada:** quando o soluto adicionado já **não se dissolve mais**. Se se juntar mais soluto, mesmo muito pouco, ele fica **por dissolver** (no fundo).\n:::\n\n:::key\nAo adicionar um sal sólido à água pode ocorrer a **dissolução completa** (sal **solúvel em água**) ou a sua **quase não dissolução** (sal **pouco solúvel em água**).\n:::\n\n## A nível corpuscular (p. 89)\nUm sal é um **composto iónico** (catiões + aniões). Ao dissolver-se em água, os **iões separam-se** e ficam **rodeados por moléculas de água**.\n\n## Solubilidade de um sal (pp. 89–90)\nCada soluto tem um **limite máximo de massa que se pode dissolver** num dado volume de solvente, a uma dada temperatura: a **solubilidade**.\n- NaCl: **35,9 g/100 mL** de água a 25 °C; PbCl₂: **0,99 g/100 mL** a 25 °C.\n\n:::note\nA **solubilidade** de um sal pode **variar** se se alterar o **solvente** ou a **temperatura**.\n**Não há sais insolúveis**: dissolve-se sempre alguma quantidade, por pequena que seja — há sais **muito pouco solúveis**.\n:::\n\n**Tabela 4 — Solubilidade a 25 °C (g/100 mL de água)**\n\n| Sal | Solubilidade |\n|---|---|\n| Cloreto de sódio | 35,9 |\n| Nitrato de chumbo(II) | 59,7 |\n| Dicloreto de cobre | 75,7 |\n| Iodeto de potássio | 148,4 |\n\nOrdem crescente de solubilidade: **cloreto de sódio < nitrato de chumbo(II) < dicloreto de cobre < iodeto de potássio**.\n\n:::key\nA **solubilidade de um sal** em água é a **quantidade máxima de soluto** que se consegue dissolver numa dada quantidade de água, a determinada **temperatura**. Unidade, por exemplo: **g/100 mL de água**.\nSal com **elevada solubilidade** → **muito solúvel**; com **baixa solubilidade** → **pouco solúvel**.\n:::\n\n### Tabela 5 — Prever a solubilidade (p. 90)\n| Solubilidade | Sais | Exceções |\n|---|---|---|\n| **Pouco solúveis** | **Carbonatos** | carbonato de sódio, potássio e amónio |\n| | **Fluoretos** | fluoreto de prata, amónio, sódio e potássio |\n| | **Fosfatos** | fosfato de sódio, potássio e amónio |\n| **Muito solúveis** | **Iodetos** | iodeto de prata, di-iodeto de cobre, di-iodeto de mercúrio, **di-iodeto de chumbo** |\n| | **Cloretos** | **cloreto de prata**, dicloreto de cobre, dicloreto de mercúrio, dicloreto de chumbo |\n| | **Brometos** | brometo de prata, dibrometo de cobre, dibrometo de mercúrio, dibrometo de chumbo |\n| | **Nitratos** | — (todos solúveis) |\n| | **Nitritos** | — |\n| | **Sais de sódio, potássio** | — |\n| | **Sais de amónio** | — |\n| | **Sulfatos** | sulfato de **bário**, **prata**, **chumbo**, **cálcio** ou mercúrio(II) |\n\n:::tip\n**Regras de ouro:** nitratos, sais de sódio, potássio e amónio → **sempre solúveis**. Carbonatos, fosfatos e fluoretos → **pouco solúveis** (exceto os de Na, K e NH₄). Prata (Ag⁺) e chumbo (Pb²⁺) costumam formar **precipitados** com cloretos, iodetos, brometos e sulfatos.\n:::\n\n### Exercício resolvido (p. 91)\n- **Nitrato de potássio:** **muito solúvel**.\n- **Di-iodeto de chumbo:** **pouco solúvel** (os iodetos são quase todos solúveis, mas este é uma exceção).\n- **Fosfato de magnésio:** **pouco solúvel**.\n- **Sulfato de cálcio:** **pouco solúvel**.\n\n## Reações em que se forma um precipitado (pp. 91–93)\nJuntar solução aquosa de **iodeto de potássio** a solução aquosa de **nitrato de chumbo(II)** (ambos solúveis) → forma-se um **sólido amarelo** = **nova substância** → ocorreu uma **reação química**.\n- O sólido amarelo é o **di-iodeto de chumbo** (pouco solúvel) — chama-se **precipitado** (sólido que se deposita no fundo).\n- O outro produto, o **nitrato de potássio**, é muito solúvel e fica em solução.\n\n:::key\n**Reação de precipitação:** reação entre duas soluções aquosas de **sais diferentes** em que se origina um **sólido** (sal pouco solúvel em água) — o **precipitado**.\n:::\n\n**\"Equação\" de palavras:**\nIodeto de potássio (aq) + Nitrato de chumbo(II) (aq) → Di-iodeto de chumbo (s) + Nitrato de potássio (aq)\n(muito solúvel) (muito solúvel) (pouco solúvel — sólido amarelo) (muito solúvel)\n\nA nível corpuscular, os iões **K⁺, I⁻, Pb²⁺ e NO₃⁻ recombinam-se (trocam)**: Pb²⁺ + I⁻ formam o sólido; K⁺ e NO₃⁻ ficam em solução.\n\nEquação não acertada: KI(aq) + Pb(NO₃)₂(aq) → PbI₂(s) + KNO₃(aq)\n**Equação acertada: 2 KI(aq) + Pb(NO₃)₂(aq) → PbI₂(s) + 2 KNO₃(aq)**\n\n:::key\n**Sal 1 (aq) + Sal 2 (aq) → Sal 3 (s) + Sal 4 (aq)**\n(muito solúvel) + (muito solúvel) → (pouco solúvel — **precipitado**) + (muito solúvel)\n:::\n\n### Exercício resolvido — Sulfato de sódio + nitrato de prata (pp. 93–94)\n**1.º passo — \"equação\" de palavras:** os iões **trocam de par**: o Na⁺ (estava com SO₄²⁻) fica com NO₃⁻; o Ag⁺ (estava com NO₃⁻) fica com SO₄²⁻. Pela tabela 5, o **sulfato de prata é pouco solúvel** (precipitado, \"s\"); o **nitrato de sódio é muito solúvel** (\"aq\").\nSulfato de sódio (aq) + Nitrato de prata (aq) → Sulfato de prata (s) + Nitrato de sódio (aq)\n\n**2.º passo — equação química:**\n\n| | Sulfato de sódio | Nitrato de prata | Sulfato de prata | Nitrato de sódio |\n|---|---|---|---|---|\n| Iões | SO₄²⁻; Na⁺ | NO₃⁻; Ag⁺ | SO₄²⁻; Ag⁺ | NO₃⁻; Na⁺ |\n| Fórmula | Na₂SO₄ | AgNO₃ | Ag₂SO₄ | NaNO₃ |\n\nNa₂SO₄(aq) + AgNO₃(aq) → Ag₂SO₄(s) + NaNO₃(aq)\n**Acertada: Na₂SO₄(aq) + 2 AgNO₃(aq) → Ag₂SO₄(s) + 2 NaNO₃(aq)**\n\n:::steps\n**Como escrever uma reação de precipitação**\n1. Escreve os iões de cada reagente.\n2. **Troca os pares**: catião do 1.º com anião do 2.º e vice-versa.\n3. Escreve as fórmulas dos produtos (cargas neutras!).\n4. Usa a **tabela 5** para ver qual é **pouco solúvel** → \"(s)\"; o outro → \"(aq)\".\n5. Acerta a equação.\n:::\n\n### Atividade prática 19 — Ocorre sempre precipitação? (pp. 94–95)\n| Ensaio | Soluções misturadas |\n|---|---|\n| A | Nitrato de prata + Cloreto de sódio |\n| B | Iodeto de potássio + Cloreto de sódio |\n| C | Carbonato de sódio + Dicloreto de cálcio |\n| D | Cromato de potássio + Nitrato de prata |\n\n## Reações de precipitação na vida real (pp. 95–97)\nOcorrem naturalmente na formação de **conchas e corais** e de **estalactites e estalagmites**.\n\n### Conchas e corais\nA água do mar (1 kg) tem **965,6 g de água** e **34,4 g de outros componentes (salinidade)**: Cl⁻ 18,980 g; Na⁺ 10,556 g; SO₄²⁻ 2,649 g; Mg²⁺ 1,272 g; Ca²⁺ 0,400 g; K⁺ 0,380 g; HCO₃⁻ 0,140 g; outros.\nAs **conchas** dos moluscos (ex.: mexilhões) e os **corais** formam-se por **precipitação do carbonato de cálcio (CaCO₃)**, o seu principal constituinte.\n\n### Estalactites e estalagmites\nFormam-se em **grutas de zonas calcárias** (rochas ricas em CaCO₃). As **estalactites** crescem do **teto** para o solo; as **estalagmites** crescem do **solo** para o teto; quando se unem formam uma **coluna**.\n\n:::steps\n**Como se formam (figura 28)**\n1. A água da chuva é ácida: reage com o CO₂ do ar → **H₂O(l) + CO₂(g) → H₂CO₃(aq)** (ácido carbónico).\n2. Nas fendas das rochas calcárias, o ácido carbónico reage com o carbonato de cálcio → **H₂CO₃(aq) + CaCO₃(s) → Ca(HCO₃)₂(aq)** (hidrogenocarbonato de cálcio, solúvel).\n3. Dentro da gruta, o CO₂ liberta-se para o ar → **Ca(HCO₃)₂(aq) → CaCO₃(s) + CO₂(g) + H₂O(l)**. Cada gota **precipita CaCO₃**: no teto → **estalactites**; no chão → **estalagmites**.\n:::\n\n:::key\nAs reações de precipitação ocorrem na **natureza**: a formação de **conchas e corais** e de **estalactites e estalagmites** resulta da **precipitação de carbonato de cálcio**, um sal muito pouco solúvel em água.\n:::\n\n### Tarefa interdisciplinar (CN e Geografia) — Precipitação na natureza (p. 97)\n**Parte 1 — Conchas e corais**\n\n**Parte 2 — Estalactites e estalagmites**"}, {"id": "12-dureza-agua", "title": "2.6 Dureza da água", "pages": "98–101", "part": "Reações Químicas", "md": "# Dureza da água\n\n## A água pode ser dura? (p. 98)\nA **dureza** da água está relacionada com os **sais dissolvidos**, principalmente **sais de cálcio e de magnésio**, que vêm das rochas com que a água esteve em contacto.\n- Concentração **elevada** destes sais → água **dura**; concentração baixa → água **macia**.\n- Águas de **zonas calcárias** são geralmente **mais duras** do que as de zonas **graníticas ou basálticas**.\n- **Mapa de Portugal (figura 29):** o **norte e centro interior** (Viana, Braga, Porto, Vila Real, Bragança, Viseu, Guarda, Aveiro, Coimbra, Castelo Branco), a Madeira e os Açores têm sobretudo **água macia**; **Leiria, Lisboa, Santarém, Setúbal, Portalegre, Évora** água **média a dura**; **Beja, Faro** e zona de Leiria/Lisboa com água **dura**.\n\n**Tabela 6 — Grau de dureza (concentração de CaCO₃)**\n\n| Grau de dureza | Concentração de CaCO₃ (mg/L) |\n|---|---|\n| **Macia** | 0 – 60 |\n| **Média** | 60 – 150 |\n| **Dura** | 150 – 300 |\n| **Muito dura** | > 300 |\n\n## Vantagens e desvantagens da água dura (pp. 98–99)\nQuando uma água dura é **aquecida**, pode formar-se um **precipitado de carbonato de cálcio (calcário)** e/ou de carbonato de magnésio, que danifica eletrodomésticos (ex.: resistências de máquinas de lavar, chuveiros) → reparações caras.\n\n| | Desvantagens | Vantagens |\n|---|---|---|\n| **Doméstico** | Faz **pouca espuma** com o sabão (dificulta a limpeza); **depósitos de calcário** em canos, máquinas de lavar, chaleiras, torneiras, chuveiros, banheiras; **sabor desagradável** | — |\n| **Industrial** | Calcário em tubagens e caldeiras → menor **eficiência e durabilidade**, **entupimento e rebentamento** de canalizações, **mais consumo de energia** → prejuízos | — |\n| **Saúde** | — | Fonte de **cálcio e magnésio** para o organismo |\n| **Aquático** | — | Diminui a disponibilidade de iões **chumbo, cádmio, crómio e zinco** (tóxicos) → favorece a vida aquática |\n\n## Como reduzir a dureza da água? (p. 99)\n| Doméstico | Industrial |\n|---|---|\n| Adicionar **produtos descalcificantes** nas máquinas de lavar roupa ou loiça. O calcário precipita sobretudo **acima de 55 °C** → programar as máquinas para **temperaturas de lavagem inferiores**. | Adicionar **óxido de cálcio (cal, CaO)** ou **carbonato de sódio (Na₂CO₃)**: reagem com a água dura e fazem **precipitar** os compostos de cálcio e magnésio, que depois são **removidos**. |\n\n:::key\nAs **águas duras** são ricas em **sais de cálcio e de magnésio**. Devido à **precipitação dos sais de cálcio**, têm desvantagens a nível doméstico e industrial. Pode diminuir-se a dureza, por exemplo, com **produtos descalcificantes**.\n:::\n\n:::warn\n**Cidadania consciente — Pedras a sair do ferro de engomar?** A água usada era **dura**; precipitou **carbonato de cálcio** (as \"pedras\"), o que diminui a eficiência e durabilidade do ferro e aumenta o consumo de energia. **Usa água destilada ou macia no ferro de engomar!**\n:::\n\n### Tarefa interdisciplinar (CN e Geografia) — Dureza da água (p. 100)\n\n:::faq\n**Como aparecem pedras nos rins?**\nO **cálculo renal** (pedra nos rins) é uma mistura de substâncias sólidas, algumas cristalinas — sobretudo **fosfato de cálcio (Ca₃(PO₄)₂)** ou **oxalato de cálcio (CaC₂O₄)**. Estes sais são excretados na urina mas são **pouco solúveis**: se a sua concentração aumenta acima do normal, **precipitam** e formam a pedra. Ao descer para a bexiga pelos ureteres provocam uma dor extrema — **cólica renal**. Prevenção: beber **pelo menos 1,5 L de água por dia**.\n:::\n\n## Tem (cons)ciência! — Dentária (p. 101)\n- **As gengivas sangrarem não é normal.** Causas: **placa bacteriana** (película invisível de bactérias entre os dentes e a gengiva) e **tártaro** → irritação e inflamação das gengivas (**gengivite**; mais avançada, **periodontite**).\n- **Tártaro:** placa sólida amarelada/acastanhada, sobretudo **fosfato de cálcio, Ca₃(PO₄)₂, um sal pouco solúvel em água**, que se deposita nos dentes e gengivas. Remove-se no dentista (**destartarização**: instrumentos manuais, ultrassons…).\n- **Escovar logo após comer?** Sim após as refeições, mas **evitar logo após alimentos ácidos** (citrinos, abacaxi, ketchup, sumos): a acidez torna o esmalte mais frágil à fricção. **Espera** que a saliva reestabeleça o **pH bucal**.\n- **Boa saúde oral:** escovar **2 vezes por dia, 2 minutos**, com pasta com **flúor**; **fio dentário** diário; evitar bebidas com gás e açucaradas; evitar açúcares; ir ao **dentista regularmente**.\n\n## Para resumir — Reações de precipitação (p. 102)\n- A **reação de precipitação** ocorre quando duas soluções aquosas de sais diferentes originam um **sólido** (pouco solúvel em água) chamado **precipitado**.\n- Esquema: **Sal 1 (aq) + Sal 2 (aq) → Sal 3 (s) + Sal 4 (aq)** (muito solúvel + muito solúvel → pouco solúvel/precipitado + muito solúvel).\n- **Na natureza:** estalactites/estalagmites, conchas e corais.\n- As **águas duras** são ricas em **sais de cálcio e magnésio**, que podem precipitar → **desvantagens** a nível doméstico e industrial → existem mecanismos para **diminuir a dureza** (ex.: produtos descalcificantes).\n\n## Investigo e comunico — De onde vem a pedra que se forma nos dentes? (p. 102)\nO **tártaro** resulta da deposição de sais de cálcio: **carbonato de cálcio** e **fosfato de cálcio e de magnésio**, entre outros."}, {"id": "20-espetro-sonoro", "title": "Som · Espetro sonoro (infografia)", "pages": "Som 1–2", "part": "Som", "md": "# Espetro sonoro\n\n**Escala de frequências (Hz):**\n- **Infrassons:** abaixo de **20 Hz** — inaudíveis para o ser humano; produzidos, por exemplo, em **terramotos**, **tempestades severas** e **erupções vulcânicas**.\n- **Sons audíveis pelo ser humano:** de **20 Hz** (sons muito **graves**) a **20 000 Hz** (sons muito **agudos**). O ser humano **produz** sons entre cerca de **85 e 1100 Hz**.\n- **Ultrassons:** acima de **20 000 Hz** — inaudíveis para o ser humano, mas úteis no **tratamento e diagnóstico** de algumas doenças.\n\n**Animais (sons ouvidos / produzidos, valores aproximados da infografia):**\n\n| Animal | Ouve | Produz |\n|---|---|---|\n| **Ser humano** | 20 – 20 000 Hz | ≈ 85 – 1100 Hz |\n| **Cães** | ≈ 40 – 40 000 Hz (ouvem **ultrassons**, não infrassons) | ≈ 450 – 1100 Hz |\n| **Gatos** | ≈ 60 – 65 000 Hz | ≈ 760 – 1520 Hz |\n| **Cetáceos** (golfinhos, baleias) | ≈ 150 – 150 000 Hz (a **maior gama**) | ≈ 7000 – 120 000 Hz |\n| **Morcegos** | ≈ 1000 – 120 000 Hz (ouvem mal sons **graves**) | ≈ 10 000 – 120 000 Hz (alguns audíveis, a maioria ultrassons) |\n\n*(Valores lidos na infografia do verso da capa.)*\n\n## O ouvido humano\n| N.º | Estrutura | Função |\n|---|---|---|\n| 1 | **Cavidade nasal** | — |\n| 2 | **Trompa de Eustáquio** | Faz a ligação com o nariz e **mantém a pressão constante** |\n| 3 | **Pavilhão auricular** (orelha) | Ouvido externo |\n| 4 | **Canal auditivo** | **Capta e encaminha** as vibrações até ao tímpano |\n| 5 | **Tímpano** | **Amplifica** as vibrações e transmite-as aos ossos mais pequenos do corpo |\n| 6 | **Martelo, bigorna e estribo** | **Vibram com a mesma frequência do tímpano** (ouvido médio) |\n| 7 | **Cóclea** | Tem células sensíveis às vibrações que transmitem a informação ao cérebro, pelo nervo auditivo, por **impulsos elétricos** (ouvido interno) |\n| 8 | **Nervo auditivo** | **Descodifica** as informações da cóclea, sob a forma de impulsos elétricos |\n\n- **Ouvido externo:** pavilhão auricular + canal auditivo. **Ouvido médio:** tímpano, martelo, bigorna, estribo (e trompa de Eustáquio). **Ouvido interno:** cóclea e nervo auditivo."}, {"id": "21-ondas-producao-som", "title": "1.1 Ondas e produção do som", "pages": "Som 8–15", "part": "Som", "md": "# Produção e propagação do som e outras ondas\n\n## Um caso português — A guitarra portuguesa (p. 8)\n- Instrumento de **cordas** tradicional português, com um **timbre** inconfundível.\n- Três tipos, distinguidos pela **cabeça**: **Coimbra** (lágrima incrustada), **Lisboa** (caracol) e **Porto** (dragão ou flor esculpidos). Todas têm **12 cordas metálicas**.\n- Não se limita ao fado: a banda **Expresso Transatlântico** integra **Gaspar Varela** (17 anos), bisneto de Celeste Rodrigues e sobrinho-bisneto de Amália Rodrigues, que já acompanhou Madonna. Música sugerida: \"Azul Celeste\".\n\n:::faq\n**Porque é que a voz dos rapazes muda durante a adolescência?** *(resposta na secção 1.3, p. 23)*\n:::\n\n## Ondas (p. 9)\n- Uma **onda transporta energia**; pode ter efeitos catastróficos, como as **ondas sísmicas** de sismos com magnitude ≥ 7 na **Escala de Richter**.\n\n:::note\n**Escala de Richter:** escala de medida da **intensidade sísmica**, usada para avaliar a **energia libertada no foco** de um sismo.\n:::\n\n:::warn\n**Cidadania consciente — O que fazer num sismo?** Dentro de um edifício: abriga-te no **vão de uma porta interior**, num **canto** da sala ou **debaixo de uma mesa ou cama**. Na rua: vai para um **local aberto**, longe do mar ou de cursos de água. **Não entres em pânico; mantém a calma!**\n:::\n\n### Atividade prática 1 (em estações) — O que desencadeia uma onda? (pp. 9–10)\n- **Estação 1:** gota de água numa tina; simulação PhET *Ondas: Introdução* (\"Água\") — variar a amplitude.\n- **Estação 2:** corda de ~3 m; um segura, o outro faz oscilar para cima e para baixo; depois com um movimento **mais amplo** do braço.\n- **Estação 3:** mola sobre a bancada; empurrar uma vez a partir de uma extremidade; depois comprimir a partir do centro.\n\n## Como se forma uma onda? (p. 11)\nÉ preciso uma **perturbação** no meio que provoque uma **variação repetida num intervalo de tempo** — uma **vibração**. Uma onda que precisa de um **meio** para se propagar é uma **onda mecânica**.\n\n:::note\n**Propagar** = difundir ou movimentar.\n:::\n\n| Onda | Como se forma | Vibração vs. propagação |\n|---|---|---|\n| **Na água** | A gota faz baixar e subir o nível da água → vibração que se desloca pela superfície | Vibração **vertical**, propagação **horizontal** |\n| **Numa corda** | Vibração criada numa zona da corda | Vibração perpendicular à propagação |\n| **Sísmica** | Vibração do movimento das **placas tectónicas** | Algumas na **mesma direção**, outras **perpendiculares** |\n| **Numa mola** | Empurrar a mola horizontalmente | **Mesma direção** |\n\n:::key\nUma **onda** tem **origem numa vibração** e resulta da **propagação dessa vibração**. Nem sempre as direções da vibração e da propagação são iguais.\n:::\n\n## Há transporte de corpúsculos? (pp. 11–12)\nNuma corda, quando a vibração chega ao **ponto P**, ele **sobe e desce** (move-se só na **vertical**) e depois **volta à posição de equilíbrio**. A corda não se desloca horizontalmente: o que se transfere horizontalmente é a **energia da vibração**. Na tina, a gota também não viaja até às paredes; é a energia que passa às porções de água seguintes.\n\n:::key\nDurante a propagação de uma vibração (numa onda) **há transferência de energia** entre as porções do meio que vibram, mas **não há transferência de corpúsculos do meio**.\n:::\n\n## Sentidos e direções de propagação (p. 12)\n- **Mola comprimida no centro:** a vibração propaga-se **nos dois sentidos**, para as duas extremidades.\n- **Gota na água:** propaga-se **em todas as direções** do plano horizontal, até às paredes da tina.\n\n## Amplitude de uma onda (p. 12)\nVariando a **intensidade da vibração**, forma-se uma onda com **maior ou menor afastamento em relação à posição de equilíbrio** — maior ou menor **amplitude (A)**.\n\n## Produção do som (pp. 13–15)\nOs sons rodeiam-nos (natureza, trânsito, voz, música). Já na antiguidade se faziam instrumentos com osso e marfim — ex.: **flauta feita num osso de asa de abutre, há cerca de 35 000 anos**.\n\n### Fontes sonoras (p. 14)\nPara haver som é necessária uma **vibração**. Os corpos que, ao vibrarem, emitem sons são **fontes sonoras**.\n\n| Fonte sonora | O que vibra |\n|---|---|\n| **Instrumentos de corda** (viola d'arco, piano) | As **cordas**, postas a vibrar pelos dedos, arco ou martelo (piano) |\n| **Instrumentos de sopro** (saxofone) | O **ar** dentro do instrumento, posto a vibrar pelo ar soprado |\n| **Instrumentos de percussão** (bateria) | A **madeira, metal ou pele**, postos a vibrar pelas mãos ou baquetas |\n| **Voz** (falar, rir) | As **cordas vocais**, quando o ar dos pulmões passa por elas sob pressão |\n| **Fogo de artifício** | A **expansão brusca de gases** cria ondas de choque (som de explosão) |\n| **Brinde** | Os **copos** chocam e o vidro vibra |\n| **Bater palmas** | A **pele e a estrutura da mão** vibram (\"clap!\") |\n\nQualquer corpo pode ser fonte sonora, desde que vibre e dessa vibração resulte um som.\n\n:::key\nO **som** é produzido pela **vibração de um corpo**. Uma **fonte sonora** é qualquer **corpo que vibra e produz um som**.\n:::\n\n## Propagação do som (p. 15)\nAo percutir um **diapasão**, ele vibra e transmite a vibração ao **ar** que o rodeia; essa porção de ar comunica a vibração à porção seguinte, e assim sucessivamente. A propagação dá-se por **transferência da energia da vibração**, **sem transferência dos corpúsculos** do ar.\n- Formam-se **zonas mais densas** (mais corpúsculos por unidade de volume) — **zonas de compressão**;\n- e **zonas menos densas** (menos corpúsculos por unidade de volume) — **zonas de rarefação**.\n- Tal como numa mola com espiras alternadamente comprimidas e distendidas, o som propaga-se por **sucessivas compressões e rarefações** do meio.\n\n:::key\nO som tem origem numa **vibração** e resulta da **propagação** dessa vibração. A fonte sonora transmite a vibração ao meio envolvente **sem haver transferência dos corpúsculos** do meio no sentido da propagação.\n:::"}, {"id": "22-onda-sonora", "title": "1.2 Onda sonora — amplitude, período e frequência", "pages": "Som 16–19", "part": "Som", "md": "# Onda sonora\n\n## Como se representa a propagação de um som? (p. 16)\nUm som não se vê, só se ouve. Para o estudar usa-se o conceito de **onda sonora**. As ondas sonoras propagam-se **simultaneamente nas três direções do espaço** (propagação **tridimensional**, em esfera, a partir da fonte).\n\n## O som como onda de pressão (pp. 16–17)\nA vibração da fonte sonora é comunicada ao meio. Numa mesma região do espaço ocorre, alternadamente:\n- a **aproximação dos corpúsculos** → zonas mais densas = **zonas de compressão**, onde a **pressão do ar é maior** do que a pressão atmosférica;\n- o **afastamento dos corpúsculos** → zonas menos densas = **zonas de rarefação**, onde a **pressão do ar é menor** do que a pressão atmosférica.\n\nUm ponto **A** do meio alterna periodicamente entre compressão e rarefação:\n- sem som → pressão em A = **pressão de equilíbrio**;\n- compressão → pressão em A **maior**;\n- rarefação → pressão em A **menor**.\n\n:::key\nA propagação da vibração de uma fonte sonora origina alternadamente zonas de **maior pressão** e de **menor pressão** — o som é uma **onda de pressão**.\n:::\n\n:::note\n**Pressão de equilíbrio:** pressão do meio **na ausência de ondas sonoras**.\n:::\n\nO gráfico **pressão (Pa) em função do tempo (s)** num ponto tem a forma de uma **curva sinusoidal**: os **picos** (p máxima) são **compressões** e os **vales** (p mínima) são **rarefações**; a linha do meio é a **p de equilíbrio**.\n\n## Características de uma onda sonora (pp. 17–19)\n\n### Amplitude (A)\nA **amplitude da pressão (A)** é a **diferença máxima entre a pressão num ponto e a pressão de equilíbrio**. A **pressão (p)** tem como unidade SI o **pascal (Pa)**.\n- **A = p máxima − p equilíbrio** ⟺ **A = p equilíbrio − p mínima**\n- Nos instantes de maior diferença: compressões = pressão **máxima**; rarefações = pressão **mínima**.\n- Duas ondas com amplitudes diferentes: a de **maior amplitude** tem picos mais altos (no livro, A₁ > A₂).\n\n:::note\n**Comprimento de onda (λ, lambda):** distância entre **dois pontos consecutivos de pressão máxima** (ou de pressão mínima). Unidade SI: **metro (m)**.\n:::\n\n### Período (T)\nO **período (T)** é o **tempo entre dois pontos consecutivos de pressão máxima** (ou mínima) — o **tempo de uma vibração completa**. Unidade SI: **segundo (s)**.\n- Figura 14: onda A com **T = 4 s**; onda B com **T = 2 s**.\n\n### Frequência (f)\nA **frequência (f)** é o **número de vibrações completas por unidade de tempo**. Unidade SI: **hertz (Hz)** (em homenagem ao físico alemão **Heinrich Hertz**).\n\n**f = n.º de vibrações ÷ Δt**  (f em Hz; Δt em s)\n\nComo uma vibração completa demora um período: **f = 1 / T**\n\n| Situação A | Situação B |\n|---|---|\n| f = 1/T = 1/4 = **0,25 Hz** | f = 1/T = 1/2 = **0,50 Hz** |\n\n:::key\n- **Amplitude da pressão (A):** diferença máxima entre a pressão num ponto e a de equilíbrio — unidade SI **pascal (Pa)**.\n- **Período (T):** tempo de uma vibração completa — unidade SI **segundo (s)**.\n- **Frequência (f):** n.º de vibrações por segundo — unidade SI **hertz (Hz)**.\n- **T e f são inversamente proporcionais:** quanto **maior a frequência, menor o período**, e vice-versa. **f = 1/T** e **T = 1/f**.\n:::\n\n### Exercício resolvido — período e frequência (p. 19)\n:::steps\n**1.º passo — período (T)**\n- **Onda 1:** uma vibração em **1 × 10⁻³ s** → **T = 1 × 10⁻³ s**.\n- **Onda 2:** 4 vibrações em 8 × 10⁻³ s → 4/(8 × 10⁻³) = 1/T ⟺ T = (1 × 8 × 10⁻³)/4 → **T = 2 × 10⁻³ s**.\n- **Onda 3:** uma vibração em **2 × 10⁻³ s** → **T = 2 × 10⁻³ s**.\n\n**2.º passo — frequência (f = 1/T)**\n- **Onda 1:** f = 1/(1 × 10⁻³) = **1000 Hz**\n- **Onda 2:** f = 1/(2 × 10⁻³) = **500 Hz**\n- **Onda 3:** f = 1/(2 × 10⁻³) = **500 Hz**\n:::\n\n:::tip\n**Ler T num gráfico:** conta quantas vibrações completas (pico a pico) cabem num intervalo de tempo e divide: **T = Δt ÷ n.º de vibrações**. Cuidado com as unidades do eixo (ex.: \"× 10⁻³ s\" = milissegundos).\n:::"}, {"id": "23-propagacao-velocidade-som", "title": "1.3 Propagação do som em diferentes meios e velocidade do som", "pages": "Som 20–23", "part": "Som", "md": "# Propagação e velocidade do som\n\nPara \"ver\" ondas sonoras usam-se tecnologias que **convertem sons em sinais elétricos** (ex.: osciloscópio, aplicações de telemóvel).\n\n### Atividade prática 3 — Frequência e período do som de um diapasão (p. 20)\nCom a app **phyphox** (*physical phone experiments*), opção osciloscópio de som: percutir um diapasão junto ao telemóvel, pausar e analisar o gráfico.\n:::note\n**1 ms** (milissegundo) = 1/1000 s = **1 × 10⁻³ s**.\n:::\n\n## Propagação do som em diferentes meios (pp. 20–21)\n\n### Atividade prática 4 — O som propaga-se entre Vénus e a Terra? (p. 20)\nMaterial: **despertador (ou rádio)**, **campânula de vidro**, **bomba de vácuo**. Põe-se o despertador a tocar dentro da campânula e liga-se a bomba de vácuo.\n\n- No **vácuo** (vazio) **não há corpúsculos** → **não há meio material** → o som **não se propaga**.\n- Nos meios **sólido, líquido e gasoso** há corpúsculos para transmitir a vibração → o som propaga-se.\n- Exemplos (figura 15): no **crânio** (sólido), no **líquido amniótico** (líquido), no **ar** (gasoso).\n\n:::key\nO som **propaga-se** nos sólidos, nos líquidos e nos gases, mas **não se propaga no vazio** (ausência de corpúsculos).\nAs ondas sonoras são **ondas mecânicas** — necessitam de um **meio material** para se propagarem.\n:::\n\n## Velocidade de propagação do som (pp. 21–23)\n\n**v_som = d / Δt**  (velocidade = distância percorrida pelo som ÷ intervalo de tempo)\n\n- Unidade **SI: metro por segundo (m/s)** (d em m, Δt em s). Também se usa **km/s**.\n- A velocidade depende das **características físicas do meio** (ex.: no ar é diferente da água).\n\n### Atividade prática 5 — Em que estado físico o som se propaga mais rapidamente? (p. 22)\nDuas filas de dominós com um balão no fim: **A** (peças muito juntas) e **B** (peças afastadas). Empurra-se a primeira peça de cada uma ao mesmo tempo.\n\n:::note\nA velocidade de um som **não depende da energia** transferida pela fonte sonora: quer sussurres quer grites, o som viaja com a **mesma velocidade**. Depende **só das características do meio**.\n:::\n\n- A **proximidade entre os corpúsculos** influencia a velocidade: nos **sólidos** os corpúsculos estão mais próximos (mais corpúsculos por unidade de volume) e a vibração é transmitida mais facilmente.\n\n:::key\nDe uma forma geral: **v_som (sólidos) > v_som (líquidos) > v_som (gases)**\n:::\n\n:::note\n**No ar**, para qualquer frequência, a velocidade do som depende das **condições atmosféricas**, nomeadamente da **temperatura** e da **humidade**.\n:::\n\n**Tabela 1 — Velocidade do som em alguns meios (m/s)** *(Irving P. Herman, Physics of the Human Body, 2016)*\n\n| Meio | v (m/s) | Meio | v (m/s) |\n|---|---|---|---|\n| Dióxido de carbono (0 °C) | 259 | Ferro (20 °C) | 5130 |\n| Ar (0 °C) | 331 | Diamante | 18 000 |\n| **Ar (20 °C)** | **343** | **Pulmão** | 630 |\n| Ar (30 °C) | 349 | **Tecidos moles*** | 1540 |\n| Álcool etílico (20 °C) | 1180 | **Sangue** | 1570 |\n| **Água (20 °C)** | **1482** | **Músculo** | 1580 |\n| Água do mar (20 °C) | 1522 | **Gordura** | 1450 |\n| Cobre (20 °C) | 3750 | **Osso** | 3500 |\n\n\\*Tecidos moles: pele, rins, fígado e cérebro. (Os 6 últimos são **tecidos humanos** — importantes para o diagnóstico médico.)\n\n:::tip\nNo ar, a velocidade **aumenta com a temperatura** (331 → 343 → 349 m/s de 0 °C a 30 °C).\n:::\n\n:::key\n**\"A velocidade do som no ar é 343 m/s\"** significa que, **em cada segundo**, o som percorre **343 metros** no ar.\n:::\n\n:::steps\n**Exemplo de cálculo (não está no livro, para treinar)**\nVês um relâmpago e ouves o trovão **3 s** depois. A que distância caiu? (ar a 20 °C)\nv = d/Δt ⟺ d = v × Δt = 343 × 3 = **1029 m ≈ 1 km**.\n:::\n\n:::faq\n**Porque é que a voz dos rapazes muda durante a adolescência?**\nAs cordas vocais, com a passagem do ar, vibram e produzem a voz. Na adolescência, as cordas vocais dos rapazes **aumentam 4 a 8 mm**, chegando, na fase adulta, a **17–21 mm**. Com isso, a **frequência** dos sons produzidos **desce cerca de 100 Hz** — a voz fica bastante **mais grave**. Nas mulheres as cordas vocais também crescem, mas menos, por isso a voz muda menos.\n**Frequência da voz humana:** crianças ≈ 250–350 Hz (mais aguda); mulheres ≈ 150–250 Hz; homens ≈ 50–150 Hz (mais grave).\n:::\n\n## Para resumir — Som (cap. 1) (p. 24)\n- O som propaga-se por meio de **ondas**: resulta da **propagação de uma vibração**.\n- Durante a propagação **há transferência de energia**, mas **não há transferência dos corpúsculos** no sentido da propagação.\n- **Fontes sonoras:** corpos que **vibram** e dão origem ao som.\n- As ondas sonoras **necessitam de um meio** e **não se propagam no vácuo**.\n- O som é uma **onda de pressão**: zonas de alta pressão (**compressão**) e de baixa pressão (**rarefação**).\n- **Período (T):** tempo de uma vibração completa — unidade SI **segundo (s)**.\n- **Frequência (f):** n.º de vibrações por unidade de tempo — **Hz**.\n- **T e f são inversamente proporcionais.**\n- **v_som = d/Δt** (m/s). De uma forma geral, **v_som (sólidos) > v_som (líquidos) > v_som (gases)**."}, {"id": "24-atributos-som", "title": "2.1 Atributos do som — intensidade, altura e timbre", "pages": "Som 28–37", "part": "Som", "md": "# Atributos do som\n\n## Um caso português — Ultrassons em dispositivos médicos (p. 28)\n- A empresa que mais **batas** forneceu ao Ministério da Saúde durante a pandemia de Covid-19 tem fábricas em **Felgueiras** e **Baião** (e uma na Ucrânia); exporta dispositivos médicos de uso único (batas cirúrgicas, fatos de bloco, campos operatórios) para cerca de **30 países**.\n- Esteriliza os dispositivos com **óxido de etileno (C₂H₄O)**.\n- Usa **ultrassons** para **cortar e selar (unir)** as matérias-primas, com um desenho técnico **patenteado** — aumenta a **resistência e a impermeabilidade**, melhorando o controlo de infeções.\n- **Portugal está na vanguarda** da inovação dos dispositivos médicos de uso único (descartáveis).\n\n:::note\n**Patente:** direito de explorar comercialmente, de forma **exclusiva**, uma invenção durante um determinado período.\n:::\n\n:::faq\n**Porque é que se leiloam violinos por milhões de euros?** *(resposta na p. 37, no fim desta secção)*\n:::\n\nOs sons distinguem-se pelos seus **atributos**: **intensidade**, **altura** e **timbre**.\n\n## Intensidade do som (pp. 29–31)\n\n### Atividade prática 6 — Diapasão percutido com intensidades diferentes (p. 29)\n\n- A intensidade está associada à **energia** produzida pela fonte sonora e transportada pela onda. Quanto **maior a energia** transferida para os corpúsculos do meio, **maior a amplitude** e **mais intenso** o som.\n- **A intensidade depende da amplitude da onda sonora.** Distingue **sons fortes** de **sons fracos**.\n\n| Diapasão percutido com… | Amplitude | Som |\n|---|---|---|\n| **Maior vigor** | **Maior** | **Forte** (mais intenso) |\n| **Menor vigor** | **Menor** | **Fraco** (menos intenso) |\n\n:::key\nA **intensidade do som** no ar relaciona-se com a **amplitude da onda de pressão**. Permite distinguir **sons fracos** (menos intensos) de **sons fortes** (mais intensos).\n:::\n\n:::note\n**Termos musicais:** *piano* e *pianíssimo* = sons **pouco intensos**; *forte* e *fortíssimo* = sons **muito intensos**.\n:::\n\n- **Flauta:** soprar com **mais vigor** → som mais forte (SOL *forte*); com menos vigor → SOL *piano*.\n- **Guitarra / cordas:** a corda tem de **vibrar com mais vigor** (puxada com mais força) para um som mais forte.\n- Em ambos os casos, a amplitude é **maior em B** (forte) do que em A (piano).\n\n### Porque se ouve pior um som ao longe? (p. 31)\nÀ medida que o som se propaga, a vibração é **distribuída por mais corpúsculos**, em todas as direções → **menos energia por corpúsculo** → **menor amplitude** → som mais fraco, mais difícil de ouvir (A₁ > A₂ > A₃ > A₄ com a distância).\n\n:::key\nÀ medida que a onda sonora se propaga e se **afasta da fonte sonora**, a sua **amplitude de pressão diminui**: o som torna-se **menos intenso**.\n:::\n\n## Altura do som (pp. 32–35)\n\n### Atividade prática 7 — Diapasões de hastes de diferentes comprimentos (p. 32)\n\n- A **altura** está relacionada com a **frequência** da onda sonora: distingue **sons agudos (altos)** de **sons graves (baixos)**.\n\n| Diapasão | Frequência | Som |\n|---|---|---|\n| Hastes **mais curtas** | **Maior** | **Agudo** (alto) |\n| Hastes **mais compridas** | **Menor** | **Grave** (baixo) |\n\n- **Som puro:** onda sonora de **uma só frequência** (ex.: o som de um **diapasão**).\n- **Som complexo:** **sobreposição** de sons com diferentes frequências (a maioria dos instrumentos).\n\n:::key\nA **altura do som** está relacionada com a **frequência** da onda sonora. Permite distinguir **sons graves (baixos)** de **sons agudos (altos)**. Os sons **graves** têm **baixas frequências**; os **agudos** têm **altas frequências**.\n:::\n\n:::warn\n**Cuidado com a palavra \"alto\"!** Em física, um som **alto** é um som **agudo** (frequência elevada), **não** um som forte. \"Fala mais alto\" no dia a dia quer dizer \"mais intenso\" — em física diz-se \"**mais forte**\".\n:::\n\n### Instrumentos de sopro (p. 34)\nNa **flauta de bisel**, a frequência depende dos **orifícios tapados**. Ao **destapar orifícios**, a **coluna de ar que vibra diminui** e o som fica **mais agudo**.\n- **DÓ: f = 261 Hz** (mais orifícios tapados — mais grave) · **SOL: f = 396 Hz** (mais agudo).\n\n### Instrumentos de percussão (p. 34)\nNo **metalofone**, a frequência depende da **lâmina** que vibra. Para lâminas de igual espessura e material, **quanto menor o comprimento, mais agudo** o som.\n- **RÉ: f = 293 Hz** (lâmina mais comprida — mais grave) · **MI: f = 329,6 Hz** (mais curta — mais agudo).\n\n### Instrumentos de cordas (p. 35)\nNa **guitarra**, a frequência depende de:\n\n| Fator | Regra |\n|---|---|\n| **Comprimento** da corda que vibra | Mesma espessura e material: **menor comprimento → mais agudo** (maior frequência) |\n| **Material** (nylon, níquel, aço…) e **espessura** | Mesmo material: **mais espessa → mais grave** (menor frequência) |\n| **Tensão** da corda | **Mais tensa (esticada) → mais agudo** (maior frequência) |\n\n- Um instrumento **desafinado** produz um som sem a frequência desejada. Para afinar rodam-se as **cravelhas**:\n  - **esticando** a corda → som mais **alto** (maior frequência);\n  - **soltando** a corda → som mais **baixo** (menor frequência).\n- Para afinar pode usar-se um **diapasão**, outro instrumento afinado ou um **programa informático** (há afinadores gratuitos online).\n\n## Timbre do som (pp. 36–37)\nDe olhos fechados consegues identificar as fontes sonoras (ex.: a voz de um colega), porque **cada fonte sonora produz sons com um determinado timbre**.\n- O **timbre** permite distinguir sons com **intensidade e altura iguais** mas de **fontes diferentes** (ex.: um **dó** tocado numa flauta ou num piano).\n- **Figura 10 — a nota LÁ** (mesma frequência e amplitude) em três instrumentos:\n  - **Diapasão** → onda sinusoidal simples — **som puro**;\n  - **Flauta transversal** → **som complexo**;\n  - **Violino** → **som complexo**.\n  O **período é o mesmo**, mas as **formas das ondas são diferentes** → **timbres diferentes**.\n- Alguns instrumentos, pelos **materiais**, **técnicas** ou **tratamentos** usados na construção, têm um timbre **inigualável**.\n\n### O que permite identificar uma pessoa pela voz? (p. 37)\nTal como as **impressões digitais**, a voz é uma característica **individual**: cada pessoa tem um **timbre próprio**. Os gráficos de três pessoas a dizer \"a\" prolongado têm **formas diferentes**. Há vozes semelhantes (ex.: na mesma família), mas **nunca exatamente iguais**.\n\n:::key\nO **timbre** é a característica do som que permite **distinguir sons com igual altura e intensidade, produzidos por fontes diferentes**.\n:::\n\n:::faq\n**Porque é que se leiloam violinos por milhões de euros?**\nOs violinos são feitos **à mão** por artesãos (***luthiers***); cada passo, da escolha da madeira ao envernizamento, exige muita arte e pode demorar **meses**. **Antonio Stradivari** (1644–1737) e **Giuseppe Guarneri** (1698–1744), italianos, destacaram-se: os violinos **Stradivarius** e **Guarneri** são sinónimo de **excelência e timbre únicos**. Hipóteses para o segredo: **densidade da madeira**, **tratamento químico** contra larvas, **verniz**. Nunca foram copiados com sucesso — os raros exemplares são **leiloados por milhões de euros**.\n:::\n\n## Para resumir — Atributos do som (p. 38)\n\n| Atributo | Classifica os sons em… | Grandeza da onda |\n|---|---|---|\n| **Intensidade** | **fracos** (pouco intensos) / **fortes** (muito intensos) | **Amplitude**: som mais intenso → **maior amplitude** |\n| **Altura** | **altos (agudos)** / **baixos (graves)** | **Frequência**: som mais agudo → **maior frequência** |\n| **Timbre** | distingue **fontes sonoras diferentes** (mesma intensidade e altura) | **Forma da onda** (som puro vs. som complexo) |\n\n:::tip\n**Truque de memória:** **I**ntensidade ↔ **A**mplitude (forte/fraco) · **A**ltura ↔ **F**requência (agudo/grave) · **T**imbre ↔ forma da onda (quem toca).\n:::\n\n## Investigo e comunico — A voz humana no canto (p. 38)\n\n| Femininas | Frequência | Masculinas | Frequência |\n|---|---|---|---|\n| **Soprano** | 196 – 1397 Hz | **Tenor** | 110 – 659 Hz |\n| **Mezzo soprano** | 196 – 880 Hz | **Barítono** | 87 – 392 Hz |\n| **Contralto** | 165 – 660 Hz | **Baixo** | 62 – 294 Hz |"}, {"id": "25-detecao-som-audiogramas", "title": "2.2 Deteção do som pelo ser humano, espetro sonoro e audiogramas", "pages": "Som 40–43", "part": "Som", "md": "# Deteção do som pelo ser humano\n\n:::faq\n**Para que servem as barreiras que se veem ao longo das autoestradas?** *(resposta na p. 46, secção 2.3)*\n:::\n\n## Espetro sonoro (pp. 40–41)\nPara ouvirmos um som é preciso: uma **fonte sonora** (corpo que vibra), um **meio** de propagação (ar, água, rochas…) e que as vibrações cheguem ao **pavilhão auricular** e atravessem o ouvido (**externo, médio e interno**) até ao **cérebro**.\n\nMesmo com fonte e meio, há sons **inaudíveis** para um ouvido humano saudável.\n\n- **Espetro sonoro:** conjunto de **todas as vibrações** produzidas por fontes sonoras.\n- O ser humano só ouve sons com frequência entre **20 Hz e 20 000 Hz (20 kHz)** — os **sons audíveis**.\n\n| Zona | Frequência | O ser humano… |\n|---|---|---|\n| **Infrassons** | **< 20 Hz** (vibração muito baixa) | **não ouve** |\n| **Sons audíveis** | **20 Hz – 20 000 Hz** | **ouve** |\n| **Ultrassons** | **> 20 000 Hz** (vibração muito alta) | **não ouve** |\n\n- Nem todos os animais ouvem a mesma gama: o **cão** também ouve **ultrassons (20 000 – 40 000 Hz)**.\n\n:::key\nOs sons **audíveis** pelo ser humano estão entre **20 Hz e 20 000 Hz (20 kHz)**. Os sons inaudíveis estão **abaixo de 20 Hz (infrassons)** e **acima de 20 000 Hz (ultrassons)**.\n:::\n\n### Aplicações dos ultrassons (figura 13, p. 41)\n| Área | Aplicação |\n|---|---|\n| **Medicina** | **Ultrassonografia (ecografia):** imagens de estruturas e órgãos internos para diagnóstico; imagens do **feto** durante a gestação |\n| **Fisioterapia** | Lesões dos tecidos moles: promovem o **relaxamento dos músculos** e a melhoria da **circulação sanguínea** |\n| **Medicina dentária** | **Remoção de tártaro** e higienização de instrumentos |\n| **Indústria / laboratório** | **Sistemas de limpeza** (boa higienização com menos produtos de limpeza) |\n| **Indús
