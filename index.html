.\n:::\n:::q Ficha 1 · 1.3 · V ou F? A. O Sistema Solar é constituído por oito planetas principais. B. A Terra é um planeta gasoso formado por uma crosta sólida. C. Todos os planetas rochosos possuem atmosfera. D. A existência de água no estado líquido é comum a todos os planetas do Sistema Solar. E. A Terra é o único planeta que possui dioxigénio na sua atmosfera. F. Vénus apresenta uma temperatura média superficial mais elevada do que Mercúrio.\n?? A **V**; B **F**; C **F**; D **F**; E **V**; F **V**.\nTabela de apoio — distância ao Sol (milhões de km): Mercúrio 57,9 · Vénus 106 · Terra 150 · Marte 227. Massa (Terra = 1): 0,055 · 0,815 · 1 · 0,11. Temperatura média: 85 °C · 471 °C · 15 °C · −28 °C. Atmosfera: ausente · CO₂, N₂ · N₂, O₂ · CO₂, N₂. Água líquida: só a Terra.\n:::\n:::q Ficha 1 · 1.3.1 · Justifica a tua opção relativamente à afirmação F (Vénus mais quente do que Mercúrio).\n?? Vénus apresenta uma temperatura média superficial mais elevada, pois possui uma **atmosfera muito rica em dióxido de carbono**, um gás com **efeito de estufa** (Mercúrio, apesar de estar mais perto do Sol, não tem atmosfera).\n:::\n:::q Ficha 1 · 1.4 · Explica a ausência de atmosfera em Mercúrio e a sua presença na Terra.\n?? Ao contrário da Terra, Mercúrio não possui atmosfera porque a sua **massa não é capaz de gerar a força gravítica** necessária para **reter gases** ao seu redor.\n:::\n:::q Ficha 1 · 2.1 · Gráfico da evolução da atmosfera (4000 Ma → atualidade). Avalia: I. A temperatura da Terra manteve-se constante. II. A concentração de CO₂ atual é inferior à de há 3500 Ma. III. À medida que diminuiu o CO₂, aumentou a temperatura. IV. A atmosfera primitiva continha dioxigénio. (A) I e II V; III e IV F (B) I e II F; III e IV V (C) I, III e IV V; II F (D) I, III e IV F; II V\n?? **(D)** — só a II é verdadeira: a temperatura **diminuiu** com a diminuição do CO₂ e a atmosfera primitiva **não tinha O₂**.\n:::\n:::q Ficha 1 · 2.2 · Indica o processo que levou à libertação de dioxigénio para a atmosfera e à absorção de dióxido de carbono.\n?? A **fotossíntese**.\n:::\n:::q Ficha 1 · 2.3 · A acumulação de dioxigénio originou a camada de ozono. Explica a importância desta camada na colonização de ambientes terrestres.\n?? A camada de ozono é uma **barreira que impede a passagem da radiação ultravioleta** nociva aos seres vivos. Antes de existir, todos os seres vivos se encontravam **na água**. Após a sua formação, foi possível a evolução dos seres vivos para **ambientes terrestres**.\n:::\n:::q Ficha 1 · 2.4 · Sem o efeito de estufa, a temperatura média na Terra seria de −18 °C. Explica a importância do efeito de estufa para a vida.\n?? O efeito de estufa permite uma **temperatura amena** e a existência de **água no estado líquido**, favoráveis ao aparecimento e à manutenção da vida.\n:::\n:::q Ficha 1 · 2.5 · Refere uma consequência do aumento dos gases com efeito de estufa com origem nas atividades humanas.\n?? O **aumento da temperatura** do planeta (**aquecimento global**).\n:::"}, {"id": "91-caderno-dominio1-1", "title": "Ficha 2 · Subsistemas da Terra (pp. 7–8)", "pages": "Caderno pp. 4–17 · Soluções pp. 107–108", "part": "Caderno de atividades", "md": ":::q Ficha 2 · 1.1 · «A Terra é um sistema fechado constituído por quatro subsistemas que interagem entre si.» Justifica.\n?? A Terra é um **sistema fechado** porque troca **energia** com o exterior, mas **não troca matéria**. É constituída por quatro **subsistemas abertos** — atmosfera, hidrosfera, geosfera e biosfera — que interagem entre si, **trocando matéria e energia**.\n:::\n:::q Ficha 2 · 1.2 · V ou F? A. A criosfera faz parte da hidrosfera. B. Os subsistemas são fechados, dinâmicos e interdependentes. C. Os solos fazem parte da geosfera. D. A água doce na superfície da Terra representa 3 % da hidrosfera. E. A biosfera corresponde à camada gasosa que envolve a Terra. F. A alteração de um subsistema provoca a alteração de todos os outros.\n?? A **V**; B **F**; C **V**; D **F**; E **F**; F **V**.\n:::\n:::q Ficha 2 · 1.2.1 · Corrige as afirmações falsas (sem usar a negação).\n?? B. Os subsistemas são **abertos**, dinâmicos e interdependentes. D. A água doce na superfície da Terra representa apenas **1 %** da hidrosfera. E. A **atmosfera** corresponde à camada gasosa que envolve a Terra.\n:::\n:::q Ficha 2 · 2 · Completa a tabela de interações: A (vulcão: geosfera e atmosfera) · B (rio a transportar sedimentos) · C (folhas ao sol: biosfera e atmosfera) · D (raízes numa rocha) · E (exemplo de D).\n?? A. As **erupções vulcânicas libertam gases** para a atmosfera. B. **Hidrosfera e geosfera**. C. Na **fotossíntese**, as plantas absorvem CO₂ do ar e libertam dioxigénio. D. **Biosfera e geosfera**. E. Através das **raízes**, as plantas absorvem **água e sais minerais** do solo.\n:::\n:::q Ficha 2 · 3.1 · Ordena as imagens 1 a 4 (Fig. 1) para reconstituir a formação do solo.\n?? **1 – 4 – 3 – 2.**\n:::\n:::q Ficha 2 · 3.2 · Indica a imagem correspondente: A. O solo maduro suporta uma densa vegetação. B. A rocha-mãe começa a sofrer meteorização e erosão. C. Começam a distinguir-se camadas horizontais. D. A matéria orgânica facilita a desintegração da rocha-mãe.\n?? A **2**; B **1**; C **3**; D **4**.\n:::\n:::q Ficha 2 · 3.3 · Refere uma interação entre a geosfera e a hidrosfera que facilite a formação dos solos.\n?? A **água (hidrosfera)** provoca a **alteração da rocha-mãe (geosfera)**, formando sedimentos que irão originar o solo.\n:::\n:::q Ficha 2 · 3.4 · Explica a importância da formação do solo na existência de vida no meio terrestre.\n?? O solo contém **reservas de água e sais minerais** usados pelas plantas para produzir **matéria orgânica** e é o **habitat** de muitas espécies.\n:::\n:::q Ficha 2 · 4.1 · Fontes hidrotermais (água do mar infiltra-se, aquece em contacto com o magma e sobe com minerais). Indica os dois subsistemas que estão na sua origem.\n?? A **hidrosfera** e a **geosfera**.\n:::\n:::q Ficha 2 · 4.2 · As bactérias e os vermes que habitam junto às fontes hidrotermais fazem parte do subsistema (A) geosfera (B) hidrosfera (C) biosfera (D) atmosfera\n?? **(C) biosfera.**\n:::"}, {"id": "91-caderno-dominio1-2", "title": "Ficha 3 · Diversidade celular (pp. 12–13)", "pages": "Caderno pp. 4–17 · Soluções pp. 107–108", "part": "Caderno de atividades", "md": ":::q Ficha 3 · 1.1 · Faz a legenda do microscópio (MOC), 1 a 12.\n?? 1 **Ocular**; 2 **Tubo ou canhão**; 3 **Revólver**; 4 **Objetiva**; 5 **Braço ou coluna**; 6 **Platina**; 7 **Pinças**; 8 **Condensador/diafragma**; 9 **Fonte de luz**; 10 **Parafuso macrométrico**; 11 **Parafuso micrométrico**; 12 **Base ou pé**.\n:::\n:::q Ficha 3 · 1.2 · Faz corresponder o algarismo: A. Local onde se coloca a preparação. B. Permite uma focagem mais precisa. C. Suporta as objetivas. D. Permite a iluminação. E. Amplia a imagem fornecida pela objetiva.\n?? A **6** (platina); B **11** (micrométrico); C **3** (revólver); D **9** (fonte de luz); E **1** (ocular).\n:::\n:::q Ficha 3 · 1.3 · I. A observação inicia-se com a objetiva de menor ampliação. II. Após a utilização, guarda-se com a platina afastada da objetiva de maior ampliação colocada. III. Transporta-se com ambas as mãos, uma na base e outra na coluna. (A) I e III V; II F (B) II e III V; I F (C) III V; I e II F (D) todas V\n?? **(A)** — I e III verdadeiras; II falsa (guarda-se com a objetiva de **menor** ampliação).\n:::\n:::q Ficha 3 · 2.1 · Faz a legenda da Fig. 2 (A bactéria; B célula vegetal; C célula animal), 1 a 9.\n?? 1 **Membrana celular**; 2 **Cloroplasto**; 3 **Núcleo**; 4 **Parede celular**; 5 **Vacúolo**; 6 **Retículo endoplasmático**; 7 **Complexo de Golgi**; 8 **Citoplasma**; 9 **Mitocôndria**.\n:::\n:::q Ficha 3 · 2.2 · Comenta: «Todas as células representadas na figura são células eucarióticas.»\n?? É **falsa**: a célula **A não tem núcleo** — o material genético está disperso no citoplasma — por isso é uma célula **procariótica**.\n:::\n:::q Ficha 3 · 2.3 · V ou F? A. A célula A é menos complexa do que B e C. B. A célula C é procariótica. C. A célula B é eucariótica vegetal. D. A célula A pertence a um ser multicelular. E. A célula C não pode pertencer a um ser unicelular. F. Todas as células têm membrana celular e citoplasma.\n?? A **V**; B **F**; C **V**; D **F**; E **F**; F **V**.\n:::\n:::q Ficha 3 · 2.4 · Refere as principais diferenças entre as células B e C.\n?? A célula **B (eucariótica vegetal)** tem **cloroplastos, parede celular e um vacúolo de grandes dimensões**, o que não acontece na célula **C (eucariótica animal)**.\n:::\n:::q Ficha 3 · 3 · Crucigrama (palavra vertical CÉLULA): 1. Protege e confere rigidez a algumas células. 2. Controla toda a atividade da célula. 3. Produção de matéria orgânica por fotossíntese. 4. Delimita a célula e regula entradas e saídas. 5. Reservatório de água e outras substâncias. 6. Produção de energia pela respiração celular.\n?? 1 **Parede celular**; 2 **Núcleo**; 3 **Cloroplasto**; 4 **Membrana celular**; 5 **Vacúolo**; 6 **Mitocôndria**.\n:::\n:::q Ficha 3 · 4.1 · Identifica os níveis de organização: A (floresta com animais) B (tecido muscular) C (coração) D (grupo de veados) E (um veado) F (uma célula muscular).\n?? A **Comunidade**; B **Tecido**; C **Órgão**; D **População**; E **Organismo**; F **Célula**.\n:::\n:::q Ficha 3 · 4.2 · Ordena as imagens de A a F por nível **decrescente** de complexidade.\n?? **A – D – E – C – B – F** (comunidade → população → organismo → órgão → tecido → célula).\n:::"}, {"id": "91-caderno-dominio1-3", "title": "Ficha de Avaliação 1 (pp. 14–17)", "pages": "Caderno pp. 4–17 · Soluções pp. 107–108", "part": "Caderno de atividades", "md": "### Grupo I — a atmosfera primitiva e a atual\n:::q Avaliação 1 · Grupo I · 1 · A Terra é o ___ planeta a contar do Sol, sendo classificado como um planeta ___. (A) quarto…telúrico (B) quarto…gasoso (C) terceiro…telúrico (D) terceiro…gasoso\n?? **(C) terceiro … telúrico.**\n:::\n:::q Avaliação 1 · Grupo I · 2 · Gráficos A (atmosfera primitiva: dinitrogénio, dióxido de carbono, vapor de água, outros) e B (atual: dinitrogénio ~78 %, dioxigénio ~21 %, outros). Podemos afirmar que (A) na atmosfera primitiva existiam grandes concentrações de dioxigénio (B) a concentração de dinitrogénio aumentou ao longo do tempo geológico (C) os principais gases atuais são o dioxigénio e o dióxido de carbono (D) a concentração de vapor de água aumentou\n?? **(B).**\n:::\n:::q Avaliação 1 · Grupo I · 3 · O dioxigénio surgiu na atmosfera devido (A) à intensa atividade vulcânica (B) à reduzida atividade vulcânica (C) ao aparecimento dos primeiros seres aeróbios (D) ao aparecimento dos primeiros seres fotossintéticos\n?? **(D).**\n:::\n:::q Avaliação 1 · Grupo I · 4 · A colonização dos ambientes terrestres ocorreu devido ao aparecimento ___, que ___. (A) da camada de ozono…filtra a radiação UV nociva (B) da camada de ozono…permite temperatura amena (C) do efeito de estufa…filtra a UV (D) do efeito de estufa…temperatura amena\n?? **(A).**\n:::\n:::q Avaliação 1 · Grupo I · 5 · Ao longo do tempo geológico verificou-se ___ de gases com efeito de estufa, levando ___ da temperatura. (A) um aumento…à diminuição (B) um aumento…ao aumento (C) uma diminuição…à diminuição (D) uma diminuição…ao aumento\n?? **(C).**\n:::\n:::q Avaliação 1 · Grupo I · 6 · Indica duas condições que permitiram o aparecimento e desenvolvimento da vida, além da força gravítica que retém a atmosfera.\n?? Por exemplo, a existência de **água no estado líquido** e a existência de um **campo magnético** (também: distância ao Sol / temperatura amena, camada de ozono, efeito de estufa).\n:::\n:::q Avaliação 1 · Grupo I · 7 · Relaciona a diminuição da concentração de dióxido de carbono na atmosfera com a evolução dos seres vivos.\n?? Os **seres fotossintéticos absorvem dióxido de carbono** da atmosfera, logo o seu aparecimento contribuiu para a **diminuição** da concentração desse gás.\n:::\n### Grupo II — o solo (composição: matéria mineral 46 %, água ± 25 %, ar ± 25 %, matéria orgânica 4 %)\n:::q Avaliação 1 · Grupo II · 1 · Na Fig. 4, a camada 1 do solo corresponde ao horizonte ___, constituído por matéria ___ em decomposição. (A) O…orgânica (B) O…inorgânica (C) A…orgânica (D) A…inorgânica\n?? **(A).**\n:::\n:::q Avaliação 1 · Grupo II · 2 · As minhocas fazem parte do subsistema (A) atmosfera (B) geosfera (C) hidrosfera (D) biosfera\n?? **(D) biosfera.**\n:::\n:::q Avaliação 1 · Grupo II · 3 · As plantas, ao absorverem água do solo para produzir matéria orgânica, estabelecem uma interação com a (A) atmosfera (B) geosfera (C) hidrosfera (D) biosfera\n?? **(B) geosfera.**\n:::\n:::q Avaliação 1 · Grupo II · 4 · «A matéria mineral do solo resulta da alteração das rochas por ação de agentes de meteorização como a água da chuva.» Os subsistemas envolvidos são\n?? **(C) a hidrosfera e a geosfera.**\n:::\n:::q Avaliação 1 · Grupo II · 5 · I. O principal constituinte do solo é a matéria orgânica. II. A camada 2 corresponde ao horizonte B. III. A camada 4 corresponde ao horizonte C e é formada por partes fragmentadas da rocha-mãe. (A) I e II V; III F (B) I e II F; III V (C) todas V (D) todas F\n?? **(B)** — o principal constituinte é a **matéria mineral** e a camada 2 é o **horizonte A**.\n:::\n:::q Avaliação 1 · Grupo II · 6 · Para cada constituinte do solo, refere o subsistema que lhe deu origem.\n?? Matéria mineral – **geosfera**; matéria orgânica – **biosfera**; ar – **atmosfera**; água – **hidrosfera**.\n:::\n### Grupo III — a floresta temperada e as células (A vegetal, B animal)\n:::q Avaliação 1 · Grupo III · 1 · As células representadas são ___ pois ___. (A) eucarióticas…não têm núcleo (B) eucarióticas…apresentam núcleo (C) procarióticas…não têm núcleo (D) procarióticas…têm núcleo\n?? **(B).**\n:::\n:::q Avaliação 1 · Grupo III · 2 · Os castanheiros são seres ___, constituídos por células ___, representadas pela letra ___. (A) multicelulares…vegetais…A (B) multicelulares…vegetais…B (C) unicelulares…vegetais…A (D) multicelulares…animais…A\n?? **(A).**\n:::\n:::q Avaliação 1 · Grupo III · 3 · A célula B pode ser classificada como ___, pois ___. (A) vegetal…tem cloroplastos e parede (B) vegetal…não tem (C) animal…tem (D) animal…não apresenta cloroplastos e parede celular\n?? **(D).**\n:::\n:::q Avaliação 1 · Grupo III · 4 · As bactérias decompositoras do solo são ___, constituídas por células ___. (A) pluricelulares…procarióticas (B) unicelulares…eucarióticas (C) pluricelulares…eucarióticas (D) unicelulares…procarióticas\n?? **(D).**\n:::\n:::q Avaliação 1 · Grupo III · 5 · Faz corresponder termo (A Núcleo, B Cloroplasto, C Parede celular, D Mitocôndria, E Membrana celular, F Citoplasma), função (I energia; II delimita e regula; III fotossíntese; IV protege e dá forma; V controla as atividades; VI meio intracelular) e algarismo da Fig. 5.\n?? **A–V–1; B–III–2; C–IV–4; D–I–7; E–II–3; F–VI–6.**\n:::\n:::q Avaliação 1 · Grupo III · 6 · Comenta: «As células são a unidade básica estrutural e funcional de todos os seres vivos da floresta temperada.»\n?? A afirmação é **verdadeira**: todos os seres vivos são **constituídos por células**, onde ocorrem **todas as funções vitais** dos organismos.\n:::\n:::q Avaliação 1 · Grupo III · 7 · Ordena por ordem crescente de complexidade: A. Tecido pancreático B. Raposa C. Sistema digestivo D. Célula do pâncreas E. Pâncreas\n?? **D – A – E – C – B** (célula → tecido → órgão → sistema → organismo).\n:::\n:::q Avaliação 1 · Grupo III · 8 · A floresta temperada é um(a) A. ___ (seres de diferentes espécies que se relacionam entre si e com o ambiente). O conjunto de carvalhos da mesma espécie é uma B. ___. A C. ___ é o conjunto de carvalhos, castanheiros, javalis… em interação. A floresta e os restantes ecossistemas constituem a D. ___. (A: 1 ecossistema 2 comunidade 3 biosfera; B: 1 comunidade 2 população 3 organismo; C: 1 biosfera 2 comunidade 3 população; D: 1 população 2 ecossistema 3 biosfera)\n?? **A 1** (ecossistema); **B 2** (população); **C 2** (comunidade); **D 3** (biosfera).\n:::"}, {"id": "92-manual-dominio1-0", "title": "1.1 Vida na Terra — Responde (pp. 9–16)", "pages": "Manual pp. 8–45", "part": "Manual", "md": ":::q Manual · p. 9 · Responde 1 · Refere os planetas com temperatura média à superfície (a) mais baixa (b) mais alta.\n?? (a) **Neptuno** (−201 °C); (b) **Vénus** (471 °C). _(resolução própria)_\n:::\n:::q Manual · p. 9 · Responde 2 · Relaciona a temperatura média à superfície dos planetas com a respetiva distância ao Sol.\n?? De forma geral, **quanto maior a distância ao Sol, menor a temperatura média** (os planetas exteriores são muito frios). A exceção é **Vénus**, mais quente do que Mercúrio por causa do efeito de estufa. _(resolução própria)_\n:::\n:::q Manual · p. 9 · Responde 3 · Qual é o único planeta que apresenta água no estado líquido? Justifica.\n?? A **Terra**: está a uma **distância adequada do Sol** e tem uma atmosfera com efeito de estufa, por isso a temperatura é **amena (15 °C)** — nem tão quente que a água evapore, nem tão fria que congele. _(resolução própria)_\n:::\n:::q Manual · p. 9 · Responde 4 · Em que difere a atmosfera terrestre da dos restantes planetas?\n?? É a única constituída principalmente por **dinitrogénio e dioxigénio**; nos outros planetas predominam o dióxido de carbono (Vénus, Marte) ou o di-hidrogénio, hélio e metano (planetas gasosos), e Mercúrio nem tem atmosfera. _(resolução própria)_\n:::\n:::q Manual · p. 9 · Responde 5 · Procura explicar a temperatura média de Vénus ser tão elevada.\n?? Vénus tem uma atmosfera **muito rica em dióxido de carbono**, um gás com **efeito de estufa**, que retém grande parte do calor. _(resolução própria)_\n:::\n:::q Manual · p. 9 · Responde 6 · Por que razão a temperatura de Mercúrio é inferior à de Vénus?\n?? Porque Mercúrio **não tem atmosfera** (não tem massa suficiente para reter gases), logo não há efeito de estufa e o calor perde-se para o Espaço. _(resolução própria)_\n:::\n:::q Manual · p. 11 · Responde 1 · Refere duas características da Terra importantes para o aparecimento da vida.\n?? Por exemplo: **distância adequada ao Sol** e **água no estado líquido** (também: massa/força gravítica para fixar uma atmosfera, camada de ozono, efeito de estufa, temperatura amena ~15 °C, campo magnético). _(resolução própria)_\n:::\n:::q Manual · p. 11 · Responde 2 · Indica a percentagem da superfície da Terra coberta de água.\n?? Cerca de **71 %**.\n:::\n:::q Manual · p. 11 · Responde 3 · Qual é a importância da força gravítica?\n?? Permite **fixar (reter) a atmosfera** em torno da Terra. _(resolução própria)_\n:::\n:::q Manual · p. 12 · Responde 1 · O que entendes por camada de ozono?\n?? Camada da atmosfera constituída por cerca de **90 % de ozono (O₃)** que funciona como **barreira** contra os raios **ultravioleta B e C**. _(resolução própria)_\n:::\n:::q Manual · p. 12 · Responde 2 · Refere a importância desta camada.\n?? **Absorve** grande parte da radiação UV, que pode afetar a saúde humana (cancro de pele, problemas nos olhos) e o ambiente; permitiu a **colonização do meio terrestre**. _(resolução própria)_\n:::\n:::q Manual · p. 12 · Responde 3 · Que notícia alarmou os cientistas e qual foi a razão dessa preocupação?\n?? Estavam a ocorrer **emissões de CFC** vindas de duas províncias chinesas (Shandong e Hebei). Os CFC **destroem o ozono** e permanecem na atmosfera cerca de 50 anos, o que podia **atrasar a recuperação** da camada de ozono. _(resolução própria)_\n:::\n:::q Manual · p. 13 · Laboratório · Discussão: 1 variável dependente; 2 compara a temperatura final nos copos A e B; 3 explica; 4 prevê o que aconteceria se a caixa ficasse coberta mais tempo; 5 relaciona com o efeito de estufa.\n?? 1 A **temperatura da água**. 2 A água do copo **A** fica **mais quente** do que a do B. 3 A película aderente deixa passar a radiação mas **impede a saída do calor**, que fica retido na caixa. 4 A temperatura do copo A **continuaria a subir**. 5 A película faz o papel dos **gases com efeito de estufa**: quanto mais destes gases, mais calor fica retido e maior a temperatura (aquecimento global). _(resolução própria)_\n:::\n:::q Manual · p. 14 · Responde 1 · Descreve a constituição da atmosfera (1.1) primitiva (1.2) atual.\n?? 1.1 **Di-hidrogénio, metano, amoníaco, monóxido de carbono, dióxido de carbono e dinitrogénio** (+ vapor de água), **sem dioxigénio**. 1.2 **Dinitrogénio (78 %)** e **dioxigénio (21 %)**; outros (1 %): dióxido de carbono, vapor de água, metano e árgon.\n:::\n:::q Manual · p. 14 · Responde 2 · Que importância teve o aparecimento do dioxigénio na Terra?\n?? A acumulação de dioxigénio levou à formação da **camada de ozono**, que filtra a UV e permitiu a **colonização do meio terrestre**; o O₂ permitiu também a respiração dos seres aeróbios. _(resolução própria)_\n:::\n:::q Manual · p. 16 · Responde 1.1 · Refere a origem da atmosfera da Terra primitiva.\n?? Os gases resultaram da **intensa atividade vulcânica** e dos **impactos de meteoritos**, e fixaram-se por ação da **força gravítica** (há cerca de 4000 Ma).\n:::\n:::q Manual · p. 16 · Responde 1.2 · O dioxigénio surgiu na atmosfera devido (A) à atividade vulcânica (B) ao aparecimento das algas (C) à presença de bactérias fotossintéticas (D) às chuvas ácidas\n?? **(C)** — bactérias fotossintéticas (cianobactérias).\n:::\n:::q Manual · p. 16 · Responde 1.3 · Seleciona as verdadeiras e corrige as falsas: A. A luminosidade solar ao longo da História da Terra foi aumentando. B. A quantidade de CO₂ foi constante. C. A temperatura aumenta com o aumento da concentração de CO₂.\n?? A **verdadeira**. B **falsa** — a quantidade de dióxido de carbono **diminuiu** ao longo da História da Terra. C **verdadeira**. _(resolução própria)_\n:::\n:::q Manual · p. 16 · Responde 1.4 · Justifica a importância do efeito de estufa para o aparecimento de vida.\n?? Mantém uma **temperatura média amena** (sem ele seria cerca de −18 °C), que permite a existência de **água líquida**, essencial à vida. _(resolução própria)_\n:::\n:::q Manual · p. 16 · Responde 1.5 · No Carbonífero (359–299 Ma) surgiram grandes florestas de fetos arbóreos. Relaciona esta flora com a fotossíntese e o dioxigénio.\n?? As grandes florestas faziam muita **fotossíntese**: **absorviam CO₂** e **libertavam dioxigénio**, fazendo **aumentar a concentração de O₂** na atmosfera. _(resolução própria)_\n:::\n:::q Manual · p. 16 · Responde 1.6 · A camada de ozono formou-se quando a quantidade de (A) CO₂ diminuiu (B) dioxigénio aumentou (C) CO₂ e O₂ diminuiu (D) dinitrogénio aumentou\n?? **(B) dioxigénio aumentou.**\n:::"}, {"id": "92-manual-dominio1-1", "title": "1.1 Vida na Terra — Organiza e Consolida (pp. 19–21)", "pages": "Manual pp. 8–45", "part": "Manual", "md": ":::q Manual · p. 19 · Organiza · Terra → localiza-se na (1); apresenta condições para a vida: distância ao Sol, que permite (2) e água líquida; massa adequada, que fixa a (3), rica em dioxigénio, que forma a (5), e que apresenta (4). Palavras: efeito de estufa, camada de ozono, atmosfera, temperatura amena, Via Láctea.\n?? (1) **Via Láctea**; (2) **temperatura amena**; (3) **atmosfera**; (4) **efeito de estufa**; (5) **camada de ozono**. _(resolução própria)_\n:::\n:::q Manual · p. 20 · Consolida 1.1 · O instrumento referido na notícia (FAST, na China) é o (A) radiotelescópio ótico (B) radiotelescópio esférico (C) telescópio esférico (D) radiotelescópio gravitacional\n?? **(B) radiotelescópio esférico** (Five-hundred-meter Aperture Spherical Telescope). _(resolução própria)_\n:::\n:::q Manual · p. 20 · Consolida 1.2 · As três características que tornam a Terra única são (A) água gasosa, temperatura amena, atmosfera protetora (B) água líquida, temperatura amena, ausência de atmosfera (C) água líquida, temperatura elevada, ausência de atmosfera (D) água líquida, temperatura amena e atmosfera protetora\n?? **(D).** _(resolução própria)_\n:::\n:::q Manual · p. 21 · Consolida 2.1 · Faz a legenda da Fig. 1.008 (planetas 1 a 8).\n?? 1 Mercúrio; 2 Vénus; 3 Terra; 4 Marte; 5 Júpiter; 6 Saturno; 7 Úrano; 8 Neptuno. _(resolução própria)_\n:::\n:::q Manual · p. 21 · Consolida 2.2 · Qual é o planeta com temperatura média à superfície mais elevada? Justifica.\n?? **Vénus** (471 °C): a sua atmosfera é muito rica em **dióxido de carbono**, que provoca um **efeito de estufa** muito intenso. _(resolução própria)_\n:::\n:::q Manual · p. 21 · Consolida 2.3 · A Terra é o único planeta com água no estado líquido. Explica.\n?? A sua **distância ao Sol** e o **efeito de estufa** dão-lhe uma temperatura média de **15 °C**, que permite à água existir no estado líquido. _(resolução própria)_\n:::\n:::q Manual · p. 21 · Consolida 2.4 · Verdadeiras e falsas (corrige): A. A atmosfera da Terra é igual à dos outros planetas telúricos. B. Saturno é o maior planeta do Sistema Solar. C. A Lua é o satélite natural da Terra.\n?? A **falsa** — a atmosfera da Terra é **diferente** (dinitrogénio e dioxigénio; Vénus e Marte têm sobretudo CO₂; Mercúrio não tem). B **falsa** — o maior planeta é **Júpiter**. C **verdadeira**. _(resolução própria)_\n:::\n:::q Manual · p. 21 · Consolida 3.1 · Gráficos: atmosfera primitiva A (dinitrogénio 40 %, CO₂ 30 %, vapor de água 25 %, metano 5 %, vestígios de amoníaco) e atual B (dinitrogénio 78 %, dioxigénio 21 %, outros 1 %). A primitiva era (A) pobre em CO₂, vapor, metano e O₂ (B) rica em CO₂ e vapor e pobre em metano e O₂ (C) pobre em CO₂, vapor e metano e rica em O₂ (D) rica em CO₂, vapor de água e metano e pobre em dioxigénio\n?? **(D).** _(resolução própria)_\n:::\n:::q Manual · p. 21 · Consolida 3.2 · Que importância teve a intensa atividade vulcânica na Terra primitiva?\n?? Libertou os **gases** que, fixados pela força gravítica, formaram a **atmosfera primitiva** (e o vapor de água que, ao condensar, originou os oceanos). _(resolução própria)_\n:::"}, {"id": "92-manual-dominio1-2", "title": "1.2 Subsistemas da Terra — Responde e Liga-te a Portugal (pp. 24–25)", "pages": "Manual pp. 8–45", "part": "Manual", "md": ":::q Manual · p. 24 · Responde 1 · Quais são as camadas que constituem os solos?\n?? Os **horizontes O, A, B e C**, assentes sobre a **rocha-mãe**.\n:::\n:::q Manual · p. 24 · Responde 2 · Horizonte com maior quantidade de matéria orgânica em decomposição.\n?? O **horizonte O** (a camada superficial, com restos de seres vivos e húmus).\n:::\n:::q Manual · p. 24 · Responde 3 · Explica a importância da rocha-mãe.\n?? É a rocha que, por **meteorização e erosão** ao longo de milhões de anos, **dá origem ao solo** — fornece a matéria mineral de que o solo é feito.\n:::\n:::q Manual · p. 25 · Liga-te a Portugal 1 · Subsistemas referidos nas notícias A (peixes mortos no Tejo por microalgas) e B (incêndios na Madeira → deslizamentos), respetivamente:\n?? **(B) biosfera e hidrosfera; hidrosfera e geosfera.** (A: as microalgas/peixes — biosfera — na água — hidrosfera. B: a chuva — hidrosfera — provoca deslizamentos de terra — geosfera.) *(A notícia B também envolve a biosfera — a vegetação queimada — mas esta é a opção que melhor corresponde.)*\n:::\n:::q Manual · p. 25 · Liga-te a Portugal 2 · Causa da morte dos peixes na notícia A.\n?? A proliferação de **fitoplâncton/microalgas (blooms)**, favorecida por temperaturas elevadas e falta de chuva, que **reduziu a quantidade de dioxigénio** na água.\n:::\n:::q Manual · p. 25 · Liga-te a Portugal 3 · Como podem os incêndios provocar deslizamentos de terra?\n?? Os incêndios **destroem a vegetação**, cujas **raízes seguravam o solo**. Sem ela, em chuvas intensas, o solo fica desprotegido e é **arrastado** — deslizamentos e aluviões.\n:::\n:::q Manual · p. 25 · Liga-te a Portugal 4 · Subsistemas em interação: A. Os vulcões libertam gases B. As raízes das árvores alteram as rochas C. Os seres vivos utilizam a água\n?? A. **geosfera – atmosfera**; B. **biosfera – geosfera**; C. **biosfera – hidrosfera**.\n:::"}, {"id": "92-manual-dominio1-3", "title": "1.2 Subsistemas da Terra — Organiza (p. 27)", "pages": "Manual pp. 8–45", "part": "Manual", "md": ":::q Manual · p. 27 · Organiza · Completa o mapa: Terra → constituída por (1) → (2), (3), Geosfera, (4); Geosfera contém o (5), formado a partir de (6) e constituído por (7).\n?? (1) **Subsistemas**; (2), (3), (4) **Atmosfera, Biosfera, Hidrosfera** (qualquer ordem); (5) **Solo**; (6) **Rocha-mãe**; (7) **Horizontes**.\n:::"}, {"id": "92-manual-dominio1-4", "title": "1.2 Subsistemas da Terra — Consolida (pp. 28–29)", "pages": "Manual pp. 8–45", "part": "Manual", "md": ":::q Manual · p. 28 · Consolida 1.1 · Legenda a Fig. 1.014 (1 céu/nuvens, 2 rochas, 3 floresta, 4 água).\n?? **1 – Atmosfera; 2 – Geosfera; 3 – Biosfera; 4 – Hidrosfera.**\n:::\n:::q Manual · p. 28 · Consolida 1.2 · O que representam as setas?\n?? As **interações** (trocas de **matéria e energia**) entre os subsistemas.\n:::\n:::q Manual · p. 28 · Consolida 1.3 · Comenta: «A Terra é um sistema aberto.»\n?? A afirmação é **falsa**. A Terra é um **sistema fechado**: só troca **energia** com o exterior, não há trocas de matéria significativas. Os seus **subsistemas** é que são sistemas abertos.\n:::\n:::q Manual · p. 28 · Consolida 1.4 · A hidrosfera corresponde (opção mais correta)\n?? **C. à totalidade da água do planeta.**\n:::\n:::q Manual · p. 28 · Consolida 1.5 · Descreve uma possível interação: A. 1 e 2 B. 3 e 4 C. 2 e 4\n?? A. **Atmosfera–geosfera:** os vulcões libertam gases para a atmosfera. B. **Biosfera–hidrosfera:** os seres vivos usam a água para viver. C. **Geosfera–hidrosfera:** a água erode e transporta as rochas.\n:::\n:::q Manual · p. 28 · Consolida 2 · Subsistemas em interação: A. raízes desgastam rochas B. animais precisam de água C. agricultura liberta poluentes no solo D. vapor de água condensa e precipita E. plantas usam sais minerais do solo F. vulcões projetam lava para o mar\n?? A. **biosfera–geosfera**; B. **biosfera–hidrosfera**; C. **biosfera–geosfera**; D. **atmosfera–hidrosfera**; E. **biosfera–geosfera**; F. **geosfera–hidrosfera**.\n:::\n:::q Manual · p. 29 · Consolida 3 · Liga: Hidrosfera, Geosfera, Biosfera, Atmosfera ↔ 1 seres vivos 2 camada gasosa 3 parte rochosa 4 toda a água\n?? **Hidrosfera–4; Geosfera–3; Biosfera–1; Atmosfera–2.**\n:::\n:::q Manual · p. 29 · Consolida 4.1 · Legenda a Fig. 1.015 (perfil do solo, 1 a 5 de cima para baixo).\n?? **1 – Horizonte O; 2 – Horizonte A; 3 – Horizonte B; 4 – Horizonte C; 5 – Rocha-mãe.**\n:::\n:::q Manual · p. 29 · Consolida 4.2 · A camada rica em matéria orgânica é o\n?? **D. horizonte O.**\n:::\n:::q Manual · p. 29 · Consolida 4.3 · Explica resumidamente como se forma o solo.\n?? Forma-se pela **meteorização e erosão da rocha-mãe** por agentes geológicos (água, vento, temperatura) e biológicos (raízes, seres vivos), ao longo de **milhões de anos**. Juntam-se restos de seres vivos (matéria orgânica) e diferenciam-se os **horizontes** até se formar um **solo maduro**.\n:::\n:::q Manual · p. 29 · Consolida 4.4 · Refere uma função do solo.\n?? Serve de **suporte** às plantas (ou: fornece **água e sais minerais**; é **habitat** de muitos seres vivos; base de ~90 % da **produção de alimentos**).\n:::"}, {"id": "92-manual-dominio1-5", "title": "1.3 Diversidade celular — Responde (pp. 31–41)", "pages": "Manual pp. 8–45", "part": "Manual", "md": ":::q Manual · p. 31 · História da Ciência 1 · Refere o instrumento inventado por Jansen.\n?? O **microscópio** (o primeiro, em 1590).\n:::\n:::q Manual · p. 31 · História da Ciência 2 · Que importância teve esse instrumento para o estudo da célula?\n?? Permitiu **observar estruturas muito pequenas**, invisíveis a olho nu, e assim descobrir as **células**. _(resolução própria)_\n:::\n:::q Manual · p. 31 · História da Ciência 3 · Quem foi o cientista que utilizou pela primeira vez o nome «célula»?\n?? **Robert Hooke**, em **1663**, ao observar cortes de cortiça.\n:::\n:::q Manual · p. 31 · História da Ciência 4 · Quem afirmou que todos os animais eram constituídos por células?\n?? **Theodor Schwann** (zoologista), em **1839**.\n:::\n:::q Manual · p. 31 · História da Ciência 5 · Relaciona o avanço tecnológico com o aumento de conhecimentos acerca da constituição dos seres vivos.\n?? Microscópios cada vez melhores (maior **ampliação e resolução** — do ótico ao **eletrónico**, que amplia 500 mil vezes) permitiram observar com mais pormenor as células e os seus organitos, e chegar à **Teoria Celular**. _(resolução própria)_\n:::\n:::q Manual · p. 37 · Responde 1 · Compara as células eucarióticas animais e vegetais: 1.1 duas semelhanças; 1.2 duas diferenças.\n?? 1.1 Ambas têm **núcleo**, **membrana celular**, **citoplasma**, **mitocôndrias** (também retículo e complexo de Golgi). 1.2 A vegetal tem **cloroplastos** e **parede celular** e um **vacúolo grande e central**; a animal não tem cloroplastos nem parede e tem **vários vacúolos pequenos**. _(resolução própria)_\n:::\n:::q Manual · p. 37 · Responde 2 · Onde se localiza o material genético?\n?? Nas eucarióticas, no **núcleo** (rodeado pela membrana nuclear); nas procarióticas, numa região do citoplasma chamada **nucleoide**.\n:::\n:::q Manual · p. 38 · Laboratório · Atividade 1 (epitélio lingual + bactérias): 1 Identifica o tipo de células. 2 Qual é a eucariótica? Justifica. 3 Objetivo do azul de metileno?\n?? 1 **Células eucarióticas animais** (do epitélio) e **bactérias** (procarióticas). 2 A **célula do epitélio**, porque tem **núcleo** delimitado por membrana. 3 **Corar** as células para ver melhor as suas estruturas (sobretudo o núcleo). _(resolução própria)_\n:::\n:::q Manual · p. 39 · Laboratório · Atividade 2 (filídios de musgo): 1 Tipo de células. 2 Organito característico. 3 Compara com as células do epitélio lingual.\n?? 1 **Células eucarióticas vegetais**. 2 **Cloroplastos** (também a parede celular). 3 As do musgo têm **parede celular e cloroplastos** e forma mais regular (poligonal); as do epitélio (animais) não têm. Ambas têm núcleo, membrana e citoplasma. _(resolução própria)_\n:::\n:::q Manual · p. 41 · Responde 1 · Define biodiversidade.\n?? A enorme **variedade e diversidade de organismos** (seres vivos) existentes na Terra.\n:::\n:::q Manual · p. 41 · Responde 2 · Qual é a unidade básica de todos os seres vivos?\n?? A **célula**.\n:::\n:::q Manual · p. 41 · Responde 3 · Ordena por ordem decrescente de complexidade: Tecido · Biosfera · Órgão · População · Célula\n?? **Biosfera → População → Órgão → Tecido → Célula.**\n:::"}, {"id": "92-manual-dominio1-6", "title": "1.3 Diversidade celular — Organiza e Consolida (pp. 43–45)", "pages": "Manual pp. 8–45", "part": "Manual", "md": ":::q Manual · p. 43 · Organiza · Célula — observada com (1); Tipos: sem núcleo (2) e (3) → célula eucariótica: (4) célula animal e com cloroplastos (5); constitui os seres vivos: uma célula (6) e mais do que uma célula (7). Palavras: pluricelulares, procariótica, microscópio, sem parede celular, célula vegetal, com núcleo, unicelulares.\n?? (1) **Microscópio**; (2) **Procariótica**; (3) **Com núcleo**; (4) **Sem parede celular**; (5) **Célula vegetal**; (6) **Unicelulares**; (7) **Pluricelulares**. _(resolução própria)_\n:::\n:::q Manual · p. 44 · Consolida 1.1 · Faz a legenda do microscópio da Fig. 1.029 (1 a 12).\n?? 1 **Ocular**; 2 **Tubo ou canhão**; 3 **Braço ou coluna**; 4 **Revólver**; 5 **Objetivas**; 6 **Platina**; 7 **Pinças**; 8 **Condensador/diafragma**; 9 **Parafuso macrométrico**; 10 **Parafuso micrométrico**; 11 **Fonte de luz (espelho)**; 12 **Pé ou base**. _(resolução própria — confirma a numeração na figura)_\n:::\n:::q Manual · p. 44 · Consolida 1.2 · Refere dois cuidados no manuseamento do microscópio.\n?? Transportá-lo com **as duas mãos** (uma na base e outra no braço); **não molhar a platina**; limpar as lentes com material próprio; guardá-lo com a **objetiva de menor ampliação**. _(resolução própria)_\n:::\n:::q Manual · p. 44 · Consolida 1.3 · Ordena: A. Coloca-se a preparação na platina com as pinças. B. Observa-se lateralmente e roda-se o macrométrico aproximando a platina da objetiva. C. Ilumina-se o campo. D. Pela ocular, roda-se o macrométrico até obter imagem e depois o micrométrico até ficar nítida. E. Coloca-se a objetiva de menor ampliação. F. Muda-se para a ampliação maior.\n?? **E → C → A → B → D → F.** _(resolução própria)_\n:::\n:::q Manual · p. 44 · Consolida 1.4 · Refere a importância do microscópio para o estudo da célula.\n?? Permite **ampliar** imagens de estruturas muito pequenas e assim **observar as células** e os seus organitos, impossíveis de ver a olho nu. _(resolução própria)_\n:::\n:::q Manual · p. 45 · Consolida 2.1 · Faz a legenda da Fig. 1.030 (A célula animal | vegetal; B bactéria).\n?? Estruturas a legendar — **A (animal/vegetal):** membrana celular, citoplasma, núcleo, mitocôndria, retículo endoplasmático, complexo de Golgi, cloroplasto, vacúolo, parede celular. **B (bactéria):** parede celular, **nucleoide** (material genético), **flagelo**. _(resolução própria — confirma os números na figura)_\n:::\n:::q Manual · p. 45 · Consolida 2.2 · Identifica o tipo de células em A e B. Justifica.\n?? **A** — **eucarióticas** (animal à esquerda, vegetal à direita): têm **núcleo** e organitos membranares. **B** — **procariótica** (bactéria): **não tem núcleo**, o material genético está no **nucleoide**. _(resolução própria)_\n:::\n:::q Manual · p. 45 · Consolida 2.3 · Correspondência: A Interior das células; B Regula as trocas entre a célula e o meio; C Realiza a fotossíntese; D Controla as atividades celulares; E Confere resistência à célula; F Respiração celular ↔ 1 Parede celular 2 Núcleo 3 Citoplasma 4 Membrana citoplasmática 5 Mitocôndria 6 Cloroplasto\n?? **A–3; B–4; C–6; D–2; E–1; F–5.** _(resolução própria)_\n:::\n:::q Manual · p. 45 · Consolida 3 · Ordena por nível crescente de complexidade (Fig. 1.031): A carvalho com animais · B corte de folha · C ramo com folhas e bolotas · D grupo de carvalhos · E um carvalho · F uma célula · G fila de células\n?? **F → G → B → C → E → D → A** (célula → tecido → órgão → sistema de órgãos → organismo → população → comunidade). _(resolução própria)_\n:::"}]}, "ESP": {"title": "Espanhol", "subtitle": "¡A bordo! 8 · Guia de estudo · 8.º ano", "missing": ["O Manual (livro do aluno) é uma digitalização sem texto e tem 192 MB (25 MB comprimido): não dá para o ler pelo Google Drive. Este guia foi feito a partir do Caderno de ejercicios completo (pp. 4–61) e das suas soluções.", "As soluções do Caderno terminam na p. 46: as respostas das pp. 47–61 (Unidades 5 e 6) estão marcadas como resolução própria."], "chapters": [{"id": "00-repaso", "title": "0 · ¡Todos a bordo! Repaso do 7.º ano", "pages": "Caderno de ejercicios pp. 4–5", "part": "Repaso", "md": "# ¡Todos a bordo! Repaso do 7.º ano\n\nRevisão geral do vocabulário, gramática e cultura do 7.º ano. A Sofía apresenta-se e volta ao *cole* (escola).\n\n## A Sofía apresenta-se (texto modelo)\n*Hola, **me llamo** Sofía y tengo 14 **años**. **Vivo** en Murcia, una **ciudad** del sudeste de España. Soy **hija** única, pero tengo un **perro** que me hace mucha compañía. Me siento siempre un poco **triste** antes de la vuelta al cole, porque eso significa que las **vacaciones** se han acabado. Pero también estoy contenta, **pues** voy a volver a ver a mis **compañeros**.*\n\n:::key\n**Para te apresentares:** *Me llamo… · Tengo … años · Vivo en… · Soy hijo/a único/a · Tengo un perro / dos hermanos.*\n- **pues** = porque (*estoy contenta, pues voy a ver a mis amigos*).\n- **la vuelta al cole** = o regresso às aulas.\n:::\n\n## Vocabulário de base\n- **Família:** hija de su madre · sobrina de su tío · nieta de su abuelo.\n- **Gustos:** *le gusta* + infinitivo/singular (*acostarse tarde*) · *le gustan* + plural (*los chocolates*) · *no le gustan las personas malas*.\n- **Embalagens:** una **barra** de pan · una **bolsa** de patatas fritas · una **botella** de agua.\n- **Lojas:** pan → **panadería** · revistas → **quiosco** · gafas → **óptica** · anillo → **joyería**.\n- **O tempo (¿Qué tiempo hace?):** **hace** frío/calor/sol/buen tiempo · **está** nublado · **hay** niebla.\n- **Expressões:** *es muy guapa · tiene mucha suerte · se divierte mucho*.\n- **Escola:** cuarto de la ESO · cuadernos, libros, estuche · unos vaqueros, unas zapatillas, un jersey · la merienda / el desayuno.\n- **Horas:** *siete y cuarto* (7:15) · *ocho menos cuarto* (7:45) · *siete y media* (7:30).\n- **Transporte:** ir **en** bici / coche / tren (mas **a pie**).\n\n## Gramática rápida para recordar\n| Estrutura | Exemplo |\n|---|---|\n| **tener que** + inf. (obrigação pessoal) | *Tienes que hacer deporte regularmente.* |\n| **deber** + inf. (conselho) | *Debes hacer deporte.* |\n| **hay que** + inf. (obrigação geral) | *Hay que comer 3 veces al día.* |\n| **Imperativo (tú)** | *¡**Haz** la cama!* |\n| **Si** + presente, presente/imperativo | *Si tú **estás** triste, **llama** a un amigo.* |\n| **gustar** | *A Sofía no **le gusta** viajar **en** coche.* |\n| Pronome + infinitivo (junto) | *Vamos al museo para **visitarlo**.* |\n| Posesivos | ***Son mi** perro Coco y **mis** gatos Bola y Feliz.* |\n| **ser** | *Tú **eres** mi mejor amiga.* |\n| **estar a punto de / ir a** | *Marga, ya estamos **saliendo**.* |\n| Plural em -z → -ces | *un chico andaluz, dos chicos **andaluces*** |\n\n- Dias: lunes, martes, **miércoles → jueves**, viernes, sábado, domingo.\n- Meses: enero, febrero, **marzo** (3.º), abril…\n- Medicamentos: dor de cabeça → **una pastilla**; mãos frias → **unos guantes**."}, {"id": "01-dime-con-quien-andas", "title": "Unidad 1 · Dime con quién andas…", "pages": "Caderno pp. 6–15", "part": "Unidades", "md": "# Unidad 1 · Dime con quién andas…\n\n**Conteúdos:** caracterização física e psicológica · gostos pessoais · roupa e acessórios · presente de indicativo · verbo *gustar* e similares · comparativos · presente de subjuntivo (verbos frequentes).\n\n## Vocabulário: estilos (tribos urbanas)\n| Estilo | Roupa, acessórios e características |\n|---|---|\n| **Los raperos** | ropa ancha, sudadera con capucha, zapatillas deportivas, gorra, pulseras y collares |\n| **Los góticos** | ropa negra de cuero, piercings, piel pálida, cruces, maquillaje muy fuerte |\n| **Los hipsters** | camisas de cuadros, barba y bigote, gafas de estilo retro, sombrero, corbata |\n| **Los metaleros** | pelo largo, vaqueros ceñidos, botas, cazadora de cuero, anillos y pulseras |\n\n**Roupa e acessórios:** pañuelo, gafas, zapatos, cinturón, guantes, camiseta, jersey, chancletas, falda, bufanda, chubasquero, pantalón, reloj, vaqueros, gorra, sombrero, calcetines, pendientes.\n\n## Descrição física\n- **Estatura:** alto · bajo · de estatura media. **Corpo:** muy flaco · delgado · gordo.\n- **Pelo:** largo / corto · liso / rizado / ondulado · rubio / castaño / moreno.\n- **Ojos:** verdes · azules · castaños. **Lleva** barba (corta/larga) y bigote, gafas.\n- **Estilo:** hipster · clásico · deportivo.\n\n:::note\n**Exemplo: Álvaro Morte** (Álvaro Antonio García Pérez, nascido a 23/02/1975 em Algeciras, Cádiz; 1,83 m; ator e diretor): *Álvaro es **alto** y **delgado**. Tiene el pelo **corto y ondulado** y los ojos **castaños**. Lleva **barba corta y bigote**. Tiene un estilo **clásico**.*\n:::\n\n## Carácter (adjetivos opostos)\n| Não é… | …mas sim |\n|---|---|\n| callado | **hablador** |\n| pesado | **divertido** |\n| nervioso | **tranquilo** |\n| vago | **trabajador** |\n| insensible | **tierno** |\n| cobarde | **valiente** |\n| grosero | **educado** |\n| intolerante | **comprensivo** |\n| egoísta | **generoso** |\n| indeciso | **decidido** |\n\nEstrutura: ***No es** callado, **sino** hablador.* (*sino* = mas sim, depois de negação)\n\n## Presente de indicativo\n| | hablar | comer | vivir | ser | ir |\n|---|---|---|---|---|---|\n| yo | hablo | como | vivo | **soy** | **voy** |\n| tú | hablas | comes | vives | **eres** | **vas** |\n| él/ella/usted | habla | come | vive | **es** | **va** |\n| nosotros | hablamos | comemos | vivimos | **somos** | **vamos** |\n| vosotros | habláis | coméis | vivís | **sois** | **vais** |\n| ellos/ustedes | hablan | comen | viven | **son** | **van** |\n\n:::key\n*Hablar, comer, vivir* são verbos **regulares** porque não mudam a raiz. *Ser, ir* são **irregulares** porque mudam a raiz.\n:::\n\n**Irregularidades frequentes** (mudam em todas as pessoas exceto *nosotros* e *vosotros*):\n- **e → ie:** empezar (empiezo), querer (quiero), despertar (despierto), pensar (pienso).\n- **e → i:** medir (mido), pedir (pido), servir (sirvo), vestir (visto).\n- **o → ue:** dormir (duermo), volver (vuelvo), poder (puedo), aprobar (apruebo); **u → ue:** jugar (juego).\n- **Irregular só na 1.ª pessoa:** hacer → **hago**, salir → **salgo**, poner → **pongo**, traer → **traigo**.\n\n## Expressões de tempo e aproximação\n- **Posiblemente / tal vez / a lo mejor / quizás** = talvez. **A menudo** = com frequência.\n- **Sobre las dos / alrededor de** = mais ou menos às duas. **Unas 100 personas** = aproximadamente.\n- **Llover a cántaros** = chover muito. **Hacer / preparar el equipaje** = fazer as malas.\n\n## Refranes (provérbios)\n- *A quien madruga, Dios le ayuda.* · *En boca cerrada no entran moscas.* · *No hay mal que por bien no venga.* · *Bicho malo nunca muere.* · *Ojos que no ven, corazón que no siente.* · *A buen entendedor, pocas palabras bastan.* · *El casado casa quiere.* · *A caballo regalado no se le mira el diente.*\n\n## Verbo gustar e similares\nEscala: **Me encanta(n)** 😍 → **Me gusta(n)** → **No me gusta(n)** → **Me molesta(n) / Me disgusta(n)** → **Me da(n) miedo**.\n\n:::key\n- Singular / infinitivo → *me **gusta** el fútbol / me gusta **jugar***.\n- Plural → *me **gustan** las manzanas*.\n- Pronomes: **me, te, le, nos, os, les** (*A Miguel **le** gustan las sudaderas*).\n:::\n\n## Comparativos\n| Tipo | Estrutura | Exemplo |\n|---|---|---|\n| Superioridade | **más** + nome/adj./adv. + **que** · verbo + **más que** | *Tengo **más** seguidores **que** tú.* |\n| Inferioridade | **menos** … **que** · verbo + **menos que** | *Luisa habla **menos que** Hugo.* |\n| Igualdade | **tan** + adj./adv. + **como** | *Ana es **tan** deportista **como** María.* |\n| Igualdade (nome) | **tanto/a/os/as** + nome + **como** | *Hay **tantos** famosos en Madrid **como** en Nueva York.* |\n\n**Irregulares:** más bueno → **mejor** · más malo → **peor** · más grande (idade) → **mayor** · más pequeño (idade) → **menor**.\n\n## Presente de subjuntivo\n- Forma-se a partir da **1.ª pessoa (yo) do presente de indicativo**: *yo hablo → (que) yo **hable** · yo pido → (que) yo **pida** · yo digo → **diga** · yo salgo → **salga***.\n- **Terminações** (semelhante ao português):\n  - verbos em **-ar**: -e, -es, -e, -emos, -éis, -en\n  - verbos em **-er/-ir**: -a, -as, -a, -amos, -áis, -an\n- **Exceções:** ser → **sea** · estar → **esté** · ir → **vaya**.\n- Usa-se depois de: **querer que, esperar que, ojalá, tal vez, no creo que, es mejor que, no hace falta que, para que**.\n  - *Quiero que **compres** las entradas.* · *Ojalá **consigan** un buen lugar.* · *Tal vez **vengáis** a mi fiesta.*\n\n:::warn\nVerbos com mudança vocálica mantêm-na: *pensar → **piense**, divertirse → te **diviertas**, dormir → **duerma***. *Nosotros/vosotros* de -ar/-er: *juguéis, comamos*.\n:::\n\n## Leitura DELE\n- **Cartazes:** *Disminuya la velocidad* = conduzir devagar · *Sea paciente, espere su turno* = esperar · *Reservado* = estacionamento para pessoas com deficiência · *Cursos de español en línea* = estudar pela Internet · *Black Friday 00:00–24:00* = preços reduzidos durante 24 h.\n- ***¡Buenos días, princesa!*** (Blue Jeans): **livro**, disponível **em papel e em formato digital** (Kindle 5,69 €, tapa blanda 18,95 €), opinião dos consumidores **muito favorável**. Personagens: Raúl, Valeria, Eli, María, Bruno, Ester (\"El club de los incomprendidos\")."}, {"id": "02-familia-y-compania", "title": "Unidad 2 · Familia y compañía", "pages": "Caderno pp. 16–25", "part": "Unidades", "md": "# Unidad 2 · Familia y compañía\n\n**Conteúdos:** relações familiares e sociais · festas em família · vizinhos, profissões e carácter · pretérito imperfecto de indicativo · adjetivos apocopados · orações condicionais com *si*.\n\n## A família\n| Masculino | Feminino | Plural (masc.) |\n|---|---|---|\n| bisabuelo | bisabuela | bisabuelos |\n| abuelo | abuela | abuelos |\n| padre / padrastro | madre / madrastra | padres / padrastros |\n| marido | mujer | matrimonio |\n| hermano | hermana | hermanos |\n| cuñado | cuñada | cuñados |\n| yerno | nuera | yernos |\n| sobrino | sobrina | sobrinos |\n| padrino | madrina | padrinos |\n| bisnieto | bisnieta | bisnietos |\n\n:::note\n**Atenção aos falsos amigos:** **cuñado** = cunhado · **yerno** = genro · **nuera** = nora · **padrastro** = padrasto · **marido / mujer** = marido / mulher · **matrimonio** = casal.\n:::\n\n**A árvore do Marcos:** avós **Antonio** e **María** → filhos **Sofía** (mãe; casada com **Daniel**) e **Pablo** (tio; casado com **Ana**) → primos **Enrique** e **Sara**; irmãos **Nini** (mais velha), **Marcos** e **Charo** (mais nova).\n\n## Festas familiares\n| Festa | Descrição | Expressão |\n|---|---|---|\n| **Carnaval** | as pessoas mascaram-se (*se disfraza*) | *Todo el año es Carnaval…* |\n| **Cumpleaños** | celebração anual e pessoal | *¡Feliz cumpleaños!* |\n| **Nochebuena y Navidad** | 24 e 25 de dezembro | *¡Feliz Navidad!* |\n| **Nochevieja** | véspera de ano novo | *¡Feliz año nuevo!* |\n| **Boda** | celebra a união entre duas pessoas | *¡Vivan los novios!* |\n\nCerimónias: **el nacimiento** (*¡Gracias por venir a conocerme!*) · **la boda** (*¡Nos casamos!*) · **el funeral** (*… comunican con pesar el fallecimiento…*).\n\n## Profissões\n- Cura os doentes → **médico** · atende clientes num restaurante → **camarero** · trabalha numa loja → **dependienta** · leva a mercadoria → **repartidor** · estuda uma ciência → **científica** · mantém a ordem pública → **policía** · combate incêndios → **bombero** · cozinha → **cocinero** · dirige um negócio/escola → **director** · ensina → **profesora**.\n- Profissão ↔ área: actor/actriz – **cine** · periodista – **información** · abogado/a – **justicia** · pintor/a – **arte** · enfermero/a – **salud** · ingeniero/a – **construcción**.\n\n## Carácter dos vizinhos\n- sem boas maneiras → **maleducada** · chef impaciente e colérico → **desagradable** · diz o que pensa → **sincera** · não é sincero → **hipócrita** · faz coisas arriscadas → **atrevida** · custa-lhe fazer amigos → **introvertido** · firme nas ideias, demasiado → **testaruda** · faz mal aos animais de propósito → **malo**.\n\n## Pretérito imperfecto de indicativo\nUsa-se para **descrever o passado, hábitos e rotinas no passado** (\"antes…\", \"de niño…\", \"en el pasado…\").\n\n| | estar (-ar) | volver (-er) | existir (-ir) |\n|---|---|---|---|\n| yo | estaba | volvía | existía |\n| tú | estabas | volvías | existías |\n| él | estaba | volvía | existía |\n| nosotros | estábamos | volvíamos | existíamos |\n| vosotros | estabais | volvíais | existíais |\n| ellos | estaban | volvían | existían |\n\n:::key\n- **-ar:** -aba, -abas, -aba, -ábamos, -abais, -aban\n- **-er/-ir:** -ía, -ías, -ía, -íamos, -íais, -ían\n- **Só 3 irregulares:** **ir** (iba, ibas, iba, íbamos, ibais, iban) · **ver** (veía, veías…) · **ser** (era, eras, era, éramos, erais, eran).\n:::\n\n*Hoy **llevamos** todos vaqueros; en el pasado solo los hombres **llevaban** pantalones.* · *De niña Merche **era** gordita y **llevaba** coletas.*\n\n## Adjetivos apocopados\nAlguns adjetivos **perdem a última letra/sílaba quando vão antes de um nome masculino singular**:\n| Adjetivo | Apócope | Exemplo |\n|---|---|---|\n| bueno | **buen** | un buen día |\n| malo | **mal** | un mal presagio |\n| alguno | **algún** | algún día |\n| ninguno | **ningún** | ningún libro |\n| primero | **primer** | mi primer año |\n| tercero | **tercer** | el tercer cumpleaños |\n| grande | **gran** (antes de masc. **e** fem.) | una gran amiga |\n\n:::warn\nDepois do nome ou sozinho não há apócope: *un hermano muy **bueno*** · *¿Me has traído **alguno**?* · *No he comprado **ninguno***. Mensagem da sopa de letras: **\"Hay palabras que apocopan cuando van delante del nombre.\"**\n:::\n\n## Orações condicionais com *si*\n**Si + presente de indicativo → presente** (ou imperativo / *ir a* + inf.) = condição real/provável.\n- *Si mi hermano **consigue** el dinero, **va a viajar** a los Estados Unidos.*\n- *Si mañana me **toca** la lotería, les **compro** una casa a mis padres.*\n- *Si no **hablas** más alto, nadie te **oye**.*\n\n## Leitura DELE\n- **Club familiar:** meditação às 10h, desporto à tarde, filmes à noite, baile semanal; **creche 1–5 anos** (14h–16h); **inglês para pessoas mais velhas** à segunda e quinta; atividades grátis, **comidas não incluídas**; aberto **todo o ano**."}, {"id": "03-come-sano", "title": "Unidad 3 · ¡Come sano y muévete!", "pages": "Caderno pp. 26–35", "part": "Unidades", "md": "# Unidad 3 · ¡Come sano y muévete!\n\n**Conteúdos:** alimentos · hábitos saudáveis e não saudáveis · o corpo, doenças e sintomas · pretérito perfecto · verbo *doler* · *deber / tener que / haber que* + infinitivo.\n\n## Pratos\n- **Tortilla** – ovos com batatas fritas (Espanha) · **Paella** – arroz com carne, legumes, açafrão (Comunidade Valenciana) · **Fideos** – massa chinesa fina como corda · **Nachos** – aperitivo mexicano de tortilla de milho com molhos · **Quesadilla** – tortilla dobrada com queijo · **Vegetariano** – sem alimentos de origem animal · **Burrito** – tortilla de trigo **enrolada** (os tacos são **dobrados**) · **Lasaña** – camadas de massa com carne picada · também **pizza, pasta, tacos**.\n\n## Sabores e sensações\n| | |\n|---|---|\n| el chile es **picante** | el café es **amargo** |\n| el pan con semillas es **crujiente** | la comida sin sal es **sosa** |\n| la zanahoria es **dura** | el limón es **ácido** |\n| la piruleta es **dulce** | la sopa está **caliente** |\n| el helado se come **frío** | el plátano es una fruta **blanda** |\n| las patatas fritas son **saladas** | |\n\n## Embalagens\nuna **caja** de galletas · una **lata** de atún · una **barra** de pan · una **botella** de vino · un **tarro** de mermelada · una **bolsita** de té · una **tableta** de chocolate · una **tarrina** de mantequilla.\n\n## Corpo, doenças e sintomas\n- **tener:** fiebre, frío, calor, gripe, alergias, tos.\n- **doler:** la cabeza, el cuello, la tripa, los dientes, las piernas, el estómago, la espalda, los hombros, el pecho.\n- **estar:** enfermo, mareado, nervioso, agotado.\n- Deficiências: *Ana no ve: es **ciega*** · *Paco **se ha roto** la pierna* · *Merche ha perdido una **pierna*** · *Enrique es **parapléjico*** · *Manuel tiene una **mano** ortopédica* · *Rosa nació sin un **brazo*** · *Pepe **se ha dislocado** el codo*.\n\n## Medicinas\n| Problema | Solução |\n|---|---|\n| Si te duele la cabeza | tomas una **pastilla** |\n| Si te pican los ojos | te echas unas **gotas** |\n| Si quieres evitar el coronavirus | vas a que te pongan la **vacuna** |\n| Si tienes tos | tomas un **jarabe** |\n| Si tienes un moratón | le aplicas una **pomada** |\n| Si tienes una herida en el dedo | la tapas con una **tirita** |\n\n**A Charo está doente:** dói-lhe a barriga (comeu demasiadas guloseimas → infusão) · dores de dentes (não lavou os dentes → lavar os dentes e ir ao dentista) · dor de cabeça (não se protegeu do sol → aspirina) · dor de ouvidos (ouviu música muito alta → gotas) · partiu o braço (patinou sem proteção → ir ao hospital).\n\n## Pretérito perfecto\n**haber** (he, has, ha, hemos, habéis, han) + **particípio**.\n- Usa-se para **ações acabadas** num **período de tempo que ainda não terminou** para quem fala: *He trabajado mucho **este trimestre**.*\n- **Marcadores** (relacionados com o presente): hoy, ya, todavía no, nunca, siempre, esta mañana/tarde/noche, esta semana, este mes/año/verano/invierno.\n- ✗ Não com: ayer, anoche, el año pasado, el mes pasado, el invierno pasado (→ *indefinido*).\n\n:::key\n**Particípios regulares:** -ar → **-ado** (cocinado) · -er/-ir → **-ido** (bebido, vivido, ido).\n**Irregulares:** abrir → **abierto** · decir → **dicho** · escribir → **escrito** · hacer → **hecho** · morir → **muerto** · poner → **puesto** · romper → **roto** · ver → **visto** · volver → **vuelto**.\n:::\n\n## Verbo doler\nFunciona como *gustar*: **me / te / le / nos / os / les + duele** (singular) / **duelen** (plural).\n*Me duele la cabeza.* · *Le duelen las muelas.* · *¿Qué os duele?*\n\n## Necessidade / obrigação\n| Estrutura | Valor | Exemplo |\n|---|---|---|\n| **tener que** + inf. | obrigação **pessoal** | *Tengo que aprender a ver con el corazón.* |\n| **haber que** (hay que) + inf. | obrigação **geral/impessoal** | *No hay que escuchar a la gente amargada.* |\n| **deber** + inf. | obrigação **moral / recomendação** | *Debo estar callada si no tengo nada que decir.* |\n\n## Leitura DELE: horários (ARHOE)\n- **Europeus:** levantam-se antes das 7h, trabalham das 9h até antes das 17h, almoçam entre 12h e 14h (1 hora), jantam entre 18h e 20h, deitam-se às 22h → **mais tempo com a família e para relaxar**.\n- **Espanhóis:** levantam-se 7h30–8h, terminam de trabalhar entre 18h e 20h, almoçam 14h–16h (**mais de uma hora**), jantam 21h–22h, deitam-se à meia-noite."}, {"id": "04-lo-hacemos-juntos", "title": "Unidad 4 · ¿Lo hacemos juntos?", "pages": "Caderno pp. 36–45", "part": "Unidades", "md": "# Unidad 4 · ¿Lo hacemos juntos?\n\n**Conteúdos:** rotinas diárias e tarefas domésticas · casa, móveis e aparelhos · pronomes de OD e OI · orações temporais · gerúndio (*estar* + gerúndio) · marcadores espaciais.\n\n## Tarefas domésticas\nrecoger la mesa · poner la mesa · sacar a pasear al perro · fregar el suelo · barrer el suelo · quitar el polvo · ordenar la casa/habitación · limpiar los cristales / el baño · tirar la basura · regar las plantas · tender la ropa · planchar la ropa · hacer la compra · cocinar · pasar la aspiradora · hacer reparaciones · ventilar la casa · poner la lavadora · hacer la colada · calentar la comida · poner el lavavajillas.\n\n| Tarefa | Objeto |\n|---|---|\n| limpar o tapete | una **aspiradora** |\n| reparações | **herramientas** |\n| cozinhar | **ollas y sartenes** |\n| tirar o pó | un **plumero** |\n| lavar a loiça | un **estropajo** |\n| varrer | una **escoba** |\n| passar a ferro | una **plancha** |\n| regar | una **regadera** |\n\n**Rotina do Paco:** se **despierta** a las 7:35 · el despertador suena a las siete y **media** · se **ducha** · se **lava** los dientes · **desayuna** leche con cereales · llega al **cole** a las 8:25 · **come** en el comedor · se lava las **manos** antes de comer · **vuelve** a casa sobre las 16:30 · ve la **tele** antes de cenar · se **acuesta** temprano a las 22:30 · va al baño dos **veces**.\n\n## Pronomes de objeto direto (OD) e indireto (OI)\n| | OD | OI |\n|---|---|---|\n| yo | me | me |\n| tú | te | te |\n| él/ella/usted | **lo / la** | **le** |\n| nosotros | nos | nos |\n| vosotros | os | os |\n| ellos/ustedes | **los / las** | **les** |\n\n:::key\n**Posição:**\n- **Antes** de verbos conjugados (indicativo: presente, indefinido…): ***Lo** tomo.* · ***Les** he pedido un ordenador.*\n- **Depois e juntos** do **infinitivo, imperativo afirmativo e gerúndio**: *Suelo usar**lo**.* · *Pide**me** lo que quieras.* · *Estoy diciéndo**te**…* · *Dí**me** la verdad.*\n:::\n\n*Debéis lavaros las manos.* · *Pedro, **sácalo** ahora mismo.* · *¿Puedes **enviarlas** por e-mail?*\n\n## Orações temporais\n- **+ infinitivo:** **al**, **antes de**, **después de** (*Antes de empezar a cocinar, elijo la receta.*)\n- **+ indicativo:** **cuando**, **siempre que**, **en cuanto** (logo que), **mientras** (enquanto), **desde que**, **hasta que**.\n  - *Siempre que cocino, lo hago con placer.* · *Mientras tú aspiras, yo limpio los cristales.*\n  - ***En cuanto** mi padre llega, empieza a preparar la cena* (ação imediatamente a seguir) vs ***mientras*** (ações simultâneas).\n\n## Gerúndio\n- **-ar → -ando** (ordenando) · **-er/-ir → -iendo** (volviendo, partiendo).\n- **Irregulares:** vogal + -er/-ir → **-yendo** (leer → **leyendo**, oír → **oyendo**, ir → **yendo**) · **e → i** (decir → **diciendo**, pedir → **pidiendo**, servir → **sirviendo**) · **o → u** (dormir → **durmiendo**, poder → **pudiendo**, morir → **muriendo**).\n\n:::key\n**estar + gerúndio** = ação em curso (= *estar a* + infinitivo em português).\n*Estou a cozinhar* → ***Estoy cocinando***. *Está a chover* → ***Está lloviendo***.\n:::\n\n## Marcadores espaciais\ndentro de · encima de · debajo de · delante de · detrás de · entre · al lado de · a la derecha de · a la izquierda de.\n\n## Leitura DELE\n- **Javier** procura: 1 quarto, mobilado, Madrid, 30–50 m², perto da universidade, rés-do-chão ou 1.º andar, até 850 €/mês → o apartamento **C** (1 dormitorio, 40 m², 1.º piso, perto das universidades, 800 €).\n- **Regras da família de acolhimento:** limpar a casa de banho → **todos os que o usam** · servem **duas** refeições (pequeno-almoço 8h e jantar 20h30) · jogos guardados **debaixo da TV** · telemóvel nas refeições **não é permitido** · wifi desliga-se **à noite** (meia-noite)."}, {"id": "05-de-compras", "title": "Unidad 5 · De compras", "pages": "Caderno pp. 46–53", "part": "Unidades", "md": "# Unidad 5 · De compras\n\n**Conteúdos:** dinheiro e compras · lojas e produtos · diálogo numa loja · pretérito indefinido e marcadores temporais · possessivos.\n\n## Dinheiro\n- **Recibir / dar el cambio** (receber / dar o troco) · **ahorrar** (poupar) · **la paga** (semanada) · **la hucha** (mealheiro).\n- **Comprar · ir de compras** (fazer compras por lazer) · **hacer la compra** (compras de casa).\n- **Monedero** (porta-moedas) · **billetes** (notas) · **monedas** · **pagar en efectivo** (dinheiro) · **tarjeta bancaria** · **pagar con tarjeta**.\n\n## Lojas (-ería)\n| Produto | Loja |\n|---|---|\n| tartas y pasteles | **pastelería** |\n| anillos y pulseras baratas | **bisutería** (joias caras → *joyería*) |\n| pantalones | **tienda de ropa** |\n| una consola | **tienda de informática y tecnología** |\n| botas | **zapatería** |\n| gafas de sol | **óptica** |\n| artículos deportivos | **tienda de deportes** |\n| fruta | **frutería** |\n| libros | **librería** |\n| un perfume | **perfumería** |\n| un reloj digital | **relojería** |\n| bolígrafos | **papelería** |\n\n:::warn\n**librería** = livraria (≠ *biblioteca*). **papelería** = papelaria.\n:::\n\n## Diálogos numa loja\n- **Pedir a talla:** *¡**Buenos días**! Quería ver esa camiseta.* — *¿La **verde**?* — *Sí. ¿**Puedo probármela**?* — *¿Qué **talla** tienes?* — ***Creo que** es la 36.* — *Los **probadores** están al fondo.*\n- **Opinar:** *¡Qué vaqueros **tan bonitos**!* — *Aproveché **las rebajas**.* — *Son muy bonitos y **te quedan** muy bien.* — *¿**De verdad**?* — *Te sientan genial.*\n- **Pagar:** ***Me llevo** esta gorra.* — *Son **10 euros**. ¿Cómo vas a pagar, **en efectivo** o con tarjeta?* — *Con **tarjeta**.*\n- **Reclamar:** *Quiero devolver estos auriculares… ya no **funcionan**.* — *No hacemos **devoluciones**, pero puedo cambiártelos.* — *Prefiero llevarme otro **modelo**.* — *Quiero hacer una **queja** para que no vuelva a pasar.* — *Es la primera **vez** que pasa.*\n\n## Pretérito indefinido (regular)\nAções **acabadas num tempo já terminado**: ayer, anoche, el lunes pasado, la semana pasada, el mes pasado, en 2005, hace mucho tiempo, el otro día, aquel día/año.\n\n| | -ar (cantar) | -er/-ir (comer/vivir) |\n|---|---|---|\n| yo | cant**é** | com**í** |\n| tú | cant**aste** | com**iste** |\n| él | cant**ó** | com**ió** |\n| nosotros | cant**amos** | com**imos** |\n| vosotros | cant**asteis** | com**isteis** |\n| ellos | cant**aron** | com**ieron** |\n\n:::key\n**Truque:** pergunta ao marcador \"**já acabou?**\" → sim = **indefinido** (*ayer*); não = **perfecto** (*hoy, este año*).\n**Exceção:** *esta mañana / tarde / noche* vão sempre com o **pretérito perfecto**.\n:::\n\n**Irregulares na 3.ª pessoa** (os mesmos que mudam de vogal no presente), só em él/ellos:\n- **e → i:** pedir → pid**ió**, pid**ieron** · preferir → prefirió · sentir → sintió, sintieron.\n- **o → u:** dormir → durm**ió**, durm**ieron** · morir → murió, murieron.\n- **i → y:** leer → le**yó**, le**yeron** · construir → construyó · concluir → concluyeron · caerse → se cayó.\n\n## Possessivos\n| Adjetivo (antes do nome) | Pronome (depois / sozinho) |\n|---|---|\n| mi(s) | mío/a/os/as |\n| tu(s) | tuyo/a/os/as |\n| su(s) | suyo/a/os/as |\n| nuestro/a/os/as | nuestro/a/os/as |\n| vuestro/a/os/as | vuestro/a/os/as |\n| su(s) | suyo/a/os/as |\n\n*Te presento a **mis** mejores amigos.* · *Aquí está **tu** libro; acabo de encontrar **el mío**.* · *Nuestras revistas están en la mesa, **las vuestras** están guardadas.* · *La única opinión que cuenta es **la suya**.*\n\n## Expressões com dinheiro\n- **Tener la cuenta en números rojos** = saldo negativo · **Costar un ojo de la cara** = ser muito caro · **Hacer números** = fazer contas por falta de dinheiro · **Estar a dos velas** = estar sem dinheiro · **Las vacas flacas** = tempos de escassez · **Vivir a cuerpo de rey** = viver com luxo · **El tiempo es oro** = aproveitar bem o tempo · **A caballo regalado no le mires el diente** = não se avalia um presente."}, {"id": "06-viajes-y-vacaciones", "title": "Unidad 6 · Viajes y vacaciones", "pages": "Caderno pp. 54–61", "part": "Unidades", "md": "# Unidad 6 · Viajes y vacaciones\n\n**Conteúdos:** férias e viagens · atividades de férias · meios de transporte · pretérito indefinido irregular · imperativo afirmativo e negativo.\n\n## Vocabulário\n- **Pasar las vacaciones…** en la montaña · en el campo · en un pueblo · junto al mar · en una isla · en el extranjero.\n- **Alojarse en…** un camping · un hostal · una caravana · un chalé · un albergue juvenil · un hotel.\n- **Viajar…** en tren · en barco · en avión · en bici · en moto · en coche · **a pie**.\n- **¿Qué tiempo hace?** hace sol / calor / frío / mal tiempo · está lloviendo · está nevando.\n- **Tipos de turismo:** de playa (tomar el sol, deportes náuticos) · cultural (monumentos, museos, arquitectura) · rural (campo, productos locales, paseo a caballo) · de montaña (senderismo, escalada, esquí) · solidario (ayudar a la gente, respetar lo local) · ecológico / ecoturismo · transportes ecológicos (a pie, en bici).\n- Billete de **ida** / **ida y vuelta** · **perforar** (validar) el billete.\n\n## Pretérito indefinido irregular\nRaiz irregular + terminações **-e, -iste, -o, -imos, -isteis, -ieron** (sem acento!):\n| Infinitivo | yo | él | ellos |\n|---|---|---|---|\n| estar | estuve | estuvo | estuvieron |\n| tener | tuve | tuvo | tuvieron |\n| saber | supe | supo | supieron |\n| poder | pude | pudo | pudieron |\n| poner | puse | puso | pusieron |\n| querer | quise | quiso | quisieron |\n| hacer | hice | **hizo** | hicieron |\n| venir | vine | vino | vinieron |\n| decir | dije | dijo | **dijeron** |\n| traer | traje | trajo | **trajeron** |\n| conducir | conduje | condujo | **condujeron** |\n\n:::key\n**ser / ir** (iguais, totalmente irregulares): fui, fuiste, fue, fuimos, fuisteis, fueron.\n**¡Ojo!** Raízes em **-j** fazem **-eron** (não -ieron): dijeron, trajeron, condujeron.\n:::\n\n## Imperativo afirmativo\n| | tú | vosotros | usted | ustedes |\n|---|---|---|---|---|\n| hablar | habla | hablad | hable | hablen |\n| comer | come | comed | coma | coman |\n| vivir | vive | vivid | viva | vivan |\n\n- **tú** = 3.ª pessoa do presente (*habla, come, resuelve*).\n- **vosotros** = infinitivo com **-r → -d** (*hablad, distribuid, contribuid*).\n- **usted / ustedes** = formas do **presente de subjuntivo** (*participe, lean, escriban, estudien*).\n- **Irregulares (tú):** decir → **di** · hacer → **haz** · ir → **ve** · poner → **pon** · salir → **sal** · ser → **sé** · tener → **ten** · venir → **ven**.\n\n## Imperativo negativo\n**no + presente de subjuntivo** em todas as pessoas: *acampar → no acampes / no acampéis / no acampe / no acampen*.\n- *Coge el tren → **No cojas** el tren.* · *Viajad en avión → **No viajéis** en avión.* · *Sé responsable → **No seas** responsable.* · *Compren recuerdos → **No compren** recuerdos.*\n\n## Decálogo do turismo responsável (imperativo tú)\n**Empieza** por ti mismo · **Elige** bien el transporte · **Quédate** en alojamientos sostenibles · **Usa** menos dispositivos electrónicos · **No derroches** energía · **Respeta** la naturaleza · **Contribuye** a la economía local · **Sé** considerado con la población local · **Minimiza** la generación de residuos · **Infórmate** y **difunde**."}], "qsets": [{"id": "90-preguntas-0", "title": "0 · Repaso", "pages": "Caderno de ejercicios ¡A bordo! 8 · Soluciones pp. 60–63", "part": "Ejercicios y soluciones", "md": ":::q Repaso · p. 4 · Ex 1 · Completa o texto da Sofía: Hola, (a)___ Sofía y tengo 14 (b)___. (c)___ en Murcia, una (d)___ del sudeste de España. Soy (e)___ única, pero tengo un (f)___ que me hace mucha compañía. Me siento siempre un poco (g)___ antes de la vuelta al cole, porque significa que las (h)___ se han acabado. Pero también estoy contenta, (i)___ voy a volver a ver a mis (j)___.\n?? a **me llamo** · b **años** · c **Vivo** · d **ciudad** · e **hija** · f **perro** · g **triste** · h **vacaciones** · i **pues** · j **compañeros**\n:::\n:::q Repaso · p. 4 · Ex 2 · Sofía vuelve al cole: ¿en qué curso está, qué hay en su mochila, qué se pone, a qué hora se levanta, qué comida se ve y cómo va al cole?\n?? a **cuarto de la ESO** · b **cuadernos, libros** · c **unos vaqueros, unas zapatillas, un jersey** · d **siete y cuarto** · e **la merienda** o **el desayuno** · f va al cole **en** bici.\n:::\n:::q Repaso · p. 5 · Ex 3 · Relaciona: a. A Sofía le gusta / le gustan / no le gustan… b. De vacaciones va… c. Ella es hija/sobrina/nieta de… e. compra… f. va a comprar pan/revistas/gafas… g. ¿Qué tiempo hace? h. Sofía es/tiene/se divierte…\n?? a **le gusta acostarse tarde; le gustan los chocolates; no le gustan las personas malas** · b **al campo; a la playa; a pasear** · c **hija de su madre; sobrina de su tío; nieta de su abuelo** · e **una barra de pan; una bolsa de patatas fritas; una botella de agua** · f **pan → a una panadería; revistas → a un quiosco; gafas → a una óptica** · g **hace frío; está nublado; hay niebla** · h **es muy guapa; tiene mucha suerte; se divierte mucho**\n:::\n:::q Repaso · p. 5 · Ex 4 · Rodea a opção correta (a–o).\n?? a. **Hay** que hacer deporte regularmente · b. \"**¡Haz** la cama!\" · c. \"Si tú **estás** triste, **llama** a un amigo\" · d. hay que **comer** 3 veces **al** día · e. A Sofía no **le gusta** viajar **en** coche · f. se levantan **muy temprano** · g. **joyería** · h. **unos guantes** · i. **una pastilla** · j. Son **mi** perro Coco y **mis** gatos · k. **visitarlo** · l. **jueves** · m. **marzo** · n. **eres** · ñ. **saliendo** · o. **andaluces**\n:::"}, {"id": "90-preguntas-1", "title": "Unidad 1 · Dime con quién andas…", "pages": "Caderno de ejercicios ¡A bordo! 8 · Soluciones pp. 60–63", "part": "Ejercicios y soluciones", "md": ":::q U1 · p. 6 · Ex 1 · Asocia as roupas e características a cada estilo: raperos, góticos, hipsters, metaleros.\n?? **Raperos:** ropa ancha, sudadera con capucha, zapatillas deportivas, gorra, pulseras y collares · **Góticos:** ropa negra de cuero, piercings, piel pálida, cruces, maquillaje muy fuerte · **Hipsters:** camisas de cuadros, barba y bigote, gafas de estilo retro, sombrero, corbata · **Metaleros:** pelo largo, vaqueros ceñidos, botas, cazadora de cuero, anillos y pulseras.\n:::\n:::q U1 · p. 6 · Ex 2 · Traça o caminho pelas palavras que são peças de roupa ou acessórios.\n?? pañuelo, gafas, zapatos, cinturón, guantes, camiseta, jersey, chancletas, falda, bufanda, chubasquero, pantalón, reloj, vaqueros, gorra, sombrero, calcetines, pendientes.\n:::\n:::q U1 · p. 7 · Ex 3 · Álvaro Morte: escolhe os adjetivos. Álvaro es (1) alto/bajo/de estatura media y (2) muy flaco/delgado/gordo. Tiene el pelo (3)… y los ojos (4)… Lleva (5)… Tiene un estilo (6)…\n?? 1 **alto** · 2 **delgado** · 3 **corto y ondulado** · 4 **castaños** · 5 **barba corta y bigote** · 6 **clásico**\n:::\n:::q U1 · p. 7 · Ex 4 · No es callado, sino… / pesado / nervioso / vago / insensible / cobarde / grosero / intolerante / egoísta / indeciso.\n?? a **hablador** · b **divertido** · c **tranquilo** · d **trabajador** · e **tierno** · f **valiente** · g **educado** · h **comprensivo** · i **generoso** · j **decidido**\n:::\n:::q U1 · p. 8 · Ex 1 · Conjuga no presente: hablar, comer, vivir, ser, ir. Completa: Hablar, comer y vivir son verbos ___; ser e ir son verbos ___.\n?? hablo, hablas, habla, hablamos, habláis, hablan · como, comes, come, comemos, coméis, comen · vivo, vives, vive, vivimos, vivís, viven · **soy, eres, es, somos, sois, son** · **voy, vas, va, vamos, vais, van**. ¡Ojo! **regulares** · **irregulares**.\n:::\n:::q U1 · p. 8 · Ex 2 · Ordena os verbos por tipo de irregularidade (1.ª pessoa): despertar, pensar, vestir, poder, dormir, traer, empezar, hacer, jugar, medir, pedir, querer, salir, servir, poner, volver.\n?? **e > ie:** empezar/empiezo, querer/quiero, despertar/despierto, pensar/pienso · **e > i:** medir/mido, pedir/pido, servir/sirvo, vestir/visto · **o > ue / u > ue:** dormir/duermo, jugar/juego, volver/vuelvo, poder/puedo · **1.ª persona:** hacer/hago, salir/salgo, poner/pongo, traer/traigo\n:::\n:::q U1 · p. 8 · Ex 3 · Crucigrama: a. empezar (nosotros) b. medir (ellos) c. hacer (él) d. traer (vosotras) e. despertar (ella) f. dormir (vosotros) g. salir (tú) h. aprobar (nosotros) i. pedir (tú) j. jugar (ellas)\n?? a **empezamos** · b **miden** · c **hace** · d **traéis** · e **despierta** · f **dormís** · g **sales** · h **aprobamos** · i **pides** · j **juegan**\n:::\n:::q U1 · p. 9 · Ex 4 · Completa os refranes no presente.\n?? a. A quien **madruga**, Dios le **ayuda** · b. En boca cerrada no **entran** moscas · c. No **hay** mal que por bien no venga · d. Bicho malo nunca **muere** · e. Ojos que no **ven**, corazón que no **siente** · f. A buen entendedor, pocas palabras **bastan** · g. El casado casa **quiere** · h. A caballo regalado no se le **mira** el diente\n:::\n:::q U1 · p. 9 · Ex 5 · Completa no presente e escolhe o significado: a. Posiblemente (salir) a las tres. b. (Ir) al cine a menudo. c. En España se (almorzar) sobre las dos. d. (Ir) a preparar el equipaje. e. (Haber) unas 100 personas. f. Los españoles (comer) sobre las 14:00. g. No (tener) ganas de salir, (estar) lloviendo a cántaros. h. A lo mejor (llegar, yo) tarde.\n?? a **sale** → 1 tal vez · b **Voy** → 2 a menudo/con frecuencia · c **almuerza** → 2 alrededor de · d **Voy** → 1 las maletas · e **Hay** → 2 aproximadamente · f **comemos** → 1 sobre las 14:00 · g **tengo**, **Está** → 2 mucho · h **llego** → 2 quizás\n:::\n:::q U1 · p. 10 · Ex 1 · Relaciona com as imagens: Me disgustan / Me encanta / No me gusta / Me gustan / Me molesta / Me dan miedo.\n?? a. Me disgustan **los libros de ciencia ficción** · b. Me encanta **esta película de animación** · c. No me gusta **este videojuego** · d. Me gustan **los días de calor** · e. Me molesta **la lluvia** · f. Me dan miedo **las películas de terror**\n:::\n:::q U1 · p. 10 · Ex 2 · Di o que gosta e não gosta o Miguel (imagens).\n?? a. Le gustan las zapatillas, pero no le gustan las botas · b. Le gusta jugar al fútbol, pero no le gusta jugar al baloncesto · c. Le gustan las manzanas, pero no le gustan las uvas · d. Le gusta viajar en tren, pero no le gusta viajar en avión · e. Le gustan las sudaderas, pero no le gustan los abrigos · f. Le gustan los animales salvajes, pero no le gustan las serpientes y las arañas\n:::\n:::q U1 · p. 11 · Ex 1 · Compara: a. Ana / deportista / María (=) b. Luisa / hablar / Hugo (−) c. Mi gato / divertido / mi perro (+) d. Mis abuelos / preocupaciones / mis padres (=)\n?? a. Ana es **tan** deportista **como** María · b. Luisa habla **menos que** Hugo · c. Mi gato es **más** divertido **que** mi perro · d. Mis abuelos tienen **tantas** preocupaciones **como** mis padres\n:::\n:::q U1 · p. 11 · Ex 2 · Escreve frases: a. haber famosos Madrid = Nueva York b. escuela de Pablo ser buena + escuela de Marcos c. Teresa estar nerviosa + Pepe d. Mi colegio ser exigente − el tuyo\n?? a. Hay **tantos** famosos en Madrid **como** en Nueva York · b. La escuela de Pablo es **mejor que** la de Marcos · c. Teresa está **más** nerviosa **que** Pepe · d. Mi colegio es **menos** exigente **que** el tuyo\n:::\n:::q U1 · p. 12 · Ex 1 · Sublinha os subjuntivos na tira do Gaturro e completa o ¡Ojo!: ser → (que yo)___, estar → ___, ir → ___\n?? Subjuntivos: **llames, me acuerde, mandes**. ¡Ojo! a partir da 1.ª **persona**; exceções: **sea, esté, vaya**.\n:::\n:::q U1 · p. 12 · Ex 2 · Completa a tabela de subjuntivo: a. yo digo b. ellas piensan c. nosotros vamos d. él está e. tú te diviertes f. vosotros cantáis g. yo salgo h. tú vienes\n?? a **(que) yo diga** · b **ellas piensen** · c **nosotros vayamos** · d **él esté** · e **tú te diviertas** · f **vosotros cantéis** · g **yo salga** · h **tú vengas**\n:::\n:::q U1 · p. 13 · Ex 4 · Sopa de letras: subjuntivo de ellos tienen, vosotros jugáis, tú vives, nosotros comemos, yo puedo, él abre, tú pones, me gusta, ella duerme.\n?? **tengan, juguéis, vivas, comamos, pueda, abra, pongas, guste, duerma**\n:::\n:::q U1 · p. 13 · Ex 5 · Relaciona: a. No creo que él b. Ojalá ellas c. Tal vez yo d. Queremos que vosotras e. Espero que nosotros f. Quiero que tú\n?? a-**4** me llame por teléfono · b-**3** lleguen a tiempo al aeropuerto · c-**6** consiga ganar este premio · d-**1** viajéis con nosotros · e-**2** consigamos las entradas · f-**5** me acompañes al parque\n:::\n:::q U1 · p. 13 · Ex 6 · Escreve frases: a. Quiero que / comprar las entradas / tú b. Ojalá / conseguir un buen lugar / ellos c. Tal vez / venir a mi fiesta / vosotras d. Espero que / llegar a tiempo al instituto / él e. Es mejor que / comprar un regalo para mi madre / yo\n?? a. Quiero que **compres** las entradas para el concierto · b. Ojalá **consigan** un buen lugar en el concierto · c. Tal vez **vengáis** a mi fiesta de cumpleaños · d. Espero que **llegue** a tiempo al instituto · e. Es mejor que **compre** un regalo para mi madre\n:::\n:::q U1 · DELE p. 14 · Ej 1 · Que mensagem corresponde a cada cartaz? 1 Hay que conducir despacio. 2 Participar no significa tener privilegios. 3 Hay que esperar. 4 Aparcamiento para discapacitados. 5 Estudiar español por Internet. 6 Comprar a precios reducidos 24 h.\n?? Soluções do caderno: **1-G · 2-F · 3-E · 4-H · 5-A · 6-B**. (1 = *En zona escolar, ¡disminuya la velocidad!* · 3 = *Sea paciente, espere su turno* · 4 = *Reservado* · 5 = *Cursos de español en línea* · 6 = *Black Friday 00:00–24:00*)\n:::\n:::q U1 · DELE p. 15 · Ej 2 · ¡Buenos días, princesa! 1. É um filme, desenho animado ou livro? 2. Como se pode comprar? 3. Opinião dos consumidores?\n?? 1 **un libro** · 2 **en papel y en formato digital** · 3 **muy favorable**\n:::\n:::q U1 · DELE p. 15 · Ej 2.4 · ¿V o F? Justifica: a. El club de los incomprendidos es un grupo reciente. b. Los chicos se mantienen unidos hasta hoy. c. Ester tiene un buen comportamiento.\n?? a **F**: *\"Han pasado más de dos años en la vida de los chicos que forman El club de los incomprendidos.\"* · b **V**: *\"hasta el momento, su amistad ha podido con todo y con todos\"* · c **V**: *\"Ester es la nuera que toda madre querría tener\"*\n:::"}, {"id": "90-preguntas-2", "title": "Unidad 2 · Familia y compañía", "pages": "Caderno de ejercicios ¡A bordo! 8 · Soluciones pp. 60–63", "part": "Ejercicios y soluciones", "md": ":::q U2 · p. 16 · Ex 1 · Completa a árvore do Marcos com as pistas.\n?? Avós **Antonio + María** → **Sofía** (mãe) + **Daniel** (pai); **Pablo** (tio) + **Ana** → primos **Enrique** e **Sara**. Filhos de Sofía e Daniel: **Nini** (mais velha), **Marcos**, **Charo** (mais nova).\n:::\n:::q U2 · p. 16 ·
