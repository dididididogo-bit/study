ícula na órbita).\n?? **1 – protão; 2 – neutrão; 3 – eletrão.** *(No livro, os protões são as esferas vermelhas com \"+\".)*\n:::\n:::q Para aplicar + · p. 42 · Q6.1 — X (10 protões, 11 neutrões) e Y (11 protões, 10 neutrões). N.º de eletrões?\n?? **X: 10 eletrões; Y: 11 eletrões** (num átomo, eletrões = protões; os neutrões não interessam).\n:::\n:::q Para aplicar + · p. 42 · Q6.2 — X e Y são do mesmo elemento?\n?? **Não**, porque têm **número de protões diferente** (10 e 11). X é néon e Y é sódio.\n:::\n:::q Para aplicar + · p. 42 · Q7 — Representa: a) 2 átomos de flúor; b) 1 molécula de dióxido de carbono; c) 2 iões cálcio; d) 3 moléculas de di-hidrogénio; e) 4 átomos de nitrogénio; f) ião do ferro que perdeu 2 eletrões; g) 5 moléculas de água; h) 3 átomos de oxigénio; i) 1 molécula de trioxigénio.\n?? a) **2 F**; b) **CO₂**; c) **2 Ca²⁺**; d) **3 H₂**; e) **4 N**; f) **Fe²⁺**; g) **5 H₂O**; h) **3 O**; i) **O₃**.\n:::\n:::q Para aplicar + · p. 43 · Q8 — A: 1 protão, 1 neutrão, 1 eletrão. B: 3 protões, 4 neutrões, 2 eletrões. C: 8 protões, 10 eletrões. D: 3 protões, 3 neutrões, 3 eletrões. Associa a átomo, catião ou anião.\n?? **A – átomo** (1 p = 1 e); **B – catião** (3 p > 2 e); **C – anião** (8 p < 10 e); **D – átomo** (3 p = 3 e).\n*(Conta as esferas vermelhas com \"+\" = protões e os pontos nas órbitas = eletrões.)*\n:::\n:::q Para aplicar + · p. 43 · Q9 — Serotonina C₁₀H₁₂N₂O: 9.1 n.º de elementos; 9.2 n.º de átomos numa molécula; 9.3 4 moléculas; 9.4 átomos em 2 moléculas.\n?? 9.1 **4 elementos** (C, H, N, O). 9.2 10 + 12 + 2 + 1 = **25 átomos**. 9.3 **4 C₁₀H₁₂N₂O**. 9.4 2 × 25 = **50 átomos**.\n:::\n:::q Para aplicar + · p. 43 · Q10 — Piada: sinal de \"piso molhado\" rodeado de moléculas de água \"secas\" (esferas vermelhas e brancas espalhadas). Explica.\n?? O aviso diz \"piso molhado\", mas no chão estão representadas **moléculas de água (H₂O)** — 1 esfera vermelha (oxigénio) e 2 brancas (hidrogénio). A piada é que o chão está literalmente \"molhado\" com moléculas de água desenhadas — a água a nível submicroscópico!\n:::\n:::q Para aplicar + · p. 43 · Q11.1 — Unidade estrutural de A (sódio metálico), B (dicloro) e C (cloreto de sódio).\n?? A – **átomos** (Na); B – **moléculas** (Cl₂); C – **iões** (Na⁺ e Cl⁻).\n:::\n:::q Para aplicar + · p. 43 · Q11.2 — Elementares ou compostas? Justifica.\n?? **A e B são elementares** (formadas por um só elemento: sódio; cloro). **C é composta** (formada por dois elementos: sódio e cloro).\n:::\n:::q Para aplicar + · p. 43 · Q11.3 — Fórmula química de cada uma.\n?? A – **Na**; B – **Cl₂**; C – **NaCl**.\n:::\n:::q Para aplicar + · p. 43 · Q11.4 — \"O ião cloreto tem ___ um eletrão do que o átomo de cloro e o ião sódio tem ___ um eletrão do que o átomo de sódio.\"\n?? O ião cloreto tem **mais** um eletrão… o ião sódio tem **menos** um eletrão.\n:::\n:::q Para aplicar + · p. 43 · Q12.1 — Iões em: A. fluoreto de sódio; B. sulfato de ferro(II); C. MgSO₄; D. KCl.\n?? A – **Na⁺ e F⁻**; B – **Fe²⁺ e SO₄²⁻**; C – **Mg²⁺ e SO₄²⁻**; D – **K⁺ e Cl⁻**.\n:::\n:::q Para aplicar + · p. 43 · Q12.2 — Nome dos compostos C e D.\n?? C – **sulfato de magnésio**; D – **cloreto de potássio**.\n:::\n:::q Para aplicar + · p. 43 · Q12.3 — Fórmula de A e B.\n?? A – **NaF**; B – **FeSO₄**.\n:::", "chapter": "05-ioes-compostos-ionicos"}, {"id": "06-reacoes-quimicas-lavoisier", "title": "1.6 Reações químicas, Lei de Lavoisier e equações químicas", "pages": "44–53", "part": "Reações Químicas", "md": "## Atividade prática 7 — Será possível obter um sólido juntando duas soluções aquosas?\n:::q AP7 · p. 45 · Como explicas o que aconteceu (ponto 5)?\n?? Formou-se de imediato um **sólido amarelo** (precipitado) — evidência de que ocorreu uma **reação química** (formou-se uma nova substância, insolúvel em água).\n:::\n:::q AP7 · p. 45 · Escreve a \"equação\" de palavras.\n?? **Nitrato de chumbo(II) (aq) + Iodeto de potássio (aq) → Di-iodeto de chumbo (s) + Nitrato de potássio (aq)**\nReagentes: nitrato de chumbo(II) e iodeto de potássio. Produtos: di-iodeto de chumbo e nitrato de potássio.\n:::\n:::q AP7 · p. 45 · Lê a \"equação\" de palavras.\n?? \"Nitrato de chumbo(II) em solução aquosa reage com iodeto de potássio em solução aquosa, originando di-iodeto de chumbo no estado sólido e nitrato de potássio em solução aquosa.\"\n:::\n:::q AP7 · p. 45 · Fórmula química dos reagentes e produtos.\n?? Nitrato de chumbo(II): **Pb(NO₃)₂**; iodeto de potássio: **KI**; di-iodeto de chumbo: **PbI₂**; nitrato de potássio: **KNO₃**.\nEquação acertada: **Pb(NO₃)₂(aq) + 2 KI(aq) → PbI₂(s) + 2 KNO₃(aq)**\n:::\n:::q AP7 · p. 45 · Questão-problema: é possível obter um sólido juntando duas soluções aquosas?\n?? **Sim.** Quando se juntam certas soluções aquosas, pode formar-se um sólido insolúvel (**precipitado**), como o di-iodeto de chumbo (amarelo).\n:::\n## Atividade prática 8 — O que acontece à massa total durante uma reação?\n:::q AP8 · p. 46 · O que significa o valor registado no ponto 5 e no ponto 7?\n?? Ponto 5: a **massa total do sistema antes da reação** (reagentes + gobelés). Ponto 7: a **massa total depois da reação** (produtos + gobelés). Os dois valores são **iguais**.\n:::\n:::q AP8 · p. 46 · Houve novas substâncias? E variação da massa?\n?? **Sim**, formou-se um sólido azul (nova substância) — houve reação química. A **massa total não variou**.\n:::\n:::q AP8 · p. 46 · \"Equação\" de palavras da reação.\n?? **Sulfato de cobre(II) (aq) + Hidróxido de sódio (aq) → Di-hidróxido de cobre (s) + Sulfato de sódio (aq)**\n(Em fórmulas: CuSO₄(aq) + 2 NaOH(aq) → Cu(OH)₂(s) + Na₂SO₄(aq))\n:::\n:::q AP8 · p. 46 · Questão-problema: o que acontece à massa total?\n?? A massa total dos reagentes e dos produtos **mantém-se constante**: a massa dos reagentes diminui e a dos produtos aumenta, mas a soma não varia.\n:::\n## É sempre possível comprovar a conservação da massa?\n:::q AP9 · p. 47 · Como verificar a Lei de Lavoisier na reação entre o ácido acético e o hidrogenocarbonato de sódio?\n?? Fazer a reação em **sistema fechado**: colocar o hidrogenocarbonato de sódio dentro de um **balão** e prender o balão à boca do erlenmeyer com ácido acético. Pesar o conjunto, depois virar o balão para o pó cair no ácido (o CO₂ fica preso no balão — o balão enche). Pesar de novo: a massa é **igual**, verificando a Lei de Lavoisier.\n:::\n## Atividade prática 10 — Eletrólise da água (p. 50)\n:::q AP10 · p. 50 · Com os átomos de UMA molécula de água consegues construir uma molécula de O₂ e uma de H₂? Porquê?\n?? **Não.** Uma molécula de água só tem **1 átomo de oxigénio** e a molécula de dioxigénio precisa de **2**.\n:::\n:::q AP10 · p. 50 · Quantas moléculas de água são precisas para obter uma molécula de dioxigénio?\n?? **Duas** moléculas de água (que têm 2 átomos de O).\n:::\n:::q AP10 · p. 50 · Com duas moléculas de água, quantas moléculas de H₂ e O₂ se obtêm?\n?? **Duas moléculas de di-hidrogénio** e **uma molécula de dioxigénio** (4 átomos de H e 2 de O de cada lado).\n:::\n## Investigo e comunico — De onde vem a maior parte do dioxigénio que respiramos? Florestas ou mar? (p. 54)\n:::q Investigo e comunico · p. 54 · Q1 — Fórmulas e percentagens dos dois principais constituintes do ar.\n?? **N₂ (dinitrogénio) ≈ 78 %** e **O₂ (dioxigénio) ≈ 21 %**.\n:::\n:::q Investigo e comunico · p. 54 · Q2 — Processo pelo qual plantas, algas e fitoplâncton produzem dioxigénio.\n?? **Fotossíntese.**\n:::\n:::q Investigo e comunico · p. 54 · Q3 — Agente que desencadeia essa reação.\n?? A **luz** (energia luminosa do Sol).\n:::\n:::q Investigo e comunico · p. 54 · Q4 — Fórmulas dos reagentes.\n?? **CO₂** (dióxido de carbono) e **H₂O** (água).\n:::\n:::q Investigo e comunico · p. 54 · Q5 — Fórmula da glicose (6 C, 12 H, 6 O).\n?? **C₆H₁₂O₆**.\n:::\n:::q Investigo e comunico · p. 54 · Q6 — Equação acertada da fotossíntese.\n?? **6 CO₂(g) + 6 H₂O(l) → C₆H₁₂O₆(aq) + 6 O₂(g)**\n:::\n:::q Investigo e comunico · p. 54 · Q7 — Florestas ou mar?\n?? Do **mar**. Estima-se que mais de metade (cerca de **50 a 80 %**) do O₂ da Terra seja produzido pelo **fitoplâncton** e algas dos oceanos; as florestas produzem o restante (e consomem grande parte do que produzem na respiração).\n:::\n## Para aplicar (p. 55)\n:::q Para aplicar · p. 55 · Q1 — Numa reação química: A. os produtos transformam-se em reagentes; B. os átomos dos reagentes rearranjam-se e formam novas substâncias; C. os átomos rearranjam-se e formam novos elementos químicos; D. a massa dos reagentes aumenta e a dos produtos diminui.\n?? **B.**\n:::\n:::q Para aplicar · p. 55 · Q2.1 — Solução aquosa de CaCl₂ + solução aquosa de Na₂SO₄ → CaSO₄(s) + NaCl(aq). Nomes das substâncias.\n?? Reagentes: **dicloreto de cálcio** (CaCl₂) e **sulfato de sódio** (Na₂SO₄). Produtos: **sulfato de cálcio** (CaSO₄) e **cloreto de sódio** (NaCl).\n:::\n:::q Para aplicar · p. 55 · Q2.2 — Equação química acertada.\n?? **CaCl₂(aq) + Na₂SO₄(aq) → CaSO₄(s) + 2 NaCl(aq)**\n:::\n:::q Para aplicar · p. 55 · Q2.3 — Que valor marcará a balança no final? Justifica.\n?? O **mesmo valor do início**. Pela **Lei de Lavoisier**, a massa total conserva-se (não há gases a escapar — o sistema não perde matéria).\n:::\n:::q Para aplicar · p. 55 · Q3.1 — Ca(s) + O₂(g) → CaO(s): nomes das substâncias.\n?? **Cálcio**, **dioxigénio** e **óxido de cálcio**.\n:::\n:::q Para aplicar · p. 55 · Q3.2 — A equação está acertada? Justifica.\n?? **Não.** Há 2 átomos de O nos reagentes e só 1 nos produtos. Acertada: **2 Ca(s) + O₂(g) → 2 CaO(s)**.\n:::\n:::q Para aplicar · p. 55 · Q3.3 — Massa de O₂ que reage com 8 g de Ca para obter 11,2 g de CaO.\n?? Pela Lei de Lavoisier: m(Ca) + m(O₂) = m(CaO) → m(O₂) = 11,2 − 8 = **3,2 g**.\n:::\n:::q Para aplicar · p. 55 · Q4 — Acerta: A. Ca + H₂O → Ca(OH)₂ + H₂; B. H₂ + F₂ → HF; C. CO + O₂ → CO₂\n?? A. **Ca(s) + 2 H₂O(l) → Ca(OH)₂(aq) + H₂(g)**\nB. **H₂(g) + F₂(g) → 2 HF(g)**\nC. **2 CO(g) + O₂(g) → 2 CO₂(g)**\n:::\n:::q Para aplicar · p. 55 · Q5.1 — Sódio + água → solução de hidróxido de sódio + di-hidrogénio. Reagentes e produtos?\n?? Reagentes: **sódio e água**. Produtos: **hidróxido de sódio e di-hidrogénio**.\n:::\n:::q Para aplicar · p. 55 · Q5.2 — Nome e fórmula dos reagentes.\n?? **Sódio, Na** e **água, H₂O**.\n:::\n:::q Para aplicar · p. 55 · Q5.3 — Nome e fórmula dos produtos.\n?? **Hidróxido de sódio, NaOH** e **di-hidrogénio, H₂**.\n:::\n:::q Para aplicar · p. 55 · Q5.4 — Equação acertada.\n?? **2 Na(s) + 2 H₂O(l) → 2 NaOH(aq) + H₂(g)**\n:::\n:::q Para aplicar · p. 55 · Q6.1 — CH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(g) está de acordo com a Lei de Lavoisier?\n?? **Sim.** Reagentes: 1 C, 4 H, 4 O. Produtos: 1 C, 4 H, 2 + 2 = 4 O. O número de átomos de cada elemento é igual, logo a massa conserva-se.\n:::\n:::q Para aplicar · p. 55 · Q6.2 — Quantos átomos estão envolvidos na reação?\n?? **9 átomos** (1 C + 4 H + 4 O) — os mesmos 9 nos reagentes e nos produtos.\n:::\n:::q Para aplicar · p. 55 · Q6.3 — A. Uma molécula de metano reage com (a) moléculas de O₂, originando (b) molécula de CO₂ e (c) moléculas de água. B. Quando reagem quatro moléculas de O₂, originam-se (d) moléculas de CO₂.\n?? (a) **2**; (b) **1**; (c) **2**; (d) **2** (a proporção O₂ : CO₂ é 2 : 1).\n:::\n## Para aplicar + (pp. 56–57)\n:::q Para aplicar + · p. 56 · Q1.1 — Esquema: CH₄ + 2 O₂ → CO₂ + 2 H₂O (modelos). É uma transformação química? Justifica.\n?? **Sim**, porque se formam **novas substâncias** (dióxido de carbono e água) a partir do metano e do dioxigénio — há rearranjo dos átomos.\n:::\n:::q Para aplicar + · p. 56 · Q1.2 — Nome e fórmula dos reagentes.\n?? **Metano, CH₄** e **dioxigénio, O₂**.\n:::\n:::q Para aplicar + · p. 56 · Q1.3 — Nome e fórmula dos produtos.\n?? **Dióxido de carbono, CO₂** e **água, H₂O**.\n:::\n:::q Para aplicar + · p. 56 · Q1.4 — Equação acertada.\n?? **CH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(g)**\n:::\n:::q Para aplicar + · p. 56 · Q2 — C(s) + O₂(g) → CO₂(g). Ensaio 1: 6 g C + 16 g O₂ → x; ensaio 2: 36 g C + y → 132 g CO₂.\n?? **x = 6 + 16 = 22 g.** **y = 132 − 36 = 96 g.** (Lei de Lavoisier: massa dos reagentes = massa dos produtos.)\n:::\n:::q Para aplicar + · p. 56 · Q3 — Acerta: A. Cl₂ + H₂ → HCl; B. NH₃ → N₂ + H₂; C. SO₂ + O₂ → SO₃; D. Al + HCl → AlCl₃ + H₂\n?? A. **Cl₂(g) + H₂(g) → 2 HCl(g)**\nB. **2 NH₃(g) → N₂(g) + 3 H₂(g)**\nC. **2 SO₂(g) + O₂(g) → 2 SO₃(g)**\nD. **2 Al(s) + 6 HCl(aq) → 2 AlCl₃(aq) + 3 H₂(g)**\n:::\n:::q Para aplicar + · p. 56 · Q4 — Filme fotográfico: brometo de prata (s) → prata (s) + dibromo (g). Equação acertada.\n?? **2 AgBr(s) → 2 Ag(s) + Br₂(g)**\n:::\n:::q Para aplicar + · p. 56 · Q5.1 — Nome do material de vidro representado.\n?? **Erlenmeyer** (balão de Erlenmeyer) e **gobelé** (copo de laboratório).\n:::\n:::q Para aplicar + · p. 56 · Q5.2 — Acerta K₂CO₃(s) + HNO₃(aq) → KNO₃(aq) + H₂O(l) + CO₂(g).\n?? **K₂CO₃(s) + 2 HNO₃(aq) → 2 KNO₃(aq) + H₂O(l) + CO₂(g)**\n:::\n:::q Para aplicar + · p. 56 · Q5.3 — O valor final na balança será maior, menor ou igual ao inicial? Justifica.\n?? **Menor.** A reação ocorreu em **sistema aberto** e um dos produtos, o **CO₂, é gasoso e escapa** para a atmosfera, por isso a sua massa não é medida. A Lei de Lavoisier continua válida, mas só se verificaria num **sistema fechado**.\n:::\n:::q Para aplicar + · p. 56 · Q6.1 — Magnésio + dioxigénio → óxido de magnésio. Reagentes e produtos.\n?? Reagentes: **magnésio** e **dioxigénio**. Produto: **óxido de magnésio**.\n:::\n:::q Para aplicar + · p. 56 · Q6.2 — Durante a reação: A. parte dos átomos desaparece e formam-se novos átomos; B. diminuição dos átomos de magnésio; C. conservação da massa total dos reagentes; D. o n.º total de átomos de cada elemento manteve-se.\n?? **D** (e a massa total do sistema conserva-se). A e B são falsas. C não é o termo correto: o que se conserva é a massa **total do sistema** (reagentes + produtos), não a massa dos reagentes, que diminui.\n:::\n:::q Para aplicar + · p. 56 · Q6.3 — Fórmula do óxido de magnésio.\n?? Mg²⁺ + O²⁻ → **MgO**.\n:::\n:::q Para aplicar + · p. 56 · Q6.4 — Equação acertada.\n?? **2 Mg(s) + O₂(g) → 2 MgO(s)**\n:::\n:::q Para aplicar + · p. 57 · Q7.1 — Dicloreto de cobre em solução decompõe-se por ação da corrente elétrica, libertando dicloro e cobre. Agente responsável?\n?? A **corrente elétrica** (é uma eletrólise).\n:::\n:::q Para aplicar + · p. 57 · Q7.2 — Fórmula do dicloreto de cobre.\n?? **CuCl₂** (Cu²⁺ + 2 Cl⁻).\n:::\n:::q Para aplicar + · p. 57 · Q7.3 — Equação acertada.\n?? **CuCl₂(aq) → Cu(s) + Cl₂(g)**\n:::\n:::q Para aplicar + · p. 57 · Q8.1 — N₂(g) + 2 O₂(g) → 2 NO₂(g). Nomes dos reagentes.\n?? **Dinitrogénio** e **dioxigénio**.\n:::\n:::q Para aplicar + · p. 57 · Q8.2 — Explica (teoria cinético-corpuscular e Lei de Lavoisier).\n?? As moléculas de N₂ e O₂, em constante movimento, **colidem de forma eficaz**: quebram-se as ligações entre os átomos dos reagentes e formam-se novas ligações, originando moléculas de NO₂ (**rearranjo dos átomos**). O número de átomos de cada elemento mantém-se (2 N e 4 O de cada lado), por isso a **massa total conserva-se** (Lei de Lavoisier).\n:::\n:::q Para aplicar + · p. 57 · Q8.3 — Quantos átomos em duas moléculas de NO₂?\n?? 2 × 3 = **6 átomos** (2 de N e 4 de O).\n:::\n:::q Para aplicar + · p. 57 · Q8.4 — Quantos elementos há no dióxido de nitrogénio?\n?? **Dois:** nitrogénio (N) e oxigénio (O).\n:::\n:::q Para aplicar + · p. 57 · Q8.5 — \"Uma molécula de (a) reage com (b) moléculas de (c), originando (d) moléculas de (e).\"\n?? (a) **dinitrogénio**; (b) **duas**; (c) **dioxigénio**; (d) **duas**; (e) **dióxido de nitrogénio**.\n:::\n:::q Para aplicar + · p. 57 · Q8.6 — Quantas moléculas de NO₂ se formam com 4 moléculas de N₂?\n?? **8 moléculas** (proporção 1 N₂ : 2 NO₂).\n:::\n:::q Para aplicar + · p. 57 · Q9 — Carbonato de magnésio (s) → óxido de magnésio (s) + dióxido de carbono (g). Equação acertada.\n?? **MgCO₃(s) → MgO(s) + CO₂(g)**\n:::\n:::q Para aplicar + · p. 57 · Q10.1 — Modelos: 2 moléculas (1 S amarelo + 2 O vermelhos) + 1 molécula (2 O) → 2 moléculas (1 S + 3 O). Fórmulas.\n?? Reagentes: **SO₂** (dióxido de enxofre) e **O₂** (dioxigénio). Produto: **SO₃** (trióxido de enxofre).\n:::\n:::q Para aplicar + · p. 57 · Q10.2 — Equação acertada (substâncias com enxofre no estado sólido).\n?? **2 SO₂(s) + O₂(g) → 2 SO₃(s)** *(estados físicos como indicados no enunciado)*\n:::\n:::q Para aplicar + · p. 57 · Q10.3 — \"O n.º de moléculas dos reagentes é ___ n.º de moléculas dos produtos e o n.º de átomos dos reagentes é ___ n.º de átomos dos produtos.\"\n?? **maior do que o** (3 moléculas vs. 2) · **igual ao** (8 átomos de cada lado).\n:::\n:::q Para aplicar + · p. 57 · Q11.1 — Nitrato de prata (aq) + cloreto de sódio (aq) → cloreto de prata (s) + nitrato de sódio (aq). Equação acertada.\n?? **AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)**\n:::\n:::q Para aplicar + · p. 57 · Q11.2 — Massa de AgCl a partir de 3,30 g de reagentes, obtendo-se 1,24 g de NaNO₃.\n?? m(AgCl) = 3,30 − 1,24 = **2,06 g** (Lei de Lavoisier).\n:::", "chapter": "06-reacoes-quimicas-lavoisier"}, {"id": "07-combustao", "title": "2.1 Reações de combustão e triângulo de fogo", "pages": "58–64", "part": "Reações Químicas", "md": "## Atividade prática 11 — Como distinguir o combustível do comburente? (p. 62)\n:::q AP11 · p. 62 · a) Reagentes e produtos da combustão do enxofre.\n?? Reagentes: **enxofre (S)** e **dioxigénio (O₂)**. Produto: **dióxido de enxofre (SO₂)**.\n**S(s) + O₂(g) → SO₂(g)**\n:::\n:::q AP11 · p. 62 · b) Combustível e comburente de todas as combustões.\n?? **Combustíveis:** enxofre, palha de aço (ferro) e magnésio. **Comburente:** o **dioxigénio** do ar (em todas).\n:::\n:::q AP11 · p. 62 · c) \"Equação\" de palavras e equação acertada da combustão do magnésio.\n?? **Magnésio (s) + Dioxigénio (g) → Óxido de magnésio (s)**\n**2 Mg(s) + O₂(g) → 2 MgO(s)**\n:::\n:::q AP11 · p. 62 · Questão-problema: como distinguir o combustível do comburente?\n?? O **combustível** é o material que **arde** (enxofre, ferro, magnésio); o **comburente** é o material que **permite** a combustão — aqui, o **dioxigénio do ar**. Sem dioxigénio (frasco fechado), a combustão para.\n*(Extra: palha de aço → 2 Fe(s) + O₂(g) → 2 FeO(s) e 4 Fe(s) + 3 O₂(g) → 2 Fe₂O₃(s).)*\n:::\n## Atividade prática 12 — Dispositivos de segurança no laboratório escolar (p. 64)\n:::q AP12 · p. 64 · Que dispositivos existem e onde estão?\n?? **Extintor**, **manta antifogo**, **caixa de areia**, **saídas de emergência** (e sinalização, por vezes chuveiro de emergência e lava-olhos). Localiza-os no laboratório da tua escola.\n:::\n:::q AP12 · p. 64 · Exemplos de incêndios e como os apagar.\n?? **Papel/madeira** na bancada → **água** (arrefecer). **Álcool ou óleo** derramado a arder → **areia** ou **manta antifogo** (abafar) ou **extintor**. **Roupa de alguém a arder** → **manta antifogo** (abafar; deitar e rebolar). **Equipamento elétrico** → **extintor seco/CO₂** (nunca água).\n:::\n:::q AP12 · p. 64 · Forma de atuação dos alunos num incêndio no laboratório.\n?? Manter a calma, **avisar o professor**, desligar o gás/equipamentos se possível, **sair de forma rápida, ordeira e silenciosa** pela saída de emergência, seguindo o plano de evacuação, e dirigir-se ao ponto de encontro.\n:::", "chapter": "07-combustao"}, {"id": "08-efeito-estufa", "title": "2.2 Efeito de estufa e aquecimento global", "pages": "65–69", "part": "Reações Químicas", "md": "## Tarefa interdisciplinar (CN, Geografia, Cidadania) — SOS Terra\n:::q Tarefa interdisciplinar · p. 68 · Q1 — Nome e fórmula de três GEE.\n?? **Dióxido de carbono, CO₂**; **metano, CH₄**; **monóxido de dinitrogénio, N₂O** (também vapor de água H₂O e CFC).\n:::\n:::q Tarefa interdisciplinar · p. 68 · Q2 — Porque são as combustões responsáveis pelas alterações climáticas?\n?? As combustões de **combustíveis fósseis** (carros, fábricas, centrais elétricas) e os **incêndios** libertam grandes quantidades de **CO₂**, que se acumula na atmosfera, **intensificando o efeito de estufa** e aumentando a temperatura global.\n:::\n:::q Tarefa interdisciplinar · p. 68 · Q3 — Quatro consequências das alterações climáticas.\n?? 1) **Temperaturas extremas** e fenómenos extremos (furacões, tempestades, secas, inundações); 2) **subida do nível do mar** (degelo); 3) **perda de biodiversidade** (ex.: aquecimento dos oceanos); 4) **problemas de saúde**, perda de colheitas e migrações de populações.\n:::\n:::q Tarefa interdisciplinar · p. 68 · Q4 — Medidas para minimizar a emissão de GEE.\n?? Usar transportes públicos, bicicleta ou andar a pé; usar **energias renováveis**; poupar eletricidade; reflorestar e prevenir incêndios; comer menos carne; reduzir, reutilizar e reciclar (ver lista abaixo).\n:::\n## Investigo e comunico — Vamos salvar o clima! (p. 70)\n:::q Investigo e comunico · p. 70 · Q1 — Principais substâncias poluentes gasosas emitidas pelas combustões.\n?? **Dióxido de carbono (CO₂)**, **monóxido de carbono (CO)**, **dióxido de enxofre (SO₂)** e **óxidos de nitrogénio (NO, NO₂)**, além de partículas (fumo/fuligem).\n:::\n:::q Investigo e comunico · p. 70 · Q2 — Principais consequências dessas emissões.\n?? **Aumento do efeito de estufa** → **aquecimento global** e **alterações climáticas** (subida do nível do mar, fenómenos extremos, perda de biodiversidade); **chuvas ácidas** (SO₂ e NOₓ); **smog** e pior qualidade do ar → problemas respiratórios.\n:::\n:::q Investigo e comunico · p. 70 · Q3 — Medidas individuais e da sociedade.\n?? **Individuais:** andar a pé, de bicicleta ou de transportes públicos; poupar eletricidade; reduzir, reutilizar, reciclar; comer menos carne; preferir produtos locais. **Sociedade:** investir em **energias renováveis**, transportes públicos e carros elétricos; reflorestar e prevenir incêndios; leis que limitem as emissões das indústrias.\n:::\n:::q Investigo e comunico · p. 70 · Q4 — Infografia.\n?? Trabalho prático: junta as respostas 1–3 com um título (ex.: \"Vamos salvar o clima!\") e imagens.\n:::\n## Para aplicar (p. 71)\n:::q Para aplicar · p. 71 · Q1.1 — Evidências de reação química na combustão do carvão.\n?? **Formação de chama** (luz), **libertação de energia/alteração de temperatura** (calor) e **formação de gases** (fumo); o carvão muda de aspeto (cinzas).\n:::\n:::q Para aplicar · p. 71 · Q1.2 — Combustível e comburente.\n?? Combustível: **carvão (carbono)**. Comburente: **dioxigénio** do ar.\n:::\n:::q Para aplicar · p. 71 · Q1.3 — Reagentes e produtos.\n?? Reagentes: **carbono e dioxigénio**. Produto: **dióxido de carbono**.\n:::\n:::q Para aplicar · p. 71 · Q1.4 — \"Equação\" de palavras correta: A. Carvão(s) + Ar(g) → Dióxido de carbono(g); B. Carbono(s) + Ar(g) → Fumo(g); C. Carbono(s) + Dioxigénio(g) → Dióxido de carbono(g); D. Carbono(s) + Dioxigénio(g) + Energia → Dióxido de carbono(g)\n?? **C.** (O ar e o carvão são misturas, não substâncias; a energia não é um reagente.)\n:::\n:::q Para aplicar · p. 71 · Q2 — Na reação de combustão: A. consome-se apenas o comburente e produz-se combustível; B. a fonte de energia é um dos reagentes; C. consomem-se o comburente e o combustível; D. ocorre uma transformação física.\n?? **C.**\n:::\n:::q Para aplicar · p. 71 · Q3 — Combustível e comburente: A. lenha na lareira; B. vela acesa; C. motor a gasolina; D. incêndio florestal; E. explosão de uma botija de butano.\n?? Combustíveis: A – **lenha**; B – **cera (parafina)**; C – **gasolina**; D – **madeira/vegetação**; E – **gás butano**. Comburente em todas: **dioxigénio** (do ar).\n:::\n:::q Para aplicar · p. 71 · Q4.1 — Palha de aço (ferro) → trióxido de diferro. \"Equação\" de palavras e equação química.\n?? **Ferro (s) + Dioxigénio (g) → Trióxido de diferro (s)**\nFe(s) + O₂(g) → Fe₂O₃(s) (por acertar)\n:::\n:::q Para aplicar · p. 71 · Q4.2 — Combustível e comburente.\n?? Combustível: **ferro (palha de aço)**. Comburente: **dioxigénio**.\n:::\n:::q Para aplicar · p. 71 · Q4.3 — Equação acertada.\n?? **4 Fe(s) + 3 O₂(g) → 2 Fe₂O₃(s)**\n(Fe: 4 = 2 × 2; O: 3 × 2 = 6 = 2 × 3 ✓)\n:::\n:::q Para aplicar · p. 71 · Q5.1/5.2 — Triângulo de fogo com exemplos.\n?? Lados: **Combustível** (ex.: madeira), **Comburente** (ex.: dioxigénio), **Fonte de energia** (ex.: chama de um fósforo).\n:::\n:::q Para aplicar · p. 71 · Q5.3 — Três métodos de extinção.\n?? 1) **Abafar** (retirar o comburente) — tapar com manta antifogo, areia, tampa. 2) **Arrefecer** (retirar a fonte de energia) — água em madeira/papel. 3) **Retirar o combustível** — fechar a válvula do gás, abrir aceiros na floresta.\n:::\n:::q Para aplicar · p. 71 · Q6.1 — Acerta: 1. CH₄ + O₂ → CO₂ + H₂O; 2. Al + O₂ → Al₂O₃; 3. C₂H₆O + O₂ → CO₂ + H₂O; 4. Mg + O₂ → MgO\n?? 1. **CH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(g)**\n2. **4 Al(s) + 3 O₂(g) → 2 Al₂O₃(s)**\n3. **C₂H₆O(aq) + 3 O₂(g) → 2 CO₂(g) + 3 H₂O(g)** (O: 1 + 6 = 7 = 4 + 3 ✓)\n4. **2 Mg(s) + O₂(g) → 2 MgO(s)**\n:::\n:::q Para aplicar · p. 71 · Q6.2 — Combustível e comburente em cada uma.\n?? Combustíveis: 1 – **metano**; 2 – **alumínio**; 3 – **etanol (C₂H₆O)**; 4 – **magnésio**. Comburente em todas: **dioxigénio**.\n:::", "chapter": "08-efeito-estufa"}, {"id": "09-acidos-bases-ph", "title": "2.3 Ácidos, bases, pH e indicadores", "pages": "72–77", "part": "Reações Químicas", "md": "## Atividade prática 13 — As soluções ácidas e básicas concentradas são perigosas? (p. 75)\n:::q AP13 · p. 75 · Nome do pictograma (líquido a corroer uma mão e um material), cuidados e proteção individual.\n?? Pictograma **\"Corrosivo\"**: provoca queimaduras graves na pele e lesões oculares, e corrói metais.\n**Cuidados:** não tocar, não cheirar diretamente, não provar; manusear na *hotte*; diluir adicionando **sempre o ácido/base à água**, devagar; manter fechado e bem rotulado.\n**Proteção individual:** **bata**, **luvas** e **óculos de proteção**.\n:::\n:::q AP13 · p. 75 · Símbolos de precaução/obrigação para o rótulo.\n?? Sinais azuis de **obrigação**: \"uso obrigatório de **luvas**\", \"uso obrigatório de **óculos de proteção**\", \"uso obrigatório de **bata**\" (e, se aplicável, de máscara).\n:::\n:::q AP13 · p. 75 · Questão-problema: são perigosas?\n?? **Sim.** As soluções ácidas e básicas **concentradas** são **corrosivas**: podem destruir tecidos vivos (pele, olhos) e materiais. Devem ser manuseadas com equipamento de proteção e diluídas antes de usar.\n:::\n## Atividade prática 14 (em estações) — Como determinar o caráter ácido-base e o pH? (pp. 78–79)\n:::q AP14 · p. 79 · Resultados esperados (vinagre, limpa-vidros, água da torneira).\n?? **Vinagre:** pH ≈ 2–3 → **ácido** (fenolftaleína incolor, tornesol vermelho).\n**Limpa-vidros** (amoniacal): pH ≈ 10–11 → **básico** (fenolftaleína carmim, tornesol azul).\n**Água da torneira:** pH ≈ 6,5–8 → **aproximadamente neutra** (fenolftaleína incolor, tornesol azul-arroxeado).\nA solução desconhecida classifica-se da mesma forma, pelo pH medido.\n:::\n:::q AP14 · p. 79 · Vantagens e desvantagens de cada técnica.\n?? **Papel indicador:** rápido, fácil e barato; menos rigoroso (valor aproximado por comparação de cores).\n**Medidor de pH:** **mais rigoroso** (valor exato); mais caro, mais demorado, precisa de calibração e lavagem.\n**Indicadores em solução (fenolftaleína, tornesol):** simples; só dizem se é **ácida, neutra ou básica** — **não dão o valor do pH** (e a fenolftaleína não distingue ácida de neutra).\n:::\n:::q AP14 · p. 79 · Questão-problema.\n?? Para saber se é ácida, básica ou neutra usa-se um **indicador ácido-base** (ex.: tornesol); para saber o **valor do pH** usa-se o **papel indicador universal** ou, com mais rigor, o **medidor de pH**.\n:::\n## Atividade prática 15 — Características ácido-base da água engarrafada (p. 80)\n:::q AP15 · p. 80 · \"Na maior parte dos casos, a água no norte do país é mais ___, enquanto no sul a água é mais ___.\"\n?? No **norte** é mais **ácida** (solos graníticos); no **sul** é mais **básica** (solos calcários). A tua região depende do rótulo/local.\n:::\n:::q AP15 · p. 80 · Qual a água mais básica e a mais ácida?\n?? Depende dos rótulos: a de **maior pH** é a mais básica e a de **menor pH** a mais ácida.\n:::\n## Atividade prática 16 — Características ácido-base da água da chuva (p. 81)\n:::q AP16 · p. 81 · O que acontece ao pH ao soprar?\n?? O pH **diminui** (a água fica mais **ácida**). O ar expirado tem mais **CO₂**, que reage com a água formando **ácido carbónico**. O gobelé apenas exposto ao ar também fica ligeiramente ácido, mas menos.\n:::\n:::q AP16 · p. 81 · Diferença na composição do ar inspirado e expirado.\n?? O ar **expirado** tem **mais dióxido de carbono** (≈4 % vs. ≈0,04 %) e **mais vapor de água**, e **menos dioxigénio** (≈16 % vs. ≈21 %) do que o ar inspirado. O dinitrogénio mantém-se (≈78 %).\n:::\n:::q AP16 · p. 81 · Questão-problema: características ácido-base da água da chuva.\n?? A água da chuva é **ligeiramente ácida** (pH ≈ 5,6) porque dissolve o **CO₂** do ar, formando **ácido carbónico**.\n:::", "chapter": "09-acidos-bases-ph"}, {"id": "10-reacoes-acido-base", "title": "2.4 Chuva ácida e reações ácido-base (neutralização)", "pages": "82–85", "part": "Reações Químicas", "md": "## Atividade prática 17 — Como se ajusta o pH da água de uma piscina? (pp. 84–85)\n:::q AP17 · p. 85 · Como variou o pH ao adicionar a solução básica? E a ácida?\n?? Com a **base**, o pH **aumentou** (a fenolftaleína acabou por ficar **carmim** — a solução ficou básica). Com o **ácido**, o pH **diminuiu** (o tornesol passou a **vermelho** — ficou mais ácida).\n:::\n:::q AP17 · p. 85 · Qual dos produtos deve o Raul usar?\n?? O **carbonato de sódio (base)**: o pH 6,8 está **abaixo** do recomendado (7,2–7,6) — a água está ligeiramente **ácida** e é preciso **aumentar** o pH.\n:::\n## Investigo e comunico — O aquário saudável (p. 86)\n:::q Investigo e comunico · p. 86 · Q1 — \"Há peixes que preferem ambientes ligeiramente ácidos e outros alcalinos.\" Concordas?\n?? **Sim.** O pH adequado varia entre **6 e 8** conforme a espécie: valores entre 6 e 7 são ligeiramente ácidos e entre 7 e 8 ligeiramente alcalinos, por isso há espécies que preferem cada tipo de ambiente.\n:::\n:::q Investigo e comunico · p. 86 · Q2 — Como evolui o pH da água do aquário com o tempo?\n?? O pH **diminui** (a água fica **mais ácida**), porque o amoníaco é transformado em **ácido nitroso** e **ácido nítrico**.\n:::\n:::q Investigo e comunico · p. 86 · Q3 — \"Para corrigir o pH de um aquário deve adicionar-se um(a) ___.\"\n?? Uma **base** — a água tende a ficar ácida, e a base faz o pH **aumentar** (reação ácido-base).\n:::\n## Para aplicar (p. 87)\n:::q Para aplicar · p. 87 · Q1.1 — Duas técnicas para medir o pH.\n?? **Indicador universal** (papel ou solução) e **medidor de pH**.\n:::\n:::q Para aplicar · p. 87 · Q1.2 — \"Uma das soluções é neutra.\" Concordas?\n?? **Não.** Nenhuma tem **pH = 7,0** a 25 °C (a mais próxima, F, tem 7,4 — é ligeiramente básica).\n:::\n:::q Para aplicar · p. 87 · Q1.3 — Soluções ácidas por ordem crescente de acidez.\n?? Ácidas: A, C, D. Menos ácida → mais ácida: **C (4,0) < A (2,0) < D (1,0)**.\n:::\n:::q Para aplicar · p. 87 · Q1.4 — Soluções básicas por ordem decrescente de basicidade.\n?? **B (13,0) > E (8,0) > F (7,4)**.\n:::\n:::q Para aplicar · p. 87 · Q1.5 — Cor do tornesol em cada solução.\n?? **Vermelho** nas ácidas (**A, C, D**); **azul** nas básicas (**B, E, F**).\n:::\n:::q Para aplicar · p. 87 · Q2.1 — Desentupidor com hidróxido de sódio: fórmula e iões.\n?? **NaOH**; iões **Na⁺** (sódio) e **OH⁻** (hidróxido).\n:::\n:::q Para aplicar · p. 87 · Q2.2 — Característica ácido-base.\n?? **Básica (alcalina)**.\n:::\n:::q Para aplicar · p. 87 · Q2.3 — Cor da fenolftaleína.\n?? **Carmim** (rosa-forte).\n:::\n:::q Para aplicar · p. 87 · Q2.4 — Nome do pictograma.\n?? **Corrosivo**.\n:::\n:::q Para aplicar · p. 87 · Q3.1 — Solução A com pH 2,0. Classifica-a.\n?? **Ácida** (pH < 7).\n:::\n:::q Para aplicar · p. 87 · Q3.2 — Ao adicionar B, o pH subiu para 3,2. Conclui-se que: A) B é neutra; B) não ocorreu reação; C) B é básica; D) ocorreu combustão.\n?? **C) a solução B é uma solução básica** (adicionar base a um ácido faz o pH aumentar).\n:::\n:::q Para aplicar · p. 87 · Q3.3 — Gráfico A (pH desce de 14) ou B (pH sobe de valor baixo, passando por 7)?\n?? **Gráfico B** — a solução A é ácida (pH inicial baixo) e, ao adicionar a base B, o pH **aumenta**.\n:::\n:::q Para aplicar · p. 87 · Q3.4 — A = HCl e B = KOH. Equação química.\n?? **HCl(aq) + KOH(aq) → KCl(aq) + H₂O(l)** (já está acertada).\n:::", "chapter": "10-reacoes-acido-base"}, {"id": "11-precipitacao", "title": "2.5 Solubilidade e reações de precipitação", "pages": "88–97", "part": "Reações Químicas", "md": "## Atividade prática 18 — Comparar a solubilidade de dois sais (p. 91)\n:::q AP18 · p. 91 · Propõe um procedimento para comparar a solubilidade do carbonato de cálcio e do nitrato de sódio.\n?? **Material:** 2 gobelés, proveta, balança, espátula, vareta de vidro, água destilada, os dois sais.\n**Procedimento:** 1) colocar o **mesmo volume de água** (ex.: 20 mL) em cada gobelé, à **mesma temperatura**; 2) pesar a **mesma pequena massa** de cada sal (ex.: 1 g); 3) juntar cada sal ao seu gobelé e agitar o mesmo tempo; 4) observar se dissolve totalmente.\n**Resultado esperado:** o **nitrato de sódio** dissolve-se completamente — **muito solúvel**; o **carbonato de cálcio** fica quase todo no fundo — **pouco solúvel**.\n(Só se pode variar o tipo de sal; tudo o resto deve ficar igual.)\n:::\n## Atividade prática 19 — Ocorre sempre precipitação? (pp. 94–95)\n:::q AP19 · p. 95 · Ocorreu precipitação em todos os ensaios? Justifica.\n?? **Não.** No **ensaio B** não se forma precipitado: os possíveis produtos (cloreto de potássio e iodeto de sódio) são **ambos muito solúveis** (sais de potássio e de sódio). Nos ensaios A, C e D forma-se precipitado.\n:::\n:::q AP19 · p. 95 · Identifica os precipitados (nome e fórmula).\n?? A – **cloreto de prata, AgCl** (branco). C – **carbonato de cálcio, CaCO₃** (branco). D – **cromato de prata, Ag₂CrO₄** (vermelho-acastanhado).\n:::\n:::q AP19 · p. 95 · \"Equação\" de palavras e equação química do ensaio C.\n?? Carbonato de sódio (aq) + Dicloreto de cálcio (aq) → Carbonato de cálcio (s) + Cloreto de sódio (aq)\n**Na₂CO₃(aq) + CaCl₂(aq) → CaCO₃(s) + 2 NaCl(aq)**\n:::\n:::q AP19 · p. 95 · Questão-problema.\n?? **Nem sempre.** Só há reação de precipitação quando um dos possíveis produtos é um **sal pouco solúvel** em água.\n:::\n## Tarefa interdisciplinar (CN e Geografia) — Precipitação na natureza (p. 97)\n:::q Tarefa interdisciplinar · Parte 1 · p. 97 · Q1 — Função das conchas.\n?? **Proteção** do corpo mole do animal contra predadores, choques e desidratação; também dão **suporte** (esqueleto externo).\n:::\n:::q Tarefa interdisciplinar · Parte 1 · p. 97 · Q2 — Porque há tantas conchas vazias na praia?\n?? Quando o molusco **morre**, o corpo mole decompõe-se ou é comido, mas a concha, sendo de CaCO₃ (pouco solúvel e resistente), **permanece** e é arrastada pelas ondas até à praia.\n:::\n:::q Tarefa interdisciplinar · Parte 1 · p. 97 · Q3 — Principal constituinte das conchas e corais duros.\n?? **Carbonato de cálcio (CaCO₃)**.\n:::\n:::q Tarefa interdisciplinar · Parte 1 · p. 97 · Q4 — É solúvel em água?\n?? **Não** — é **muito pouco solúvel** em água (por isso precipita).\n:::\n:::q Tarefa interdisciplinar · Parte 1 · p. 97 · Q5 — Onde está o maior recife de coral?\n?? A **Grande Barreira de Coral**, no nordeste da **Austrália** (mar de Coral, Queensland), com mais de 2000 km.\n:::\n:::q Tarefa interdisciplinar · Parte 2 · p. 97 · Q1 — Diferença entre estalactite e estalagmite.\n?? A **estalactite** cresce **do teto para baixo**; a **estalagmite** cresce **do chão para cima**. (Truque: estalaC**T**ite → **T**eto.)\n:::\n:::q Tarefa interdisciplinar · Parte 2 · p. 97 · Q2 — Grutas em Portugal.\n?? **Grutas de Mira de Aire** (Porto de Mós) e **Grutas de Alvados** / **Grutas de Santo António** (Maciço Calcário Estremenho, Leiria/Santarém). Também as Grutas da Moeda (Fátima).\n:::\n:::q Tarefa interdisciplinar · Parte 2 · p. 97 · Q3 — Tipo de solos.\n?? Solos/rochas **calcários** (ricos em carbonato de cálcio).\n:::\n:::q Tarefa interdisciplinar · Parte 2 · p. 97 · Q4 — Justifica: \"é necessária água, dióxido de carbono e carbonato de cálcio\".\n?? A **água** com **CO₂** forma ácido carbónico, que dissolve o **carbonato de cálcio** da rocha (formando hidrogenocarbonato de cálcio solúvel). Depois, na gruta, o CO₂ liberta-se e o CaCO₃ **precipita**. Sem um destes três componentes o processo não acontece.\n:::\n:::q Tarefa interdisciplinar · Parte 2 · p. 97 · Q5 — Equações químicas envolvidas.\n?? H₂O(l) + CO₂(g) → H₂CO₃(aq)\nH₂CO₃(aq) + CaCO₃(s) → Ca(HCO₃)₂(aq)\nCa(HCO₃)₂(aq) → CaCO₃(s) + CO₂(g) + H₂O(l)\n:::\n:::q Tarefa interdisciplinar · Parte 2 · p. 97 · Q6 — A formação de estalactites é exemplo de precipitado em contexto real?\n?? **Sim**: forma-se um **sólido pouco solúvel (CaCO₃)** a partir de uma solução aquosa, que se deposita — é um precipitado.\n:::", "chapter": "11-precipitacao"}, {"id": "12-dureza-agua", "title": "2.6 Dureza da água", "pages": "98–101", "part": "Reações Químicas", "md": "## Tarefa interdisciplinar (CN e Geografia) — Dureza da água (p. 100)\n:::q Tarefa interdisciplinar · p. 100 · Q1 — A água de consumo é substância ou mistura?\n?? **Mistura** (homogénea): tem água e vários sais e gases dissolvidos.\n:::\n:::q Tarefa interdisciplinar · p. 100 · Q2 — Iões responsáveis pela dureza.\n?? **Ião cálcio (Ca²⁺)** e **ião magnésio (Mg²⁺)**.\n:::\n:::q Tarefa interdisciplinar · p. 100 · Q3 — Dureza da água da tua região (mapa).\n?? Resposta pessoal pelo mapa. Ex.: **Lisboa** → água **média/dura**; **Porto** ou **Braga** → **macia**; **Faro** ou **Beja** → **dura**.\n:::\n:::q Tarefa interdisciplinar · p. 100 · Q4a — Porque é que a natureza dos solos influencia a dureza?\n?? A água **dissolve componentes das rochas** que atravessa. Os solos **calcários/dolomíticos** são ricos em carbonatos de cálcio e magnésio, por isso a água fica com muitos iões Ca²⁺ e Mg²⁺ (**dura**). Os solos **graníticos/basálticos** têm poucos destes sais (água **macia**).\n:::\n:::q Tarefa interdisciplinar · p. 100 · Q4b/c — Solo da tua região; faz sentido usar anticalcário?\n?? Resposta pessoal. Se vives numa região **calcária** (ex.: Lisboa, Algarve), **sim**, faz sentido usar anticalcário na máquina. Numa região **granítica** (ex.: Minho), a água é macia e **não é necessário**.\n:::\n:::q Tarefa interdisciplinar · p. 100 · Q5 — Tratamento de águas duras.\n?? **Doméstico:** descalcificantes, lavar a temperaturas mais baixas (< 55 °C), filtros/descalcificadores. **Industrial:** adicionar **cal (CaO)** ou **carbonato de sódio (Na₂CO₃)** para precipitar e remover os sais de cálcio e magnésio.\n:::\n## Investigo e comunico — De onde vem a pedra que se forma nos dentes? (p. 102)\n:::q Investigo e comunico · p. 102 · Q1 — Carbonato de cálcio e fosfatos de cálcio e magnésio: muito ou pouco solúveis?\n?? **Pouco solúveis** — pela tabela 5, os **carbonatos** e os **fosfatos** são pouco solúveis (as exceções são apenas os de sódio, potássio e amónio).\n:::\n:::q Investigo e comunico · p. 102 · Q2 — Fórmulas do carbonato de cálcio e do fosfato de cálcio.\n?? Carbonato de cálcio: **CaCO₃** (Ca²⁺ + CO₃²⁻). Fosfato de cálcio: **Ca₃(PO₄)₂** (3 Ca²⁺ + 2 PO₄³⁻).\n:::\n:::q Investigo e comunico · p. 102 · Q3 — Consequências do tártaro para a saúde oral.\n?? Irritação e inflamação das gengivas (**gengivite**), **sangramento**, **periodontite** (pode levar à perda de dentes), mau hálito e acumulação de bactérias (cáries).\n:::\n:::q Investigo e comunico · p. 102 · Q4 — Como prevenir.\n?? Escovar os dentes **2 vezes por dia, 2 minutos**, com pasta com flúor; usar **fio dentário** diariamente; evitar açúcares e bebidas açucaradas/com gás; ir ao dentista regularmente.\n:::\n:::q Investigo e comunico · p. 102 · Q5 — Como remover o tártaro já formado.\n?? Só no **dentista**, por **destartarização** (instrumentos manuais, ultrassons e outras técnicas). Não sai só com a escova.\n:::\n## Para aplicar (p. 103)\n:::q Para aplicar · p. 103 · Q1.1 — 24 g de NaCl em 200 mL de água a 25 °C: mistura homogénea ou heterogénea?\n?? **Homogénea**. A solubilidade é 35,9 g/100 mL → em 200 mL dissolvem-se até **71,8 g**. Como 24 g < 71,8 g, o sal **dissolve-se todo** (solução não saturada).\n:::\n:::q Para aplicar · p. 103 · Q1.2 — Massa de NaCl a acrescentar para saturar.\n?? Máximo em 200 mL: 2 × 35,9 = **71,8 g**. Falta: 71,8 − 24 = **47,8 g**.\n:::\n:::q Para aplicar · p. 103 · Q1.3 — O dicloreto de cobre é mais ou menos solúvel do que o NaCl (mesma temperatura)?\n?? **Mais solúvel**: pela tabela 4, a solubilidade do dicloreto de cobre (**75,7 g/100 mL**) é maior do que a do cloreto de sódio (**35,9 g/100 mL**).\n:::\n:::q Para aplicar · p. 103 · Q2 — Muito ou pouco solúvel: A. brometo de prata; B. dibrometo de cálcio; C. carbonato de sódio; D. carbonato de cálcio; E. fosfato de sódio; F. fluoreto de amónio; G. nitrato de prata; H. nitrato de potássio; I. nitrato de cobre(I).\n?? **Pouco solúveis:** A (brometo de prata — exceção dos brometos), D (carbonato de cálcio).\n**Muito solúveis:** B (dibrometo de cálcio), C (carbonato de sódio — exceção), E (fosfato de sódio — exceção), F (fluoreto de amónio — exceção), G, H e I (todos os nitratos são solúveis).\n:::\n:::q Para aplicar · p. 103 · Q3.1 — Distingue água dura de água macia.\n?? A **água dura** tem **muitos sais de cálcio e magnésio** dissolvidos (> 150 mg/L de CaCO₃); a **água macia** tem **poucos** (0–60 mg/L).\n:::\n:::q Para aplicar · p. 103 · Q3.2 — Duas vantagens e duas desvantagens da água dura.\n?? **Vantagens:** fonte de **cálcio e magnésio** para o organismo; diminui a disponibilidade de iões tóxicos (chumbo, cádmio…) para a vida aquática.\n**Desvantagens:** faz **pouca espuma** com o sabão; forma **depósitos de calcário** que danificam máquinas, canos e caldeiras (e aumentam o consumo de energia).\n:::\n:::q Para aplicar · p. 103 · Q3.3 — Uma forma doméstica e uma industrial de diminuir a dureza.\n?? **Doméstica:** usar **produtos descalcificantes** (ou lavar a < 55 °C). **Industrial:** adicionar **óxido de cálcio (CaO)** ou **carbonato de sódio (Na₂CO₃)** para precipitar os sais de cálcio e magnésio.\n:::\n:::q Para aplicar · p. 103 · Q4.1 — Fórmulas dos sais: A) nitrato de potássio e cloreto de sódio; B) nitrato de cálcio e carbonato de sódio; C) sulfato de potássio e nitrito de bário; D) brometo de potássio e nitrato de prata.\n?? A) **KNO₃** e **NaCl**; B) **Ca(NO₃)₂** e **Na₂CO₃**; C) **K₂SO₄** e **Ba(NO₂)₂**; D) **KBr** e **AgNO₃**.\n:::\n:::q Para aplicar · p. 103 · Q4.2 — Nome e fórmula dos produtos.\n?? A) **cloreto de potássio KCl** e **nitrato de sódio NaNO₃**.\nB) **carbonato de cálcio CaCO₃** e **nitrato de sódio NaNO₃**.\nC) **sulfato de bário BaSO₄** e **nitrito de potássio KNO₂**.\nD) **brometo de prata AgBr** e **nitrato de potássio KNO₃**.\n:::\n:::q Para aplicar · p. 103 · Q4.3 — Há precipitado? Qual?\n?? A) **Não** (KCl e NaNO₃ são muito solúveis). B) **Sim — CaCO₃**. C) **Sim — BaSO₄**. D) **Sim — AgBr**.\n:::\n:::q Para aplicar · p. 103 · Q4.4 — \"Equações\" de palavras e químicas das precipitações.\n?? **B)** Nitrato de cálcio (aq) + Carbonato de sódio (aq) → Carbonato de cálcio (s) + Nitrato de sódio (aq)\n**Ca(NO₃)₂(aq) + Na₂CO₃(aq) → CaCO₃(s) + 2 NaNO₃(aq)**\n**C)** Sulfato de potássio (aq) + Nitrito de bário (aq) → Sulfato de bário (s) + Nitrito de potássio (aq)\n**K₂SO₄(aq) + Ba(NO₂)₂(aq) → BaSO₄(s) + 2 KNO₂(aq)**\n**D)** Brometo de potássio (aq) + Nitrato de prata (aq) → Brometo de prata (s) + Nitrato de potássio (aq)\n**KBr(aq) + AgNO₃(aq) → AgBr(s) + KNO₃(aq)**\n:::\n:::q Para aplicar · p. 103 · Q5 — Qual é de precipitação? A. H₂SO₄ + Mg(OH)₂ → MgSO₄ + H₂O; B. 8 C₄H₁₀ + 13 O₂ → 8 CO₂ + 10 H₂O; C. Na₂SO₄(aq) + Pb(NO₃)₂(aq) → PbSO₄(s) + 2 NaNO₃(aq)\n?? **C** (forma-se um sólido, PbSO₄). A é uma reação **ácido-base**; B é uma **combustão** (e repara que nem está bem acertada — o correto seria 2 C₄H₁₀ + 13 O₂ → 8 CO₂ + 10 H₂O).\n:::\n:::q Para aplicar · p. 103 · Q6 — Texto sobre a formação de estalactites e estalagmites.\n?? A água da chuva dissolve **CO₂** do ar e torna-se ácida (**ácido carbónico**). Ao infiltrar-se em rochas **calcárias**, dissolve o **carbonato de cálcio**, formando **hidrogenocarbonato de cálcio** (solúvel). Dentro da gruta, a água goteja e liberta CO₂; o carbonato de cálcio, pouco solúvel, **precipita**. As gotas que ficam no **teto** formam **estalactites** (crescem para baixo) e as que caem no **chão** formam **estalagmites** (crescem para cima). Quando se unem formam **colunas**.\n:::\n## Para aplicar + (pp. 104–106) — revisão do capítulo 2\n:::q Para aplicar + · p. 104 · Q1.1 — Apagador de velas: combustível e comburente.\n?? Combustível: **cera (parafina)** da vela. Comburente: **dioxigénio** do ar.\n:::\n:::q Para aplicar + · p. 104 · Q1.2 — A vela apaga porque o apagador: A. é metálico e frio; B. retira o combustível; C. impede o contacto com o dioxigénio do ar; D. impede o contacto com a cera.\n?? **C** (abafa — retira o comburente).\n:::\n:::q Para aplicar + · p. 104 · Q2.1 — O gás natural é renovável?\n?? **Não renovável** — é um **combustível fóssil** (formou-se há milhões de anos e esgota-se).\n:::\n:::q Para aplicar + · p. 104 · Q2.2 — Combustível e comburente.\n?? Combustível: **gás natural (metano)**. Comburente: **dioxigénio** do ar.\n:::\n:::q Para aplicar + · p. 104 · Q2.3 — Reagentes e produtos.\n?? Reagentes: **metano** e **dioxigénio**. Produtos: **dióxido de carbono** e **água**.\n:::\n:::q Para aplicar + · p. 104 · Q2.4 — \"Equação\" de palavras correta (A: gás natural + ar; B: gás natural + dioxigénio; C: gás natural + ar → fumo; D: metano + dioxigénio → dióxido de carbono + água).\n?? **D. Metano (g) + Dioxigénio (g) → Dióxido de carbono (g) + Água (g)** (numa equação só entram **substâncias**; o gás natural e o ar são misturas).\n:::\n:::q Para aplicar + · p. 104 · Q2.5 — Equação química da combustão do metano.\n?? **CH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(g)**\n:::\n:::q Para aplicar + · p. 104 · Q3.1 — Motor a gasolina: combustível e comburente.\n?? Combustível: **gasolina**. Comburente: **dioxigénio** do ar.\n:::\n:::q Para aplicar + · p. 104 · Q3.2 — Consequências da emissão de CO₂ pelo tráfego para a qualidade do ar.\n?? Pior **qualidade do ar** (com outros poluentes dos escapes: CO, NOₓ, partículas → problemas respiratórios, smog) e **aumento do efeito de estufa** → aquecimento global.\n:::\n:::q Para aplicar + · p. 104 · Q3.3a — O que é o efeito de estufa e a sua importância.\n?? Fenómeno **natural** em que os **gases de efeito de estufa** (CO₂, vapor de água…) **retêm a radiação infravermelha** emitida pela Terra. É importante porque mantém a **temperatura média** da Terra (~15 °C) estável e adequada à **vida** (sem ele seria < 0 °C).\n:::\n:::q Para aplicar + · p. 104 · Q3.3b — Duas consequências do aumento dos GEE.\n?? **Aquecimento global** com **subida do nível do mar** (degelo) e **alterações climáticas** (fenómenos extremos: ondas de calor, tempestades, secas).\n:::\n:::q Para aplicar + · p. 104 · Q3.3c — Três medidas para reduzir o CO₂ do tráfego.\n?? Usar **transportes públicos**; andar a **pé ou de bicicleta**; usar **carros elétricos** ou partilhar carro (*carpooling*).\n:::\n:::q Para aplicar + · p. 104 · Q4.1 — C₂H₆O(g) + O₂(g) → CO₂(g) + H₂O(g): A. quatro substâncias; B. o CO₂ é reagente; C. não é combustão; D. quatro elementos.\n?? **A** (etanol, dioxigénio, dióxido de carbono e água). B é falsa (é produto); C é falsa (é combustão); D é falsa (só 3 elementos: C, H, O).\n:::\n:::q Para aplicar + · p. 104 · Q4.2 — Acerta a equação.\n?? **C₂H₆O(g) + 3 O₂(g) → 2 CO₂(g) + 3 H₂O(g)**\n:::\n:::q Para aplicar + · p. 105 · Q5 — Uma vantagem das combustões no quotidiano.\n?? Fornecem **energia** (térmica e luminosa): cozinhar, aquecer as casas, mover veículos, produzir eletricidade.\n:::\n:::q Para aplicar + · p. 105 · Q6 — Dois problemas ambientais do CO₂ das atividades antropogénicas.\n?? **Aumento do efeito de estufa → aquecimento global** e **alterações climáticas** (também a acidificação dos oceanos).\n:::\n:::q Para aplicar + · p. 105 · Q7 — Combustão do octaenxofre (S₈) com dioxigénio → dióxido de enxofre. 7.1 combustível; 7.2 comburente; 7.3 equação.\n?? 7.1 **Octaenxofre (S₈)**. 7.2 **Dioxigénio (O₂)**. 7.3 **S₈(s) + 8 O₂(g) → 8 SO₂(g)**.\n:::\n:::q Para aplicar + · p. 105 · Q7.4 — A emissão de SO₂ provoca: A. aumento do efeito de estufa e chuvas ácidas; B. diminuição do pH dos solos e chuvas ácidas; C. aquecimento global e chuvas ácidas; D. diminuição do pH dos solos e aquecimento global.\n?? **B** (o SO₂ forma ácido sulfúrico/sulfuroso na chuva → chuva ácida, que acidifica os solos).\n:::\n:::q Para aplicar + · p. 105 · Q8 — Associa: a) ácido clorídrico; b) sulfúrico; c) nítrico; d) fosfórico; e) acético ↔ 1) HNO₃; 2) H₂SO₄; 3) HCl; 4) CH₃COOH; 5) H₃PO₄.\n?? **a – 3; b – 2; c – 1; d – 5; e – 4.**\n:::\n:::q Para aplicar + · p. 105 · Q9 — Legenda da escala de pH (Ácida, Inferior, Aumenta, Superior, Neutra, Igual, Básica, Diminui): A (acidez ___), B (basicidade ___), C, D, E (soluções).\n?? **A – aumenta** (a acidez aumenta para a esquerda, com a diminuição do pH). **B – aumenta** (a basicidade aumenta com o aumento do pH). **C – ácida** (pH **inferior** a 7). **D – básica** (pH **superior** a 7). **E – neutra** (pH **igual** a 7).\n:::\n:::q Para aplicar + · p. 105 · Q10.1 — Materiais: vinagre 3; limpa-vidros 11; sangue 7,35–7,45; água salgada 7; leite 6,5; água mineral X 5,6; água mineral Y 9. Ácidas por ordem crescente de acidez.\n?? Ácidas: leite, água mineral X, vinagre. Ordem crescente de acidez: **leite (6,5) < água mineral X (5,6) < vinagre (3)**.\n:::\n:::q Para aplicar + · p. 105 · Q10.2 — A mais básica.\n?? O **limpa-vidros** (pH 11).\n:::\n:::q Para aplicar + · p. 105 · Q10.3 — \"A água salgada é ___, a água mineral X é ___ e a água mineral Y é ___.\"\n?? **B. neutra / ácida / básica**.\n:::\n:::q Para aplicar + · p. 105 · Q10.4 — V/F: A. O vinagre não altera a cor do azul de tornesol. B. O pH das águas poderia ser medido com indicador universal em solução. C. O leite torna carmim a fenolftaleína. D. O sangue é uma solução básica. E. O indicador universal dá uma indicação aproximada do pH.\n?? **A – F** (o vinagre é ácido: o tornesol fica **vermelho**). **B – V.** **C – F** (o leite é ligeiramente ácido; a fenolftaleína fica **incolor**). **D – V** (pH 7,35–7,45 > 7). **E – V.**\n:::\n:::q Para aplicar + · p. 106 · Q11 — Nome comum das bases: a) NH₃; b) NaClO; c) NaHCO₃; d) KOH; e) Ba(OH)₂; f) Al(OH)₃.\n?? a) **amoníaco**; b) **hipoclorito de sódio**; c) **hidrogenocarbonato de sódio** (bicarbonato de sódio); d) **hidróxido de potássio**; e) **hidróxido de bário** (di-hidróxido de bário); f) **hidróxido de alumínio** (tri-hidróxido de alumínio).\n:::\n:::q Para aplicar + · p. 106 · Q12.1 — Solução com pH 2: característica ácido-base.\n?? **Ácida** (pH < 7) — e bastante ácida.\n:::\n:::q Para aplicar + · p. 106 · Q12.2 — É perigosa? Cuidados.\n?? **Sim**, pode ser **corrosiva**. Usar **bata, luvas e óculos de proteção**; trabalhar na *hotte*/arejar; não cheirar nem provar; para diluir, juntar **o ácido à água**, devagar e com agitação.\n:::\n:::q Para aplicar + · p. 106 · Q12.3 — Símbolo de perigo.\n?? Pictograma **\"Corrosivo\"** (líquido a corroer uma mão e um material).\n:::\n:::q Para aplicar + · p. 106 · Q13 — A saliva deve ter pH 6,8–7,2; os açúcares baixam o pH. Característica da pasta de dentes?\n?? **Básica (alcalina)**: ao escovar, a base reage com os ácidos da boca (reação ácido-base) e faz o **pH aumentar**, restabelecendo o pH da saliva.\n:::\n:::q Para aplicar + · p. 106 · Q14 — \"Equações\" de palavras e químicas: A. HCl + KOH; B. H₂SO₄ + Ca(OH)₂; C. HNO₃ + NaOH; D. H₃PO₄ + KOH.\n?? **A.** Ácido clorídrico (aq) + Hidróxido de potássio (aq) → Cloreto de potássio (aq) + Água (l)\n**HCl(aq) + KOH(aq) → KCl(aq) + H₂O(l)**\n**B.** Ácido sulfúrico (aq) + Di-hidróxido de cálcio (aq) → Sulfato de cálcio + Água (l)\n**H₂SO₄(aq) + Ca(OH)₂(aq) → CaSO₄(aq) + 2 H₂O(l)** *(o sulfato de cálcio é pouco solúvel, por isso também pode aparecer como (s))*\n**C.** Ácido nítrico (aq) + Hidróxido de sódio (aq) → Nitrato de sódio (aq) + Água (l)\n**HNO₃(aq) + NaOH(aq) → NaNO₃(aq) + H₂O(l)**\n**D.** Ácido fosfórico (aq) + Hidróxido de potássio (aq) → Fosfato de potássio (aq) + Água (l)\n**H₃PO₄(aq) + 3 KOH(aq) → K₃PO₄(aq) + 3 H₂O(l)**\n:::\n:::q Para aplicar + · p. 106 · Q15.1 — O peixe-palhaço vive em água com pH 8–8,4. Característica ácido-base?\n?? **Básica (ligeiramente alcalina)** — pH > 7.\n:::\n:::q Para aplicar + · p. 106 · Q15.2 — O pH desceu para 7,5. Característica da substância a adicionar?\n?? **Básica**: é preciso **aumentar** o pH (de 7,5 para 8–8,4), e ao adicionar uma base a uma solução o pH sobe.\n:::\n:::q Para aplicar + · p. 106 · Q15.3 — O que significa a dureza de uma água?\n?? Está relacionada com a quantidade de **sais de cálcio e magnésio** (iões Ca²⁺ e Mg²⁺) dissolvidos: quanto maior a concentração, mais **dura** é a água.\n:::\n:::q Para aplicar + · p. 106 · Q16 — Chuva com pH 5,0 junto a um parque industrial. Opção correta: A. Sem poluição teria sempre pH = 7. B. A chuva é naturalmente ácida, com pH inferior a 5,6. C. A acidificação (pH < 5,6) deve-se a atividades humanas, como a emissão de CO₂ pela indústria. D. Sem poluição teria sempre pH > 7.\n?? **C.** A chuva normal é ligeiramente ácida (pH ≈ 5,6, não 7); abaixo de 5,6 é chuva ácida, causada pelas atividades humanas. *(Repara: os principais culpados da chuva ácida são os óxidos de enxofre e de nitrogénio, mas a opção C é a única correta.)*\n:::\n:::q Para aplicar + · p. 107 · Q17.1 — Solo com pH 5,3: característica.\n?? **Ácido**.\n:::\n:::q Para aplicar + · p. 107 · Q17.2 — Cultura adequada (batata-doce 5,1–6; cenoura 5,7–7; ervilhas 5,9–7,3).\n?? A **batata-doce** — é a única cujo intervalo de pH ideal inclui **5,3**.\n:::\n:::q Para aplicar + · p. 107 · Q17.3 — Para semear ervilhas, sulfato de amónio ou carbonato de cálcio?\n?? **Carbonato de cálcio**: as ervilhas precisam de pH 5,9–7,3, por isso é preciso **aumentar** o pH do solo (o sulfato de amónio diminuiria o pH).\n:::\n:::q Para aplicar + · p. 107 · Q18.1 — Nome comum: NaNO₃; CuNO₃; KI.\n?? **Nitrato de sódio**; **nitrato de cobre(I)**; **iodeto de potássio**.\n:::\n:::q Para aplicar + · p. 107 · Q18.2 — Que par forma um sólido?\n?? **Nitrato de cobre(I) + iodeto de potássio** (CuNO₃ e KI).\n(NaNO₃ + KI dá NaI e KNO₃, ambos solúveis; NaNO₃ + CuNO₃ têm o mesmo anião — não reagem.)\n:::\n:::q Para aplicar + · p. 107 · Q18.3 — Fórmula e nome do precipitado.\n?? **CuI — iodeto de cobre(I)** (os iodetos de cobre são exceção: pouco solúveis).\nCuNO₃(aq) + KI(aq) → CuI(s) + KNO₃(aq)\n:::\n:::q Para aplicar + · p. 107 · Q19.1 — Ácido sulfúrico + hidróxido de sódio → água + X. Tipo de reação.\n?? **B. ácido-base.**\n:::\n:::q Para aplicar + · p. 107 · Q19.2 — Equação química.\n?? **H₂SO₄(aq) + 2 NaOH(aq) → Na₂SO₄(aq) + 2 H₂O(l)** (X = **sulfato de sódio**).\n:::\n:::q Para aplicar + · p. 107 · Q20 — \"Uma água dura é tanto mais dura quanto ___ for a sua concentração em iões ___. As águas macias … em Portugal são mais frequentes ___.\"\n?? Resposta do livro: **D. maior / Ca²⁺ e Mg²⁺ / no centro e sul** — é a única opção com os iões certos (Ca²⁺ e Mg²⁺) e \"maior\".\n*Atenção:* pelo mapa da p. 98, as águas **macias** são mais frequentes no **norte** e as **duras** no centro-sul. A última parte da opção D só faz sentido se a frase se referir às águas duras. Confirma com o teu professor.\n:::\n:::q Para aplicar + · p. 107 · Q21 — 100 mL de água + 20,0 g de NaCl; 50 mL de água + 40,0 g de dicloreto de cobre. O que observaram?\n?? **NaCl:** solubilidade 35,9 g/100 mL → 20,0 g < 35,9 g → dissolve-se **todo** (solução não saturada).\n**Dicloreto de cobre:** 75,7 g/100 mL → em 50 mL dissolvem-se no máximo 75,7 ÷ 2 = **37,85 g**. Como 40,0 g > 37,85 g, **não se dissolve tudo**: fica cerca de **2,15 g no fundo** (solução saturada).\n:::\n:::q Para aplicar + · p. 107 · Q22.1 — Nitrato de prata + cloreto de potássio → sólido. Tipo de reação.\n?? **C. precipitação.**\n:::\n:::q Para aplicar + · p. 107 · Q22.2 — \"Equação\" de palavras.\n?? **Nitrato de prata (aq) + Cloreto de potássio (aq) → Cloreto de prata (s) + Nitrato de potássio (aq)**\n:::\n:::q Para aplicar + · p. 107 · Q22.3 — Fórmulas: a) reagentes; b) precipitado.\n?? a) **AgNO₃** e **KCl**. b) **AgCl**.\n:::\n:::q Para aplicar + · p. 107 · Q22.4 — Equação acertada.\n?? **AgNO₃(aq) + KCl(aq) → AgCl(s) + KNO₃(aq)**\n:::", "chapter": "12-dureza-agua"}, {"id": "21-ondas-producao-som", "title": "1.1 Ondas e produção do som", "pages": "Som 8–15", "part": "Som", "md": "## Atividade prática 1 (em estações) — O que desencadeia uma onda? (pp. 9–10)\n:::q AP1 · p. 9 · Estação 1 — O que se observa na água após a queda da gota? E ao aumentar a amplitude?\n?? Formam-se **ondas circulares** que se afastam do ponto onde a gota caiu, em todas as direções. Com **maior amplitude** (gota maior), as ondas ficam **mais altas** (maior afastamento da posição de equilíbrio) e o gráfico mostra picos maiores.\n:::\n:::q AP1 · p. 10 · Estação 2 — Comparar os passos 2 e 4.\n?? Em ambos se forma uma onda que percorre a corda até à outra pessoa. Com o movimento **mais amplo** (passo 4), a onda tem **maior amplitude** (sobe e desce mais). A corda **não se desloca** até ao outro extremo — só a vibração/energia.\n:::\n:::q AP1 · p. 10 · Estação 3 — O que se observa na mola?\n?? Uma zona de **espiras comprimidas** percorre a mola de uma ponta à outra (vibração e propagação na **mesma direção**). Ao comprimir a partir do **centro**, a perturbação propaga-se **para os dois lados**, em direção às duas extremidades.\n:::\n:::q AP1 · p. 10 · Questão-problema: o que desencadeia uma onda?\n?? Uma **vibração** (perturbação) num meio. A onda é a **propagação dessa vibração**, que transporta **energia** sem transportar matéria.\n:::\n## Atividade prática 2 — Como se produz e propaga um som? (p. 13)\n:::q AP2 · Parte 1 · p. 13 · Mão na garganta e à frente da boca ao falar: o que sentes? O que é preciso para produzir a voz?\n?? Na garganta sente-se uma **vibração** (das cordas vocais); à frente da boca sente-se o **ar a sair** (sopro). Para produzir a voz é preciso que o ar vindo dos pulmões faça **vibrar as cordas vocais**.\n:::\n:::q AP2 · Parte 2 · p. 13 · Diapasão percutido: o que sentes nas hastes? E na água?\n?? As hastes **vibram** (sente-se um formigueiro; ao segurá-las o som para). Perto da água, a superfície **agita-se/forma pequenas ondas** (e salpica se tocar) — prova de que o diapasão vibra.\n:::\n:::q AP2 · Parte 3 · p. 13 · Simulação \"Som\" com partículas: o que observas?\n?? Quando o altifalante vibra, as **partículas do ar** junto dele ficam alternadamente **mais juntas** (compressões) e **mais afastadas** (rarefações); a perturbação propaga-se, mas cada partícula só **oscila à volta da sua posição** — não viaja com o som.\n:::\n:::q AP2 · p. 13 · Questão-problema: como se produz e propaga um som?\n?? O som é produzido pela **vibração de um corpo** (fonte sonora) e propaga-se porque essa vibração é transmitida ao **meio** (ex.: ar), por **compressões e rarefações** sucessivas, com transferência de energia mas **sem transporte de matéria**.\n:::", "chapter": "21-ondas-producao-som"}, {"id": "23-propagacao-velocidade-som", "title": "1.3 Propagação do som em diferentes meios e velocidade do som", "pages": "Som 20–23", "part": "Som", "md": "## Atividade prática 3 — Frequência e período do som de um diapasão (p. 20)\n:::q AP3 · p. 20 · Como se determina o período e a frequência?\n?? No gráfico, mede-se o **tempo de uma vibração completa** (de um pico ao pico seguinte) → **período T**; ou conta-se n vibrações num intervalo e faz-se T = Δt/n. Depois **f = 1/T**.\nEx.: diapasão de **440 Hz** → T = 1/440 ≈ **0,00227 s ≈ 2,3 ms**. (O valor da frequência costuma estar gravado no diapasão — serve para confirmar.)\n:::\n## Atividade prática 4 — O som propaga-se entre Vénus e a Terra? (p. 20)\n:::q AP4 · p. 20 · O que acontece ao som com a bomba ligada? Porquê?\n?? O som vai ficando **cada vez mais fraco** até quase **deixar de se ouvir**. A bomba retira o **ar** de dentro da campânula: com menos corpúsculos, a vibração quase não se consegue transmitir; no **vácuo** o som não se propaga.\n:::\n:::q AP4 · p. 20 · Questão-problema: o som propaga-se entre Vénus e a Terra?\n?? **Não.** Entre Vénus e a Terra existe essencialmente **vácuo** (espaço sem matéria), e o som precisa de um **meio material** para se propagar.\n:::\n## Atividade prática 5 — Em que estado físico o som se propaga mais rapidamente? (p. 22)\n:::q AP5 · p. 22 · Associa as filas A e B aos estados sólido e gasoso.\n?? **A – sólido** (peças muito próximas, como os corpúsculos de um sólido). **B – gasoso** (peças afastadas).\n:::\n:::q AP5 · p. 22 · 5.1 a) A que corresponde a régua a empurrar a primeira peça? b) E a queda da peça seguinte por contacto?\n?? a) À **fonte sonora** que inicia a **vibração**. b) À **propagação da vibração** de corpúsculo para corpúsculo (transferência de energia de uma porção do meio para a seguinte).\n:::\n:::q AP5 · p. 22 · 5.2 Em que meio o som se propaga mais rapidamente?\n?? No **sólido** (fila A): o balão é atingido primeiro, porque as peças (corpúsculos) estão mais próximas e a vibração é transmitida mais depressa.\n:::\n:::q AP5 · p. 22 · Questão-problema.\n?? O som propaga-se mais rapidamente nos **sólidos**, depois nos **líquidos** e mais lentamente nos **gases**.\n:::\n## Investigo e comunico — Quando a natureza é a sala de aula! (p. 24)\n:::q Investigo e comunico · p. 24 · Q1 — Como é que uma ave produz o canto?\n?? As aves têm um órgão vocal chamado **siringe**, na base da traqueia (onde ela se divide para os pulmões). O ar expirado faz **vibrar as membranas** da siringe, controladas por músculos — a **vibração** produz o som. Algumas aves conseguem produzir dois sons ao mesmo tempo, um em cada lado da siringe.\n:::\n:::q Investigo e comunico · p. 24 · Q2–Q3 — Pesquisa no Portal dos Observadores de Aves e gravação com a App Birdnet.\n?? Trabalho de pesquisa pessoal. Ex.: **pisco-de-peito-ruivo** (*Erithacus rubecula*): estatuto **Pouco Preocupante**; pequeno, com peito alaranjado; residente todo o ano (mais abundante no inverno, com aves migradoras do norte da Europa); observa-se em todo o país, em jardins, matas e parques. A ave é a **fonte sonora** e a gravação capta a vibração do ar.\n:::\n## Para aplicar (p. 25)\n:::q Para aplicar · p. 25 · Q1 — V/F: A. Uma onda sonora no ar resulta do deslocamento do ar desde a fonte até ao ouvinte. B. Uma onda tem origem numa vibração. C. A velocidade do som é máxima no ar. D. O som não se propaga no vazio. E. Uma onda resulta da propagação de uma vibração.\n?? **A – F** (não há transporte de ar, só de energia). **B – V.** **C – F** (é máxima nos **sólidos**). **D – V.** **E – V.**\n:::\n:::q Para aplicar · p. 25 · Q2.1 — Ondas numa corda (I com oscilações maiores, II menores). Qual tem maior amplitude?\n?? A **onda I** (maior afastamento em relação à posição de equilíbrio).\n:::\n:::q Para aplicar · p. 25 · Q2.2 — Que letra identifica a amplitude da onda II (a = distância pico a pico na horizontal; b = distância horizontal; c = altura do pico à linha de equilíbrio)?\n?? **c** — a distância do **pico à posição de equilíbrio**. (a corresponde ao **comprimento de onda**.)\n:::\n:::q Para aplicar · p. 25 · Q3.1 — Violino de Einstein (sol 196 Hz, ré 293,66 Hz, lá 440 Hz, mi 659,26 Hz). O que é necessário para produzir som?\n?? Que as **cordas vibrem** (postas a vibrar pelo arco ou pelos dedos). A vibração transmite-se ao corpo do violino e ao ar.\n:::\n:::q Para aplicar · p. 25 · Q3.2 — A que grandeza correspondem os valores?\n?? À **frequência** (em hertz, Hz).\n:::\n:::q Para aplicar · p. 25 · Q3.3 — Quantas vibrações por segundo para a nota sol?\n?? **196 vibrações** completas por segundo (196 Hz).\n:::\n:::q Para aplicar · p. 25 · Q3.4 — Que corda produz o som de maior período?\n?? A corda **sol** — tem a **menor frequência** (196 Hz), e T e f são inversamente proporcionais.\n:::\n:::q Para aplicar · p. 25 · Q3.5 — Período da corda mi.\n?? T = 1/f = 1/659,26 ≈ **1,52 × 10⁻³ s** (≈ 0,0015 s).\n:::\n:::q Para aplicar · p. 25 · Q4 — A. instrumento musical/fonte sonora; B. frequência/período; C. s/Hz.\n?? A. **fonte sonora**; B. **frequência** da onda; C. **Hz**.\n:::\n:::q Para aplicar · p. 25 · Q5.1 — Gráfico p(t) com 0,005 s e 0,010 s marcados (início em p de equilíbrio, a subir). Instante de pressão a) máxima; b) mínima.\n?? Período T = **0,005 s**. a) Máxima a **T/4 = 0,00125 s** (também 0,00625 s…). b) Mínima a **3T/4 = 0,00375 s** (também 0,00875 s…).\n*(Lê-se no gráfico: o primeiro pico está a ¼ do caminho até 0,005 s e o primeiro vale a ¾.)*\n:::\n:::q Para aplicar · p. 25 · Q5.2 — Tempo entre uma compressão e a rarefação seguinte.\n?? **Meio período:** 0,005 ÷ 2 = **0,0025 s**.\n:::\n:::q Para aplicar · p. 25 · Q5.3 — Frequência do som.\n?? f = 1/T = 1/0,005 = **200 Hz**.\n:::\n:::q Para aplicar · p. 25 · Q5.4 — Período do som.\n?? **T = 0,005 s** (5 × 10⁻³ s).\n:::\n:::q Para aplicar · p. 25 · Q6 — Explosões em Beirute ouvidas em Chipre (200 km). Tempo, em minutos (v = 343 m/s).\n?? d = 200 km = **200 000 m**. Δt = d/v = 200 000/343 ≈ **583 s**. Em minutos: 583/60 ≈ **9,7 min** (quase 10 minutos).\n:::\n## Para aplicar + (pp. 26–27) — revisão do capítulo 1 (Som)\n:::q Para aplicar + · p. 26 · Q1 — \"A zona A corresponde a uma ___, zona de ___ pressão, e a zona B a uma zona de ___, zona de ___ pressão.\"\n?? **B. compressão … maior … rarefação … menor.** (No esquema, A está numa faixa mais escura = mais densa; B numa faixa mais clara = menos densa.)\n:::\n:::q Para aplicar + · p. 26 · Q2.1 — Diapasão: p máxima aos 5 × 10⁻³ s, p mínima aos 15 × 10⁻³ s, equilíbrio em t = 0. Em que instante: a) compressão; b) menor densidade; c) mais corpúsculos por volume; d) não se propaga som.\n?? a) **t = 5 × 10⁻³ s**; b) **t = 15 × 10⁻³ s** (rarefação); c) **t = 5 × 10⁻³ s** (compressão); d) **t = 0 s** (pressão de equilíbrio, corpúsculos uniformemente distribuídos).\n:::\n:::q Para aplicar + · p. 26 · Q2.2 — Qual dos gráficos (A: período 10 ms; B: período 20 ms) traduz a situação?\n?? **B.** Da pressão máxima (5 ms = T/4) à mínima (15 ms = 3T/4) vai meio período (10 ms), logo **T = 20 ms**. No gráfico B o pico está aos 5 ms e o vale aos 15 ms.\n:::\n:::q Para aplicar + · p. 26 · Q3.1 — Gráficos A (período 3 ms, amplitude menor) e B (período 2 ms, amplitude maior). a) Maior variação da pressão? b) Maior período?\n?? a) **B** (maior amplitude). b) **A** (T = 3 ms > 2 ms).\n:::\n:::q Para aplicar + · p. 26 · Q3.2 — Define período.\n?? Tempo que decorre entre **dois pontos consecutivos de pressão máxima** (ou mínima), ou seja, o **tempo de uma vibração completa**.\n:::\n:::q Para aplicar + · p. 26 · Q3.3 — Período em SI.\n?? A: **3 × 10⁻³ s**; B: **2 × 10⁻³ s**.\n:::\n:::q Para aplicar + · p. 26 · Q3.4 — Frequências.\n?? A: f = 1/(3 × 10⁻³) ≈ **333 Hz**. B: f = 1/(2 × 10⁻³) = **500 Hz**.\n:::\n:::q Para aplicar + · p. 26 · Q4 — Porque vemos o relâmpago antes de ouvir o trovão?\n?? Ocorrem ao mesmo tempo, mas a **luz** propaga-se muito **mais depressa** (≈ 300 000 km/s) do que o **som** no ar (≈ 343 m/s). A luz chega quase instantaneamente; o som demora mais.\n:::\n:::q Para aplicar + · p. 27 · Q5 — Som percorreu 958,3 m em 3,7 s. Em que meio (CO₂ 259; ar 340; hidrogénio 1260 m/s)?\n?? v = d/Δt = 958,3/3,7 = **259 m/s** → **dióxido de carbono**.\n:::\n:::q Para aplicar + · p. 27 · Q6 — Gráfico com 4 troços (0–t₁: 4 vibrações, amplitude grande; t₁–t₂: 4 vibrações, amplitude pequena; t₂–t₃ e t₃–t₄: muitas vibrações, amplitude grande e pequena). V/F: A. A frequência foi máxima entre 0 e t₁. B. Entre t₁ e t₂ ocorrem 4 vibrações completas. C. O período é máximo entre t₃ e t₄. D. Entre 0 e t₁ e entre t₂ e t₃ atinge-se a amplitude de pressão máxima.\n?? **A – F** (a frequência é máxima entre **t₂ e t₄**, onde há mais vibrações no mesmo tempo). **B – V.** **C – F** (aí o período é **mínimo**; o máximo é entre 0 e t₂). **D – V.**\n:::\n:::q Para aplicar + · p. 27 · Q7.1 — Velocidade no aço 5874 m/s e no ar 343 m/s. Num segundo, o som percorre maior distância no aço ou no ar?\n?? No **aço** (5874 m em vez de 343 m).\n:::\n:::q Para aplicar + · p. 27 · Q7.2 — Porque se ouve o comboio antes de o ver?\n?? O som do comboio propaga-se pelos **carris de aço** (e pelo ar) muito **mais depressa** do que o próprio comboio se desloca, e chega à estação antes dele (o comboio pode ainda estar escondido numa curva ou túnel).\n:::\n:::q Para aplicar + · p. 27 · Q7.3 — \"A velocidade do som é maior nos meios (a) ___ do que nos (b) ___. Onde a velocidade é menor é nos meios (c) ___.\"\n?? (a) **sólidos**; (b) **líquidos** (ou gasosos); (c) **gasosos**.\n:::\n:::q Para aplicar + · p. 27 · Q8 — *Star Wars* (ouvem-se explosões no espaço) ou *Gravity* (colisões sem som). Qual é mais realista?\n?? ***Gravity***. No espaço há **vácuo** e o som **não se propaga** sem um meio material.\n:::\n:::q Para aplicar + · p. 27 · Q9 — Pedra num lago (A: 0,02 m entre cristas; B: 0,025 m do topo da crista ao fundo do vale). Opção correta: A. Há transferência de matéria e energia. B. A amplitude em B é 0,025 m. C. As ondas resultam da propagação de uma vibração. D. A amplitude em A é 0,02 m.\n?? **C.** (A: só há transferência de **energia**. B: 0,025 m é crista-vale; a amplitude é metade, **0,0125 m**. D: 0,02 m é a distância entre cristas — o **comprimento de onda**.)\n:::\n:::q Para aplicar + · p. 27 · Q10 — Associa Frequência / Período / Amplitude de pressão: A. unidade SI s; B. unidade SI Hz; C. tempo de uma vibração completa; D. n.º de vibrações num segundo; E. diferença máxima entre a pressão e a de equilíbrio; F. unidade SI Pa.\n?? **Período:** A, C. **Frequência:** B, D. **Amplitude de pressão:** E, F.\n:::", "chapter": "23-propagacao-velocidade-som"}, {"id": "24-atributos-som", "title": "2.1 Atributos do som — intensidade, altura e timbre", "pages": "Som 28–37", "part": "Som", "md": "## Atividade prática 6 — Diapasão percutido com intensidades diferentes (p. 29)\n:::q AP6 · Parte 1 · p. 29 · O que distingue os sons do diapasão percutido com pouco e com muito vigor?\n?? A **intensidade**: com muito vigor o som é **mais forte** (mais intenso); com pouco vigor é **mais fraco**. A nota (altura) é a mesma.\n:::\n:::q AP6 · Parte 2 · p. 29 · Compara os gráficos no telemóvel.\n?? Os dois gráficos têm o **mesmo período/frequência**, mas o som forte tem **maior amplitude** (picos mais altos).\n:::\n:::q AP6 · p. 29 · Questão-problema.\n?? A onda do diapasão percutido com mais vigor tem **maior amplitude**; a frequência mantém-se. Mais amplitude → som mais **intenso**.\n:::\n## Atividade prática 7 — Diapasões de hastes de diferentes comprimentos (p. 32)\n:::q AP7 · p. 32 · Conseguiste distinguir os sons? Porquê?\n?? **Sim**: um é mais **agudo** (diapasão de hastes **mais curtas**) e o outro mais **grave** (hastes **mais compridas**). Têm **alturas** diferentes.\n:::\n:::q AP7 · p. 32 · Compara os gráficos (hastes curtas vs. compridas) e os sons de 440 Hz e 2000 Hz.\n?? O diapasão de hastes **curtas** dá uma onda com **mais vibrações no mesmo tempo** (maior frequência, menor período) → som **agudo**. O de hastes **compridas** tem **menor frequência** → som **grave**. O som de **2000 Hz** ouve-se muito mais **agudo** do que o de 440 Hz.\n:::\n:::q AP7 · p. 32 · Questão-problema.\n?? As ondas diferem na **frequência**: hastes mais curtas → **maior frequência** → som mais **agudo** (alto); hastes mais compridas → **menor frequência** → som mais **grave** (baixo).\n:::\n## Atividade prática 8 (em estações) — Diferentes alturas nos instrumentos (p. 33)\n:::q AP8 · Estação 1 · p. 33 · Palhinha cortada em três partes: que atributo varia? Que parte dá o som mais alto e com maior frequência?\n?? Varia a **altura**. A parte **mais curta** dá o som mais **alto (agudo)** e a onda de **maior frequência** (coluna de ar mais pequena).\n:::\n:::q AP8 · Estação 2 · p. 33 · Régua a vibrar na mesa: relação entre a altura do som e o comprimento que vibra.\n?? Quanto **menor** o comprimento da parte da régua que vibra, mais **agudo** é o som (**maior frequência**). Parte comprida → som mais grave.\n:::\n:::q AP8 · Estação 3 · p. 33 · Elástico: relação entre o comprimento que vibra e a frequência.\n?? Quanto **mais curto** (e mais esticado) o elástico que vibra, mais **agudo** o som — **maior frequência**.\n:::\n:::q AP8 · p. 33 · Questão-problema: como se produzem sons de diferentes alturas?\n?? Variando o **tamanho do que vibra** (coluna de ar, lâmina, corda) e, nas cordas, também a **tensão**, a **espessura** e o **material**: quanto mais curto/tenso/fino, mais agudo.\n:::\n## Investigo e comunico — A voz humana no canto (p. 38)\n:::q Investigo e comunico · p. 38 · Q1 — Como é que o ser humano forma a voz?\n?? O ar vindo dos **pulmões** passa pela laringe e faz **vibrar as cordas vocais**; a vibração é depois modificada pela garganta, boca, língua, lábios e cavidades nasais.\n:::\n:::q Investigo e comunico · p. 38 · Q2 — Atributo em que se baseia a classificação das vozes.\n?? A **altura** (relacionada com a **frequência**).\n:::\n:::q Investigo e comunico · p. 38 · Q3 — Entre que frequências está a voz humana no canto?\n?? Entre **62 Hz** (baixo) e **1397 Hz** (soprano).\n:::\n:::q Investigo e comunico · p. 38 · Q4 — Num coro: a) masculinos com as vozes mais agudas; b) femininas com ondas de oscilação completa em menor tempo.\n?? a) **Tenores**. b) **Sopranos** (menor período → maior frequência → mais agudo).\n:::\n:::q Investigo e comunico · p. 38 · Q5 — Classifica: a) Ed Sheeran; b) Jacinta; c) Sofia Escobar; d) Barry White (soprano, baixo, contralto ou tenor).\n?? a) **Tenor**; b) **Contralto**; c) **Soprano**; d) **Baixo**. *(Classificação por audição — confirma com o professor.)*\n:::\n## Para aplicar (p. 39)\n:::q Para aplicar · p. 39 · Q1 — Diapasão (onda sinusoidal) vs. martelo (onda irregular), com as mesmas p máx. e p mín. Opção correta: A. O som do martelo é puro. B. As intensidades são iguais. C. É maior a amplitude do diapasão. D. Só o diapasão é fonte sonora.\n?? **B** — as duas ondas atingem as **mesmas pressões máxima e mínima** (mesma amplitude → mesma intensidade). (O som do martelo é **complexo**; ambos são fontes sonoras.)\n:::\n:::q Para aplicar · p. 39 · Q2.1 — Característica da onda que varia com o afastamento da fonte.\n?? A **amplitude** (diminui).\n:::\n:::q Para aplicar · p. 39 · Q2.2 — Atributo do som que varia.\n?? A **intensidade** (o som fica mais fraco).\n:::\n:::q Para aplicar · p. 39 · Q2.3 — \"A onda sonora vai perdendo velocidade entre o José e a Clara.\" Concordas?\n?? **Não.** A velocidade depende **só do meio** (o ar), que é o mesmo. O que diminui é a **amplitude** (e a intensidade), porque a energia se espalha por mais corpúsculos.\n:::\n:::q Para aplicar · p. 39 · Q3 — Diapasões A (264 Hz), B (352 Hz), C (440 Hz). Corretas: A. O período de B é 2,8 ms. B. O menor período é o de A. C. O som mais agudo é o de C. D. O som de C propaga-se com maior velocidade.\n?? **A e C.** T_B = 1/352 ≈ 0,00284 s ≈ **2,8 ms** ✓. O menor período é o de **C** (maior frequência), não A. C é o **mais agudo** ✓. A velocidade é **igual** para todos (mesmo meio).\n:::\n:::q Para aplicar · p. 39 · Q4.1 — Gráfico: A (amplitude maior, frequência alta), B (amplitude média, frequência baixa), C (amplitude pequena, mesma frequência que A). a) maior período; b) maior amplitude; c) menor frequência.\n?? a) **B**; b) **A**; c) **B**.\n:::\n:::q Para aplicar · p. 39 · Q4.2 — Que ondas correspondem a sons com igual altura?\n?? **A e C** (têm a **mesma frequência**).\n:::\n:::q Para aplicar · p. 39 · Q5 — Violino e piano a tocar (mesma frequência, formas diferentes). Correto: A. Não têm a mesma amplitude. B. Não estão a tocar a mesma nota. C. Produzem sons com diferente timbre. D. Os sons são puros.\n?? **C.** As ondas têm o mesmo período (mesma nota) mas formas diferentes → **timbres diferentes**; são sons **complexos**.\n:::", "chapter": "24-atributos-som"}, {"id": "25-detecao-som-audiogramas", "title": "2.2 Deteção do som pelo ser humano, espetro sonoro e audiogramas", "pages": "Som 40–43", "part": "Som", "md": "## Trabalho de pesquisa — Os ultrassons são importantes no dia a dia? (p. 40)\n:::q Trabalho de pesquisa · p. 40 · Quatro aplicações dos ultrassons na medicina e na indústria.\n?? (Pela figura 13 do livro.) **Medicina:** 1) **ecografia/ultrassonografia** (imagens de órgãos e do feto); 2) **fisioterapia** (relaxamento muscular e melhor circulação); 3) **medicina dentária** (remoção de tártaro, higienização de instrumentos). **Indústria:** 4) **sistemas de limpeza**; **controlo de qualidade** (deteção de defeitos); **soldagem e corte de plásticos**; **amaciar a carne**; **sonares** nas embarcações.\n:::", "chapter": "25-detecao-som-audiogramas"}, {"id": "26-poluicao-sonora", "title": "2.3 Poluição sonora — fontes, consequências, prevenção e proteção", "pages": "Som 44–49", "part": "Som", "md": "## Atividade prática 9 — Estás sujeito a poluição sonora diariamente? (p. 44)\n:::q AP9 · p. 44 · Identifica as fontes de poluição sonora e responde à questão-problema.\n?? Valores típicos: aula ≈ 40–60 dB; **corredor no intervalo ≈ 70–85 dB**; **sala dos alunos ≈ 70–80 dB**; conversa ≈ 50–60 dB; **rua com trânsito ≈ 70–90 dB**; quarto à noite ≈ 25–35 dB.\n**Fontes de poluição sonora** (acima de 65 dB): o **intervalo** (gritos, correria), o **polivalente** e o **trânsito** (motores, buzinas). Resposta: **sim**, estamos sujeitos diariamente a poluição sonora, sobretudo na escola nos intervalos e na rua.\n*(Os teus valores dependem das medições que fizeres.)*\n:::\n## Trabalho de pesquisa — Impacto da poluição sonora (p. 45)\n:::q Trabalho de pesquisa · p. 45 · Q1a — Consequências da poluição sonora no ser humano.\n?? Perda de audição (temporária ou **permanente**), zumbidos, dores de cabeça, **perturbações do sono**, **stresse**, ansiedade, irritabilidade, falta de concentração e de memória (pior rendimento escolar), aumento da tensão arterial e do risco cardiovascular.\n:::\n:::q Trabalho de pesquisa · p. 45 · Q1b — Medidas de i) prevenção e ii) proteção.\n?? **i) Prevenção:** não gerar ruído excessivo; preferir **bicicleta/veículos elétricos**; obras nos **horários permitidos**; **isolar** as casas; comprar equipamentos **menos ruidosos**; baixar o volume dos auriculares.\n**ii) Proteção:** **barreiras acústicas**; tapetes e cortinas (absorvem o som); **abafadores e tampões auditivos**; nas fábricas, **cabines acústicas** e **rotação** dos trabalhadores.\n:::\n:::q Trabalho de pesquisa · p. 45 · Q2 — Amigos põem música numa coluna num local público para todos ouvirem. O que achas?\n?? É **falta de civismo**: impõe ruído a quem não quer ouvir e pode ultrapassar os 65 dB (poluição sonora), incomodando, prejudicando a concentração e o descanso dos outros. Deviam usar **auscultadores com volume moderado** ou baixar o som.\n:::\n:::q Trabalho de pesquisa · p. 45 · Q3 — Texto de sensibilização para a comunidade educativa.\n?? Exemplo: \"**O ruído também é poluição!** Acima de 65 dB, o som prejudica a saúde: tira a concentração, causa stresse e cansaço e, se for muito intenso ou prolongado, provoca **perdas de audição que não têm cura**. No intervalo, fala em vez de gritar; usa os auscultadores a menos de 60 % do volume; protege os ouvidos em concertos. **Cuida dos teus ouvidos: só tens dois!**\"\n:::\n## Investigo e comunico — Língua gestual (p. 48)\n:::q Investigo e comunico · p. 48 · Q1 — Que parte do corpo não funciona corretamente numa pessoa surda?\n?? O **ouvido** (sistema auditivo): pode ser o ouvido externo/médio (transmissão das vibrações), a **cóclea** (ouvido interno) ou o **nervo auditivo**.\n:::\n:::q Investigo e comunico · p. 48 · Q2 — Os surdos também são mudos?\n?? *
