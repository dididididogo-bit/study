<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Layout: an iOS-style app. Content layer (grouped lists, widgets) scrolls under a floating
   Liquid Glass navigation layer (nav buttons, tab bar, menus, sheets). Apple system colours. */
:root {
  /* Apple system colours (light) */
  --red: #FF3B30; --orange: #FF9500; --yellow: #FFCC00; --green: #34C759; --mint: #00C7BE;
  --teal: #30B0C7; --cyan: #32ADE6; --blue: #007AFF; --indigo: #5856D6; --purple: #AF52DE;
  --pink: #FF2D55; --brown: #A2845E; --gray: #8E8E93;
  --accent: var(--blue);

  /* Semantic surfaces & labels */
  --bg: #F2F2F7;
  --bg2: #FFFFFF;
  --card: rgba(255, 255, 255, .84);
  --sheet-bg: rgba(242, 242, 247, .82);
  --sheet-card: #FFFFFF;
  --label: #000000;
  --label2: rgba(60, 60, 67, .6);
  --label3: rgba(60, 60, 67, .3);
  --sep: rgba(60, 60, 67, .2);
  --fill: rgba(120, 120, 128, .2);
  --fill2: rgba(118, 118, 128, .12);
  --scrim: rgba(0, 0, 0, .16);
  --on-accent: #FFFFFF;

  /* Liquid Glass */
  --glass: rgba(255, 255, 255, .5);
  --glass-strong: rgba(250, 250, 252, .78);
  --glass-rim: rgba(255, 255, 255, .95);
  --glass-rim2: rgba(255, 255, 255, .35);
  --glass-shade: rgba(0, 0, 0, .05);
  --glass-shadow: rgba(0, 0, 0, .14);
  --lens: rgba(120, 120, 128, .16);
  --lens-press: rgba(255, 255, 255, .28);
  --seg-thumb: #FFFFFF;
  --edge: rgba(242, 242, 247, .7);
  --wall-o: .32;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

  --ease: cubic-bezier(.25, .1, .25, 1);
  --ease-sheet: cubic-bezier(.32, .72, 0, 1);
  --ease-bounce: cubic-bezier(.34, 1.36, .64, 1);
  --ease-soft: cubic-bezier(.22, 1.2, .36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --red: #FF453A; --orange: #FF9F0A; --yellow: #FFD60A; --green: #30D158; --mint: #63E6E2;
    --teal: #40C8E0; --cyan: #64D2FF; --blue: #0A84FF; --indigo: #5E5CE6; --purple: #BF5AF2;
    --pink: #FF375F; --brown: #AC8E68; --gray: #8E8E93;
    --bg: #000000; --bg2: #1C1C1E; --card: rgba(28, 28, 30, .86);
    --sheet-bg: rgba(28, 28, 30, .8); --sheet-card: #2C2C2E;
    --label: #FFFFFF; --label2: rgba(235, 235, 245, .6); --label3: rgba(235, 235, 245, .3);
    --sep: rgba(84, 84, 88, .6); --fill: rgba(120, 120, 128, .36); --fill2: rgba(118, 118, 128, .24);
    --scrim: rgba(0, 0, 0, .42);
    --glass: rgba(40, 40, 44, .42); --glass-strong: rgba(44, 44, 48, .76);
    --glass-rim: rgba(255, 255, 255, .42); --glass-rim2: rgba(255, 255, 255, .1);
    --glass-shade: rgba(0, 0, 0, .25); --glass-shadow: rgba(0, 0, 0, .5);
    --lens: rgba(255, 255, 255, .12); --lens-press: rgba(255, 255, 255, .16);
    --seg-thumb: #636366; --edge: rgba(0, 0, 0, .6); --wall-o: .26;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --red: #FF453A; --orange: #FF9F0A; --yellow: #FFD60A; --green: #30D158; --mint: #63E6E2;
  --teal: #40C8E0; --cyan: #64D2FF; --blue: #0A84FF; --indigo: #5E5CE6; --purple: #BF5AF2;
  --pink: #FF375F; --brown: #AC8E68; --gray: #8E8E93;
  --bg: #000000; --bg2: #1C1C1E; --card: rgba(28, 28, 30, .86);
  --sheet-bg: rgba(28, 28, 30, .8); --sheet-card: #2C2C2E;
  --label: #FFFFFF; --label2: rgba(235, 235, 245, .6); --label3: rgba(235, 235, 245, .3);
  --sep: rgba(84, 84, 88, .6); --fill: rgba(120, 120, 128, .36); --fill2: rgba(118, 118, 128, .24);
  --scrim: rgba(0, 0, 0, .42);
  --glass: rgba(40, 40, 44, .42); --glass-strong: rgba(44, 44, 48, .76);
  --glass-rim: rgba(255, 255, 255, .42); --glass-rim2: rgba(255, 255, 255, .1);
  --glass-shade: rgba(0, 0, 0, .25); --glass-shadow: rgba(0, 0, 0, .5);
  --lens: rgba(255, 255, 255, .12); --lens-press: rgba(255, 255, 255, .16);
  --seg-thumb: #636366; --edge: rgba(0, 0, 0, .6); --wall-o: .26;
  color-scheme: dark;
}
:root[data-accent="red"] { --accent: var(--red) }
:root[data-accent="orange"] { --accent: var(--orange) }
:root[data-accent="yellow"] { --accent: var(--yellow) }
:root[data-accent="green"] { --accent: var(--green) }
:root[data-accent="mint"] { --accent: var(--mint) }
:root[data-accent="teal"] { --accent: var(--teal) }
:root[data-accent="cyan"] { --accent: var(--cyan) }
:root[data-accent="blue"] { --accent: var(--blue) }
:root[data-accent="indigo"] { --accent: var(--indigo) }
:root[data-accent="purple"] { --accent: var(--purple) }
:root[data-accent="pink"] { --accent: var(--pink) }
:root[data-accent="brown"] { --accent: var(--brown) }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { height: 100% }
body {
  margin: 0; background: var(--bg); color: var(--label);
  font: 400 17px/1.29 var(--font); letter-spacing: -.022em;
  -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; letter-spacing: inherit; text-align: inherit }
input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; -webkit-user-select: text; user-select: text }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.ic { width: 22px; height: 22px; flex: none; display: block }

/* ---------- Scene ---------- */
#app { position: fixed; inset: 0; background: #000; overflow: hidden }
.scene {
  position: absolute; inset: 0; background: var(--bg); overflow: hidden;
  transform-origin: 50% 0; transition: transform .5s var(--ease-sheet), border-radius .5s var(--ease-sheet), filter .5s;
}
.scene.pushed { transform: translateY(calc(env(safe-area-inset-top, 0px) + 10px)) scale(.93); border-radius: 24px; filter: brightness(.9) }
.wallpaper { position: absolute; inset: 0; pointer-events: none; opacity: var(--wall-o); transition: opacity .6s }
.wallpaper i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; animation: drift 34s var(--ease) infinite alternate }
.wallpaper i:nth-child(1) { background: radial-gradient(circle, var(--accent) 0, transparent 62%); left: -30vmax; top: -30vmax }
.wallpaper i:nth-child(2) { background: radial-gradient(circle, var(--pink) 0, transparent 62%); right: -34vmax; top: 10vh; animation-duration: 41s; animation-delay: -12s }
.wallpaper i:nth-child(3) { background: radial-gradient(circle, var(--mint) 0, transparent 62%); left: -10vmax; bottom: -40vmax; animation-duration: 37s; animation-delay: -6s }
.wallpaper i:nth-child(4) { background: radial-gradient(circle, var(--orange) 0, transparent 62%); right: -30vmax; bottom: -30vmax; animation-duration: 45s; animation-delay: -20s; opacity: .7 }
@keyframes drift { 0% { transform: translate(0, 0) scale(1) } 50% { transform: translate(8vmax, 6vmax) scale(1.12) } 100% { transform: translate(-6vmax, 10vmax) scale(.95) } }
.nowall .wallpaper { opacity: 0 }

/* ---------- Views ---------- */
.view {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain;
  opacity: 0; visibility: hidden; transform: scale(.985);
  transition: opacity .18s var(--ease), transform .18s var(--ease), visibility 0s .18s;
  scrollbar-width: none;
}
.view::-webkit-scrollbar { display: none }
.view.active { opacity: 1; visibility: visible; transform: none; transition: opacity .28s var(--ease), transform .42s var(--ease-soft), visibility 0s }
.content {
  max-width: 720px; margin: 0 auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 56px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 124px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 26px;
}
.head { display: flex; flex-direction: column; gap: 2px; padding: 0 4px; transform-origin: 0 50% }
.eyebrow { margin: 0; font: 600 13px/18px var(--font); text-transform: uppercase; letter-spacing: .03em; color: var(--label2) }
.lt { margin: 0; font: 700 34px/41px var(--font-display); letter-spacing: .01em; text-wrap: balance }
.subtitle { margin: 0; font: 400 15px/20px var(--font); color: var(--label2) }
.sec { display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.sec-h { margin: 0; padding: 0 4px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font: 700 21px/26px var(--font-display); letter-spacing: .01em }
.sec-h .link { font: 400 17px var(--font); color: var(--accent); letter-spacing: -.02em }
.sec-foot { margin: 0; padding: 0 16px; font: 400 13px/18px var(--font); color: var(--label2) }

/* ---------- Grouped lists ---------- */
.group {
  background: var(--card); border-radius: 26px; overflow: hidden;
  display: flex; flex-direction: column;
}
.row {
  position: relative; display: flex; align-items: center; gap: 14px; width: 100%;
  min-height: 52px; padding-left: 16px; text-align: left; transition: background .25s;
}
.row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 0; min-height: 52px; align-self: stretch }
.row:not(:last-child) .row-main { box-shadow: inset 0 -.5px 0 var(--sep) }
.row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px }
.row-title { font: 400 17px/22px var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.row-sub { font: 400 14px/19px var(--font); color: var(--label2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.row-val { color: var(--label2); font-variant-numeric: tabular-nums; white-space: nowrap }
.chev { color: var(--label3) }
.chev .ic { width: 15px; height: 15px; stroke-width: 2.8 }
button.row:active, .row.tap:active, .row.pressing { background: var(--fill2) }
.star-on { color: var(--yellow) }
.star-on .ic { width: 16px; height: 16px; fill: currentColor; stroke-width: 1.6 }

/* Subject icons (app-icon squircles) */
.sicon {
  --s: 32px; width: var(--s); height: var(--s); border-radius: calc(var(--s) * .26); flex: none;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 78%, #fff), var(--c) 70%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 -1px 1px rgba(0, 0, 0, .1), 0 1px 2px rgba(0, 0, 0, .08);
}
.sicon .ic { width: calc(var(--s) * .6); height: calc(var(--s) * .6); stroke-width: 2.1 }
.sicon b { font: 700 calc(var(--s) * .44)/1 var(--font-round); letter-spacing: -.03em }
.sicon.m { --s: 44px }
.sicon.l { --s: 58px }
.sicon.xl { --s: 88px; box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .4), inset 0 -2px 3px rgba(0, 0, 0, .1), 0 10px 30px color-mix(in srgb, var(--c) 40%, transparent) }

/* Grid of subjects */
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 12px }
.scard {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
  padding: 14px; border-radius: 24px; background: var(--card); min-width: 0;
  transition: transform .35s var(--ease-bounce);
}
.scard:active, .scard.pressing { transform: scale(.97) }
.scard .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; width: 100% }
.scard .code { font: 600 12px/16px var(--font); color: var(--label2); text-transform: uppercase; letter-spacing: .04em }
.scard .name { font: 600 16px/21px var(--font); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.scard .who { font: 400 13px/18px var(--font); color: var(--label2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100% }
.scard .star-on { position: absolute; top: 14px; right: 14px }

/* ---------- Liquid Glass ---------- */
.glass {
  position: relative; isolation: isolate;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(1.9) brightness(1.04);
  backdrop-filter: blur(14px) saturate(1.9) brightness(1.04);
  box-shadow:
    inset 0 1px 0 -.5px var(--glass-rim),
    inset 0 -1px 0 -.5px var(--glass-rim2),
    inset 0 0 12px var(--glass-shade),
    0 6px 22px -4px var(--glass-shadow),
    0 1px 2px rgba(0, 0, 0, .06);
}
.glass::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1px;
  background: linear-gradient(135deg, var(--glass-rim) 0%, transparent 32%, transparent 64%, var(--glass-rim2) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  opacity: .9;
}
.glass-strong { background: var(--glass-strong) }
.rt .glass, .rt .group, .rt .scard, .rt .widget, .rt .menu, .rt .sheet { -webkit-backdrop-filter: none !important; backdrop-filter: none !important }
.rt .glass { background: var(--bg2) }
.rt .glass-strong, .rt .menu, .rt .sheet { background: var(--bg2) }
.rt .group, .rt .scard, .rt .widget { background: var(--bg2) }

/* Refraction (Chromium only: SVG displacement inside backdrop-filter) */
.refract .tabbar { -webkit-backdrop-filter: url(#lg-bar) blur(5px) saturate(1.9) brightness(1.05); backdrop-filter: url(#lg-bar) blur(5px) saturate(1.9) brightness(1.05) }
.refract .tabbar.min { -webkit-backdrop-filter: url(#lg-min) blur(5px) saturate(1.9); backdrop-filter: url(#lg-min) blur(5px) saturate(1.9) }
.refract .tabbar.resizing { -webkit-backdrop-filter: blur(6px) saturate(1.9) brightness(1.05); backdrop-filter: blur(6px) saturate(1.9) brightness(1.05) }
.refract .nbtn { -webkit-backdrop-filter: url(#lg-btn) blur(4px) saturate(1.9); backdrop-filter: url(#lg-btn) blur(4px) saturate(1.9) }
.refract .round { -webkit-backdrop-filter: url(#lg-round) blur(6px) saturate(1.9); backdrop-filter: url(#lg-round) blur(6px) saturate(1.9) }
.refract .lens.pressed { -webkit-backdrop-filter: url(#lg-lens) blur(1.5px) saturate(1.6) brightness(1.08); backdrop-filter: url(#lg-lens) blur(1.5px) saturate(1.6) brightness(1.08) }
.rt.refract .tabbar, .rt.refract .nbtn, .rt.refract .round, .rt.refract .lens.pressed { -webkit-backdrop-filter: none; backdrop-filter: none }

/* Interactive glass: grows and lights up when pressed */
.press { transition: transform .45s var(--ease-bounce), filter .3s, box-shadow .3s }
.press:active { transform: scale(1.08); filter: brightness(1.08) }
.press-in { transition: transform .4s var(--ease-bounce) }
.press-in:active { transform: scale(.96) }

/* ---------- Nav bar ---------- */
.navbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20; pointer-events: none;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav-inner { position: relative; max-width: 720px; margin: 0 auto; height: 56px; display: flex; align-items: center; justify-content: space-between }
.nav-slot { display: flex; gap: 10px; pointer-events: auto; min-width: 44px }
.nav-title {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -30%); opacity: 0;
  font: 600 17px/22px var(--font); transition: opacity .25s, transform .35s var(--ease-soft); white-space: nowrap;
}
.navbar.scrolled .nav-title { opacity: 1; transform: translate(-50%, -50%) }
.nbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--label) }
.nbtn .ic { width: 20px; height: 20px; stroke-width: 2.2 }
.nbtn.tint { background: var(--accent); color: var(--on-accent) }
.nbtn.tint::after { opacity: .6 }
.nbtn[disabled] { opacity: .4; pointer-events: none }
.nbtn.fav-on { color: var(--yellow) }
.nbtn.fav-on .ic { fill: currentColor }
.edge {
  position: absolute; left: 0; right: 0; z-index: 15; pointer-events: none;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  background: linear-gradient(var(--edge), transparent);
  transition: opacity .3s;
}
.edge.top { top: 0; height: calc(env(safe-area-inset-top, 0px) + 80px); opacity: 0;
  -webkit-mask-image: linear-gradient(#000 45%, transparent); mask-image: linear-gradient(#000 45%, transparent) }
.edge.top.on { opacity: 1 }
.edge.bottom { bottom: 0; height: calc(env(safe-area-inset-bottom, 0px) + 72px); -webkit-backdrop-filter: none; backdrop-filter: none;
  background: linear-gradient(transparent, var(--edge));
  -webkit-mask-image: linear-gradient(transparent, #000 60%); mask-image: linear-gradient(transparent, #000 60%) }

/* ---------- Tab bar ---------- */
/* Geometry is driven per frame by a spring simulation in JS (--m: minimise 0→1, --p: press 0→1). */
.tabbar {
  --itemw: 72px; --m: 0; --p: 0;
  position: absolute; z-index: 30; left: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); width: 360px;
  height: 64px; border-radius: 32px; padding: 4px; touch-action: none; will-change: transform, width;
}
.tabclip { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; z-index: 2; pointer-events: none }
.tabtrack { position: absolute; left: 4px; top: 4px; height: 56px; display: flex; will-change: transform }
.tab {
  width: var(--itemw); flex: none; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--label); transition: color .18s var(--ease); pointer-events: auto;
}
.tab > span:first-child { display: block; will-change: transform }
.tab .ic { width: 25px; height: 25px; stroke-width: 1.9; transition: stroke-width .2s }
.tab-label { font: 600 10px/12px var(--font); letter-spacing: .01em; opacity: calc(1 - var(--m) * 2) }
.tab.hl, .tabbar.min .tab.on { color: var(--accent) }
.tab.hl .ic { stroke-width: 2.3 }
.tab.bounce .ic { animation: symBounce .45s var(--ease) }
@keyframes symBounce { 0% { scale: 1 } 30% { scale: .8 } 65% { scale: 1.12 } 100% { scale: 1 } }
.lens {
  position: absolute; left: 4px; top: 4px; height: 56px; width: var(--itemw); border-radius: 28px; z-index: 1;
  background: var(--lens); will-change: transform; pointer-events: none;
}
.lens::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: var(--p);
  background: var(--lens-press);
  box-shadow: inset 0 1px 0 -.5px var(--glass-rim), inset 0 -1px 0 -.5px var(--glass-rim2), inset 0 0 10px rgba(255, 255, 255, .25), 0 8px 24px -6px var(--glass-shadow);
}
.lens.pressed { z-index: 3 }

/* ---------- Search, chips, segmented ---------- */
.search { display: flex; align-items: center; gap: 8px; height: 46px; border-radius: 23px; padding: 0 8px 0 14px; color: var(--label2) }
.search .ic { width: 19px; height: 19px; stroke-width: 2.3 }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: 17px; color: var(--label) }
.search input::placeholder { color: var(--label2) }
.search input::-webkit-search-cancel-button { display: none }
.clear { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--label2); transition: opacity .2s, transform .3s var(--ease-bounce) }
.clear .ic { width: 18px; height: 18px }
.clear[hidden] { display: none }
.chips {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 4px max(16px, env(safe-area-inset-left, 0px)) 10px;
  margin-block: -4px -10px;
}
.chips::-webkit-scrollbar { display: none }
.chip { flex: none; height: 36px; padding: 0 16px; border-radius: 18px; font: 600 15px/36px var(--font); white-space: nowrap; transition: transform .45s var(--ease-bounce), background .25s, color .25s }
.chip.on { background: var(--accent); color: var(--on-accent) }
.chip:active { transform: scale(1.08) }
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border-radius: 999px; background: var(--fill2) }
.seg > button { position: relative; z-index: 1; height: 34px; padding: 0 10px; border-radius: 999px; font: 500 14px/34px var(--font); text-align: center; white-space: nowrap; transition: font-weight .2s }
.seg > button.on { font-weight: 600 }
.seg-thumb {
  position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 999px; background: var(--seg-thumb);
  box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04), inset 0 1px 0 rgba(255, 255, 255, .4);
  transition: transform .5s var(--ease-bounce), width .5s var(--ease-bounce), scale .3s var(--ease-bounce);
}
.seg:active .seg-thumb { scale: 1.06 1.12 }
.seg.noanim .seg-thumb { transition: none }
.seg.disabled { opacity: .45; pointer-events: none }

/* ---------- Switch ---------- */
.switch { position: relative; flex: none; width: 52px; height: 32px; border-radius: 16px; background: var(--fill); transition: background .3s }
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 28px; height: 28px; border-radius: 14px; background: #fff;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .16);
  transition: transform .45s var(--ease-bounce), width .3s var(--ease-bounce), scale .35s var(--ease-bounce), background .2s;
}
.switch[aria-checked="true"] { background: var(--green) }
.switch[aria-checked="true"]::after { transform: translateX(20px) }
.switch:active::after { width: 34px; scale: 1.15; background: rgba(255, 255, 255, .78); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px) }
.switch[aria-checked="true"]:active::after { transform: translateX(14px) }

/* ---------- Widgets (Today) ---------- */
.widgets { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.widget {
  display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-height: 164px; padding: 16px;
  border-radius: 26px; background: var(--card); text-align: left; min-width: 0;
}
.w-label { display: flex; align-items: center; gap: 6px; font: 600 15px/20px var(--font) }
.w-label .ic { width: 18px; height: 18px; stroke-width: 2.4 }
.w-big { font: 700 34px/1 var(--font-round); letter-spacing: -.02em; font-variant-numeric: tabular-nums }
.w-big small { font: 600 15px var(--font); color: var(--label2); letter-spacing: -.01em; margin-left: 3px }
.w-note { font: 400 13px/18px var(--font); color: var(--label2); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.w-ring { display: flex; align-items: center; gap: 12px }
.w-ring svg { width: 58px; height: 58px; flex: none; transform: rotate(-90deg) }
.favs { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; padding: 4px max(16px, env(safe-area-inset-left, 0px)) 6px; margin: -4px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) -6px }
.favs::-webkit-scrollbar { display: none }
.fav { flex: none; width: 70px; display: flex; flex-direction: column; align-items: center; gap: 6px; font: 500 12px/15px var(--font); text-align: center }
.fav span:last-child { width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.bar-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 16px }
.bar-row .bt { display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.bar-row .bn { font: 400 15px/20px var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.bar { height: 6px; border-radius: 3px; background: var(--fill2); overflow: hidden }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--c); transform-origin: 0 50%; animation: grow .9s var(--ease-soft) both }
@keyframes grow { from { transform: scaleX(0) } }

/* ---------- Tasks ---------- */
.check {
  width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff;
  box-shadow: inset 0 0 0 2px var(--label3); transition: background .25s, box-shadow .25s, transform .4s var(--ease-bounce);
}
.check .ic { width: 15px; height: 15px; stroke-width: 3; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .35s .05s var(--ease) }
.check:active { transform: scale(.85) }
.task.done .check { background: var(--c); box-shadow: inset 0 0 0 2px var(--c) }
.task.done .check .ic { stroke-dashoffset: 0 }
.task.done .row-title { color: var(--label2) }
.task.leaving { animation: leave .45s .35s var(--ease) both }
@keyframes leave { to { opacity: 0; transform: translateX(24px) } }
.tag { display: inline-block; padding: 0 6px; border-radius: 6px; font: 600 11px/17px var(--font); letter-spacing: .02em; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); vertical-align: 1px; margin-right: 2px }
.overdue { color: var(--red) }
.example { font: 500 11px/15px var(--font); color: var(--label2); border: .5px solid var(--label3); border-radius: 5px; padding: 0 5px; margin-left: 4px }

/* ---------- Focus ---------- */
.timer { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 8px 0 4px }
.ring { position: relative; width: min(290px, 74vw); max-width: 100%; aspect-ratio: 1 }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible }
.ring .track { stroke: var(--fill2) }
.ring .prog { stroke: var(--c); transition: stroke-dashoffset .35s linear, stroke .4s; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--c) 45%, transparent)) }
.ring-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px }
.ring-time { font: 200 68px/1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums }
.ring-sub { font: 500 15px var(--font); color: var(--label2) }
.pick { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px 0 7px; border-radius: 23px; font: 600 16px var(--font); max-width: 100% }
.pick .sicon { --s: 32px; border-radius: 50% }
.pick .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.pick .ic.dd { width: 16px; height: 16px; stroke-width: 2.6; color: var(--label2) }
.ctrls { display: flex; justify-content: center; gap: 28px }
.round { width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center; font: 600 16px var(--font) }
.round.go { color: var(--green); background: color-mix(in srgb, var(--green) 22%, var(--glass)) }
.round.hold { color: var(--orange); background: color-mix(in srgb, var(--orange) 22%, var(--glass)) }
.round[disabled] { opacity: .45; pointer-events: none }
.dur { width: min(340px, 100%) }

/* ---------- Settings ---------- */
.swatches { display: flex; flex-wrap: wrap; gap: 12px; padding: 14px 16px 16px }
.sw { width: 30px; height: 30px; border-radius: 50%; background: var(--c); position: relative; transition: transform .4s var(--ease-bounce) }
.sw::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; box-shadow: 0 0 0 2.5px var(--c); opacity: 0; scale: .8; transition: opacity .2s, scale .35s var(--ease-bounce) }
.sw.on::after { opacity: 1; scale: 1 }
.sw:active { transform: scale(.88) }
.ricon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: var(--c); flex: none }
.ricon .ic { width: 18px; height: 18px; stroke-width: 2.2 }
.stepper { display: flex; border-radius: 10px; background: var(--fill2); overflow: hidden }
.stepper button { width: 46px; height: 32px; display: grid; place-items: center; transition: background .2s }
.stepper button:active { background: var(--fill) }
.stepper button + button { box-shadow: inset .5px 0 0 var(--sep) }
.stepper .ic { width: 16px; height: 16px; stroke-width: 2.6 }
.danger { color: var(--red) }
.seg-row { padding: 12px 16px }

/* ---------- Empty states ---------- */
.empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 36px 24px; text-align: center; color: var(--label2) }
.empty .ic { width: 46px; height: 46px; stroke-width: 1.6; margin-bottom: 6px; color: var(--label3) }
.empty b { font: 700 21px/26px var(--font-display); color: var(--label) }
.empty p { margin: 0; font: 400 15px/20px var(--font); max-width: 32ch; text-wrap: balance }
.empty .btn { margin-top: 12px }

/* ---------- Buttons ---------- */
.btn { height: 50px; padding: 0 22px; border-radius: 25px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 17px var(--font); white-space: nowrap }
.btn .ic { width: 19px; height: 19px; stroke-width: 2.3 }
.btn-prim { background: var(--accent); color: var(--on-accent) }
.btn-prim.glass::after { opacity: .55 }
.btn-red { background: var(--red); color: #fff }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }

/* ---------- Menus ---------- */
.menu {
  position: fixed; z-index: 70; min-width: 236px; max-width: min(300px, calc(100vw - 24px)); max-height: min(70vh, 560px);
  overflow-y: auto; overscroll-behavior: contain; padding: 6px; border-radius: 26px; scrollbar-width: none;
  transform-origin: var(--ox, 50%) var(--oy, 0); animation: menuIn .5s var(--ease-soft) both;
}
.menu::-webkit-scrollbar { display: none }
.menu.measure { visibility: hidden; animation: none }
.menu.out { animation: menuOut .2s var(--ease) both; pointer-events: none }
@keyframes menuIn { from { opacity: 0; transform: scale(.3); filter: blur(10px) } 60% { opacity: 1; filter: blur(0) } to { opacity: 1; transform: none; filter: none } }
@keyframes menuOut { to { opacity: 0; transform: scale(.6); filter: blur(6px) } }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 10px 14px 10px 10px; border-radius: 18px; font: 400 17px/22px var(--font); text-align: left; transition: background .15s }
.mi:hover, .mi:focus-visible, .mi.hl { background: var(--fill2); outline: 0 }
.mi .mck { width: 18px; flex: none; color: var(--label) }
.mi .mck .ic { width: 16px; height: 16px; stroke-width: 2.8 }
.mi .ml { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.mi .ml small { display: block; font-size: 13px; line-height: 17px; color: var(--label2) }
.mi > .ic { width: 20px; height: 20px; stroke-width: 2 }
.mi .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); flex: none }
.mi.danger { color: var(--red) }
.mhead { padding: 10px 14px 4px 38px; font: 400 13px/18px var(--font); color: var(--label2) }
.msep { height: .5px; background: var(--sep); margin: 5px 14px }
.ctx-ov { position: fixed; inset: 0; z-index: 60; background: var(--scrim); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2); animation: fade .3s var(--ease) both }
.ctx-ov.out { animation: fade .25s var(--ease) reverse both }
.ctx-prev { position: fixed !important; z-index: 65; margin: 0; pointer-events: none; border-radius: 20px; overflow: hidden; background: var(--bg2) !important;
  box-shadow: 0 24px 60px -10px rgba(0, 0, 0, .35); transition: transform .5s var(--ease-soft); padding-left: 16px }
.ctx-prev.scard { padding: 14px }
.ctx-prev .row-main { box-shadow: none !important }
@keyframes fade { from { opacity: 0 } }

/* ---------- Sheets ---------- */
.sheet-layer { position: fixed; inset: 0; z-index: 50 }
.sheet-scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .45s var(--ease) }
.sheet {
  position: absolute; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); margin: 0 auto; max-width: 620px;
  max-height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 40px);
  display: flex; flex-direction: column; border-radius: 38px; overflow: hidden;
  background: var(--sheet-bg); -webkit-backdrop-filter: blur(40px) saturate(1.8); backdrop-filter: blur(40px) saturate(1.8);
  box-shadow: inset 0 1px 0 -.5px var(--glass-rim), 0 -10px 50px -10px rgba(0, 0, 0, .3);
  transform: translateY(calc(100% + 60px)); transition: transform .55s var(--ease-sheet);
}
.sheet-layer.open .sheet { transform: none }
.sheet-layer.open .sheet-scrim { opacity: 1 }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--label3); margin: 7px auto -4px; flex: none }
.sheet-head { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px; padding: 10px 14px 6px; touch-action: none; flex: none }
.sheet-title { text-align: center; font: 600 17px/22px var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 6px 16px calc(env(safe-area-inset-bottom, 0px) + 20px); display: flex; flex-direction: column; gap: 22px; scrollbar-width: none }
.sheet-body::-webkit-scrollbar { display: none }
.sheet .group { background: var(--sheet-card); -webkit-backdrop-filter: none; backdrop-filter: none }
.hero { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding-top: 4px }
.hero h2 { margin: 0; font: 700 26px/31px var(--font-display); letter-spacing: .01em; text-wrap: balance }
.hero p { margin: -6px 0 0; color: var(--label2); font-size: 15px }
.hero .sicon.xl { animation: pop .7s .1s var(--ease-bounce) both }
@keyframes pop { from { transform: scale(.5); opacity: 0 } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px }
.stat { background: var(--sheet-card); border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.stat b { font: 700 22px/26px var(--font-round); font-variant-numeric: tabular-nums; white-space: nowrap }
.stat span { font: 400 13px/16px var(--font); color: var(--label2) }
.avatar { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font: 600 15px var(--font-round); background: linear-gradient(#A5ABB8, #858994) }
.notes { width: 100%; min-height: 110px; resize: vertical; border: 0; outline: 0; background: none; padding: 14px 16px; font-size: 17px; line-height: 22px; display: block }
.notes::placeholder, .field::placeholder { color: var(--label3) }
.field { width: 100%; border: 0; outline: 0; background: none; padding: 0 16px; height: 52px; font-size: 17px; display: block }
.frow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; min-height: 52px }
.frow:not(:last-child) { box-shadow: inset 0 -.5px 0 var(--sep) }
.frow select, .frow input { border: 0; outline: 0; background: var(--fill2); border-radius: 9px; padding: 6px 10px; font-size: 16px; color: var(--accent); max-width: 62%; min-width: 0 }
.as { padding-top: 22px; gap: 10px }
.as-text { text-align: center; padding: 0 12px 10px; display: flex; flex-direction: column; gap: 4px }
.as-text b { font: 600 17px var(--font) }
.as-text p { margin: 0; color: var(--label2); font-size: 15px }
.as .btn { width: 100% }

/* ---------- Toast ---------- */
.toast {
  position: fixed; z-index: 90; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 10px);
  display: flex; align-items: center; gap: 8px; padding: 0 20px 0 14px; height: 46px; border-radius: 23px; max-width: calc(100vw - 32px);
  font: 600 15px var(--font); white-space: nowrap; pointer-events: none;
  transform: translate(-50%, calc(-100% - 30px)) scale(.8); transition: transform .55s var(--ease-bounce);
}
.toast.show { transform: translate(-50%, 0) }
.toast .ic { width: 20px; height: 20px; color: var(--green); stroke-width: 2.6 }
.toast span { overflow: hidden; text-overflow: ellipsis }

/* ---------- Pushed pages (iOS navigation stack) ---------- */
.page {
  position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow: hidden;
  transform: translateX(100%); transition: transform .5s var(--ease-sheet), filter .5s var(--ease-sheet);
  box-shadow: -10px 0 40px rgba(0, 0, 0, .12);
}
.page.in { transform: none }
.page.under, .scene.under { transform: translateX(-28%); filter: brightness(.9) }
.scene.under { transition: transform .5s var(--ease-sheet), filter .5s var(--ease-sheet) }
.page.dragging, .page.dragging ~ .page { transition: none }
.pscroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain; scrollbar-width: none }
.pscroll::-webkit-scrollbar { display: none }
.pscroll .content { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 60px) }
.pnav { position: absolute; top: 0; left: 0; right: 0; z-index: 3; pointer-events: none;
  padding-top: env(safe-area-inset-top, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.pnav .nav-slot { pointer-events: auto }
.pnav.scrolled .nav-title { opacity: 1; transform: translate(-50%, -50%) }
.pnav .nav-title { max-width: 55%; overflow: hidden; text-overflow: ellipsis }
.pback { height: 44px; border-radius: 22px; display: inline-flex; align-items: center; gap: 2px; padding: 0 14px 0 8px; font: 500 17px var(--font); color: var(--label); max-width: 160px }
.pback .ic { width: 22px; height: 22px; stroke-width: 2.4; transform: scaleX(-1) }
.pback span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.page .edge.top { position: absolute }

/* ---------- Guide home ---------- */
.ghero { display: flex; align-items: center; gap: 16px; padding: 0 4px }
.ghero .sicon { --s: 64px }
.gprog { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding: 18px; border-radius: 26px; background: var(--card) }
.gprog svg { width: 92px; height: 92px; transform: rotate(-90deg) }
.gprog .num { font: 700 28px/1 var(--font-round); font-variant-numeric: tabular-nums }
.gprog .lbl { font: 400 14px/19px var(--font); color: var(--label2) }
.gprog .stack { display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.gprog .btns { display: flex; gap: 8px; flex-wrap: wrap }
.gprog .btn { height: 40px; padding: 0 16px; font-size: 15px; border-radius: 20px }
.ch-row .row-sub { display: flex; align-items: center; gap: 8px }
.minibar { flex: none; width: 54px; height: 5px; border-radius: 3px; background: var(--fill2); overflow: hidden }
.minibar i { display: block; height: 100%; background: var(--green); border-radius: 3px }
.ch-num { width: 32px; height: 32px; border-radius: 9px; flex: none; display: grid; place-items: center; font: 700 13px var(--font-round); color: #fff; background: var(--c) }
.feat { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border-radius: 24px; text-align: left; background: var(--card) }
.feat .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px }
.feat b { font: 600 17px/22px var(--font) }
.feat small { font: 400 13px/17px var(--font); color: var(--label2) }
.feat .bar { height: 5px }
.feat .bar i { background: var(--cyan); animation: none }
.missing { padding: 14px 16px; border-radius: 20px; background: color-mix(in srgb, var(--orange) 14%, var(--card)); font: 400 14px/19px var(--font); display: flex; flex-direction: column; gap: 6px }
.missing b { color: var(--orange) }
.gpane { display: flex; flex-direction: column; gap: 26px }
.gpane[hidden] { display: none }

/* ---------- Guide reader (rendered Markdown) ---------- */
.gdoc { display: flex; flex-direction: column; gap: 14px; -webkit-user-select: text; user-select: text; font: 400 17px/1.47 var(--font); letter-spacing: -.01em; padding: 0 4px }
.gdoc h1 { margin: 0; font: 700 30px/36px var(--font-display); letter-spacing: .01em; text-wrap: balance }
.gdoc h2 { margin: 18px 0 0; font: 700 22px/28px var(--font-display); letter-spacing: .01em; text-wrap: balance }
.gdoc h3 { margin: 8px 0 0; font: 600 18px/24px var(--font) }
.gdoc p { margin: 0 }
.gdoc ul, .gdoc ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px }
.gdoc li::marker { color: var(--label2) }
.gdoc b { font-weight: 650 }
.gdoc code { font: 500 .9em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--fill2); padding: 1px 5px; border-radius: 5px }
.gdoc pre { margin: 0; padding: 14px; border-radius: 16px; background: var(--card); overflow-x: auto; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace }
.gdoc blockquote { margin: 0; padding: 4px 0 4px 14px; border-left: 3px solid var(--fill); color: var(--label2) }
.tbl { overflow-x: auto; border-radius: 16px; background: var(--card); -webkit-overflow-scrolling: touch }
.tbl table { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.35 }
.tbl th { text-align: left; font-weight: 600; background: var(--fill2) }
.tbl th, .tbl td { padding: 10px 12px; vertical-align: top; min-width: 90px }
.tbl tr + tr td { box-shadow: inset 0 .5px 0 var(--sep) }
.call { --c: var(--blue); position: relative; padding: 14px 16px 14px 18px; border-radius: 20px; background: color-mix(in srgb, var(--c) 11%, var(--card)); display: flex; flex-direction: column; gap: 8px }
.call > .cl { display: flex; align-items: center; gap: 6px; font: 700 12px/16px var(--font); text-transform: uppercase; letter-spacing: .06em; color: var(--c) }
.call > .cl .ic { width: 15px; height: 15px; stroke-width: 2.4 }
.call.key { --c: var(--accent) }
.call.note { --c: var(--blue) }
.call.warn { --c: var(--orange) }
.call.tip { --c: var(--green) }
.call.faq { --c: var(--purple) }
.call.steps { --c: var(--indigo) }

/* Question cards */
.qcard { border-radius: 22px; background: var(--card); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 110px; transition: box-shadow .4s }
.qcard.flash { box-shadow: 0 0 0 3px var(--accent) }
.qhead { display: flex; align-items: center; gap: 8px; font: 600 12px/16px var(--font); color: var(--label2); letter-spacing: .02em }
.qhead .qdot { width: 8px; height: 8px; border-radius: 50%; background: var(--fill); flex: none }
.qcard[data-st="1"] .qdot { background: var(--green) }
.qcard[data-st="-1"] .qdot { background: var(--red) }
.qtext { font-weight: 600 }
.qtext > :first-child { margin-top: 0 }
.qreveal { align-self: flex-start; height: 36px; padding: 0 14px; border-radius: 18px; font: 600 15px var(--font); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); transition: transform .4s var(--ease-bounce) }
.qreveal:active { transform: scale(.95) }
.qcard.open .qreveal { display: none }
.qans-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease-sheet) }

<script id="guide-data" type="application/json">{"FQ": {"title": "Físico-Química", "subtitle": "Guia de estudo · FAQ 8 · 8.º ano", "missing": ["Livro 1 (Reações Químicas): o capítulo 3 \"Velocidade das reações químicas\" (pp. 108–128) não estava nos PDFs.", "Livro 2 (Som e Luz): faltam as pp. 94–95, e os PDFs terminam na p. 105 (o capítulo 4 pode continuar)."], "chapters": [{"id": "00-ciclo-carbono", "title": "Ciclo do carbono e do oxigénio", "pages": "2–3", "part": "Reações Químicas", "md": "# Ciclo do carbono e do oxigénio\n\nO **carbono** e o **oxigénio**, fundamentais para a existência de vida na Terra, **circulam naturalmente** entre o **subsolo**, os **organismos**, os **oceanos** e a **atmosfera**. O **Sol** é a fonte de energia que sustenta a vida na Terra.\n\n## Os processos do ciclo\n\n| Processo | O que acontece | Equação química |\n|---|---|---|\n| **Fotossíntese** (plantas verdes) | As plantas consomem CO₂ da atmosfera e água que absorvem dos solos. Por ação da luz, o CO₂ reage com a água, originando dioxigénio e glicose (alimento da planta). A vegetação reabsorve parte do carbono da atmosfera. | 6 CO₂(g) + 6 H₂O(l) → 6 O₂(g) + C₆H₁₂O₆(aq) |\n| **Fotossíntese** (fitoplâncton) | Parte do CO₂ atmosférico dissolve-se na água e é absorvida pelas algas do fitoplâncton, que produzem O₂. | — |\n| **Respiração** (plantas) | Na ausência de luz, as plantas verdes respiram: consomem dioxigénio e produzem dióxido de carbono. | C₆H₁₂O₆(aq) + 6 O₂(g) → 6 CO₂(g) + 6 H₂O(g) |\n| **Respiração** (animais e seres humanos) | Absorvem O₂ e libertam CO₂ para a atmosfera. | — |\n| **Combustões** | A queima de petróleo e carvão liberta carbono na forma de CO e CO₂ para a atmosfera. | C(s) + O₂(g) → CO₂(g)  ·  2 C(s) + O₂(g) → 2 CO(g) |\n\n## Onde fica guardado o carbono\n- **Carvão mineral:** restos de plantas e animais soterrados concentram carbono no subsolo; sob elevada pressão formam carvão mineral, o **combustível fóssil mais abundante**.\n- **Petróleo e gás natural:** sob altas temperaturas e pressão do subsolo, a matéria orgânica decomposta forma petróleo e gás natural.\n- **Conchas e corais:** combinado com o cálcio, o carbono desce ao fundo do mar ou é incorporado nas conchas, nos corais e noutros organismos.\n\n:::key\nA fotossíntese **retira CO₂** e **liberta O₂**; a respiração e as combustões **consomem O₂** e **libertam CO₂**. A fotossíntese e a respiração são reações \"inversas\" uma da outra.\n:::"}, {"id": "01-natureza-corpuscular", "title": "1.1 Natureza corpuscular da matéria", "pages": "10–15", "part": "Reações Químicas", "md": "# Natureza corpuscular da matéria\n\n:::faq\n**Porque é que uma bola de praia não totalmente cheia incha quando é deixada ao Sol?**\nAo aquecer, os corpúsculos do ar dentro da bola ficam mais agitados (movem-se mais depressa) e chocam com mais força e mais frequência com as paredes da bola. Como a bola não está totalmente cheia e é flexível, o ar ocupa mais espaço — a bola incha.\n:::\n\n## Um caso português — Lítio, o petróleo branco (p. 10)\n- O **lítio** não se encontra na natureza como elemento isolado, mas sim na forma de **iões combinados** com outros elementos.\n- É usado em **baterias recarregáveis** (telemóveis, carros elétricos), na indústria do vidro e da cerâmica, na produção de medicamentos e no fabrico de ligas metálicas usadas na aviação.\n- É um aliado importante na **transição energética** (deixar de depender de combustíveis fósseis). Com o aumento de carros elétricos, a Europa percebeu que dependia da Ásia para matérias-primas como baterias.\n- **Portugal** tem reservas de lítio em zonas do centro e do norte, correspondentes a cerca de **10 % do lítio de todas as reservas europeias**. Atualmente só se extrai uma pequena parte, destinada à cerâmica e ao vidro.\n- Para ser usado em baterias, prevê-se a abertura de minas a céu aberto. O aumento da extração é apetecível economicamente, mas os **impactos sociais e ambientais** têm de ser avaliados.\n\n## Se se fragmentar um objeto até não o poder dividir mais, o que se irá encontrar? (p. 11)\n- **Demócrito** (filósofo grego, séc. IV a.C., 460–370 a.C.) acreditava que, ao fragmentar um grão de areia até ao limite, se obteria uma porção muitíssimo pequena que não se poderia dividir mais — o **átomo**, que em grego significa **indivisível**.\n- **Dalton** (físico e químico inglês, 1766–1844), há cerca de 200 anos (séc. XIX), definiu o átomo como uma **esfera indivisível** que constitui toda a matéria.\n- Mais tarde, com microscópios eletrónicos e de acordo com a **teoria cinético-corpuscular**, concluiu-se que a matéria é formada por corpúsculos pequenos: **átomos, moléculas e iões**, em **constante movimento**, com **espaços vazios** entre eles.\n- Estes corpúsculos **não se veem** a olho nu nem com microscópio ótico; só com **microscópios eletrónicos** (ampliações de mais de 100 mil vezes).\n- Exemplo: o diâmetro de um átomo de carbono é 0,000 000 000 134 m = **1,34 × 10⁻¹⁰ m**.\n\n:::note\nHoje sabe-se que o átomo é constituído por partículas mais pequenas, sendo, portanto, **divisível**.\n:::\n\n## O que se vê ao observar um material com um microscópio eletrónico? (p. 12)\nPara observar os corpúsculos é preciso usar técnicas de observação, muitas delas **indiretas**. A imagem construída no microscópio eletrónico depende do tipo de corpúsculos do material (ex.: folha de **alumínio** → átomos de alumínio arrumados; folha de **grafeno** → átomos de carbono em forma de favo de mel).\n\n*Curiosidade:* prevê-se que venham a existir telemóveis flexíveis com a espessura de uma folha de papel, com baterias só de grafeno (hipótese ainda em investigação). Já se desenvolvem baterias de grafeno e lítio, com grande durabilidade e reduzido tempo de carga.\n\n:::key\n**Teoria cinético-corpuscular da matéria:** a matéria é constituída por pequeníssimos **corpúsculos** (átomos, moléculas e iões), em **movimento contínuo**. Entre os corpúsculos existe **espaço vazio**.\n:::\n\nTodos os materiais são formados por **corpúsculos em movimento**, e são as **forças de atração** entre eles que fazem com que a matéria se apresente em diferentes estados físicos, a uma dada temperatura e pressão.\n\n## Estados físicos — macroscópico e microscópico (p. 13)\n\n| | **Sólido** | **Líquido** | **Gasoso** |\n|---|---|---|---|\n| Propriedades macroscópicas | Volume fixo e forma fixa, independentemente do recipiente | Volume fixo; adquire a forma do recipiente | Adquire a forma e o volume do recipiente |\n| Forças de atração | **Muito fortes** | **Menos fortes** do que nos sólidos | **Fracas** |\n| Movimento dos corpúsculos | Posições aproximadamente fixas; só **vibram** | Têm alguma mobilidade e chocam entre si | Movem-se livremente, **muito afastados** entre si |\n\n:::key\nA diferença entre os **estados físicos** explica-se pela **liberdade de movimento** dos corpúsculos e pela **atração** entre eles.\n:::\n\n### Atividade prática 1 — Seringa com ar vs. com água\n**Questão-problema:** Porque é que se consegue comprimir o êmbolo de uma seringa quando está cheia de ar e não quando está cheia de água?\nProcedimento: encher a seringa com ar, tapar a ponta com o dedo e empurrar o êmbolo; repetir com água.\n\n> Quando se comprime um gás, reduz-se o espaço vazio entre os corpúsculos desse gás e, por isso, o volume ocupado pelo gás diminui.\n\n## Misturar substâncias sem transformação química (p. 14)\n\n:::note\n**Transformação química:** há formação de **novas substâncias**.\n**Transformação física:** há alteração da forma física dos materiais (partir, dobrar, mudar de estado físico…) **sem** formação de novas substâncias.\n:::\n\n### Atividade prática 2 — Água + etanol\n**Questão-problema:** Sem haver derrames, adicionou-se 40 mL de água a 10 mL de etanol. Qual será o volume final obtido?\nMaterial: proveta de 50 mL, proveta de 10 mL, água e etanol.\n\nQuando se misturam substâncias diferentes, as novas interações entre corpúsculos podem ser **mais fortes ou mais fracas**, e o volume da mistura pode **não corresponder à soma** dos volumes iniciais (ex.: água + etanol).\n\n## O que acontece quando se aquece um sólido? (pp. 14–15)\n- Ao aquecer um sólido, os corpúsculos **recebem energia** e ficam **mais agitados**, colidindo com mais energia e mais frequência. Esta agitação torna-se mais forte do que a interação entre corpúsculos → ganham mobilidade → a substância passa a **líquido** (fusão).\n- Se o aquecimento continuar, aumenta ainda mais a energia e o movimento, os corpúsculos afastam-se mais e aumenta o espaço vazio → passa a **gasoso**.\n\n**Mudanças de estado físico:**\n- sólido → líquido: **fusão** · líquido → sólido: **solidificação**\n- líquido → gasoso: **vaporização** · gasoso → líquido: **condensação**\n- sólido → gasoso: **sublimação** (e gasoso → sólido: sublimação inversa / ressublimação)\n\n### Atividade prática 3 — Corante em água quente e fria\n**Questão-problema:** Por que razão consigo misturar mais depressa (sem agitar) um corante em água quente do que em água fria?\nParte 1: simulação PhET *Gases: Introdução* — arrefecer/aquecer um gás e observar o movimento dos corpúsculos. Parte 2: 150 mL de água em dois gobelés, aquecer um até 40 °C, juntar uma gota de corante a cada um.\n\n:::key\nMantendo o **volume constante**, o **movimento dos corpúsculos é tanto mais intenso quanto maior for a temperatura**.\n:::"}, {"id": "02-propriedades-gases", "title": "1.2 Propriedades dos gases", "pages": "16–19", "part": "Reações Químicas", "md": "# Propriedades dos gases\n\nOs gases são muito estudados porque têm grande aplicação no quotidiano e são facilmente acessíveis — todo o nosso corpo está em contacto permanente com gases (ar atmosférico). Vamos estudar três propriedades: **volume, temperatura e pressão**.\n\n| Grandeza | Símbolo | Significado |\n|---|---|---|\n| **Volume** | *V* | Espaço ocupado por um gás. |\n| **Temperatura** | *T* | Relaciona-se com a **agitação** dos corpúsculos do gás. |\n| **Pressão** | *p* | Soma da intensidade das **forças** que os corpúsculos exercem nas **paredes** do recipiente, **por unidade de área**. |\n\n- Unidade mais usual de pressão: **atmosfera (atm)**. Unidade **SI**: **pascal (Pa)**.\n\n:::warn\n**Cidadania consciente — Gases longe de fontes de calor!** Os corpúsculos de um gás dentro de uma lata, ao serem aquecidos, aumentam a intensidade da força exercida por unidade de área das paredes da lata. Se a temperatura continuar a aumentar, a lata pode **rebentar**, causando graves danos físicos e materiais. **Mantém as latas com gases sob pressão longe de fontes de calor!**\n:::\n\n## Pode variar-se a pressão de um gás variando a temperatura ou o volume?\n\n### Atividade prática 4 (simulação PhET *Gases: Introdução*)\n**Questões-problema:** O que acontece à pressão de um gás quando é aquecido, mantendo o volume? O que acontece à pressão quando diminui o volume, mantendo a temperatura?\nProcedimento: registar T e p iniciais; aquecer até 200 °C (volume constante); depois, a temperatura constante, diminuir o volume.\n\nA **temperatura**, o **volume** e a **pressão** de um gás são grandezas físicas que se **relacionam entre si**:\n\n:::key\n**Volume constante:** ↑ temperatura → ↑ intensidade da força exercida pelos corpúsculos por unidade de área → **↑ pressão** (figura 9).\n**Temperatura constante:** ↓ volume → ↑ intensidade da força por unidade de área → **↑ pressão** (figura 10).\n:::\n\n:::faq\n**Porque é que uma bola de praia não totalmente cheia incha quando é deixada ao Sol? (resposta do livro)**\nCom o aumento da temperatura exterior, a temperatura do ar no interior da bola também aumenta. Os corpúsculos do ar agitam-se mais, aumentando a intensidade das forças exercidas nas paredes interiores da bola. Como as paredes têm alguma **elasticidade**, vão expandindo à medida que aumenta a intensidade das forças, aumentando assim o **volume** da bola.\n:::\n\n## Para resumir — Natureza corpuscular da matéria (p. 18)\n- A **matéria** é formada por pequenos corpúsculos, apenas visíveis com **microscópios eletrónicos**.\n- Os **corpúsculos** são: **átomos, moléculas e iões**.\n- Os corpúsculos estão em **constante movimento**.\n- Entre os corpúsculos existe **espaço vazio**.\n- A matéria pode estar nos estados **sólido, líquido e gasoso** — do sólido para o gasoso **aumenta a liberdade de movimento** dos corpúsculos.\n\n## Investigo e comunico — Gases sem cheiro (p. 18)\nOs gases domésticos (butano, propano) são **inodoros e incolores**. São odorizados artificialmente com produtos que contêm **enxofre**, dando o \"cheiro a gás\", para que uma fuga seja facilmente detetada."}, {"id": "03-atomos-elementos", "title": "1.3 Átomos e elementos químicos", "pages": "20–23", "part": "Reações Químicas", "md": "# Átomos e elementos químicos\n\n:::faq\n**Numa escala submicroscópica, como é constituído o corpo humano?**\nOs principais **elementos químicos** do corpo humano são o **carbono, o oxigénio, o hidrogénio e o nitrogénio**. Também são importantes o cálcio, o fósforo, o enxofre e o sódio, entre outros. A nível atómico, o corpo é, na maior parte, **espaço vazio**: o átomo de hidrogénio tem um protão no núcleo e um eletrão à volta, e entre eles não há rigorosamente nada — o átomo de hidrogénio é **99,9999999999996 % espaço vazio** (e o mesmo acontece com os outros átomos do corpo).\n:::\n\n## O que é o átomo?\n- O átomo é uma das **unidades estruturais** de toda a matéria. Demócrito e Dalton diziam que era indivisível, mas estudos desde cerca de **1850** até ao séc. XX mostraram que é formado por **partículas subatómicas**: **eletrões, protões e neutrões** (partículas muito menores do que o átomo).\n- O átomo tem duas zonas:\n  - **Núcleo** (região central, muito pequena): **protões** (carga elétrica **positiva**) e **neutrões** (**sem** carga elétrica).\n  - **Nuvem eletrónica** (região à volta do núcleo, formada maioritariamente por vazio): onde se movem os **eletrões** (carga elétrica **negativa**).\n- A região do núcleo é **muito mais pequena** do que a nuvem eletrónica.\n\n```\nÁtomo\n├── Núcleo\n│   ├── Protões (carga +)\n│   └── Neutrões (sem carga)\n└── Nuvem eletrónica\n    └── Eletrões (carga −)\n```\n\n- Átomos com igual número de protões são do **mesmo elemento químico**.\n- Em cada átomo, **n.º de eletrões = n.º de protões**. Ex.: 20 protões (20 cargas +) → 20 eletrões (20 cargas −). Por isso o átomo é sempre **eletricamente neutro**.\n\n:::key\nUm átomo é formado por **partículas subatómicas: protões (+), neutrões (sem carga) e eletrões (−)**.\nUm átomo é **eletricamente neutro** porque o número de protões é sempre igual ao número de eletrões.\n:::\n\n:::warn\n**Cidadania consciente — Contaminação ambiental.** O lixo (doméstico, industrial e rural) pode conter substâncias nocivas que contaminam os solos e os mares com elementos químicos indesejáveis. **Descarta o teu lixo com consciência!**\n:::\n\n## O que são elementos químicos?\nTudo o que nos rodeia é formado por um ou mais elementos químicos. Exemplos:\n- A **maçã** é rica em cálcio, fósforo e potássio.\n- A **água mineral** contém hidrogénio, oxigénio, silício, cálcio, magnésio e cloro.\n- A armação da **bicicleta** é feita com alumínio.\n- O **smartphone** contém cobre, ouro, prata, lítio, cobalto, alumínio e silício.\n- O **cimento** contém carbono, oxigénio, hidrogénio, alumínio, ferro e silício.\n\n- A **IUPAC** (*International Union of Pure and Applied Chemistry*) — organização internacional que define as regras para os nomes dos compostos químicos — reconhece **118 elementos químicos**: **90 naturais** e os restantes **sintéticos**.\n- Os elementos estão organizados na **Tabela Periódica** (p. 125). Cada \"caixa\" tem um número = **número de protões** do núcleo dos átomos desse elemento. Esse número é **diferente para cada elemento**.\n- Ex.: **hidrogénio (H)**: 1 protão, 1 eletrão. **Oxigénio (O)**: 8 protões, 8 eletrões.\n\n:::key\nExistem **118 elementos** reconhecidos pela IUPAC. Todos os átomos de um **mesmo elemento químico** têm **igual número de protões** no núcleo.\n:::\n\n## Símbolos de elementos químicos (p. 22)\n- Criados no **séc. XIX**, com base nas letras do nome em **latim, grego ou inglês**.\n- Uma letra → **maiúscula**. Duas letras → **1.ª maiúscula, 2.ª minúscula**.\n- Leem-se **letra a letra**: \"Li\" lê-se \"éle-i\".\n- O sódio é **Na** porque em latim se chama *natrium*.\n\n**Tabela 1 — Nome e símbolo de alguns elementos**\n\n| Elemento | Símbolo | Elemento | Símbolo | Elemento | Símbolo |\n|---|---|---|---|---|---|\n| Alumínio | Al | Ferro | Fe | Néon | Ne |\n| Cálcio | Ca | Flúor | F | Níquel | Ni |\n| Carbono | C | Fósforo | P | Nitrogénio | N |\n| Chumbo | Pb | Hélio | He | Ouro | Au |\n| Cloro | Cl | Hidrogénio | H | Oxigénio | O |\n| Cobalto | Co | Iodo | I | Potássio | K |\n| Cobre | Cu | Lítio | Li | Prata | Ag |\n| Enxofre | S | Magnésio | Mg | Sódio | Na |\n\n:::tip\nOs que costumam enganar: **Pb** chumbo, **Au** ouro, **Ag** prata, **K** potássio, **Na** sódio, **Cu** cobre, **Fe** ferro, **S** enxofre, **P** fósforo, **N** nitrogénio.\n:::\n\n## Substâncias elementares\nSubstâncias como o **hélio** (gás nos balões) e o **ferro** (pregos) são **substâncias elementares**: formadas por átomos de **um só elemento químico**.\n\n:::key\n**Substância elementar** → constituída por **um só elemento químico**.\n:::\n\n## Representação simbólica de átomos (p. 23)\nModelos com códigos de cores para representar átomos (úteis para modelos moleculares). As cores não são reais — servem só para ajudar.\n\n| Elemento | Cor do modelo |\n|---|---|\n| Hidrogénio | Branco |\n| Carbono | Preto |\n| Oxigénio | Vermelho |\n| Nitrogénio | Azul |\n| Cloro | Verde |\n| Enxofre | Amarelo |\n\nPara representar vários átomos **separados**, escreve-se o **número antes do símbolo** (coeficiente):\n- Dois átomos de hidrogénio → **2 H**\n- Um átomo de oxigénio → **O**\n- Quatro átomos de carbono → **4 C**\n- Três átomos de nitrogénio → **3 N**\n\n## Para resumir — Átomo e elementos químicos (p. 24)\n- O **átomo** é formado por uma região central, o **núcleo**, e por uma região à volta deste — a **nuvem eletrónica**.\n- É formado por **protões, neutrões e eletrões**: os protões (e neutrões) estão no núcleo e os eletrões giram à volta do núcleo.\n- É **eletricamente neutro**: **n.º de protões (carga +) = n.º de eletrões (carga −)**.\n- A cada tipo de átomo corresponde um **elemento químico**.\n- Todas as substâncias formadas por átomos do mesmo elemento químico são **substâncias elementares**.\n- Conhecem-se **118 elementos** (**90 naturais e 28 sintéticos**).\n- São do mesmo elemento todos os átomos **com o mesmo número de protões**.\n- Cada elemento tem um **símbolo químico** com uma letra (maiúscula) ou duas (1.ª maiúscula, 2.ª minúscula). Ex.: Hidrogénio **H**, Carbono **C**, Magnésio **Mg**."}, {"id": "04-moleculas", "title": "1.4 Moléculas e fórmulas químicas", "pages": "26–32", "part": "Reações Químicas", "md": "# Moléculas\n\n:::faq\n**A que se deve o \"buraco\" de ozono?**\nO **ozono** (O₃) nas camadas superiores da atmosfera é de importância vital, porque **impede que grande parte da radiação solar** (ultravioleta) atinja a superfície terrestre. Poluentes como os **clorofluorocarbonetos (CFC)**, presentes em frigoríficos e aparelhos de ar condicionado, **destroem** a fina camada de ozono, originando zonas mais rarefeitas — o **\"buraco\" de ozono**.\n:::\n\n## O que são moléculas?\n- Toda a matéria é formada por corpúsculos: átomos, moléculas e iões.\n- Quando um átomo se **liga** a um ou mais átomos, forma-se uma **molécula** — um corpúsculo **eletricamente neutro**.\n- Há moléculas formadas por átomos do **mesmo elemento** (ex.: O₂, dois átomos de oxigénio ligados) e por átomos de **elementos diferentes** (ex.: H₂O, dois de hidrogénio e um de oxigénio).\n- As moléculas são infinitamente pequenas: em apenas **1 g de água** há cerca de **33 456 000 000 000 000 000 000** moléculas (≈ 3,3 × 10²²).\n\n## Representação simbólica de moléculas — fórmulas químicas\n**Moléculas de um só elemento:** escreve-se o **símbolo químico** e, à direita, **em índice**, o número de átomos da molécula.\n\n| Composição | Fórmula |\n|---|---|\n| Dois átomos de hidrogénio | **H₂** |\n| Três átomos de oxigénio | **O₃** |\n| 60 átomos de carbono | **C₆₀** |\n\nOs átomos podem ligar-se em inúmeras combinações → há muitíssimas substâncias com propriedades diferentes.\n\n:::key\nSubstância formada por **moléculas de um só elemento** (ex.: O₂, N₂, O₃): a **unidade estrutural** é a **molécula** e a substância é **elementar**.\n:::\n\n:::note\n**Relembra:** uma **substância** é formada por **um só componente**; uma **mistura** é formada por **dois ou mais componentes**.\n:::\n\n**Moléculas de dois ou mais elementos:** depois de cada símbolo indica-se, em índice à direita, o n.º de átomos desse elemento. **Quando há só um átomo, omite-se o índice 1.**\n\n| Composição | Fórmula |\n|---|---|\n| 1 átomo de carbono + 2 de oxigénio | **CO₂** (não se escreve C₁O₂) |\n| 2 átomos de hidrogénio + 1 de oxigénio | **H₂O** |\n| 1 átomo de carbono + 4 de hidrogénio | **CH₄** |\n\n:::tip\nPode-se escrever O₂C em vez de CO₂? Segundo a IUPAC, recomenda-se que os elementos surjam pela ordem **C, N, H, S, O**. Por isso escreve-se **CO₂**.\n:::\n\n:::key\nSubstância formada por moléculas de **dois ou mais elementos** (ex.: água H₂O, propanona/acetona C₃H₆O): a **unidade estrutural** é a **molécula** e a substância é **composta**.\n:::\n\n## Como se representam várias moléculas? (p. 28)\nEscreve-se, **antes** da fórmula e ao mesmo nível, o número de moléculas — o **coeficiente**.\n\n| Representação | Significado |\n|---|---|\n| **3 H₂** | Três moléculas de H₂, cada uma com 2 átomos de H → no total **6 átomos** (3 × 2) de hidrogénio. |\n| **2 CH₄** | Duas moléculas de CH₄ (1 C + 4 H cada) → no total **10 átomos**: 2 × 1 de C e 2 × 4 de H. |\n\n:::key\nEm **3 H₂O**: o **coeficiente (3)** é o número de **moléculas**; o **índice (2)** é o número de **átomos** de cada elemento **numa molécula**.\n:::\n\n## Nomes de moléculas (regras IUPAC) (p. 29)\n\n| Fórmula | Nome | Composição |\n|---|---|---|\n| H₂ | **di-hidrogénio** | 2 átomos de H |\n| O₂ | **dioxigénio** | 2 átomos de O |\n| O₃ | **trioxigénio** (ou **ozono**) | 3 átomos de O |\n| N₂ | **dinitrogénio** (ou **azoto**) | 2 átomos de N |\n| Cl₂ | **dicloro** | 2 átomos de Cl |\n| S₈ | **octaenxofre** | 8 átomos de S |\n| H₂O | **água** (ou **monóxido de di-hidrogénio**) | 2 H + 1 O |\n| CO₂ | **dióxido de carbono** | 1 C + 2 O |\n| CO | **monóxido de carbono** | 1 C + 1 O |\n| CH₄ | **metano** | 1 C + 4 H |\n| C₄H₁₀ | **butano** | 4 C + 10 H |\n| NH₃ | **amoníaco** (ou **tri-hidreto de nitrogénio**) | 1 N + 3 H |\n| SO₂ | **dióxido de enxofre** | 1 S + 2 O |\n| NO₂ | **dióxido de nitrogénio** | 1 N + 2 O |\n\n:::tip\nPrefixos: **mono** = 1, **di** = 2, **tri** = 3, **tetra** = 4, **penta** = 5, **hexa** = 6, **octa** = 8.\n:::\n\n## Tem (cons)ciência! — Nutrição: o que acontece ao açúcar no organismo? (p. 31)\n- Os **açúcares** pertencem aos **hidratos de carbono** — importantes, mas devem ser consumidos **com moderação**.\n- Açúcar simples principal: **sacarose (C₁₂H₂₂O₁₁)**, composta por **glicose (C₆H₁₂O₆)**, adicionada a alimentos e bebidas. Outros: **frutose (C₆H₁₂O₆)** na fruta e **lactose (C₁₂H₂₂O₁₁)** nos laticínios.\n- **Coração e rins:** o excesso de glicose no sangue causa inflamação nos vasos sanguíneos, aumentando o risco de enfarte do miocárdio e insuficiência renal (principais causas de morte em Portugal).\n- **Pâncreas:** produz **insulina** (hormona que faz entrar a glicose nas células). Se a sua atividade é deficiente (ex.: obesidade), a glicose acumula-se no sangue → **diabetes mellitus**. Quase metade da população portuguesa tem excesso de glicose no sangue.\n- **Fígado:** transforma o excesso de açúcar em **gordura** (acumula-se sobretudo no abdómen). A OMS considera a obesidade uma **pandemia do séc. XXI**.\n- **Músculos:** o exercício aumenta o uso de glicose; deves fazer **pelo menos 60 minutos de atividade física por dia**.\n- **Cérebro:** o excesso de açúcar dificulta a sensação de saciedade e estimula **serotonina (C₁₀H₁₂N₂O)** e **dopamina (C₈H₁₁NO₂)** → cria **dependência**.\n- **Boca:** o açúcar alimenta as bactérias → **cárie dentária** (afeta ~90 % de crianças e adultos). Escovar os dentes **pelo menos duas vezes por dia**.\n- Quantidades: refrigerante (1 lata) **35 g** (6–7 pacotes); creme de cacau e avelã (2 colheres) **17 g** (3 pacotes); gomas (1 saqueta) **14 g** (2–3 pacotes); cereais com chocolate (1 taça) **13 g** (2–3 pacotes).\n- Segundo a OMS, o consumo excessivo de açúcar é a principal causa de morte no mundo. Afeta a memória e **dificulta a aprendizagem**.\n\n## Para resumir — Moléculas (p. 32)\n- São **agrupamentos de dois ou mais átomos ligados** entre si.\n- Podem ser representadas por **modelos moleculares** e por **fórmulas químicas** (ex.: CO₂, O₂).\n- A **fórmula química** indica: o(s) **símbolo(s)** do(s) elemento(s) da molécula; o **número de átomos** de cada elemento (em índice, à direita do símbolo; o \"1\" omite-se).\n- Exemplo: **3 CH₄** = 3 moléculas de metano, cada uma com 1 átomo de carbono e 4 de hidrogénio.\n\n## Investigo e comunico — Fumar não é fixe! (p. 32)\nQuem fuma é mais vulnerável a infeções respiratórias e patologias bucais, e tem menor capacidade física.\n*Mortes atribuídas ao tabaco por doença (Portugal 2017):* neoplasias (tumores) **19,6 %**; doenças cérebro-cardiovasculares **8,7 %**; doença respiratória crónica **28,1 %**; diabetes mellitus tipo 2 **9,8 %**."}, {"id": "05-ioes-compostos-ionicos", "title": "1.5 Iões e compostos iónicos", "pages": "34–41", "part": "Reações Químicas", "md": "# Iões e compostos iónicos\n\n:::faq\n**Porque é que temos cãibras?**\nAs cãibras são **contrações musculares involuntárias**, muitas vezes fortes e dolorosas, sobretudo nas pernas de quem pratica desporto (mas podem acontecer a qualquer pessoa, mesmo a dormir). Causas: falta de **aquecimento**, esforço muscular exagerado e/ou **défice de iões K⁺, Mg²⁺ e Ca²⁺** no organismo. Para as evitar: bom aquecimento e alimentos ricos em vitaminas e nesses iões — abacate, espinafres, banana e leguminosas (ricos em **K⁺** e **Mg²⁺**) e batata-doce (muito rica em **Ca²⁺**).\n:::\n\n## O que é um ião?\n- Tal como o átomo e a molécula, o **ião** é um constituinte da matéria.\n- Ao contrário dos átomos e moléculas, os iões **não são eletricamente neutros**: têm **carga elétrica** (positiva ou negativa).\n- Ião com carga **positiva** → **catião**. Ião com carga **negativa** → **anião**.\n\n## Como se sabe se um ião é positivo ou negativo?\nHá átomos com tendência a **captar** eletrões e outros com tendência a **ceder** eletrões.\n- Ex.: o átomo de **sódio** (11 protões, 11 eletrões) tende a **ceder 1 eletrão** → **ião sódio** (11 protões, 10 eletrões).\n- O átomo de **cloro** (17 protões, 17 eletrões) tende a **captar 1 eletrão** → **ião cloreto** (17 protões, 18 eletrões).\n\n:::key\n**O ião sódio é um catião** porque: formou-se pela **cedência** de um eletrão; tem globalmente **mais uma carga positiva** do que negativas; tem carga **monopositiva** (+1).\n**O ião cloreto é um anião** porque: formou-se pela **captação** de um eletrão; tem globalmente **mais uma carga negativa**; tem carga **mononegativa** (−1).\n:::\n\n:::tip\nTruque: **ceder eletrões → catião (+)**; **captar eletrões → anião (−)**. Os protões **nunca** mudam!\n:::\n\n## Como se representam iões? (p. 35)\nA representação do ião inclui:\n- o **símbolo químico** do átomo que lhe deu origem;\n- a **carga elétrica** em **expoente, do lado direito**;\n- se a diferença entre protões e eletrões for maior que 1, escreve-se o **número antes do sinal** (o \"1\" omite-se).\n\n| Ião | Símbolo | Carga |\n|---|---|---|\n| Ião sódio | **Na⁺** | +1 |\n| Ião cloreto | **Cl⁻** | −1 |\n| Ião cálcio | **Ca²⁺** | +2 |\n\n- **Iões monoatómicos:** formados por **um só átomo** (ex.: O²⁻, F⁻, K⁺).\n- **Iões poliatómicos:** formados por **mais do que um átomo** (ex.: NO₃⁻, NH₄⁺, PO₄³⁻). A carga é a do ião todo, em expoente à direita.\n\n| Ião poliatómico | Fórmula | Significado da carga |\n|---|---|---|\n| **Ião nitrato** | **NO₃⁻** | excesso de **1 eletrão** em relação ao n.º total de protões |\n| **Ião amónio** | **NH₄⁺** | deficiência de **1 eletrão** em relação ao n.º total de protões |\n| **Ião fosfato** | **PO₄³⁻** | excesso de **3 eletrões** em relação ao n.º total de protões |\n\n:::key\nOs **iões** têm **carga elétrica** que resulta da **captação ou cedência de eletrões**.\n- **O + 2 eletrões → O²⁻** (átomo de oxigénio capta 2 eletrões → **ião óxido**, anião)\n- **Fe → Fe³⁺ + 3 eletrões** (átomo de ferro cede 3 eletrões → **ião ferro(III)**, catião)\n:::\n\n## Atividade prática 6 — Será a água mineral comercializada toda igual? (p. 36)\nAnalisar o rótulo de uma água mineral.\n\n## O que é um composto iónico (sal)? (p. 36)\nQuando se aproximam **iões de carga contrária** (ou átomos que tendem a formar iões de carga contrária), estabelece-se uma **força elétrica atrativa** → forma-se um **composto iónico**. Ex.: o sódio cede 1 eletrão ao cloro → Na⁺ e Cl⁻ atraem-se → **NaCl**.\n\n- Os compostos iónicos são **eletricamente neutros**: n.º de cargas negativas = n.º de cargas positivas.\n\n### Escrever a fórmula química\n- Escreve-se **primeiro o catião** (ião positivo) e **depois o anião** (ião negativo).\n- **Omitem-se as cargas** na fórmula final.\n- O **número de iões** de cada tipo vai em **índice, à direita** (o 1 omite-se).\n- Iões poliatómicos repetidos ficam entre **parênteses**: Ba(OH)₂.\n\n### Dar o nome\n- Primeiro o **nome do anião**, depois **\"de\"** + **nome do catião**.\n- Quando catião e anião são **monoatómicos**, indica-se o n.º de iões com **prefixos multiplicadores** (di, tri…).\n- Ex.: **NaCl – cloreto de sódio**; **MgCl₂ – dicloreto de magnésio**.\n\n:::steps\n**Exemplos resolvidos**\n1. **Na⁺ + O²⁻** → para ficar neutro são precisos **2 Na⁺** e **1 O²⁻**: 2 Na⁺ + O²⁻ → **Na₂O** — **óxido de dissódio**.\n2. **Ca²⁺ + Cl⁻** → 1 Ca²⁺ e **2 Cl⁻**: Ca²⁺ + 2 Cl⁻ → **CaCl₂** — **dicloreto de cálcio**.\n3. **Cu²⁺ + SO₄²⁻** → Cu²⁺ + SO₄²⁻ → **CuSO₄** — **sulfato de cobre(II)**.\n4. **Na⁺ + CO₃²⁻** → 2 Na⁺ + CO₃²⁻ → **Na₂CO₃** — **carbonato de sódio**.\n5. **Ba²⁺ + OH⁻** → Ba²⁺ + 2 OH⁻ → **Ba(OH)₂** — **di-hidróxido de bário**.\n:::\n\n:::tip\nMétodo rápido: **\"cruza\" as cargas**. Ca²⁺ e Cl⁻ → o 2 do cálcio vai para o cloro, o 1 do cloro vai para o cálcio → CaCl₂. Al³⁺ e O²⁻ → Al₂O₃. Depois simplifica se possível (Mg²⁺ e O²⁻ → MgO).\n:::\n\n- As substâncias formadas por compostos iónicos formam uma **rede cristalina** com atração entre iões de carga oposta (ex.: cristal de NaCl).\n- Nestas substâncias: as **unidades estruturais são os iões**; trata-se obrigatoriamente de uma substância **composta**.\n\n:::key\nOs **compostos iónicos** são formados por **iões** e são **eletricamente neutros**.\n:::\n\n## Compostos iónicos no quotidiano (p. 39)\nOs compostos iónicos também se chamam **sais**. Podem ter origem **natural** (ex.: o cloreto de sódio nas salinas) mas a maioria tem origem **industrial** (ex.: sulfato de cobre(II)).\n\n**Tabela 2 — Sais usados no quotidiano / laboratório**\n\n| Sal | Fórmula | Uso |\n|---|---|---|\n| Cloreto de sódio | **NaCl** | Sal de cozinha — tempero alimentar (branco) |\n| Sulfato de cobre(II) | **CuSO₄** | Fungicida antimíldio em videiras e batateiras (azul) |\n| Carbonato de cálcio | **CaCO₃** | Mármore — base de monumentos, ex.: Mosteiro dos Jerónimos (branco) |\n| Trióxido de diferro | **Fe₂O₃** | Resultado da corrosão do ferro — **ferrugem** (vermelho-acastanhado) |\n\n:::warn\n**Cidadania consciente — Olha o excesso de sal!** 85 % dos adolescentes portugueses consomem sal em excesso: média de **8,5 g/dia**; a OMS recomenda **menos de 5 g/dia**. Evita alimentos processados industrializados!\n:::\n\n## Para resumir — Iões (p. 40)\n- Um ião pode formar-se por **captação** de um ou mais eletrões (ex.: **Br + 1 eletrão → Br⁻**) ou por **cedência** de um ou mais eletrões (ex.: **Ca → Ca²⁺ + 2 eletrões**).\n- Iões **negativos** = **aniões**; iões **positivos** = **catiões**.\n- Há substâncias cuja **unidade estrutural** são **iões**.\n- Iões de carga contrária exercem **forças elétricas de atração** e formam **compostos iónicos**.\n- Os compostos iónicos são **eletricamente neutros**: n.º de cargas positivas = n.º de cargas negativas.\n- A **fórmula química** do ião indica o n.º e tipo de átomos que o originaram e a **carga** (n.º de eletrões captados/cedidos).\n\n## Investigo e comunico — Elementos minerais essenciais (p. 40)\nOs sais minerais são fundamentais para as funções celulares das plantas; convém adicionar periodicamente nutrientes (adubos) à terra.\n\n| Elemento essencial | Forma em que a raiz o absorve |\n|---|---|\n| Nitrogénio | NO₃⁻ e NH₄⁺ |\n| Potássio | K⁺ |\n| Cálcio | Ca²⁺ |\n| Magnésio | Mg²⁺ |\n| Fósforo | H₂PO₄⁻ e HPO₄²⁻ |\n| Enxofre | SO₄²⁻ |"}, {"id": "06-reacoes-quimicas-lavoisier", "title": "1.6 Reações químicas, Lei de Lavoisier e equações químicas", "pages": "44–53", "part": "Reações Químicas", "md": "# Reações químicas\n\n:::faq\n**Porque é que choramos ao cortar cebolas?**\nAo cortar uma cebola rompem-se células que contêm enxofre e liberta-se **propanotial-S-óxido (C₃H₆SO)**. Ao atingir os olhos, este gás provoca irritação e as glândulas lacrimais produzem **lágrimas** (defesa). O C₃H₆SO **reage com a água** das lágrimas e formam-se três produtos: **ácido sulfúrico (H₂SO₄)**, **propanal (C₃H₆O)** e **ácido sulfídrico (H₂S)** — que causam ardor e prurido.\n**4 C₃H₆SO(g) + 4 H₂O(l) → H₂SO₄(aq) + 4 C₃H₆O(l) + 3 H₂S(aq)**\nO corpo produz mais lágrimas (água) para **diluir** o ácido formado e diminuir a irritação.\n:::\n\n## Como detetar uma reação química? (p. 44)\n:::note\n**Relembra:** nas reações químicas há **formação de novas substâncias**, que pode ocorrer por **junção de substâncias**, por **ação mecânica**, por **aquecimento**, por **incidência de luz** e por **ação da eletricidade**.\n:::\n\n**Evidências** (provas visíveis) de uma reação química:\n- **Formação de um gás** (efervescência, bolhas)\n- **Formação de um sólido** (ex.: ferrugem no ferro)\n- **Mudança de cor** (ex.: banana a escurecer)\n- **Formação de chama**\n- **Alteração de temperatura** (ex.: velas a arder)\n\n## O que acontece quando se juntam substâncias? — Teoria das colisões\nQuando os corpúsculos de duas substâncias entram em contacto, podem ocorrer, ou não, **colisões eficazes**:\n- **Situação A — colisão eficaz:** os corpúsculos colidem e **formam-se novas substâncias** com propriedades diferentes → **ocorre reação química**.\n- **Situação B — colisão não eficaz:** os corpúsculos colidem mas **não se formam novas substâncias** → não há reação.\n\n- **Reagentes** = substâncias iniciais. **Produtos da reação** = substâncias que se formam.\n\n:::key\n**Teoria das colisões:** quando os reagentes colidem e formam novas ligações há formação de novas substâncias (**colisão eficaz**): **quebram-se ligações** entre os corpúsculos dos reagentes e **formam-se novas ligações**, originando os produtos da reação.\n:::\n\n## Como se representa uma reação química? (p. 45)\nPor **equações químicas**: **reagentes à esquerda**, **produtos à direita**, separados por uma **seta (→)** que indica a transformação. Indicam-se os **estados físicos**: **sólido (s)**, **líquido (l)**, **gasoso (g)**, **aquoso (aq)** (dissolvido em água).\n\n**Reagentes (substâncias iniciais) → Produtos da reação (substâncias que se formam)**\n\n:::note\n**Recorda:** numa **solução aquosa de iodeto de potássio**, o iodeto de potássio está totalmente dissolvido em água → **mistura homogénea**. **Solvente** = a água; **soluto** = o iodeto de potássio.\n:::\n\n### Atividade prática 7 — Será possível obter um sólido juntando duas soluções aquosas?\nJuntar 1 gota de solução de **nitrato de chumbo(II)** a ~10 gotas de solução de **iodeto d
