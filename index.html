tria** | **Controlo de qualidade** — deteção de defeitos ou imperfeições |\n| **Indústria** | **Soldagem e corte de plásticos** (económicos e eficientes) |\n| **Indústria alimentar** | Tornar a **carne mais macia** |\n| **Embarcações** | **Sonares** (normalmente **300 kHz – 600 kHz**) para mapear o fundo do mar, localizar cardumes, navios, submarinos ou socorrer mergulhadores perdidos |\n\n## Audiogramas (pp. 42–43)\nA capacidade de ouvir um som entre 20 Hz e 20 000 Hz também depende da sua **intensidade**.\n\n### Nível de intensidade sonora\n- Escala que relaciona, **para a mesma frequência**, a intensidade de um som com a do **som mais fraco que conseguimos ouvir**.\n- Medido na escala de **bel (B)**; usa-se mais o **decibel (dB)**: **1 dB = 1/10 B = 0,1 B**.\n- Instrumento de medida: **sonómetro**.\n\n- **Limiar da audição:** o som **menos intenso** que o ser humano consegue ouvir. Numa audição normal, varia entre **0 dB e 25 dB** (sons do quotidiano).\n- **Limiar da dor:** nível máximo **suportável sem sentir dor** — **≥ 120 dB**.\n\n**Figura 15 — Níveis de intensidade sonora (dB):**\n\n| Situação | dB |\n|---|---|\n| Abaixo do nível de perceção humana | < 0 |\n| Deserto ou região polar sem vento | 0 |\n| Voz sussurrada | 10 |\n| Sala de aula | 40 |\n| Rádio com volume médio | 50 |\n| Aspirador a funcionar | 80 |\n| Broca pneumática | 100 |\n| Descolagem de avião | 130 |\n| Lançamento de foguetão | 170 |\n\n:::key\nO **nível de intensidade sonora** mede-se com **sonómetros**, em **decibéis (dB)**, e relaciona-se com a intensidade do som.\nO **limiar da audição**, numa audição normal, situa-se **entre 0 dB e 25 dB** — o nível **mínimo** que um ser humano consegue ouvir.\nPara quase todas as frequências, o **limiar da dor** é **≥ 120 dB** — nível a partir do qual um som **provoca dor**.\n:::\n\n### Zona de audição (p. 43, figura 16)\n- A **zona de audição** depende da **frequência** e do **nível de intensidade sonora**.\n- O limiar da audição entre **0 e 25 dB** é para a gama do quotidiano, **250 Hz – 8000 Hz**; para outras frequências do espetro audível pode ser muito diferente de 0 dB (ex.: a **20 Hz** é preciso cerca de **120 dB** para ouvir).\n- O ouvido humano é **mais sensível** por volta dos **1000–5000 Hz** (limiar mais baixo).\n- O **limiar da dor** ronda os **120–130 dB** em toda a gama.\n\n### Audiograma tonal simples\n- Determina o **limiar de audição individual**; faz-se numa **cabine acústica** (isolada acusticamente), com **auscultadores** especiais.\n- São emitidos sons e o paciente **assinala** quando os ouve (levanta a mão ou prime um botão que acende uma luz).\n- Frequências testadas: **125 Hz a 8000 Hz**; nível de intensidade: cerca de **0 dB a 120 dB**.\n\n### Audiogramas (p. 44, figura 18)\nCom os resultados do exame faz-se o **audiograma**, onde se regista o **limiar de audição individual** (nível de intensidade em dB, a crescer **para baixo**, em função da frequência, de 125 a 8000 Hz). **●** = ouvido esquerdo; **×** = ouvido direito; zona cinzenta = limiar de uma audição normal (0–25 dB).\n\n| Audiograma | O que mostra |\n|---|---|\n| **A — Audição normal** | Os dois ouvidos dentro da zona cinzenta (0–25 dB) em todas as frequências |\n| **B — Perda auditiva no ouvido esquerdo** | O ouvido **esquerdo** (●) precisa de sons **mais intensos** (≈ 30–40 dB) em **todas as frequências**; o direito é normal |\n| **C — Perda auditiva nos 4000 Hz, em ambos os ouvidos** | Os dois ouvidos descem muito (≈ 100 dB) perto dos **4000 Hz** (típico da exposição a ruído) |\n\n:::tip\n**Ler um audiograma:** quanto **mais abaixo** está o ponto, **mais intenso** tem de ser o som para a pessoa o ouvir → **pior audição** nessa frequência.\n:::"}, {"id": "26-poluicao-sonora", "title": "2.3 Poluição sonora — fontes, consequências, prevenção e proteção", "pages": "Som 44–49", "part": "Som", "md": "# Poluição sonora\n\nA audição permite desfrutar sons agradáveis (canto de uma ave, mar), mas também nos expõe a **ruídos** que interferem com a qualidade de vida → **poluição sonora**.\n\n### Atividade prática 9 — Estás sujeito a poluição sonora diariamente? (p. 44)\nUsar um sonómetro ou uma app \"medidor de som\" numa aula, no corredor no intervalo, na sala dos alunos, numa conversa, numa rua com trânsito, no quarto à noite e noutro local ruidoso.\n\n## Que sons são poluição sonora? (p. 44)\nO ruído é hoje visto como fonte de problemas **físicos, psicológicos e sociais**. A **OMS** definiu **poluição sonora** como sons com nível de intensidade **superior a 65 dB**, recomendando que **durante o dia** não se ultrapasse este valor.\n\n:::key\n**Poluição sonora (OMS):** sons com nível de intensidade sonora **superior a 65 dB**.\n:::\n\n## Consequências da poluição sonora (p. 45)\nSegundo a OMS, é um dos **fatores ambientais que mais problemas causa na saúde humana**:\n- afeta a **concentração** e a **memorização** → **menor rendimento escolar**;\n- o ruído prolongado provoca **stresse, fadiga, depressão ou ansiedade**;\n- um ruído **superior a 45 dB** impede **conciliar o sono** ou dormir bem → decisões menos ponderadas, **irritabilidade e agressividade**.\n\nTambém afeta o **ambiente e a vida selvagem**: perturba os padrões de **reprodução** e **aleitamento** e pode contribuir para a **extinção de espécies** → desequilíbrios nos **ecossistemas**.\n\n## Medidas de prevenção e proteção (p. 46)\n\n### Prevenir a poluição sonora\n- Atividades de lazer **sem ruído excessivo**;\n- evitar carros a combustão — preferir **bicicleta** ou **veículos elétricos**;\n- **obras domésticas** nos horários recomendados;\n- **isolar** moradias/apartamentos com materiais que absorvem ruídos;\n- comprar equipamentos tendo em conta o **nível de ruído**.\n\n:::note\n**Regulamento Geral do Ruído** (decreto-lei n.º 9/2007), artigo 16.º: obras no interior de edifícios de habitação, comércio ou serviços que façam ruído **só em dias úteis, entre as 8 h e as 20 h**.\n:::\n\n### Proteger quando não se pode evitar\n- **Barreiras acústicas** (metal, acrílico) em vias de tráfego intenso, para impedir a propagação do som;\n- na decoração, **tapetes, cortinas** e outros materiais **absorventes de som**;\n- **equipamentos de segurança acústica**: **abafadores** e **tampões auditivos**;\n- na indústria: **enclausurar as máquinas** em cabines acústicas e **rotação periódica** dos trabalhadores expostos.\n\n:::note\n**Abafadores e tampões auditivos:** equipamentos de **proteção auditiva individual**, a usar sempre que o bem-estar da pessoa exposta ao ruído está em causa.\n:::\n\n:::faq\n**Para que servem as barreiras ao longo das autoestradas?**\n**Não** são para impedir a passagem de animais ou pessoas. São **barreiras acústicas**: um obstáculo físico para **reduzir os impactos da poluição sonora** nas populações — por isso só se colocam onde há **aglomerados populacionais**.\n:::\n\n## Tem (cons)ciência! — Otorrinolaringologia (p. 47)\n**Porque é que uma pessoa é surda?**\n- **Congénita** (já se nasce surdo): medicamentos ou doença da mãe na gestação, falta de oxigenação do bebé no parto…\n- **Adquirida:** alguns medicamentos, doenças (ex.: **otites** na infância), **exposição a ruídos intensos e/ou prolongados** (ex.: telemóvel, mp3). **Evita a exposição a ruídos intensos!**\n\n| Nível (dB) | Sensação corporal | Consequências |\n|---|---|---|\n| **< 50** | Confortável | — |\n| **50 – 65** | Inibe o relaxamento; estado de alerta | Diminui o poder de concentração |\n| **65 – 70** | O organismo reage para se adequar ao ambiente | Aumenta a **cortisona**, diminui a resposta **imunológica**, aumenta o **colesterol** e a libertação de **endorfinas** |\n| **> 70** | Grandes níveis de **stresse**; desequilíbrios emocionais | Aumenta o risco de **enfarte**, **infeções** e **lesões no sistema auditivo** |\n\n**Porque ouvimos pior constipados?** Nas crianças as **trompas de Eustáquio** são mais curtas, estreitas e horizontais, dificultando o movimento de ar e fluido. Com constipações ou alergias o tecido incha e as bactérias ficam presas → **infeção no ouvido** que empurra o **tímpano** (vermelho, inchado, dorido). **Assoa-te com frequência e lava as fossas nasais com água do mar.**\n\n**Cotonetes para tirar a cera?** **Não.** O corpo elimina naturalmente o excesso de cera; os cotonetes podem **ferir a membrana do tímpano**. **Evita usar cotonetes!**\n\n## Para resumir — Deteção do som pelo ser humano (p. 48)\n- De todas as frequências (**espetro sonoro**), o ser humano só ouve uma parte — os **sons audíveis** (20 Hz – 20 000 Hz); abaixo são **infrassons**, acima **ultrassons**.\n- O **nível de intensidade sonora** mede-se com **sonómetros**, em **decibéis (dB)**.\n- **Limiar da audição:** entre **0 dB e 25 dB**. **Limiar da dor:** **≥ 120 dB**.\n- Se se suspeita de um problema auditivo, faz-se um **audiograma**.\n- Maiores fontes de **poluição sonora:** **tráfego rodoviário e aéreo**, **obras** em alguns locais de trabalho, algumas **atividades de lazer**. A poluição sonora prejudica a **saúde** e a **qualidade de vida**.\n- **Medidas de proteção:** por exemplo, **equipamentos de segurança acústica**."}, {"id": "27-fenomenos-acusticos", "title": "2.4 Fenómenos acústicos — reflexão, absorção, reverberação e eco", "pages": "Som 50–57", "part": "Som", "md": "# Fenómenos acústicos\n\n:::faq\n**As ecografias feitas durante uma gravidez são fotografias do bebé no útero?** *(resposta na p. 57, no fim desta secção)*\n:::\n\n## Reflexão, absorção e refração (p. 50)\nO som propaga-se por **ondas mecânicas** que, ao encontrar um **obstáculo**, sofrem **reflexão** e **absorção**, entre outros. Estes fenómenos **ocorrem em simultâneo**; o que **predomina** depende da **natureza do material** do obstáculo.\n\n| | Predominância da **reflexão** | Predominância da **absorção** |\n|---|---|---|\n| O que é | O som encontra um obstáculo e **retorna ao meio de origem**. **Não há variação da velocidade** (propaga-se sempre no mesmo meio). | A **energia** que a onda transporta é **absorvida** pelo meio/obstáculo. |\n| Materiais | **Polidos:** **vidro**, **metal**, **madeira polida** | **Porosos:** **cortiça**, **madeira não polida**, **tecidos**, **papel** |\n| Som refletido | **Forte** (seta grossa) | **Fraco** (seta fina) |\n\n- **Isolamento sonoro** de uma casa: usar **materiais absorventes**.\n- **Sala de espetáculos:** encontrar um **equilíbrio** entre reflexão e absorção para boa qualidade acústica.\n\n:::key\nQuando um **som atinge um obstáculo**, ocorre:\n- **Reflexão** — parte da energia do som é **reenviada** para o meio onde se propagava;\n- **Absorção** — parte da energia é **absorvida** pelo obstáculo;\n- **Refração** — o som pode **atravessar** o próprio obstáculo.\n:::\n\nA **reflexão** do som pode originar dois fenómenos: a **reverberação** e o **eco**.\n\n## Reverberação (p. 51)\n- Ocorre quando um som sofre **múltiplas reflexões** nas paredes de um obstáculo (parede, caixa de ressonância…), **persistindo depois** de a fonte deixar de o produzir.\n- Os sons chegam ao ouvido num intervalo de tempo **inferior a 0,1 s** → há **prolongamento** e **aumento de intensidade** do som, com a sensação de que um som está \"**colado**\" ao outro.\n- **Figura 22:** com **menor reverberação** só as ondas 5 e 6 chegam ao ouvinte (as outras são absorvidas); com **maior reverberação**, a onda 6 chega diretamente, as 3 e 5 por reflexão e a 4 por múltiplas reflexões.\n- A **ausência** de reverberação só acontece em **câmaras anecoicas** (salas especiais, muito raras). Num espaço com obstáculos há sempre alguma reverberação.\n\n:::note\nA **reverberação é essencial para os instrumentos musicais**: a **caixa de ressonância** permite o **prolongamento** e a **amplificação** do som (ex.: violino).\n:::\n\n## Eco (pp. 51–52)\n- O **eco** ocorre quando o som refletido regressa ao emissor num intervalo **igual ou superior a 0,1 s**. São precisos pelo menos **0,1 s** para distinguir o som produzido do som refletido.\n- Ouve-se a **repetição** do som, sendo o **segundo menos intenso** (houve absorção no obstáculo e durante a propagação).\n\n### A que distância de um obstáculo se ouve o eco?\nAssumindo: ar a **20 °C**; v_som = **343 m/s**; intervalo **≥ 0,1 s**; o som percorre **duas vezes** a distância fonte–obstáculo (**ida e volta**).\n\n:::steps\n**Cálculo da distância mínima para ouvir eco**\nDistância total = **2 d**\nv = d/Δt ⟺ 343 = 2d / 0,1 ⟺ 2d = 343 × 0,1 ⟺ d = (343 × 0,1)/2 ⟺ **d ≈ 17 m**\n:::\n\n:::key\nQuando um som sofre reflexão, pode ocorrer:\n- **Reverberação** — persistência do som após a emissão, **sem** se distinguir o som emitido do refletido (Δt < 0,1 s);\n- **Eco** — o som emitido e o refletido ouvem-se **distintamente** (Δt ≥ 0,1 s).\nPara se ouvir eco, a fonte tem de estar a pelo menos **17 m** do obstáculo (no ar, a 20 °C).\n:::\n\n:::tip\nEm problemas de eco, lembra-te sempre: **d = v × Δt ÷ 2** (o tempo medido é de **ida e volta**).\n:::\n\n## Reflexão e absorção nas salas de espetáculo (p. 53)\nÉ preciso cuidado na **arquitetura** e nos **materiais**: não se pode ouvir **eco**, nem ter um **tempo de reverberação** muito **elevado** (reflexão excessiva) ou muito **baixo** (absorção excessiva).\n- Reflexões **indesejadas** → **materiais absorventes**. Reflexões **desejadas** → **painéis** que refletem o som **uniformemente**.\n- Para evitar que o som do palco atinja o teto: **discos** ou **canópias** suspensos no teto, que **difundem** o som sem eco.\n  - **Royal Albert Hall** (Londres): **discos** no teto.\n  - **Sala Suggia, Casa da Música** (Porto): **canópia (concha acústica)**; o **tecido das cadeiras absorve o som como o corpo humano** (a acústica é igual com a sala cheia ou vazia).\n  - **Grand Hall, Elbphilharmonie** (Hamburgo): **plateia à volta do palco** — espectadores mais perto dos músicos, excelente experiência sonora em qualquer lugar.\n\n## O eco na vida animal — ecolocalização (p. 54)\n- Animais com visão pouco desenvolvida ou que vivem com pouca luz usam a **ecolocalização** (localização pelo eco). Precisam de um órgão para **emitir** sons e outro para **interpretar o eco**.\n- Usada por mamíferos como o **morcego** e o **golfinho**: evitam obstáculos e localizam as **presas**. O eco permite reconhecer o ambiente a **três dimensões** (altura, largura e profundidade).\n  - **Morcego:** emite **ultrassons** que são **refletidos pelo inseto**.\n  - **Golfinho:** emite **ultrassons** que são **refletidos pelo peixe**.\n- Algumas aves de cavernas ou noturnas têm uma ecolocalização mais rudimentar (só para a locomoção).\n- A **distância** ao obstáculo percebe-se pelo **intervalo de tempo** entre a emissão e a receção: **quanto maior o intervalo, mais distante** está o obstáculo.\n\n:::key\nA **ecolocalização** consiste na **emissão de sons** e na **análise do tempo** que a onda demora a chegar ao alvo (obstáculos e presas) e a **voltar** à fonte emissora, na forma de **eco**.\n:::\n\n### O ser humano também pode usar ecolocalização? (p. 55)\nQuem é **cego de nascença** desenvolve muito a audição. Os humanos podem emitir sons **audíveis** (estalar a língua, *flashes* de som) que refletem nas superfícies e voltam, ajudando a perceber o espaço — técnica baseada na ecolocalização dos animais.\n\n:::note\n**World Access for the Blind** — ONG fundada por **Daniel Kish**, cego desde a infância, que desenvolveu uma técnica de ecolocalização para reconhecer o mundo. Já a ensinou a mais de **2500 pessoas** em cerca de **40 países** (waftb.net).\n:::\n\n## O eco e os sonares (pp. 55–56)\n- **Sonar** vem do inglês ***Sound Navigation and Ranging***; foi criado para detetar **submarinos** na **Primeira Guerra Mundial**. Hoje é usado em barcos de **pesca**, **submarinos** e missões de **segurança, defesa e busca e salvamento**.\n- Tem um **emissor** e um **recetor de ultrassons**: a diferença de tempo entre a emissão e a receção permite estimar a **distância** e a **localização** de um obstáculo (cardume, submarino, fundo do mar).\n- A propagação do ultrassom pode ser afetada pela **absorção do som pela água**.\n\n### Os sonares prejudicam os animais? (p. 56)\nGolfinhos e outros animais marinhos **ouvem** os sons dos sonares, que são **muito intensos** → **danos auditivos** temporários ou permanentes. Para fugir ao ruído **mergulham demasiado fundo**; com stresse **sobem demasiado depressa** → **descompressão repentina** → **bolhas no sangue e na pele** → podem **morrer**.\n\n### Exercício resolvido — sonar de 100 kHz (p. 56)\nSituação A: barco com um **cardume** por baixo; situação B: o som chega ao **fundo do mar**.\n\n## A reflexão na medicina (p. 57)\n\n### Estetoscópio\nO corpo produz sons ao funcionar. O médico **ausculta-os** com um **estetoscópio** (ex.: coração, pulmões).\n- Partes: **auscultador** (com **diafragma** e **campânula**), **tubo de condução**, **hastes** e **olivas auriculares**.\n- O som entra pelo **diafragma**, sofre **múltiplas reflexões (reverberação)** na **campânula** — que o **amplificam** — e é conduzido pelos **tubos**, também por **múltiplas reflexões**, até aos ouvidos pelas **olivas auriculares**.\n\n### Ecografias\n- Os **ecógrafos** usam **ultrassons** para diagnóstico e tratamento.\n- Uma **sonda** encostada à pele **emite ultrassons** que se **refletem nos órgãos**. A reflexão (**eco**) varia com o órgão; a sonda **capta** o som refletido e gera uma **imagem digital** no monitor.\n- Permite acompanhar o **feto**, avaliar **órgãos internos** (fígado, rins) e **lesões ortopédicas**.\n\n:::note\nO ecógrafo **não** permite avaliar bem órgãos com **muito ar** (pulmões, intestinos), nem órgãos protegidos por estruturas **muito densas** (como o **cérebro**, dentro do crânio).\n:::\n\n:::faq\n**As ecografias da gravidez são fotografias do bebé no útero?**\n**Não.** O ecógrafo **emite e capta ultrassons** e, pela análise dos sons refletidos pelo feto, gera uma **imagem digital**. Nem as ecografias **5D** (\"topo de gama\") são fotografias.\n:::\n\n## Para resumir — Fenómenos acústicos (p. 58)\n- Os fenómenos acústicos podem ocorrer em **simultâneo** quando um som encontra um obstáculo.\n- **Absorção:** quando as ondas encontram uma superfície **rugosa**, sendo a sua energia **absorvida** pelo obstáculo.\n- **Refração:** quando as ondas encontram uma superfície e a **conseguem atravessar**.\n- **Reflexão:** quando as ondas encontram uma superfície **lisa e dura** e são **reenviadas para o mesmo meio**. O som refletido é **menos intenso** do que o incidente (parte da energia foi absorvida). É **aplicada** na medicina e na indústria.\n- Perceção da reflexão pelo ser humano:\n  - **Eco:** ouve-se a **repetição** do som. A distância fonte–obstáculo é **superior a 17 m** (no ar); o intervalo entre o som emitido e o refletido é **≥ 0,1 s**.\n  - **Reverberação:** ouve-se um **prolongamento** e **amplificação** do som. A distância fonte–obstáculo é **inferior a 17 m** (no ar)."}, {"id": "30-propagacao-luz", "title": "3.1 Propagação da luz — corpos luminosos, trajetória, feixes e meios", "pages": "Luz 64–69", "part": "Luz", "md": "# Ondas de luz e sua propagação\n\n## Um caso português — A excelência dos cientistas e engenheiros portugueses (p. 64)\n- Quando uma estrela **se afasta**, a sua luz (espetro de radiação eletromagnética) fica **mais vermelha**; quando **se aproxima**, fica **mais azul**.\n- Os astrofísicos medem estas variações com um **espetrógrafo**, que **decompõe a luz** das estrelas nas várias cores. A diferença de \"cor\" permite medir a **velocidade da estrela** e descobrir **planetas** a orbitar estrelas distantes, mesmo sem os ver.\n- O **ESO** (Observatório Europeu do Sul) desafiou a comunidade internacional a construir o espetrógrafo mais preciso do mundo para o **VLT** (*Very Large Telescope*). Nasceu o **ESPRESSO** (novembro de **2017**), com uma equipa de cientistas e engenheiros **portugueses**.\n- Testemunho de **Alexandre Cabral** (Faculdade de Ciências da Universidade de Lisboa, Instituto de Astrofísica e Ciências do Espaço).\n\n:::faq\n**Haverá algo mais rápido do que a luz?** *(resposta na secção 3.2, p. 73)*\n:::\n\n## Corpos luminosos e corpos iluminados (p. 65)\n- Nem toda a **radiação eletromagnética** é visível: há a **radiação visível (luz visível)**, detetável pelo olho humano, e radiação **invisível** — **ondas de rádio, micro-ondas, infravermelha, ultravioleta, raios X e radiação gama**.\n- Quando se fala em \"**luz**\", normalmente refere-se a \"**radiação visível**\".\n\n| | **Corpos luminosos** | **Corpos iluminados** |\n|---|---|---|\n| Definição | Têm **luz própria** — **emitem** luz visível | **Não produzem** luz visível; apenas **refletem** a luz que recebem dos corpos luminosos |\n| Papel | **Fonte de luz** | **Recetor de luz** |\n| Exemplos | **Estrelas** (o Sol), **fogueira**, lâmpadas acesas que iluminam a cidade | **Lua**, planetas, tendas, campistas, árvores, um livro |\n\n**Corpo luminoso (fonte de luz) → Corpo iluminado (recetor de luz)**\n\n:::note\n**O Sol é luminoso ou iluminado?** O Sol é a única **estrela** do Sistema Solar; produz luz própria por **reações nucleares** no seu centro, que libertam grandes quantidades de energia na forma de luz (radiação visível) → é um **corpo luminoso**.\n:::\n\n:::key\nOs **corpos luminosos** emitem luz → são **fontes de luz**.\nOs **corpos iluminados** reenviam a luz que neles incide, vinda de um corpo luminoso → são **recetores de luz**.\n:::\n\n:::warn\n**A Lua não é luminosa!** Brilha porque **reflete** a luz do Sol — é um corpo **iluminado**.\n:::\n\n## Trajetória da luz (pp. 66–67)\n\n### Atividade prática 10 — Como é a trajetória da luz? (p. 66)\nUma vela e dois cartões perfurados entre os olhos e a vela: **situação 1** (orifícios **alinhados**) e **situação 2** (orifícios **desalinhados**).\n\n- A luz, no mesmo meio, normalmente **não contorna objetos**: desloca-se **em linha reta** — **propagação retilínea** (ex.: raios solares a atravessar as nuvens).\n\n:::key\nA **luz propaga-se em linha reta**.\n:::\n\n:::warn\n**Cidadania consciente — Luz laser.** Apontada para os olhos, pode causar **danos irreparáveis e permanentes na visão**. Não apontes para os olhos de ninguém (nem para os teus), não te ponhas no trajeto do laser e usa **óculos de proteção**. **Um laser não é um brinquedo!**\n:::\n\n## Representação da luz (pp. 67–68)\n- A trajetória de um **raio luminoso** representa-se por um **segmento de reta orientado** (com uma **seta** a indicar o sentido).\n- **Feixe luminoso:** **conjunto de raios luminosos**.\n\n| Feixe | Como são os raios | Exemplo |\n|---|---|---|\n| **Convergente** | Dirigem-se **todos para o mesmo ponto** | Luz depois de passar numa lupa |\n| **Paralelo** | São **paralelos** | Laser; luz do Sol a chegar à Terra |\n| **Divergente** | Saem da **mesma fonte** e **separam-se** | Lanterna; lâmpada |\n\n:::note\nO **Sol** liberta um feixe **divergente**, mas como está muito longe, a luz solar chega à Terra na forma de um feixe de raios **paralelos**.\n:::\n\n:::key\nUm **raio luminoso** representa-se por um **segmento de reta orientado**.\nUm **feixe luminoso** é um **conjunto de raios luminosos** (conjunto de segmentos orientados). Pode ser **convergente, divergente ou paralelo**.\n:::\n\n## Triângulo de visão (p. 68)\n- Um **livro** (corpo iluminado) fica visível porque a luz que **reflete** chega aos nossos olhos.\n- **Lâmpada** = **fonte de luz**; **livro** = **recetor de luz**; **olho humano** = **detetor de luz**.\n- O percurso fonte → recetor → detetor forma o **triângulo de visão**.\n- **Na escuridão total** não vemos nada porque **não há fonte de luz** → o olho não recebe luz.\n\n:::key\nO **triângulo de visão** é um esquema que explica e representa os **três aspetos fundamentais** para se ver um objeto iluminado: **fonte de luz**, **recetor de luz** (objeto) e **detetor de luz** (olho).\n:::\n\n## Em que meios se propaga a luz? (pp. 68–69)\n- Para ver a chama da vela a luz atravessa o **ar** → propaga-se em meios **gasosos**.\n- Também se vê através de um **aquário com água**: atravessa um **sólido (vidro)** e um **líquido (água)**.\n- **Vácuo (vazio):** zona sem matéria, nem ar. Pode criar-se com **máquinas de vácuo**, mas na prática nunca é perfeito.\n- A luz do **Sol** viaja pelo espaço até à Terra → **a luz propaga-se no vazio**; **não precisa de meio material**.\n\n:::note\n**Porque se diz que o espaço é \"quase vazio\"?** Entre planetas, estrelas e outros astros não existe quase nada, e as distâncias são enormes.\n:::\n\n:::key\nA **luz propaga-se** em meios materiais **sólidos, líquidos e gasosos** e também no **vazio (vácuo)**.\n:::\n\n:::tip\n**Som vs. luz:** o **som** propaga-se em todos os meios materiais, mas **não no vazio**. A **luz** propaga-se **no vazio** e em **todos** os meios materiais (transparentes ou translúcidos).\n:::"}, {"id": "31-materiais-sombras-velocidade-luz", "title": "3.2 Materiais e luz, sombras, eclipses e velocidade da luz", "pages": "Luz 70–73", "part": "Luz", "md": "# Materiais, sombras e velocidade da luz\n\n## Que materiais se deixam atravessar pela luz? (pp. 70–71)\n\n### Atividade prática 11 (p. 70)\nMaterial: folha de **acetato**, **papel vegetal**, **vidro fosco**, **papel celofane colorido**, **cartolina preta** e **tecido escuro**. Parte 1: olhar para uma vela através de cada material. Parte 2: medir a **iluminância** (quantidade de luz) com o sensor de luz do telemóvel (*Phyphox*).\n\n| Material | A luz… | Imagem através dele | Exemplos |\n|---|---|---|---|\n| **Transparente** | atravessa-o **totalmente** | **nítida** | vidro, acetato, ar, água |\n| **Translúcido** | só **parte** o atravessa | **pouco nítida** | papel vegetal, vidro fosco |\n| **Opaco** | **não** o atravessa | **não se vê** | cartolina, madeira, parede, Terra, Lua |\n\n:::key\nNem todos os materiais se deixam atravessar pela luz visível:\n- **Opacos** — **não** se deixam atravessar pela luz visível;\n- **Transparentes** — deixam-se atravessar **totalmente**;\n- **Translúcidos** — deixam-se atravessar **parcialmente**.\n:::\n\n## Como se formam as sombras? (p. 71)\n- Quando a luz incide num objeto **opaco**, não o consegue atravessar nem contornar (propaga-se em **linha reta**) → atrás dele forma-se uma **zona de sombra**: **zona do espaço onde não há luz visível**.\n- À volta da sombra pode formar-se a **penumbra**: zona onde há **diminuição** de luz visível (só chega parte da luz).\n- Os **eclipses** ocorrem devido à **propagação retilínea** da luz (a **Terra** e a **Lua** são objetos **opacos**):\n\n| Eclipse | Ordem dos astros | Fase da Lua | O que acontece |\n|---|---|---|---|\n| **Solar** (do Sol) | **Sol – Lua – Terra** | **Lua Nova** | A **sombra da Lua** cai sobre a Terra |\n| **Lunar** (da Lua) | **Sol – Terra – Lua** | **Lua Cheia** | A Lua entra na **sombra da Terra** |\n\n### Atividade prática 12 — Como se forma uma sombra? (p. 72)\nFolha branca (\"ecrã de projeção\") num suporte, uma **bola de pingue-pongue** pendurada noutro, sala escura e uma **lanterna**.\n\n## Velocidade da luz (pp. 72–73)\n- No vazio, a luz percorre cerca de **300 000 km num segundo**. No **ar** a velocidade é **aproximadamente igual** à do vazio.\n- **c ≈ 300 000 km/s** = **300 000 000 m/s = 3 × 10⁸ m/s** (em unidade SI). É o **valor de velocidade mais elevado** conhecido.\n\n:::note\n**Porque se representa por c?** Do latim ***celeritas***, que significa **rapidez**.\nO valor exato no vazio é **299 792,458 km/s**; 300 000 km/s é uma boa aproximação.\n:::\n\n- Noutros meios materiais a velocidade da luz é **menor**:\n\n**Tabela 1 — Velocidade da luz em meios transparentes (km/s)**\n\n| Meio | Velocidade (km/s) |\n|---|---|\n| Ar (1 atm) | 299 702 ≈ 3,0 × 10⁵ |\n| Gelo (0 °C) | 228 849 ≈ 2,3 × 10⁵ |\n| Água (20 °C) | 225 408 ≈ 2,3 × 10⁵ |\n| Álcool etílico | 220 436 ≈ 2,2 × 10⁵ |\n| Glicerina | 203 940 ≈ 2,0 × 10⁵ |\n| Vidro | 199 862 ≈ 2,0 × 10⁵ |\n| Quartzo | 194 670 ≈ 1,9 × 10⁵ |\n| Diamante | 123 881 ≈ 1,2 × 10⁵ |\n\n:::warn\n**Atenção!** Ao contrário do som, a luz **diminui** a sua velocidade quando passa do **ar** para outros meios materiais. (O som é mais rápido nos sólidos; a luz é mais rápida no vazio/ar.)\n:::\n\n:::key\nA **velocidade da luz** no ar é aproximadamente igual à do vazio: **300 000 km/s** ou **300 000 000 m/s** (SI).\n**c ≈ 300 000 000 m/s = 3 × 10⁸ m/s**\n:::\n\n### Exercício resolvido — Luz do Sol até à Terra (p. 73)\nDistância Sol–Terra ≈ **150 000 000 km**; c = 300 000 000 m/s.\n\n:::faq\n**Haverá algo mais rápido do que a luz?**\nSegundo os conhecimentos científicos atuais, a **velocidade máxima possível no Universo** é **300 000 km/s** — a velocidade da luz no vazio. **Não há nada mais rápido do que a luz.**\n:::\n\n## Para resumir — Luz (cap. 3, 1.ª parte) (p. 74)\n- A luz **propaga-se em linha reta** e **transporta energia**.\n- Representa-se por um **raio luminoso** (segmento de reta orientado).\n- Um **feixe luminoso** é um conjunto de raios luminosos; pode ser **convergente, paralelo ou divergente**.\n- Os **corpos luminosos** emitem luz → **fontes de luz**. Os **corpos iluminados** reenviam a luz que neles incide → **recetores de luz**.\n- O **triângulo de visão** representa os três aspetos fundamentais para ver um objeto iluminado.\n- **Materiais onde incide luz:** **opacos** (não se deixam atravessar — podem provocar zonas de **sombra** e de **penumbra**); **transparentes** (deixam-se atravessar **totalmente**); **translúcidos** (deixam-se atravessar **parcialmente**).\n\n## Investigo e comunico — Eclipses, sombra e penumbra (p. 74)\nEsquema: Sol (pontos **A** em cima e **B** em baixo), Terra (pontos **C** em cima e **D** em baixo) e Lua alinhados (eclipse da Lua)."}, {"id": "32-radiacao-eletromagnetica", "title": "3.3 Ondas de luz — radiação e espetro eletromagnético", "pages": "Luz 76–81", "part": "Luz", "md": "# Ondas de luz — radiação eletromagnética\n\n:::faq\n**Toda a radiação é perigosa?** *(resposta na p. 81, no fim desta secção)*\n:::\n\n## O que é a luz? (p. 76)\n- A **luz** é uma **onda que transporta energia eletromagnética**. A luz emitida pelo Sol propaga-se no espaço na forma de **radiação** — por isso diz-se \"**radiação** emitida pelo Sol\".\n- \"Luz\" costuma referir-se à **radiação visível**; os olhos só veem uma **parte muito pequena** de toda a radiação eletromagnética.\n\n:::note\n**Radiação:** processo de **transferência de energia** que pode acontecer **sem contacto** entre os corpos.\n:::\n\n### Como se propaga a radiação eletromagnética?\n- Propaga-se geralmente **em linha reta**;\n- propaga-se em **meios materiais** e **no vazio**;\n- **pode propagar-se em meios opacos** (ex.: ondas de rádio atravessam paredes);\n- velocidade **máxima no vazio**: **c ≈ 3 × 10⁸ m/s** (≈ igual no ar);\n- noutros meios materiais tem velocidade **inferior** a 3 × 10⁸ m/s;\n- **transporta energia**.\n\n:::key\nA **luz (radiação visível)** é uma onda que transporta energia eletromagnética e faz parte da **radiação eletromagnética**. Propaga-se geralmente em **linha reta** em meios **transparentes e translúcidos** e no **vazio**, e **transporta energia**.\nA **velocidade da radiação eletromagnética** é ≈ **300 000 000 m/s no vazio** e no ar; **diminui** noutros meios materiais.\n:::\n\n## Onda eletromagnética (p. 77)\n- A propagação da radiação eletromagnética representa-se por uma **onda eletromagnética** (gráfico tridimensional): há uma oscilação do **campo elétrico** e, ao mesmo tempo, do **campo magnético**, **perpendiculares entre si** (e à direção de propagação).\n- \"**Eletromagnética**\" = a oscilação é, simultaneamente, **elétrica e magnética**.\n- Características semelhantes às ondas sonoras: **amplitude, frequência, período** (e **comprimento de onda**).\n\n**Tabela 2 — Ondas eletromagnéticas vs. ondas sonoras**\n\n| | **Eletromagnética** | **Sonora** |\n|---|---|---|\n| **Semelhanças** | **Transportam energia**, mas **não transportam matéria** · Caracterizam-se pela **amplitude, período e frequência** · Podem propagar-se em **todos os meios materiais** (sólido, líquido, gasoso) | (igual) |\n| Direção da oscilação | **Perpendicular** à direção de propagação | Vibração dos corpúsculos **paralela** à direção de propagação |\n| No vazio | **Propaga-se** → **não é onda mecânica** | **Não se propaga** → **é onda mecânica** |\n| Velocidade no ar | ≈ **300 000 000 m/s** | ≈ **340 m/s** |\n| Frequência máxima | Visível: ≈ **7,5 × 10¹⁴ Hz** (750 000 000 000 000 Hz) | Audível: ≈ **20 000 Hz** |\n\n:::key\nA **onda eletromagnética** representa a **propagação da radiação eletromagnética**.\n:::\n\n## Frequência e energia (p. 78)\nUma onda eletromagnética de **alta frequência** (situação A) transporta **mais energia** do que uma de **baixa frequência** (situação B).\n\n:::key\nQuanto **maior a frequência** da radiação eletromagnética, **maior a energia** que transporta (para ondas com a mesma amplitude).\n:::\n\n## Espetro eletromagnético (p. 78)\nAs várias formas de radiação distinguem-se pela **frequência** e organizam-se em **bandas** num esquema — o **espetro eletromagnético**.\n\n**Por ordem crescente de frequência (e de energia):**\n\n| Banda | Frequência aprox. (Hz) |\n|---|---|\n| **Ondas de rádio** | até ≈ 10⁹ |\n| **Micro-ondas** | ≈ 10⁹ – 10¹² |\n| **Infravermelhos (IV)** | ≈ 10¹² – 4 × 10¹⁴ |\n| **Luz visível** (vermelho → violeta) | ≈ 4 × 10¹⁴ – 7,5 × 10¹⁴ |\n| **Ultravioleta (UV)** | ≈ 10¹⁵ – 10¹⁷ |\n| **Raios X** | ≈ 10¹⁷ – 10²⁰ |\n| **Raios gama (γ)** | > 10²⁰ |\n\n:::tip\n**Mnemónica (ordem crescente de frequência/energia):** **R**ádio · **M**icro-ondas · **I**nfravermelho · **V**isível · **U**ltravioleta · **X** · **G**ama → \"**R**ui **M**uito **I**nteligente **V**ê **U**ma **X**ícara **G**rande\".\nDentro do visível: **vermelho** (menor frequência) → laranja → amarelo → verde → azul → anil → **violeta** (maior frequência).\n:::\n\n- A **luz visível** é só uma **pequena faixa** entre o infravermelho e o ultravioleta.\n- A **ultravioleta** tem **maior frequência** do que a visível → transporta **mais energia** → é **mais energética**.\n\n:::key\nO **espetro eletromagnético** é um esquema onde se **organizam as várias formas de radiação eletromagnética**, por exemplo, por ordem crescente de **frequência** ou de **energia**.\n:::\n\n## Radiação emitida pelo Sol (p. 79)\n- O Sol emite **toda** a radiação do espetro, mas a **atmosfera** só deixa chegar à superfície uma **parte**.\n- O Sol emite **pouca radiação de ondas de rádio**; no entanto, quase todas as ondas de rádio **chegam à superfície** (a maioria **não vem do Sol**).\n- Figura 18: as camadas da atmosfera (**termosfera, estratosfera, troposfera**) absorvem diferentes bandas; **quanto mais compridas as barras, menos absorvida** é a radiação. Chegam ao solo sobretudo as **ondas de rádio**, a **luz visível** e parte dos **infravermelhos**; os **raios X e gama** e a maior parte dos **UV** são absorvidos lá em cima.\n\n**Figura 19 — Radiação solar que atinge a superfície:** **infravermelha ≈ 50 %**, **visível ≈ 43 %**, **ultravioleta ≈ 7 %**.\n\n- A radiação **UV** é, na maior parte, **retida na camada de ozono**; à superfície chega a UV de **menor energia** (responsável pelo **bronzeamento**).\n\n:::warn\n**Cidadania consciente — O perigo da radiação UV.** A exposição excessiva à radiação UV é a **causa mais comum de cancro da pele**. Evita o Sol nas horas de **maior intensidade de UV**; consulta o **índice UV** no site do **IPMA**. **Quando o índice UV for ≥ 3**, protege-te: **roupa fresca, chapéu, óculos de sol e protetor solar!**\n:::\n\n## Aplicações das radiações (pp. 80–81)\n\n### Radiação NÃO ionizante\n| Radiação | Descrição | Aplicações |\n|---|---|---|\n| **Ondas de rádio** | A que transporta **menor energia** | **Telecomunicações**: rádio, **TV**, **GPS** |\n| **Micro-ondas** | Entre os infravermelhos e as ondas de rádio | **Telemóveis** e **satélites**; **radares**, **radiotelescópios**; **forno micro-ondas** |\n| **Infravermelho (IV)** | A energia térmica emitida pelos seres vivos é IV | **Comandos de televisão**; aquecimento no **forno tradicional**; **óculos de visão noturna** (imagem térmica); **câmaras de visão térmica**; **termómetros sem contacto** |\n| **Visível** | Pequena parte do espetro, essencial para ver o mundo **a cores** | **Visão**; **luz laser** (cada laser tem **uma só cor** = uma só frequência) |\n\n### Radiação IONIZANTE\n| Radiação | Descrição | Aplicações |\n|---|---|---|\n| **Ultravioleta (UV)** | Ionizante → **prejudicial** à saúde. Divide-se, por ordem crescente de energia, em **UVA, UVB e UVC**. Os **UVC** (mais energéticos) **não chegam** à superfície (absorvidos pelo **ozono**). | **Solários** (bronzeamento); **desinfeção** de utensílios e superfícies (uso médico ou alimentar) |\n| **Raios X** | **Penetram na pele** e são **absorvidos nos ossos** → imagens médicas. Ionizante. | Aparelhos de **raios X** e **TAC**; **radioterapia** (destruir/inibir células de **tumores**) |\n| **Raios gama (γ)** | A radiação **mais energética**; atravessa vários obstáculos, incluindo o **corpo humano**; prejudicial, mas em doses controladas usada em medicina. Símbolo **γ** (gama, alfabeto grego). | **Centrais nucleares** (energia elétrica); **radioterapia** |\n\n:::note\n**Radiação ionizante:** tem energia suficiente para **retirar eletrões a átomos ou moléculas** e transformá-los em **iões**. É **perigosa** porque é muito **penetrante** e pode **alterar átomos e moléculas das células humanas**.\n:::\n\n:::faq\n**Toda a radiação é perigosa?**\n**Não.** A radiação está sempre à nossa volta (Sol, lâmpadas, antenas de telemóvel, micro-ondas). Só a **radiação ionizante** (com energia para transformar átomos ou moléculas em iões) é perigosa; a **maioria** da radiação à nossa volta é **não ionizante** e **não representa perigo**. Devemos ter cuidado com a ionizante: **parte da ultravioleta, os raios X e os raios gama**.\n:::\n\n## Para resumir — Radiação eletromagnética (p. 82)\n- É uma **onda que transporta energia**; propaga-se geralmente em **linha reta** em meios **transparentes e translúcidos** e no **vazio**.\n- Velocidade ≈ **300 000 000 m/s no vazio** (**c ≈ 3 × 10⁸ m/s**); é **mais elevada no vácuo** e **diminui** noutros meios materiais.\n- A sua propagação representa-se por uma **onda eletromagnética**, com **amplitude, frequência e período**.\n- Quanto **maior a frequência**, **maior a energia**.\n- O **espetro eletromagnético** organiza a radiação, por exemplo, por ordem crescente de frequência.\n\n## Investigo e comunico — Qual é a radiação do meu telemóvel? (p. 82)\nNuma chamada, a informação é transmitida por radiação eletromagnética do telemóvel até à antena da **estação-base** mais próxima, que está ligada às estações vizinhas (a **rede móvel**)."}, {"id": "40-reflexao-luz", "title": "4.1 Reflexão e absorção da luz, leis da reflexão", "pages": "Luz 86–89", "part": "Luz", "md": "# Fenómenos óticos — reflexão e absorção\n\n## Um caso português — Ver mais e melhor o mundo que nos rodeia (p. 86)\n- Testemunho de **José Manuel González-Méijome**, **optometrista** (avalia a saúde da visão e prescreve óculos, lentes de contacto, planos de treino da visão), a viver em Portugal desde 2000, com prémios internacionais desde 2016.\n- Coordena na **Universidade do Minho** o projeto ***Opto-Biomechanical Eye Research Network*** (mais 7 parceiros em 6 países): estrutura e comportamento mecânico do olho, formação das imagens na **retina**, crescimento do olho e aparecimento da **miopia** → desenho de **lentes** e **procedimentos cirúrgicos**.\n- A Optometria e Ciências da Visão abrem portas para **realidade virtual**, elementos óticos, iluminação, ciências biomédicas…\n\n:::faq\n**Porque é que se aconselha a não vestir roupa preta no verão, mas sim branca ou de cor clara?** *(resposta na p. 93, secção 4.2)*\n:::\n\n## O que acontece à luz quando encontra um obstáculo? (p. 87)\nTal como o som, pode ocorrer **reflexão, refração e/ou absorção** — os **fenómenos óticos**.\n\n:::note\n**Ótica:** área da Física que estuda a **radiação luminosa**.\n:::\n\n| Fenómeno | O que acontece |\n|---|---|\n| **Reflexão da luz** | A luz encontra um obstáculo e **muda de direção**, sendo **reenviada para trás** (para o mesmo meio) |\n| **Refração da luz** | A luz encontra um obstáculo e **consegue atravessá-lo** |\n| **Absorção da luz** | A **energia luminosa transforma-se noutra forma de energia** no interior do material (ex.: em **energia térmica**, aquecendo o obstáculo) |\n\n- Na maioria dos casos ocorrem **em simultâneo**; a intensidade de cada um depende da **superfície** e do **material**.\n\n| Se o obstáculo for… | Ocorre |\n|---|---|\n| **Opaco** | **Reflexão e absorção**, mas **não refração**. Num objeto de **cor escura predomina a absorção**; num de **cor clara predomina a reflexão**. |\n| **Translúcido ou transparente** | **Todos**: reflexão, absorção e refração |\n\n## Quando ocorre a reflexão? (p. 88)\nQuando um raio incide numa superfície e **volta para o mesmo meio**. O raio refletido é normalmente **menos intenso** do que o incidente → a reflexão vem sempre acompanhada de **absorção e/ou refração** (num corpo opaco, só de absorção).\n\n:::key\nQuando ocorre **reflexão** da luz, ocorre simultaneamente **absorção e/ou refração**. Por isso, o **raio refletido é menos intenso** do que o raio incidente.\n:::\n\n## Leis da reflexão (pp. 88–89)\n\n**Vocabulário (figura 3):**\n- **Raio incidente (rᵢ):** raio que incide na superfície.\n- **Raio refletido (rᵣ):** raio refletido pela superfície.\n- **Ângulo de incidência (αᵢ):** ângulo entre a **normal** e o **raio incidente**.\n- **Ângulo de reflexão (αᵣ):** ângulo entre a **normal** e o **raio refletido**.\n- **Ponto de incidência:** onde o raio incidente encontra a superfície.\n- **Normal:** segmento de reta **imaginário**, traçado no ponto de incidência, que faz **90°** com a superfície.\n- **Plano de incidência:** plano que contém o raio incidente, o raio refletido e a normal.\n\n:::note\n**α** é uma letra grega que se lê \"**alfa**\".\n:::\n\n:::key\n**Leis da reflexão:**\n1. O **ângulo de incidência é igual ao ângulo de reflexão**, medidos em relação à **normal** no ponto de incidência: **αᵢ = αᵣ**.\n2. O **raio incidente**, o **raio refletido** e a **normal** à superfície refletora estão **todos no mesmo plano**.\n:::\n\n- A luz refletida propaga-se com a **mesma velocidade** que a incidente (está no **mesmo meio**).\n\n:::warn\n**Erro clássico:** os ângulos medem-se a partir da **normal**, **não** a partir da superfície! Se te derem o ângulo com a superfície (ex.: 30°), o ângulo de incidência é **90° − 30° = 60°**.\n:::\n\n### Como desenhar os raios refletidos (figura 5, p. 89)\n:::steps\n1. Desenhar o **raio incidente** (rᵢ), com seta.\n2. Marcar o **ponto de incidência** na superfície.\n3. Com um **transferidor ou esquadro**, desenhar a **normal** (tracejado, a 90°).\n4. Medir e assinalar o **ângulo de incidência** (αᵢ).\n5. Medir e assinalar o **ângulo de reflexão** (αᵣ = αᵢ), do outro lado da normal.\n6. Desenhar o **raio refletido** (rᵣ), do ponto de incidência passando pelo ângulo marcado, com a seta a **afastar-se** da superfície.\n:::\n\n### Atividade prática 13 — Verificar as leis da reflexão no laboratório (p. 90)\nMaterial: **laser**, **espelho plano**, **transferidor** (disco ótico/goniómetro) e folha de registo. Fazer incidir o laser no espelho com ângulos de incidência de **0°, 15°, 45° e 75°** e medir os ângulos de reflexão.\n:::note\n**Cuidados com o laser:** não olhes diretamente para a luz laser, nem a apontes para os olhos de ninguém — pode provocar **cegueira**.\n:::\n\n## Reflexão especular e reflexão difusa (pp. 90–92)\n\n| | **Reflexão especular** | **Reflexão difusa** |\n|---|---|---|\n| Superfície | **Polida** (muito lisa): espelho, água sem corrente | **Rugosa**: papel, tecido, ecrã de cinema, água ondulada |\n| Raios refletidos | **Paralelos** entre si | **Não paralelos** (em todas as direções) |\n| Imagem | **Nítida** | **Pouco nítida** ou nenhuma |\n| Normais | Paralelas entre si em todos os pontos | **Não** são paralelas (a superfície não é lisa) |\n\n- As duas podem ocorrer **em simultâneo**, mas uma **predomina**: no **espelho** predomina a **especular**; num **livro** a **difusa**.\n- A reflexão **difusa** permite que um filme projetado num **ecrã de cinema** (tela rugosa) seja visto de **todos os lugares** da sala.\n- Lago com superfície **lisa** → reflexão **especular** (imagem nítida das árvores); lago com **ondulação** → reflexão **difusa** (imagem pouco nítida).\n\n:::key\nAs **leis da reflexão também se aplicam à reflexão difusa**: em cada ponto, αᵢ = αᵣ em relação à normal **nesse ponto**. Os raios refletidos não são paralelos porque as **normais** em cada ponto da superfície rugosa **não são paralelas**.\n:::\n\n### Atividade prática 14 — Reflexão difusa vs. especular (p. 91)\nTrês raios laser num **espelho** (αᵢ > 10°) e depois numa superfície de **papel de alumínio amarrotado**, numa sala escura.\n\n## Aplicações da reflexão da radiação eletromagnética (pp. 92–93)\n- **Espelhos:** usam a reflexão para **formar ou projetar imagens**.\n- **Medidor laser de distância:** emite um feixe laser que é **refletido** no obstáculo e permite **calcular a distância** (ex.: altura de uma sala).\n- **Radar:** emite **ondas de rádio** que são refletidas no objeto e **regressam** ao radar; pelo **tempo** de ida e volta calcula-se a **distância**. Usado no **trânsito rodoviário** e no **tráfego aéreo**.\n\n### Exercício resolvido — Medidor laser (p. 93)\nA luz emitida demorou **0,015 µs** a voltar ao aparelho.\n\n:::faq\n**Porque se aconselha a não vestir roupa preta no verão, mas branca ou de cor clara?**\nA roupa **branca reflete** a maior parte da radiação que nela incide; a roupa **preta absorve** a maior parte (e aquece). Por isso a roupa clara é mais **fresca**. Também contam o corte (**larga ou apertada**) e o **material**.\n:::"}, {"id": "41-espelhos", "title": "4.2 Espelhos planos e curvos — imagens", "pages": "Luz 96–105", "part": "Luz", "md": "# Espelhos\n\n:::warn\n**Páginas 94–95 em falta:** os PDFs enviados saltam da p. 93 para a p. 96 (a digitalização tem aí uma página em branco). Se essas páginas tiverem conteúdo ou exercícios, envia-as e eu acrescento-os aqui.\n:::\n\n:::faq\n**De que são feitos os espelhos comuns?** *(resposta na p. 103, no fim desta secção)*\n:::\n\n## Imagens formadas por espelhos (p. 96)\n- **Espelhos:** superfícies **polidas** que provocam a **reflexão** da luz. Podem ser **planos** ou **curvos**.\n- O objeto e a imagem representam-se por uma **seta**.\n\n| | **Imagem real** | **Imagem virtual** |\n|---|---|---|\n| Onde se forma | **À frente** do espelho | **Atrás** do espelho |\n| Projetável num alvo? | **Sim** | **Não** |\n| Exemplo | Vela à frente de um **espelho curvo** (côncavo): a imagem da chama aparece num **alvo** | A nossa imagem num **espelho plano** |\n\n:::key\nAs imagens formadas por espelhos podem ser:\n- **virtuais** — **não** podem ser projetadas num alvo, porque se formam **atrás do espelho**;\n- **reais** — **podem** ser projetadas num alvo, porque se formam **à frente do espelho**.\n:::\n\n:::key\n**As quatro características de uma imagem:**\n1. **Classificação** — virtual ou real;\n2. **Tamanho** — maior, menor ou do mesmo tamanho que o objeto;\n3. **Orientação** — **direita** ↑ ou **invertida** ↓;\n4. **Distância ao espelho** — igual, mais perto ou mais longe do que o objeto.\n:::\n\n## Espelhos planos (pp. 97–99)\n**Espelho plano:** superfície **polida e plana**, onde ocorre **reflexão especular**.\n\n### Atividade prática 15 (em estações) — Imagem num espelho plano (pp. 97–98)\n**Estação 1:** letra **F** com **3 cm**, a **10 cm** de um espelho plano vertical.\n**Estação 2:** folha de **acetato/vidro** vertical; vela acesa num X a **10 cm**; outra vela **apagada** do outro lado, movida até \"parecer acesa\".\n\n- Figura 12: F com 3 cm a 10 cm do espelho → imagem com **3 cm**, a **10 cm** atrás do espelho, **simétrica**.\n\n:::warn\n**Orientação ≠ simetria!** Uma imagem **invertida** fica de **pernas para o ar** (o F \"de cabeça para baixo\"). Uma imagem **simétrica** fica **trocada esquerda-direita** (o F \"ao espelho\"), mas continua **direita**. Num espelho plano a imagem é **direita e simétrica**.\n:::\n\n### Como se explica a imagem num espelho plano? (p. 99)\nA luz do objeto incide no espelho e é **refletida** para os olhos. O olho não \"percebe\" a reflexão: o **cérebro** cria a ilusão de que os raios vêm **em linha reta de trás do espelho** — onde se cruzam os **prolongamentos** (tracejados) dos raios refletidos, forma-se a **imagem virtual**.\n\n### Aplicações dos espelhos planos (p. 99)\n- **Decorativos e utilitários** (casas, casas de banho).\n- **Caleidoscópio:** cilindro com **três espelhos planos** em **triângulo** e pedaços de **vidro colorido** soltos → imagens coloridas.\n- **Periscópio:** **dois espelhos planos** inclinados a **45°**. Usado nos **submarinos** para ver à superfície estando submerso entre **15 m e 20 m**, sem ser detetado.\n\n## Espelhos curvos (pp. 100–103)\n\n| | **Côncavo (convergente)** | **Convexo (divergente)** |\n|---|---|---|\n| Superfície refletora | Do lado de **dentro** da curva (\"caverna\") | Do lado de **fora** da curva |\n| Raios paralelos refletidos | **Convergem** num ponto, o **foco (F)**, à frente do espelho | **Divergem**; os **prolongamentos** encontram-se atrás do espelho, no **foco (F)** |\n| Aplicações | **Espelho de dentista**, **espelho de maquilhagem**, **telescópio refletor**, **refletores de faróis ou lanternas** | **Retrovisores de carros**, **espelhos em cruzamentos** (grande campo de visão) |\n\n:::key\nÀ distância entre o **centro do espelho** e o **foco (F)** chama-se **distância focal (f)**. Unidade SI: **metro (m)**.\n:::\n\n### Atividade prática 16 — Imagem em espelhos curvos (p. 101)\nVela acesa à frente de um **alvo**, sala escura, **espelho côncavo** (depois **convexo**); variar a distância espelho–vela.\n\n### Imagens no espelho côncavo (convergente) (p. 101)\n| Objeto | Imagem |\n|---|---|\n| **Afastado** do espelho (para lá do **foco**) | **Real**, **invertida**; **menor, do mesmo tamanho ou maior** do que o objeto |\n| **Próximo** do espelho (entre o **foco** e o espelho) | **Virtual**, **direita**, **maior** do que o objeto |\n\n### Imagens no espelho convexo (divergente) (p. 102)\nPara **qualquer posição** do objeto, a imagem é **virtual**, **direita** e **menor** do que o objeto.\n\n### Como desenhar a imagem num espelho curvo (figura 23, p. 102)\nDesenham-se **dois de três raios**:\n:::steps\n1. **Raio pelo centro de curvatura (C):** reflete-se **sobre si próprio** (volta pelo mesmo caminho).\n2. **Raio paralelo ao eixo principal:** reflete-se **em direção ao foco (F)** (no convexo, o **prolongamento** passa pelo foco).\n3. **Raio que passa pelo foco (F):** reflete-se **paralelo ao eixo principal**.\n4. A **imagem** representa-se do eixo principal até ao ponto onde se **cruzam os raios refletidos** (imagem real) ou os seus **prolongamentos** (imagem virtual).\n:::\n- **Eixo principal:** linha onde estão o **centro de curvatura (C)** e o **foco (F)**.\n- **Côncavo, objeto afastado (fig. 24-A):** os raios refletidos **cruzam-se** à frente do espelho → imagem **real**.\n- **Côncavo, objeto próximo (fig. 24-B):** cruzam-se os **prolongamentos** atrás do espelho → imagem **virtual**.\n- **Convexo (fig. 25):** a imagem forma-se onde se cruzam os **prolongamentos** dos raios refletidos (atrás do espelho, entre o espelho e o foco).\n\n:::faq\n**De que são feitos os espelhos comuns?**\nDe **três camadas**: 1) **vidro muito polido** (plano, côncavo ou convexo); 2) uma camada de **metal**, normalmente **prata**, muito polida; 3) atrás, uma camada de **tinta preta**, que **absorve** a luz que vem de trás do espelho.\n:::\n\n## Para resumir — Espelhos (p. 104)\n- A imagem pode ser **virtual** (não projetável; forma-se **atrás** do espelho) ou **real** (projetável; forma-se **à frente**).\n- **Planos:** imagem **simétrica, virtual, direita, do mesmo tamanho** do objeto e à **mesma distância** do espelho.\n- **Côncavos:** fazem **convergir** os raios → **convergentes**. Objeto **afastado** → imagem **real, invertida**, menor, igual ou maior; objeto **próximo** → imagem **virtual, maior, direita**.\n- **Convexos:** fazem **divergir** os raios → **divergentes**. Imagem **virtual, menor e direita**.\n\n## Investigo e comunico — Quem foi o padre Himalaya? (p. 104)\nO padre **Manuel António Gomes**, conhecido como **padre Himalaya**, cientista e inventor, criou um **forno solar** a que chamou **pireliόforo**. Nos **Arcos de Valdevez**, de onde era natural, há as \"**Oficinas de criatividade Himalaya**\".\n\n## Para aplicar (p. 105)\n\n:::note\n**Fim do material enviado:** os PDFs terminam na **p. 105** do livro de Som/Luz. Se o capítulo 4 continuar (ex.: refração, lentes, dispersão da luz, olho humano), envia as páginas seguintes.\n:::"}], "qsets": [{"id": "01-natureza-corpuscular", "title": "1.1 Natureza corpuscular da matéria", "pages": "10–15", "part": "Reações Químicas", "md": "## Atividade prática 1 — Seringa com ar vs. com água\n:::q AP1 · p. 13 · Quais são os gases mais abundantes na constituição do ar?\n?? O **azoto (nitrogénio, N₂)** — cerca de 78 % — e o **oxigénio (O₂)** — cerca de 21 %. (O restante ≈1 % é sobretudo árgon, com um pouco de dióxido de carbono e outros gases.)\n:::\n:::q AP1 · p. 13 · Que diferenças observaste?\n?? Com **ar**, o êmbolo desce (o ar é comprimido); com **água**, o êmbolo praticamente não se move.\n:::\n:::q AP1 · p. 13 · Questão-problema: porque se comprime o ar e não a água?\n?? Nos gases, os corpúsculos estão **muito afastados** e existe **muito espaço vazio** entre eles; ao empurrar o êmbolo, esse espaço diminui e o volume do gás diminui. Nos líquidos, os corpúsculos estão **muito próximos** uns dos outros (pouco espaço vazio), por isso a água praticamente não se pode comprimir.\n:::\n## Atividade prática 2 — Água + etanol\n:::q AP2 · p. 14 · Qual é o volume final? Explica.\n?? O volume final é **ligeiramente inferior a 50 mL** (aprox. 48–49 mL). Ao misturar substâncias diferentes, os corpúsculos de água e de etanol **interagem de forma diferente** (atraem-se mais) e os corpúsculos mais pequenos ocupam parte dos **espaços vazios** entre os outros. Por isso, o volume da mistura não é igual à soma dos volumes.\n:::\n## Atividade prática 3 — Corante em água quente e fria\n:::q AP3 · p. 15 · Relaciona a variação de temperatura do gás com a agitação dos corpúsculos.\n?? Quanto **maior a temperatura**, **mais agitados** (mais rápidos) se movem os corpúsculos; ao arrefecer, movem-se mais devagar.\n:::\n:::q AP3 · p. 15 · Classifica a mistura obtida após homogeneização (aspeto macroscópico).\n?? É uma **mistura homogénea** (solução) — não se distinguem os componentes a olho nu.\n:::\n:::q AP3 · p. 15 · Em qual dos gobelés a homogeneização foi mais rápida?\n?? No gobelé com **água quente (40 °C)**.\n:::\n:::q AP3 · p. 15 · Questão-problema (com base na teoria cinético-corpuscular).\n?? Na água quente os corpúsculos têm **mais energia** e movem-se **mais rapidamente**, por isso os corpúsculos do corante espalham-se (difundem-se) mais depressa entre os da água. Na água fria o movimento é mais lento e a mistura demora mais.\n:::", "chapter": "01-natureza-corpuscular"}, {"id": "02-propriedades-gases", "title": "1.2 Propriedades dos gases", "pages": "16–19", "part": "Reações Químicas", "md": "## Atividade prática 4 (simulação PhET *Gases: Introdução*)\n:::q AP4 · p. 16 · Como variou a pressão quando o gás foi aquecido (volume constante)?\n?? A pressão **aumentou**. Os corpúsculos ficaram mais agitados e passaram a chocar com mais força e mais vezes com as paredes.\n:::\n:::q AP4 · p. 16 · Como variou a pressão com a diminuição do volume (temperatura constante)?\n?? A pressão **aumentou**. Com menos espaço, os corpúsculos chocam mais vezes com as paredes por unidade de área.\n:::\n## Investigo e comunico — Gases sem cheiro (p. 18)\n:::q Investigo e comunico · p. 18 · Q1 — Qual é o significado do pictograma (chama)?\n?? Pictograma de **inflamável**: o gás pode inflamar-se (arder) facilmente em contacto com chamas, faíscas ou calor.\n:::\n:::q Investigo e comunico · p. 18 · Q2 — Que cuidados deves ter no manuseamento destas botijas?\n?? Mantê-las **longe de fontes de calor** e chamas, em local **arejado** e na **vertical**; não as expor ao sol; verificar se não há fugas (cheiro a gás) e fechar a válvula depois de usar; manusear com cuidado para não as danificar.\n:::\n:::q Investigo e comunico · p. 18 · Q3 — Ouve-se líquido ao abanar, mas sai gás ao abrir. Porquê?\n?? Dentro da botija o gás está a **pressão muito elevada**: os corpúsculos estão tão próximos que o butano fica no **estado líquido**. Ao abrir a válvula, a pressão diminui, os corpúsculos afastam-se (aumenta o espaço vazio e a liberdade de movimento) e a substância passa ao **estado gasoso**.\n:::\n:::q Investigo e comunico · p. 18 · Q4 — Porque é perigoso haver incêndios onde existem botijas de gás?\n?? O calor aumenta a temperatura do gás dentro da botija; com volume constante, a **pressão aumenta** muito e a botija pode **explodir**. Além disso, o gás é **inflamável**, alimentando o incêndio.\n:::\n## Para aplicar (p. 19)\n:::q Para aplicar · p. 19 · Q1 — Escolhe os termos corretos: \"De acordo com a teoria cinético-corpuscular, toda a matéria é formada por pequeníssimos corpúsculos / corpúsculos visíveis com microscópios óticos que se encontram parados / em constante movimento. Entre esses corpúsculos existe ar / espaço vazio.\"\n?? **pequeníssimos corpúsculos** · **em constante movimento** · **espaço vazio**.\n:::\n:::q Para aplicar · p. 19 · Q2 — Quais são corpúsculos que constituem a matéria? Átomos / Volume / Iões / Moléculas\n?? **Átomos, iões e moléculas.** (Volume é uma grandeza física, não um corpúsculo.)\n:::\n:::q Para aplicar · p. 19 · Q3 — A Clara sentiu o perfume de um colega na outra ponta da sala. Explica (teoria cinético-corpuscular).\n?? Os corpúsculos do perfume estão em **constante movimento** e há **espaço vazio** entre os corpúsculos do ar. Os corpúsculos do perfume (no estado gasoso) movem-se e **espalham-se pelo ar** da sala até chegarem ao nariz da Clara.\n:::\n:::q Para aplicar · p. 19 · Q4.1 — Identifica o estado físico em A (corpúsculos próximos e desordenados), B (muito afastados) e C (próximos e ordenados).\n?? **A – líquido; B – gasoso; C – sólido.**\n:::\n:::q Para aplicar · p. 19 · Q4.2 — Relaciona um estado físico com cada afirmação: A. Volume fixo e forma do recipiente. B. Ocupa sempre todo o volume do recipiente. C. Volume fixo e forma fixa. D. Corpúsculos muito afastados.\n?? **A – líquido; B – gasoso; C – sólido; D – gasoso.**\n:::\n:::q Para aplicar · p. 19 · Q5.1 — Em qual das situações (A: corpúsculos com pouca agitação; B: corpúsculos muito agitados) é maior a temperatura?\n?? Na situação **B** (os corpúsculos estão mais agitados).\n:::\n:::q Para aplicar · p. 19 · Q5.2 — Em que situação a pressão é maior? Usa \"agitação dos corpúsculos\", \"pressão\" e \"intensidade da força exercida nas paredes do recipiente\".\n?? Na situação **B**. Como a temperatura é maior, a **agitação dos corpúsculos** é maior; por isso aumenta a **intensidade da força exercida nas paredes do recipiente** por unidade de área e, consequentemente, a **pressão** é maior.\n:::\n:::q Para aplicar · p. 19 · Q5.3 — \"Mantendo o volume ocupado por um gás, quanto ___ for a temperatura, ___ será a sua pressão.\"\n?? Quanto **maior** for a temperatura, **maior** será a sua pressão. (Também é válido: quanto **menor** … **menor**.)\n:::\n:::q Para aplicar · p. 19 · Q6 — Êmbolo empurrado (sentido 1 = compressão, sentido 2 = expansão). Quais são verdadeiras? A. No sentido 1 ocorre uma transformação física. B. No sentido 1 aumenta a pressão. C. No sentido 2 o volume do gás é maior. D. O espaço vazio aumenta no sentido 1. E. No sentido 1 aumenta a liberdade de movimento. F. No sentido 2 aumenta a proximidade entre corpúsculos.\n?? Verdadeiras: **A, B e C**.\nD é falsa (no sentido 1 o espaço vazio **diminui**); E é falsa (no sentido 1 a liberdade de movimento **diminui**); F é falsa (no sentido 2 os corpúsculos **afastam-se**).\n:::", "chapter": "02-propriedades-gases"}, {"id": "03-atomos-elementos", "title": "1.3 Átomos e elementos químicos", "pages": "20–23", "part": "Reações Químicas", "md": "## Tarefa interdisciplinar com Ciências Naturais — Unidade estrutural: átomo ou célula?\n:::q Tarefa interdisciplinar · p. 23 · a) Distingue célula de átomo.\n?? A **célula** é a unidade básica estrutural e funcional dos **seres vivos** (tem membrana, citoplasma, material genético…) e é formada por milhões de moléculas. O **átomo** é a unidade estrutural de **toda a matéria** (viva e não viva), muito mais pequeno, formado por protões, neutrões e eletrões. Uma célula é constituída por átomos; um átomo não é constituído por células.\n:::\n:::q Tarefa interdisciplinar · p. 23 · b) Quantos átomos e células poderá ter o corpo humano?\n?? Estima-se que o corpo humano tenha cerca de **30 a 37 biliões de células** (≈ 3,7 × 10¹³) e cerca de **7 × 10²⁷ átomos** (7 mil quatriliões). *(Valores aproximados de fontes científicas; confirma com o teu professor.)*\n:::\n:::q Tarefa interdisciplinar · p. 23 · c) Ordena por ordem crescente de complexidade: célula, tecido, átomo, organismo, molécula, sistema de órgãos.\n?? **átomo → molécula → célula → tecido → sistema de órgãos → organismo** (entre tecido e sistema de órgãos existe o nível \"órgão\").\n:::\n## Investigo e comunico — Os elementos que me rodeiam (p. 24)\n:::q Investigo e comunico · p. 24 · Escolhe um elemento natural da Tabela Periódica: a) nome e símbolo; b) ano da descoberta; c) n.º de protões e eletrões; d) onde o encontras.\n?? Exemplo resolvido com o **cálcio**:\na) Cálcio, **Ca**. b) Isolado em **1808** por Humphry Davy. c) **20 protões e 20 eletrões** (átomo neutro). d) Ossos e dentes, leite e queijo, cascas de ovo, conchas, calcário, giz e cimento.\n*(Podes escolher outro elemento: o raciocínio é o mesmo — n.º de protões = número atómico da Tabela; n.º de eletrões = n.º de protões.)*\n:::\n## Para aplicar (p. 25)\n:::q Para aplicar · p. 25 · Q1 — Completa: \"No átomo, distinguem-se duas regiões: o (a) e a região à volta deste. No núcleo encontram-se os (b), com carga positiva, e os (c), sem carga. Em volta do núcleo encontram-se os (d) que têm carga elétrica (e). Num átomo, o n.º de protões é igual ao n.º de (f).\"\n?? (a) **núcleo**; (b) **protões**; (c) **neutrões**; (d) **eletrões**; (e) **negativa**; (f) **eletrões**.\n:::\n:::q Para aplicar · p. 25 · Q2 — Seleciona a única opção correta. A. Podemos representar átomos do mesmo elemento por símbolos diferentes. B. O símbolo do sódio é NA. C. O núcleo do átomo é eletricamente neutro. D. Os átomos são constituídos por partículas subatómicas, logo não são indivisíveis.\n?? **D.** (A: cada elemento tem um só símbolo. B: é **Na**. C: o núcleo tem carga **positiva** — tem protões; o átomo inteiro é que é neutro.)\n:::\n:::q Para aplicar · p. 25 · Q3 — Os átomos A e B têm 8 e 9 protões. São do mesmo elemento?\n?? **Não.** Átomos do mesmo elemento têm **o mesmo número de protões**; A tem 8 (oxigénio) e B tem 9 (flúor).\n:::\n:::q Para aplicar · p. 25 · Q4 — A (10 p, 10 e), B (11 p, 10 e), C (10 p, 11 e). São átomos?\n?? Só **A** é um átomo, porque tem n.º de protões = n.º de eletrões (é neutro). **B** e **C** não são átomos, porque têm números diferentes de protões e eletrões — têm carga elétrica (são **iões**: B é um ião positivo e C um ião negativo).\n:::\n:::q Para aplicar · p. 25 · Q5 — Significado de: 5 C / 3 N / 10 O / 2 P / 4 Na\n?? **5 C** – cinco átomos de carbono; **3 N** – três átomos de nitrogénio; **10 O** – dez átomos de oxigénio; **2 P** – dois átomos de fósforo; **4 Na** – quatro átomos de sódio.\n:::\n:::q Para aplicar · p. 25 · Q6 — a) Elemento cujos átomos têm 38 protões. b) N.º de protões do flúor e do berílio.\n?? a) **Estrôncio (Sr)**, número atómico 38. b) Flúor: **9** protões; berílio: **4** protões.\n:::\n:::q Para aplicar · p. 25 · Q7.1 — 18 átomos de magnésio (12 protões cada) representam-se por: A. 18 MG B. Mg₁₈ C. MG₁₈ D. 18 Mg\n?? **D. 18 Mg** (coeficiente antes do símbolo; o símbolo do magnésio é Mg, com g minúsculo).\n:::\n:::q Para aplicar · p. 25 · Q7.2 — Quantos eletrões tem cada átomo de magnésio? Justifica.\n?? **12 eletrões**, porque o átomo é eletricamente neutro: o n.º de eletrões é igual ao n.º de protões (12).\n:::\n:::q Para aplicar · p. 25 · Q8 — Representa: a) 2 átomos de flúor; b) 1 átomo de hélio; c) 3 átomos de cálcio.\n?? a) **2 F**; b) **He**; c) **3 Ca**.\n:::\n:::q Para aplicar · p. 25 · Q9.1 — No modelo: 3 eletrões à volta do núcleo; núcleo com 3 esferas vermelhas e 4 azuis. Quantos protões, eletrões e neutrões?\n?? **3 eletrões** (os pontos nas órbitas) → logo **3 protões** (átomo neutro). As restantes partículas do núcleo são **4 neutrões**. *(Confirma as cores no teu livro: as esferas em igual número aos eletrões são os protões.)*\n:::\n:::q Para aplicar · p. 25 · Q9.2 — Que elemento é?\n?? **Lítio (Li)** — o elemento com 3 protões.\n:::", "chapter": "03-atomos-elementos"}, {"id": "04-moleculas", "title": "1.4 Moléculas e fórmulas químicas", "pages": "26–32", "part": "Reações Químicas", "md": "## Atividade prática 5 — Podemos recorrer a modelos para representar moléculas? (p. 30)\n:::q AP5 · Estação 2 · p. 30 · Modelos: 1 = duas esferas vermelhas ligadas; 2 = duas esferas vermelhas separadas; 3 = vermelha–preta–vermelha ligadas; 4 = uma esfera preta. Escreve a representação simbólica e diz quais são moléculas.\n?? 1 → **O₂** (molécula); 2 → **2 O** (dois átomos separados — não é molécula); 3 → **CO₂** (molécula); 4 → **C** (um átomo — não é molécula).\nRepresentam moléculas: **1 e 3**.\n:::\n:::q AP5 · Estação 3 · p. 30 · Como é o modelo de 3 H₂O?\n?? **Três** moléculas separadas, cada uma com **uma esfera vermelha (O)** ligada a **duas esferas brancas (H)** — no total 3 átomos de O e 6 de H.\n:::\n:::q AP5 · Estação 4 · p. 30 · Duas moléculas, cada uma com uma esfera azul (N) ligada a três brancas (H). a) Quantos átomos? b) Representação simbólica? c) Classificação da substância?\n?? a) Cada molécula tem **4 átomos** (1 N + 3 H); as duas moléculas têm **8 átomos**. b) **2 NH₃** (amoníaco). c) **Substância composta** (formada por dois elementos diferentes).\n:::\n## Tarefa interdisciplinar com Ciências Naturais — Atmosferas, primitiva e atual (p. 30)\n:::q Tarefa interdisciplinar · p. 30 · Q1 — Gases da atmosfera primitiva (nome e fórmula).\n?? Vapor de **água (H₂O)**, **dióxido de carbono (CO₂)**, **dinitrogénio (N₂)**, **metano (CH₄)**, **amoníaco (NH₃)**, **di-hidrogénio (H₂)** e compostos de enxofre (ex.: **sulfureto de hidrogénio, H₂S**). Praticamente **não havia dioxigénio (O₂)**.\n:::\n:::q Tarefa interdisciplinar · p. 30 · Q2 — A que se deveu o aparecimento de dioxigénio na atmosfera?\n?? À **fotossíntese** realizada pelos primeiros seres fotossintéticos (as **cianobactérias**, nos oceanos), que consumiam CO₂ e libertavam O₂.\n:::\n:::q Tarefa interdisciplinar · p. 30 · Q3 — Principais gases da atmosfera atual.\n?? **Dinitrogénio, N₂ (≈78 %)**; **dioxigénio, O₂ (≈21 %)**; **árgon, Ar (≈0,9 %)**; **dióxido de carbono, CO₂ (≈0,04 %)**; vapor de **água, H₂O** (variável).\n:::\n:::q Tarefa interdisciplinar · p. 30 · Q4 — Quatro funções da atmosfera atual.\n?? 1) Fornece o **O₂** para a respiração e o **CO₂** para a fotossíntese; 2) **protege** dos raios ultravioleta (camada de ozono); 3) **regula a temperatura** (efeito de estufa natural) e reduz as diferenças entre o dia e a noite; 4) protege dos **meteoritos** (que ardem ao entrar); também permite o **ciclo da água** e o estado do tempo.\n:::\n## Investigo e comunico — Fumar não é fixe! (p. 32)\n:::q Investigo e comunico · p. 32 · Q1 — Duas substâncias do tabaco: a) fórmulas; b) efeitos.\n?? **Nicotina, C₁₀H₁₄N₂** — muito **viciante** (dependência), aumenta a tensão arterial e o ritmo cardíaco.\n**Monóxido de carbono, CO** — liga-se à hemoglobina e **reduz o transporte de oxigénio** no sangue (cansaço, menor capacidade física, problemas cardíacos).\n(Outras: amoníaco NH₃, cianeto de hidrogénio HCN, formaldeído CH₂O, benzeno C₆H₆ — cancerígeno.)\n:::\n:::q Investigo e comunico · p. 32 · Q2 — Reflete sobre os dados da tabela.\n?? O tabaco contribui para várias doenças graves. A maior percentagem de mortes atribuídas ao tabaco é na **doença respiratória crónica (28,1 %)**, seguida dos **tumores (19,6 %)**. Mostra que fumar prejudica sobretudo os pulmões, mas também o coração, os vasos sanguíneos e o metabolismo (diabetes).\n:::\n:::q Investigo e comunico · p. 32 · Q3 — Consequências do tabaco na adolescência (atividade física e desporto).\n?? Menor capacidade **respiratória** e de **resistência** (menos O₂ chega aos músculos por causa do CO), cansaço mais rápido, recuperação mais lenta, mais infeções respiratórias, e **dependência** da nicotina que se instala mais depressa nos jovens.\n:::\n:::q Investigo e comunico · p. 32 · Q4 — O que dirias para encorajar alguém a não fumar?\n?? Resposta pessoal. Ex.: \"Fumar viciar-te-á, faz mal aos pulmões e ao coração, tira-te fôlego no desporto e gasta-te dinheiro. Sem tabaco vives mais e melhor — e eu ajudo-te.\"\n:::\n:::q Investigo e comunico · p. 32 · Q5 — Elabora uma infografia.\n?? Trabalho prático: junta as substâncias, fórmulas e efeitos (Q1), os dados da tabela (Q2) e os conselhos (Q3–Q4), e pede ao professor para corrigir antes de divulgar.\n:::\n## Para aplicar (p. 33)\n:::q Para aplicar · p. 33 · Q1 — Opção correta: A. As moléculas, ao contrário dos átomos, não possuem protões, neutrões e eletrões. B. As moléculas são entidades eletricamente neutras. C. A fórmula do amoníaco é SO₂. D. As moléculas são obrigatoriamente formadas por elementos diferentes.\n?? **B.** (A: as moléculas são formadas por átomos, logo têm protões, neutrões e eletrões. C: o amoníaco é NH₃. D: há moléculas de um só elemento, ex.: O₂.)\n:::\n:::q Para aplicar · p. 33 · Q2.1 — Figura: 6 pares de esferas azuis ligadas. Átomos ou moléculas? Justifica.\n?? **Moléculas**, porque cada corpúsculo é formado por **dois átomos ligados** entre si.\n:::\n:::q Para aplicar · p. 33 · Q2.2 — Substância elementar ou composta?\n?? **Elementar** — as moléculas são formadas por átomos de **um só elemento** (todas as esferas têm a mesma cor).\n:::\n:::q Para aplicar · p. 33 · Q2.3 — Fórmula química (esferas azuis = nitrogénio).\n?? **N₂** (dinitrogénio).\n:::\n:::q Para aplicar · p. 33 · Q2.4 — Unidade estrutural: átomo ou molécula?\n?? A **molécula**.\n:::\n:::q Para aplicar · p. 33 · Q3 — Tetrafósforo (4 átomos de P ligados): a) fórmula; b) unidade estrutural; c) 3 moléculas; d) elementar ou composta?\n?? a) **P₄**; b) a **molécula**; c) **3 P₄**; d) **elementar** (só tem fósforo).\n:::\n:::q Para aplicar · p. 33 · Q4.1 — Acetona: 3 C, 6 H e 1 O. Fórmula de a) uma molécula; b) cinco moléculas.\n?? a) **C₃H₆O**; b) **5 C₃H₆O**.\n:::\n:::q Para aplicar · p. 33 · Q4.2 — Número total de átomos: a) numa molécula; b) em três moléculas.\n?? a) 3 + 6 + 1 = **10 átomos**; b) 3 × 10 = **30 átomos**.\n:::\n:::q Para aplicar · p. 33 · Q4.3 — A acetona é composta ou elementar?\n?? **Composta** (formada por três elementos diferentes: C, H e O).\n:::\n:::q Para aplicar · p. 33 · Q5.1 — Mistura com moléculas de pares brancos e pares verde-escuros. Quantas substâncias?\n?? **Duas** substâncias (dois tipos de moléculas).\n:::\n:::q Para aplicar · p. 33 · Q5.2 — Quantos elementos em cada substância?\n?? **Um** elemento em cada (cada molécula tem dois átomos iguais).\n:::\n:::q Para aplicar · p. 33 · Q5.3 — Nome e fórmula (branco = H, verde = Cl).\n?? **Di-hidrogénio, H₂** e **dicloro, Cl₂**.\n:::\n:::q Para aplicar · p. 33 · Q6 — O que representa: a) 2 O₃; b) 2 O; c) 5 CO₂; d) 2 CH₄?\n?? a) **duas moléculas de ozono** (trioxigénio), cada uma com 3 átomos de O; b) **dois átomos de oxigénio**; c) **cinco moléculas de dióxido de carbono**; d) **duas moléculas de metano**.\n:::\n:::q Para aplicar · p. 33 · Q7 — Representa: a) duas moléculas de amoníaco; b) dois átomos de carbono; c) três moléculas de água.\n?? a) **2 NH₃**; b) **2 C**; c) **3 H₂O**.\n:::", "chapter": "04-moleculas"}, {"id": "05-ioes-compostos-ionicos", "title": "1.5 Iões e compostos iónicos", "pages": "34–41", "part": "Reações Químicas", "md": "## Atividade prática 6 — Será a água mineral comercializada toda igual? (p. 36)\n:::q AP6 · p. 36 · Que informações dá o rótulo?\n?? Nome e **origem** (nascente/região), **composição química** (iões presentes e as suas concentrações em mg/L), pH, resíduo seco, validade, volume da embalagem, indicações de conservação.\n:::\n:::q AP6 · p. 36 · Fórmulas do catião e do anião em maior concentração; um ião monoatómico e o átomo que lhe deu origem.\n?? Depende do rótulo. Na maioria das águas portuguesas o **anião mais abundante** é o **hidrogenocarbonato (HCO₃⁻)** e o catião é o **sódio (Na⁺)** ou o **cálcio (Ca²⁺)**. Exemplo de ião monoatómico: **Ca²⁺**, originado pelo **átomo de cálcio** (que cedeu 2 eletrões); ou **Cl⁻**, originado pelo **átomo de cloro** (que captou 1 eletrão).\n:::\n:::q AP6 · p. 36 · Massa de ião cálcio ingerida em 33 cL de água.\n?? Método: lê a concentração de Ca²⁺ no rótulo (em mg/L) e multiplica por **0,33 L** (33 cL = 0,33 L).\nEx.: se o rótulo indica **10 mg/L** de Ca²⁺ → 10 × 0,33 = **3,3 mg** de ião cálcio.\n:::\n:::q AP6 · p. 36 · Classifica a água mineral quanto ao n.º de componentes; solvente e solutos.\n?? É uma **mistura homogénea** (solução) — tem vários componentes. **Solvente:** a água. **Solutos:** os sais minerais dissolvidos (iões como Ca²⁺, Mg²⁺, Na⁺, K⁺, HCO₃⁻, Cl⁻, SO₄²⁻…) e gases dissolvidos.\n:::\n:::q AP6 · p. 36 · Questão-problema: toda a água mineral é igual?\n?? **Não.** As águas minerais têm **composições diferentes** (iões diferentes e em concentrações diferentes), consoante a **região** de onde são captadas e as rochas por onde a água passa.\n:::\n## Investigo e comunico — Elementos minerais essenciais (p. 40)\n:::q Investigo e comunico · p. 40 · Q1 — Fórmula da substância do adubo A (nitrato de amónio).\n?? **NH₄NO₃** (ião amónio NH₄⁺ + ião nitrato NO₃⁻).\n:::\n:::q Investigo e comunico · p. 40 · Q2 — Iões presentes no adubo A.\n?? **Ião amónio (NH₄⁺)** e **ião nitrato (NO₃⁻)**.\n:::\n:::q Investigo e comunico · p. 40 · Q3 — Iões absorvidos com o adubo B (NPK).\n?? NPK = **N**itrogénio, **P** (fósforo) e **K** (potássio): **NO₃⁻ e NH₄⁺**, **H₂PO₄⁻ e HPO₄²⁻**, e **K⁺**.\n:::\n:::q Investigo e comunico · p. 40 · Q4 — Efeitos de um solo pobre em iões potássio.\n?? Folhas mais velhas **amarelecem e secam nas bordas** (manchas castanhas), crescimento lento, caules fracos, flores/frutos pequenos e de má qualidade, e menor resistência a doenças, à seca e ao frio.\n:::\n## Para aplicar (p. 41)\n:::q Para aplicar · p. 41 · Q1 — A. Ião com carga negativa. B. Corpúsculo com mais eletrões do que protões. C. Ião formado por captação de um eletrão. D. Ião formado a partir de um grupo de átomos. Quais se associam a F⁻ e a S²⁻?\n?? **F⁻: A, B e C** (é anião, tem mais um eletrão do que protões, formou-se pela captação de 1 eletrão).\n**S²⁻: A e B** (é anião e tem mais eletrões do que protões; formou-se por captação de **2** eletrões, não 1).\nNenhum dos dois é D (ambos são **monoatómicos**).\n:::\n:::q Para aplicar · p. 41 · Q2 — V ou F? A. Um ião positivo forma-se pela captação de cargas positivas. B. Um catião é um ião positivo. C. O ião NH₄⁺ tem carga +4. D. Um composto iónico é eletricamente neutro. E. O ião I⁻ resultou de um átomo de iodo que cedeu um eletrão.\n?? **A – F** (forma-se pela **cedência de eletrões**). **B – V.** **C – F** (tem carga **+1**; o 4 é o n.º de átomos de H). **D – V.** **E – F** (o iodo **captou** um eletrão).\n:::\n:::q Para aplicar · p. 41 · Q3 — Fórmulas: a) sulfato de cobre(II); b) fluoreto de lítio; c) dicloreto de bário; d) sulfato de sódio; e) di-hidróxido de cálcio; f) nitrato de chumbo(II).\n?? a) Cu²⁺ + SO₄²⁻ → **CuSO₄**\nb) Li⁺ + F⁻ → **LiF**\nc) Ba²⁺ + 2 Cl⁻ → **BaCl₂**\nd) 2 Na⁺ + SO₄²⁻ → **Na₂SO₄**\ne) Ca²⁺ + 2 OH⁻ → **Ca(OH)₂**\nf) Pb²⁺ + 2 NO₃⁻ → **Pb(NO₃)₂**\n:::\n:::q Para aplicar · p. 41 · Q4 — O óxido de dissódio (Na₂O) é formado por: A. 2 Na⁺ e 1 O²⁻ B. 1 Na⁺ e 2 O²⁻ C. 2 Na⁻ e 1 O⁺ D. 2 Na⁺ e 2 O⁻\n?? **A.** (2 cargas + e 2 cargas − → neutro.)\n:::\n:::q Para aplicar · p. 41 · Q5 — Zinco(II) (Zn²⁺) com dois iões brometo (Br⁻): A. ZnBr B. BrZn₂ C. Br₂Zn D. ZnBr₂\n?? **D. ZnBr₂** (catião primeiro; 1 Zn²⁺ + 2 Br⁻).\n:::\n:::q Para aplicar · p. 41 · Q6.1 — Iões: Ca²⁺ (20 p, 18 e) e dois F⁻ (9 p, 10 e). N.º de protões e eletrões dos **átomos** de cálcio e flúor.\n?? Átomo de **cálcio: 20 protões e 20 eletrões**. Átomo de **flúor: 9 protões e 9 eletrões**. (Os protões não mudam; nos átomos, eletrões = protões.)\n:::\n:::q Para aplicar · p. 41 · Q6.2 — Fórmula e nome do composto.\n?? **CaF₂ — difluoreto de cálcio.**\n:::\n:::q Para aplicar · p. 41 · Q6.3 — O ião Ca²⁺ é monoatómico ou poliatómico?\n?? **Monoatómico** (formado por um só átomo).\n:::\n:::q Para aplicar · p. 41 · Q7 — Nomes: a) KCl; b) Li₂O; c) NaOH; d) Ag₂CO₃.\n?? a) **cloreto de potássio**; b) **óxido de dilítio**; c) **hidróxido de sódio**; d) **carbonato de prata**.\n:::\n:::q Para aplicar · p. 41 · Q8 — Quantos iões há em: a) Ca(HCO₃)₂; b) Li₂O?\n?? a) **3 iões**: 1 Ca²⁺ + 2 HCO₃⁻. b) **3 iões**: 2 Li⁺ + 1 O²⁻.\n:::\n:::q Para aplicar · p. 41 · Q9.1 — Iões do fosfato de cálcio.\n?? **Ião cálcio (Ca²⁺)** e **ião fosfato (PO₄³⁻)**.\n:::\n:::q Para aplicar · p. 41 · Q9.2 — Fórmula do fosfato de cálcio.\n?? Para neutralizar: 3 Ca²⁺ (6+) e 2 PO₄³⁻ (6−) → **Ca₃(PO₄)₂**.\n:::\n## Para aplicar + (pp. 42–43) — revisão do capítulo 1\n:::q Para aplicar + · p. 42 · Q1 — Do gás → líquido → sólido (sentido 1) há um aumento: A. da desordem B. do espaço vazio C. da liberdade de movimentos D. das interações entre corpúsculos\n?? **D.** No sentido 1 os corpúsculos ficam mais próximos e organizados, logo aumentam as **interações** (forças de atração) entre eles; a desordem, o espaço vazio e a liberdade de movimento **diminuem**.\n:::\n:::q Para aplicar + · p. 42 · Q2.1 — Recipiente 1 (gás azul, êmbolo em cima) + recipiente 2 (gás vermelho, êmbolo em baixo) = recipiente 3 (os dois gases, mesmo volume que 1). V/F: A. O gás em 3 é uma substância. B. O volume do gás em 1 é superior ao do gás em 2. C. Empurrar o êmbolo de 2 diminui o volume, logo a pressão diminui. D. Aquecer o gás em 3 aumenta a intensidade da força por unidade de área.\n?? **A – F** (é uma **mistura** de dois gases). **B – V.** **C – F** (ao diminuir o volume, a pressão **aumenta**). **D – V.**\n:::\n:::q Para aplicar + · p. 42 · Q2.2 — Porque é que os dois gases juntos ocupam o mesmo volume que o gás 1?\n?? Porque nos gases há **muito espaço vazio** entre os corpúsculos: os corpúsculos do gás 2 ocupam espaços vazios entre os do gás 1. Além disso, um gás ocupa **todo o volume** do recipiente onde está.\n:::\n:::q Para aplicar + · p. 42 · Q3 — Porque se dissolve mais depressa o chocolate no leite quente?\n?? No leite quente os corpúsculos têm **mais energia** e movem-se **mais depressa**, chocando mais vezes e com mais força com o chocolate, que assim se espalha (dissolve) mais rapidamente.\n:::\n:::q Para aplicar + · p. 42 · Q4 — Toda a matéria é constituída por: A. corpúsculos em constante movimento B. corpúsculos e ar C. corpúsculos em movimento apenas no estado gasoso D. átomos, moléculas e iões\n?? **A e D.**\n:::\n:::q Para aplicar + · p. 42 · Q5.1 — Carga de um átomo e de cada partícula subatómica.\n?? O **átomo** é **eletricamente neutro** (carga 0). **Protão**: carga **positiva**; **neutrão**: **sem carga**; **eletrão**: carga **negativa**.\n:::\n:::q Para aplicar + · p. 42 · Q5.2 — Nome das partículas 1 (esfera vermelha do núcleo), 2 (esfera azul do núcleo) e 3 (part
